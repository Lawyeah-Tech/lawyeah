interface:
  display_name: "刑事接案资格与冲突筛查"
  short_description: "接案闸与JB#草案；家属付款人不是客户，口头同意不是授权，值班不是本案辩护人，筛查不是已接案"
  default_prompt: "使用 $刑事接案资格与冲突筛查，在单方无冲突立场下形成中国大陆刑事接案筛查草案：接案闸、Q#路径、JB#接案行（主体切片客户或委托人或付款人或单位/授权路径/冲突/打开接口/E#）。开闸材料是可编号身份、书面委托、律所受理、法援决定指派、值班安排、机关文书或冲突记录碎片，不是口头家属就是客户或付了就能接。接案闸打开不等于已接受不等于家属即客户不等于付款即授权不等于值班即辩护人。口头同意不是授权。付款记录不赋权。书面代委托不是本人已确认策略。法援口头通知不是本案指派。单位授权不是责任人员本人辩护。信息隔离不是冲突已治愈。筛查结论不是已会见不是实体意见。错误主张不关窗：保证今晚必须接、家属即客户、口头当书面、先接再补手续、隔离即无冲突，只关对应格，闸已开仍出其他JB#。冲突未闭合不得形成限定范围接受，窗口不关。评估筛查第四槽用search_case_by_fact只比较差异，禁止范本生成委托合同或无冲突证明。双方秘密、伪造授权、规避已确定冲突、泄密、冒充、违法取证第一次即整体停止，不得选边，不得问代表哪一方后继续。闸关仍交十节，第6节不出JB#终稿。本窗闸名只能是接案闸，禁止复用冲突闸、筛查闸、评估闸、会见闸。预留不得占用立案闸、调查闸。主行只能是JB#，禁止A#、N#、JS#、SC#。主路径只用Q-接，禁止Q-筛、Q-冲、Q-诉、Q-辩作主路径。邻窗Q-接只作转介进本窗本窗打开为主路径不是已接受。不定罪、不保证可接、不代提交是交付禁令不是负触发，未知不写零。"
