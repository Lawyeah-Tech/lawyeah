interface:
  display_name: "准备证照印章管控与交接"
  short_description: "印章闸与YZ#草案；占有不是合法权源，交接草稿不是已交接"
  default_prompt: "使用 $准备证照印章管控与交接，在单方无冲突立场下形成中国大陆发送前证照印章合法管控与交接草稿：印章闸、主体与强制接口、Q#路径、YZ#印章行（保管权源/占有与清单/合法交接/保全接口/禁止动作红旗/E#）。开闸材料是可编号权源或物品碎片，不是口头章在我手里就是我说了算或复印件就算交完了。印章闸打开不等于已交接不等于占有即权源不等于已裁定保全。占有不是合法权源。持章不是合法法定代表人。交接草稿不是已交接。登记法定代表人不是当然保管人。两套代表人抢先占有不是合法权源。错误主张不关窗：占有即权源、持章即合法法定代表人、草稿即已交接、回执即已核准、未登记即已对抗、抢先占有即合法、持章对外一律无效、未知写零，只关对应格，闸已开仍出其他YZ#。范本只借交接清单与返还或行为保全申请栏目。双方秘密、伪造交接或决议、倒签已交接、抢夺、隐匿、私刻第一次即整体停止，不得选边。闸关仍交十节，第6节不出YZ#终稿。本窗闸名只能是印章闸，禁止复用任免闸、控制闸、僵局闸、保全闸、登记闸。主行只能是YZ#，禁止YJ#、ZY#、RM#、KZ#、JJ#、AJ#、A#。主路径只用Q-印，本窗Q-印不是合规印发。不得问代表哪一方后继续。不代提交、不写已交接、不指导抢章是交付禁令不是负触发，未知不写零。"
