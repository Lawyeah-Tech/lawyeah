interface:
  display_name: "准备公司设立文件与登记"
  short_description: "设立闸与XS#草案；材料齐不是已成立，清单齐不是已核准"
  default_prompt: "使用 $准备公司设立文件与登记，在单方无冲突立场下准备中国大陆公司设立文件与登记核验草案：设立闸、主体与强制接口、Q#路径、XS#设立行（类型已选/股东发起人与出资/章程必载缺口/机关产生/登记核验/E#）。开闸材料是可编号类型已选碎片，不是口头已经选定，不是材料已经齐。无书面设立授权但有类型已选碎片＝设立闸部分打开。设立闸打开不等于已选定不等于已成立不等于已核准不等于已提交不等于已签署章程。材料齐不是已成立。清单齐不是已核准。网交不是已核准。名称预核准不是已成立。口头住所不是已合法。有限认缴五年不是股份发起人实缴。评估缺失不是作价已公允。错误主张不关窗：材料齐即已成立、网交即已核准、五年套发起人、虚假住所可用、保证核准、未知写零，只关对应格，闸已开仍出其他XS#。主路径只用Q-设，禁止Q-选。范本只借申请书章程任职栏目，不得升格已成立或已核准。双方秘密、倒签设立会议、虚构实缴、虚假住所或抢夺印章第一次即整体停止，不得选边。闸关仍交十节，第6节不出XS#终稿。本窗闸名只能是设立闸，禁止复用选型闸、登记闸、章程闸、变更闸。不代提交、不保证核准、不写已成立是交付禁令不是负触发，未知不写零。"
