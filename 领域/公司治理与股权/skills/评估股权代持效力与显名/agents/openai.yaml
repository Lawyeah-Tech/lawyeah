interface:
  display_name: "评估股权代持效力与显名"
  short_description: "代持闸与DT#草案；只有出资不是代持已成立，代持有效不是已经是名册股东"
  default_prompt: "使用 $评估股权代持效力与显名，在单方无冲突立场下形成中国大陆代持效力与显名路径草案：代持闸、主体与强制接口、Q#路径、DT#代持行（合意与资金/合同效力/投资权益/显名条件/善意第三人接口/E#）。开闸材料是可编号代持合意或出资碎片，不是口头钱是我出的就算代持。代持闸打开不等于已成立不等于已是名册股东不等于已显名。只有出资不是代持已成立。代持有效不是已经是名册股东。隐名股东直接向公司主张股东权利原则上不支持除非完成显名。上市公司代持不是当然有效。半数同意不足不是已显名。名义股东处分不是当然追回。错误主张不关窗：只有出资即代持已成立、代持有效即已是名册股东、隐名即可向公司主张、上市代持当然有效、半数不足即已显名、处分即当然追回、未知写零，只关对应格，闸已开仍出其他DT#。案例只比较差异。双方秘密、伪造代持协议或倒签转账第一次即整体停止，不得选边。闸关仍交十节，第6节不出DT#终稿。本窗闸名只能是代持闸，禁止复用结构闸、名册闸、转让闸。主行只能是DT#，禁止GQ#、MC#、ZR#、DH#、A#。主路径只用Q-持。不得问代表哪一方后继续。不把代持有效写成已是名册股东是交付禁令不是负触发，未知不写零。"
