interface:
  display_name: "准备一人公司特殊安排"
  short_description: "一人闸与YR#草案；措施不是已独立，缺书面决定不是已合法决定"
  default_prompt: "使用 $准备一人公司特殊安排，在单方无冲突立场下准备中国大陆一人公司的财产独立措施、书面决定和举证责任接口草案：一人闸、主体与强制接口、Q#路径、YR#一人安排行（一人身份/财产独立措施/书面决定要点/举证责任接口/登记公示/E#）。开闸材料是可编号一人身份碎片（登记或名册显示股东为一人，或拟设一人），不是口头财产已经独立了。无书面授权但有拟设或已成立一人身份碎片＝一人闸部分打开。一人闸打开不等于已独立不等于已免连带不等于已合法决定不等于已签署不等于已置备。隔离措施清单不是已独立。账户分开不是已独立。缺书面决定不是已合法决定。2018一个自然人只能设一个一人有限不是现行。一人股份不得自动套第60条全文。第60条一人书面决定不是第59条第3款多股东书面一致。置备不是已对外对抗。第23条第3款只开举证责任接口，不写连带成立。错误主张不关窗：措施即已独立、账户分开即已独立、缺书面即已合法、2018一人只能设一个当现行、一人股份自动套第60条全文、未知写零，只关对应格，闸已开仍出其他YR#。主路径只用Q-一，禁止Q-选、Q-设、Q-章作主路径。范本只借书面决定和隔离措施栏目，不得升格已独立或已合法决定。双方秘密、倒签书面决定、补造隔离合同或销毁账册第一次即整体停止，不得选边。闸关仍交十节，第6节不出YR#终稿。本窗闸名只能是一人闸，禁止复用选型闸、设立闸、章程闸、变更闸。不写已独立、不写连带成立、不代提交是交付禁令不是负触发，未知不写零。"
