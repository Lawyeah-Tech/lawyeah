interface:
  display_name: "准备监事会或审计委员会履职文件"
  short_description: "监事闸与JS#草案；未见账簿不是已经合规，三十日未满不是已违法拒绝"
  default_prompt: "使用 $准备监事会或审计委员会履职文件，在单方无冲突立场下准备中国大陆监事会、一名监事或审计委员会履职草稿：监事闸、主体与强制接口、Q#路径、JS#监事行（机关设置/检查质询/召集接口/代表诉讼答复/审计委员会接口/E#）。开闸材料是可编号机关设置或履职议题碎片，不是口头账没看也算合规。监事闸打开不等于已检查不等于已经合规不等于已答复。未见账簿不是已经合规。三十日未满不是已违法拒绝。未设机关不是可出监察报告。监事会与审计委员会不得同时写成两个已开会机关。履职文件不是勤勉责任已成立。错误主张不关窗：未见账簿即合规、三十日未满即违法拒绝、两套机关同时已开会、未知写零，只关对应格，闸已开仍出其他JS#。范本只借检查记录和书面答复栏目。双方秘密、伪造未设机关开会或倒签检查记录第一次即整体停止，不得选边。闸关仍交十节，第6节不出JS#终稿。本窗闸名只能是监事闸，禁止复用董事闸、决议闸、召集闸、监察闸。不执行发送是交付禁令不是负触发，未知不写零。"
