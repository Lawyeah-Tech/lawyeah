interface:
  display_name: "准备查阅复制书面请求"
  short_description: "书面请求闸与QH#草案；请求草稿不是已送达，微信已读不是已提出"
  default_prompt: "使用 $准备查阅复制书面请求，在单方无冲突股东立场下形成中国大陆发送前查阅书面请求草稿：书面请求闸、主体与强制接口、Q#路径、QH#请求函行（股东身份依据/材料范围/目的说明/中介与保密/送达接口/E#）。开闸材料是可编号股东身份或拟查材料碎片，不是口头微信已读就算已提出。书面请求闸打开不等于已送达不等于已提出不等于已获准。请求草稿不是已送达。微信已读不是已提出。未说明目的不是已提出账簿凭证查阅请求。十五日自书面提出起算。错误主张不关窗：草稿即已送达、微信已读即已提出、未说明目的即已提出账簿请求、十五日未满即违法拒绝、账簿凭证当然可复制、草稿即已获准、未知写零，只关对应格，闸已开仍出其他QH#。范本只借栏目。双方秘密、伪造请求或倒签送达第一次即整体停止，不得选边。闸关仍交十节，第6节不出QH#终稿。本窗闸名只能是书面请求闸，禁止复用查阅闸、书面闸、起诉闸、名册闸。主行只能是QH#，禁止CK#、SM#、SZ#、A#。主路径只用Q-请，禁止Q-阅、Q-书、Q-代。不得问代表哪一方后继续。不代提交、不写已获准是交付禁令不是负触发。本窗QH#不是已送达、不是已获准、不是评估窗CK#。未知不写零。"
