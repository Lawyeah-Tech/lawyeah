interface:
  display_name: "准备董事会或执行董事决定"
  short_description: "董事闸与DH#草案；草稿不是已经通过，创始人方便不是已符合一名董事"
  default_prompt: "使用 $准备董事会或执行董事决定，在单方无冲突的公司或董事立场下准备中国大陆董事会或一名董事决定草稿：董事闸、主体与强制接口、Q#路径、DH#董事行（职权范围/召集与定足数/回避/一名董事接口/决议要点/E#）。开闸材料是可编号职权或议题碎片，不是口头今天开了就算过了。董事闸打开不等于已通过不等于已召开不等于待发送终稿。草稿不是已经通过。创始人方便不是已符合一名董事。2018执行董事不是现行必须机关名。正文用一名董事。董事会制订增减资方案不是股东会已经决定。通知期章程未定不得编造一律三日。股份十日不得套有限。回避后不足三人提交股东会，不硬过。催缴或失权决议草稿不是催缴书不是失权通知终稿。错误主张不关窗：草稿即已通过、创始人方便即已符合、董事会即已决定增减资、一律三日、未知写零，只关对应格，闸已开仍出其他DH#。范本只借决议栏目。双方秘密、伪造出席或倒签会议第一次即整体停止，不得选边。闸关仍交十节，第6节不出DH#终稿。本窗闸名只能是董事闸，禁止复用决议闸、召集闸、催缴闸、失权闸。不执行发送是交付禁令不是负触发，未知不写零。"
