interface:
  display_name: "评估利润分配请求权"
  short_description: "分配闸与FP#草案；有利润不是已可强制分配，抽象请求权不是已决议具体债权"
  default_prompt: "使用 $评估利润分配请求权，在单方无冲突立场下形成中国大陆利润分配路径草案：分配闸、主体与强制接口、Q#路径、FP#分配行（分配基础/决议或具体方案/抽象或具体债权/执行期与返还接口/比例接口/E#）。开闸材料是可编号利润、决议或未支付碎片，不是口头很赚钱就必须分。分配闸打开不等于已可强制分配不等于已决议具体债权。有利润不是已可强制分配。抽象利润分配请求权不是已决议具体债权。决议分配未支付与未作决议强制分配必须分列。认缴比例不是分配比例。六个月执行期不是请求已成立。错误主张不关窗：有利润即强制分、无决议即到期债权、认缴即分配比例、六个月即请求已成立、未知写零、唯一必得总额，只关对应格，闸已开仍出其他FP#。案例只比较差异。双方秘密、伪造分配决议或倒签分配第一次即整体停止，不得选边。闸关仍交十节，第6节不出FP#终稿。本窗闸名只能是分配闸，禁止复用测算闸、查阅闸、起诉闸。主行只能是FP#，禁止DJ#、CK#、CY#、SZ#、A#。主路径只用Q-分，禁止Q-测、Q-代。不得问代表哪一方后继续。不输出唯一可分数额、不把无决议写成已确定债权是交付禁令不是负触发。未知不写零。"
