interface:
  display_name: "准备限制性股权或期权的公司文件"
  short_description: "授予闸与SY#草案；决议草稿不是已通过，未通过决议不是已经授予"
  default_prompt: "使用 $准备限制性股权或期权的公司文件，在单方无冲突立场下形成中国大陆发送前限制性股权或期权公司文件草稿：授予闸、主体与强制接口、Q#路径、SY#授予行（工具类型/决议闭合/授予文件要点/限制回购公司接口/名册或台账接口/E#）。开闸材料是可编号决议或授予文件碎片，不是口头给过期权就算已授予。授予闸打开不等于已通过不等于已经授予。决议草稿不是已通过。未通过决议不是已经授予。授予草稿不是已行权。期权台账不是股东名册。网交回执不是已核准。错误主张不关窗：决议草稿即已通过、未通过决议即已经授予、授予草稿即已行权、期权台账即名册股东、回执即已核准、口头即已授予、未知写零，只关对应格，闸已开仍出其他SY#。范本只借栏目。双方秘密、伪造决议或倒签授予日第一次即整体停止，不得选边。闸关仍交十节，第6节不出SY#终稿。本窗闸名只能是授予闸，禁止复用股权激励闸、激励闸、代持闸、名册闸。主行只能是SY#，禁止JL#、DT#、MC#、ZR#、A#。主路径只用Q-授，禁止Q-激。不得问代表哪一方后继续。不写劳动合同或个税、不把决议草稿写成已通过是交付禁令不是负触发。本窗SY#不是已授予、不是已通过、不是劳动方案、不是个税、不是评估窗JL#。未知不写零。"
