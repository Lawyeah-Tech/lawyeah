interface:
  display_name: "评估章程与强制性规范冲突"
  short_description: "条款闸与TK#草案；冲突不是决议当然无效，冲突不是设立无效"
  default_prompt: "使用 $评估章程与强制性规范冲突，在单方无冲突立场下对照中国大陆公司章程与强制性规范：条款闸、主体与强制任意接口、Q#路径、TK#条款行（条款切片/文本层级/强制或任意/冲突后果/决议接口/修订接口/E#）。主路径只用Q-冲，禁止Q-章作主路径。开闸材料是可编号章程条款碎片，不是口头这条违法决议就无效。无书面评估授权但有条款＝条款闸部分打开。无一章程文本＝条款闸关闭仍交十节，不是整体停止。条款闸打开不等于条款已不生效不等于决议当然无效不等于设立无效不等于已修订。冲突不是决议当然无效。内容违章不是当然无效。股东协议不是已改章程。取消查阅或催缴失权不是任意。新设有限突破五年不是任意。错误主张不关窗：冲突即决议当然无效、冲突即设立无效、另有规定即取消底线、突破五年、未知写零，只关对应格，闸已开仍出其他TK#。类案只比较差异。禁止search_template。双方秘密、选边有利版本、伪造备案或抢夺印章第一次即整体停止，不得选边。闸关仍交十节，第6节不出TK#终稿。本窗闸名只能是条款闸，禁止复用章程闸、冲突闸、对照闸、决议闸；主行只能是TK#，禁止CZ#、XL#、IC#、B#。不改写新章程、不把冲突写成决议当然无效是交付禁令不是负触发，不选定法院，未知不写零。"
