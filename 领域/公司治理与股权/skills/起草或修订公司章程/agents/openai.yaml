interface:
  display_name: "起草或修订公司章程"
  short_description: "章程闸与CZ#草案；草稿不是已通过，范本不是已签署"
  default_prompt: "使用 $起草或修订公司章程，在单方无冲突立场下准备中国大陆公司章程或修正案草稿：章程闸、主体与强制接口、Q#路径、CZ#章程行（版本权限/必载对照/强制底线/任意可写/修正对照/签署决议登记接口/E#）。开闸材料是可编号现行章程或拟设必载碎片，不是口头已经通过。无书面授权但有条款碎片＝章程闸部分打开。章程闸打开不等于已通过不等于已签署不等于已备案不等于已代替决议。草稿不是已通过。范本不是已签署。必载缺失不得用默认条款冒充已载明。股东协议不是已改章程。有限必载不是股份必载。新设有限突破五年不是任意。法定三分之二不是惯例。章程不得取消查阅或催缴失权。错误主张不关窗：草稿即已通过、范本即已签署、取消查阅、突破五年、惯例三分之二、未知写零，只关对应格，闸已开仍出其他CZ#。主路径只用Q-章，禁止Q-设、Q-选作主路径。范本只借章程栏目，不得升格已通过或已备案。双方秘密、倒签通过日、伪造签名或抢夺印章第一次即整体停止，不得选边。闸关仍交十节，第6节不出CZ#终稿。本窗闸名只能是章程闸，禁止复用选型闸、设立闸、登记闸、决议闸。不写已通过、不代签署、不代替决议是交付禁令不是负触发，未知不写零。"
