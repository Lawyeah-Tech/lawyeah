interface:
  display_name: "提起决议不成立无效或撤销之诉"
  short_description: "决议诉闸与XF#草案；轻微瑕疵不是当然应撤销，只列对立股东不是可交终稿"
  default_prompt: "使用 $提起决议不成立无效或撤销之诉，在单方无冲突立场下准备中国大陆决议不成立、无效或撤销之诉起诉包草案：决议诉闸、主体与强制接口、Q#路径、XF#决议诉行（原告资格/请求类型/被告列法/除斥接口/管辖接口/证据目录/E#）。开闸材料是可编号决议切片或请求类型碎片，不是口头已经立案。决议诉闸打开不等于已立案不等于应撤销。轻微瑕疵不是当然应撤销。无股东资格不是可提撤销。原则上列公司为被告。不成立四项穷尽。无效或不成立不适用撤销六十日。错误主张不关窗：轻微瑕疵即应撤销、无资格仍提撤销、只列对立股东、有效仲裁仍应起诉、草稿即已立案、未知写零，只关对应格，闸已开仍出其他XF#。范本只借起诉状栏目。双方秘密、伪造决议或倒签起诉第一次即整体停止，不得选边。闸关仍交十节，第6节不出XF#终稿。本窗闸名只能是决议诉闸，禁止复用决议闸、起诉闸、答辩闸。不代提交是交付禁令不是负触发，未知不写零。"
