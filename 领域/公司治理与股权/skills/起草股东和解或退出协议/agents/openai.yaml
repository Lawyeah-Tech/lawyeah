interface:
  display_name: "起草股东和解或退出协议"
  short_description: "和解闸与HJ#草案；草稿不是已签署，单独和解不是已可强制执行"
  default_prompt: "使用 $起草股东和解或退出协议，在单方无冲突立场下形成中国大陆发送前股东和解或退出协议草稿：和解闸、主体与强制接口、Q#路径、HJ#和解行（谈拢切片/处分路径/对价与付款/弃权边界/名册登记与章证照/执行力接口/E#）。开闸材料是可编号谈拢碎片，不是口头已经谈拢或微信说签了。和解闸打开不等于已签署不等于已生效履行不等于已可强制执行不等于已过户不等于待签署终稿。草稿不是已签署。口头谈拢不是已生效。单独和解不是已有强制执行力。付款不是名册记载不是变更登记。概括弃权不是覆盖未知请求。章证照一并处理不是已交接。错误主张不关窗：草稿即已签署、口头谈拢即已履行、单独和解即已可执行、付款即已过户、概括弃权覆盖未知请求、章证照一并处理即已交接、未知写零，只关对应格，闸已开仍出其他HJ#。范本只借和解或退出协议栏目。双方秘密、伪造协议或签章、伪造放弃、倒签签署日或已履行、虚假减资、抢夺印章、隐匿资产或账簿、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出HJ#终稿。本窗闸名只能是和解闸，禁止复用退出闸、协议闸、谈判闸、回购闸、拘束闸、转让闸、僵局闸、登记闸。主行只能是HJ#，禁止TC#、BJ#、HG#、ZR#、XY#、A#。主路径只用Q-和，禁止Q-谈、Q-签、Q-束、Q-购作主路径。本窗Q-签只作草稿即已签署不关窗码。不代签署、不写已签署、不保证司法确认是交付禁令不是负触发，未知不写零。"
