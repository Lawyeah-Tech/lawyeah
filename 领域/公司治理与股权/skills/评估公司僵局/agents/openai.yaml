interface:
  display_name: "评估公司僵局"
  short_description: "僵局闸与JJ#草案；盈利不是无僵局，机关失灵不是必须解散"
  default_prompt: "使用 $评估公司僵局，在单方无冲突立场下形成中国大陆公司僵局路径草案：僵局闸、主体与强制接口、Q#路径、JJ#僵局行（失灵切片/持续不能形成有效决议/盈利或亏损接口/替代路径/百分之十表决权与解散／破产接口/E#）。开闸材料是可编号机关失灵、失败召集表决、对峙或瘫痪、章程或名册碎片，不是口头必须解散。僵局闸打开不等于必须解散不等于已无僵局不等于解散诉状已可交。盈利不是无僵局。一次会议未开不是经营管理严重困难。亏损不是必须解散。持股百分之十是表决权不是当然出资额。其他途径未尝试不是已满足。错误主张不关窗：盈利即无僵局、一次流会即已符合解散、亏损即必须解散、出资额即百分之十门槛、未尝试即其他途径不能解决、未知写零，只关对应格，闸已开仍出其他JJ#。案例只比较差异。双方秘密、伪造决议、倒签会议或抢夺印章证照第一次即整体停止，不得选边。闸关仍交十节，第6节不出JJ#终稿。本窗闸名只能是僵局闸，禁止复用关系闸、控制闸、退出闸、谈判闸、和解闸、立案闸、起诉闸。主行只能是JJ#，禁止JG#、JM#、KZ#、TC#、GX#、SZ#、A#。主路径只用Q-僵，禁止用Q-争、Q-谈、Q-散作主路径。不得问代表哪一方后继续。不写解散诉状、不把盈利写成无僵局是交付禁令不是负触发。未知不写零。"
