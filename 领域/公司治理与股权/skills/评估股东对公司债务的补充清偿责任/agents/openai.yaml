interface:
  display_name: "评估股东对公司债务的补充清偿责任"
  short_description: "清偿闸与BC#草案；不能清偿不是已补充清偿，未届期不是当然补全部债"
  default_prompt: "使用 $评估股东对公司债务的补充清偿责任，在单方无冲突的债权人或被追责股东立场下评估中国大陆股东对公司债务的补充清偿条件与范围：清偿闸、主体与强制接口、Q#路径、BC#清偿行（债务基础/不能清偿/责任类型/范围上限/主体分列/E#）。开闸材料是可编号公司债碎片或认缴/抽逃碎片，不是口头股东要还全部债。无书面授权但有碎片＝清偿闸部分打开。不能清偿未闭合＝闸可半开，不得写已补充清偿成立。清偿闸打开不等于已补充清偿不等于不能清偿已坐实不等于未届期已加速不等于已抽逃不等于人格否认已成立。不能清偿不是已补充清偿成立。未届期不是当然补全部公司债。认缴登记不是已实缴。大额转出不是当然抽逃。第54条提前缴纳不是已对债权人补充清偿。解释三第13条不是已被征求意见稿废止。征求意见稿不是现行。第88条第1款不是当然溯及2024-07-01前转让。人格否认连带不是本窗补充清偿。错误主张不关窗：不能清偿即已补充清偿、未届期即当然补全部债、认缴即已实缴、大额转出即抽逃、第54条即已对债权人补充清偿、征求意见稿当现行、第88条第1款当然溯及、未知写零，只关对应格，闸已开仍出其他BC#。主路径只用Q-责，禁止Q-瑕、Q-催、Q-失、Q-否、Q-测、Q-诉、Q-清、Q-追作主路径。未届期股东在执行中不是当然可追加。公司住所地或执行法院不是唯一管辖已定。类案只比较差异，禁止用范本生成已补充清偿证明、诉状或执行追加终稿。双方秘密、伪造出资凭证、倒签缴款日或伪造不能清偿证明第一次即整体停止，不得选边。闸关仍交十节，第6节不出BC#终稿。本窗闸名只能是清偿闸，禁止复用瑕疵闸、催缴闸、失权闸、测算闸。不出诉状、不写已补充清偿是交付禁令不是负触发，未知不写零。"
