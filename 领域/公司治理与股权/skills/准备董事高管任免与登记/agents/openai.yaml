interface:
  display_name: "准备董事高管任免与登记"
  short_description: "任免闸与RM#草案；未登记不是已对抗善意相对人，网交回执不是已核准"
  default_prompt: "使用 $准备董事高管任免与登记，在单方无冲突立场下形成中国大陆发送前董事高管或法定代表人任免与登记草稿：任免闸、主体与强制接口、Q#路径、RM#任免行（权源/身份与机关/文件要点/登记对抗接口/交接接口/E#）。开闸材料是可编号任免意思或身份碎片，不是口头执照还没换也算换完了。任免闸打开不等于已换证不等于已核准不等于已对抗。未登记不是已对抗善意相对人。任免草稿不是已换证。网交回执不是已核准。董事会任免董事不是权源已闭合。劳动解除金不是本窗任免终稿。错误主张不关窗：未登记即已对抗、草稿即已换证、回执即已核准、董事会任免董事即权源已闭合、未知写零，只关对应格，闸已开仍出其他RM#。范本只借栏目。双方秘密、伪造任免决议、倒签任职或抢章第一次即整体停止，不得选边。闸关仍交十节，第6节不出RM#终稿。本窗闸名只能是任免闸，禁止复用董事闸、忠实闸、设立闸、变更闸、登记闸。主行只能是RM#，禁止DH#、ZS#、XS#、BG#、RF#、A#。不得问代表哪一方后继续。不代提交不写已换证是交付禁令不是负触发，未知不写零。"
