interface:
  display_name: "梳理股权结构与控制权"
  short_description: "结构闸与GQ#草案；登记不是实际控制人已认定，持股最多不是当然实际控制人"
  default_prompt: "使用 $梳理股权结构与控制权，在单方无冲突立场下形成中国大陆股权控制图草案：结构闸、主体与强制接口、Q#路径、GQ#结构行（三层主体/认缴实缴/表决权/协议约束/控制人接口/E#）。开闸材料是可编号股东或持股碎片，不是口头登记上就是实控人。结构闸打开不等于实控人已认定不等于名册已对抗。登记不是实际控制人已认定。持股最多不是当然实际控制人。认缴比例不是当然表决权。名册不是对外对抗已完成。图上控制不是已完成变更登记。未实缴不是当然无表决权。错误主张不关窗：登记即实控人、持股最多即实控人、认缴即表决权、名册即已对抗、图上即已过户、未知写零，只关对应格，闸已开仍出其他GQ#。案例只比较差异。双方秘密、伪造名册、倒签一致行动或抢章第一次即整体停止，不得选边。闸关仍交十节，第6节不出GQ#终稿。本窗闸名只能是结构闸，禁止复用关系闸、转让闸、控制闸。主行只能是GQ#，禁止GX#、ZR#、JG#、ST#、A#。不得问代表哪一方后继续。不判断转让终局不指导抢章是交付禁令不是负触发，未知不写零。"
