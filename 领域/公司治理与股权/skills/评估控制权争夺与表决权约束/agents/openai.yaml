interface:
  display_name: "评估控制权争夺与表决权约束"
  short_description: "控制闸与KZ#草案；名册或登记不是已最终控制，持股最多不是当然实际控制人"
  default_prompt: "使用 $评估控制权争夺与表决权约束，在单方无冲突立场下形成中国大陆控制权争夺路径草案：控制闸、主体与强制接口、Q#路径、KZ#争夺行（权源切片/席位或代表人/名册登记对抗/协议拘束接口/临时措施红旗/E#）。开闸材料是可编号股权、席位、代表人、名册或协议碎片，不是口头登记上就是我说了算。控制闸打开不等于已最终控制不等于实际控制人已认定。名册或登记不是已最终控制。持股最多不是当然实际控制人。认缴比例不是当然表决权。股东协议不是当然对公司发生效力。错误主张不关窗：名册即已最终控制、持股最多即当然实控人、认缴即当然表决权、股东协议即对公司生效、登记即已对抗、未知写零，只关对应格，闸已开仍出其他KZ#。案例只比较差异。双方秘密、伪造决议、倒签一致行动或抢夺印章证照第一次即整体停止，不得选边。闸关仍交十节，第6节不出KZ#终稿。本窗闸名只能是控制闸，禁止复用结构闸、关系闸、转让闸。主行只能是KZ#，禁止GQ#、GX#、ZR#、A#。主路径只用Q-争，禁止Q-构、Q-束。不得问代表哪一方后继续。不指导抢章、不把名册写成已最终控制是交付禁令不是负触发。未知不写零。"
