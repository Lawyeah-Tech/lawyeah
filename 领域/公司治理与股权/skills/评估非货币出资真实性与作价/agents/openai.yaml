interface:
  display_name: "评估非货币出资真实性与作价"
  short_description: "非货币闸与FB#草案；未评估不是当然低价，合同一签不是已实缴"
  default_prompt: "使用 $评估非货币出资真实性与作价，在单方无冲突立场下评估中国大陆非货币出资的可出资性、权属转移和作价争点：非货币闸、主体与强制接口、Q#路径、FB#非货币行（标的可出资性/权属负担/转移手续/作价争点/责任接口/E#）。开闸材料是可编号非货币标的碎片，不是口头这个专利值一个亿。无书面授权但有标的碎片＝非货币闸部分打开。非货币闸打开不等于已实缴不等于已公允不等于当然显著低价。未评估不是当然显著低价。合同一签不是已实缴。未办理财产权转移不是已实缴。评估报告不是已公允。口头作价不是已评估。劳务不是当然能出资。第50条设立时其他股东连带只开接口。错误主张不关窗：未评估即当然低价、合同一签即已实缴、评估报告即已公允、劳务当然能出资、未知写零，只关对应格，闸已开仍出其他FB#。主路径只用Q-非，禁止Q-催、Q-鉴、Q-测作主路径。类案只比较差异，禁止用范本生成鉴定意见或已虚假出资证明。双方秘密、伪造评估报告、伪造权属证书或倒签过户日第一次即整体停止，不得选边。闸关仍交十节，第6节不出FB#终稿。本窗闸名只能是非货币闸，禁止复用瑕疵闸、催缴闸、测算闸、鉴定闸。不预测鉴定、不写已虚假出资是交付禁令不是负触发，未知不写零。"
