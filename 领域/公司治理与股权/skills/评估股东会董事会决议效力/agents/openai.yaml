interface:
  display_name: "评估股东会董事会决议效力"
  short_description: "决议闸与XL#草案；轻微瑕疵不是当然撤销，第二十七条穷尽四项"
  default_prompt: "使用 $评估股东会董事会决议效力，在单方无冲突立场下判断中国大陆公司股东会或董事会决议不成立、无效或可撤销路径：决议闸、机关与形成方式、Q#路径、XL#效力行（决议切片/机关/形成方式/不成立接口/无效接口/可撤销接口/E#）。开闸材料是可编号决议或形成碎片，不是口头通知晚了就算撤销。决议闸打开不等于已撤销不等于当然不成立。轻微瑕疵不是当然撤销。未开会不是当然不成立。内容违章不是当然无效。内容违法不是可撤销。视频或电子通信开会不是未召开。解释四其他情形不是2024年后不成立口袋。过了六十日不是仍可撤。错误主张不关窗：轻微瑕疵即当然撤销、未开会即当然不成立、内容违章即当然无效、内容违法即写成可撤销、电子开会即未召开、解释四口袋当不成立、过了六十日仍可撤、今天起诉即已撤销，只关对应格，闸已开仍出其他XL#。类案只比较差异。双方秘密、伪造决议或倒签会议第一次即整体停止，不得选边。闸关仍交十节，第6节不出XL#终稿。本窗闸名只能是决议闸，禁止复用关系闸、瑕疵闸、催缴闸、失权闸、效力闸；效力只作行名XL#。禁止与投并购路径表决议闸列混用。不写诉状是交付禁令不是负触发，不选定法院，不给胜诉率，未知不写零。"
