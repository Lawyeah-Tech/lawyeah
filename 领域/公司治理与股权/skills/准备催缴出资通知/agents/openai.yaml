interface:
  display_name: "准备催缴出资通知"
  short_description: "催缴闸与CJ#草案；催缴书不是已失权，已读不是已送达"
  default_prompt: "使用 $准备催缴出资通知，在单方无冲突的公司机关立场下准备中国大陆发送前催缴出资通知草案：催缴闸、主体与强制接口、Q#路径、CJ#催缴行（权源/股东与差额/宽限期接口/后果提示/送达接口/E#）。开闸材料是可编号未按期缴纳股东碎片，不是口头该缴了，不是今天发函就算失权。无书面授权但有未缴碎片＝催缴闸部分打开。催缴闸打开不等于已发出不等于已送达不等于已失权。催缴书草稿不是已发出。催缴书不是已失权。已读不是已送达。宽限期自发出之日起不得少于六十日。章程短于六十日不是可执行。未届期不是当然催缴。发出不是已失权。监事会或经理名义不是董事会催缴。解释三第17条不是2024年后唯一失权路径。错误主张不关窗：催缴书即已失权、已读即送达、宽限期少于六十日、未届期当然催缴、发出即失权、未知写零，只关对应格，闸已开仍出其他CJ#。主路径只用Q-催，禁止Q-评、Q-失作主路径。范本只借催缴书栏目，不得升格已发出或已失权。双方秘密、倒签催缴发出日、伪造董事会决议或冒充董事会抬头第一次即整体停止，不得选边。闸关仍交十节，第6节不出CJ#终稿。本窗闸名只能是催缴闸，禁止复用瑕疵闸、失权闸。不执行发送、不写已失权是交付禁令不是负触发，未知不写零。"
