interface:
  display_name: "评估出资瑕疵催缴与加速到期"
  short_description: "瑕疵闸与XC#草案；催缴评估不是已失权，未届期不是当然加速到期"
  default_prompt: "使用 $评估出资瑕疵催缴与加速到期，在单方无冲突立场下判断中国大陆公司未缴、不实、抽逃或加速到期路径：瑕疵闸、认缴实缴对照、Q#路径、XC#瑕疵行（股东切片/认缴实缴/期限/催缴接口/加速接口/失权接口/E#）。开闸材料是可编号股东或认缴碎片，不是口头觉得不安全。瑕疵闸打开不等于已失权不等于当然加速。催缴评估不是已失权。未届期不是当然加速到期。大额转出不是当然抽逃。认缴登记不是已实缴。错误主张不关窗：催缴评估即已失权、未届期即当然加速、大额转出即抽逃、今天发函即失权，只关对应格，闸已开仍出其他XC#。类案只比较差异。双方秘密、伪造出资凭证或倒签缴款日第一次即整体停止，不得选边。闸关仍交十节，第6节不出XC#终稿。本窗闸名只能是瑕疵闸，禁止复用关系闸、催缴闸、失权闸；加速只作路径，不是闸名。不发函是交付禁令不是负触发，不选定法院，不给胜诉率，未知不写零。"
