interface:
  display_name: "准备有限公司股权内部转让"
  short_description: "转让闸与ZR#草案；对内无法定优先购买，签署不是已取得股东权"
  default_prompt: "使用 $准备有限公司股权内部转让，在单方无冲突立场下形成中国大陆有限公司对内或对外发送前转让文件、对外优先购买通知和名册登记接口：转让闸、对内对外路径、Q#路径、ZR#转让行（转让切片/对内对外路径/同等条件/名册接口/登记接口/未缴出资接口/E#）。开闸材料是可编号转让方、受让方或股权碎片，不是口头签了就是股东。转让闸打开不等于已取得对内股东权不等于已变更登记不等于已放弃。对内默认无法定优先购买。对外才走优先购买书面通知。章程另定从其规定。签署协议不是已取得股东权。付款不是已变更登记。2018年过半数同意不是现行对外程序。错误主张不关窗：签署即股东、付款即过户、对内当然要发优先购买、对外仍须过半数、未答复即当然放弃，只关对应格，闸已开仍出其他ZR#。范本只借栏目。双方秘密、倒签放弃或隐瞒未缴第一次即整体停止，不得选边。闸关仍交十节，第6节不出ZR#终稿。本窗闸名只能是转让闸，禁止复用优先购买闸、催缴闸、失权闸、召集闸。不执行发送是交付禁令不是负触发，不选定法院，不给胜诉率，未知不写零。"
