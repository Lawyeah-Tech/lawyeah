interface:
  display_name: "准备有限公司股权内部转让"
  short_description: "转让闸与ZR#草案；签署协议不是已取得股东权，付款不是已变更登记"
  default_prompt: "使用 $准备有限公司股权内部转让，在单方无冲突立场下准备中国大陆有限公司股东之间转让的发送前协议草稿和名册登记接口：转让闸、对内对外路径、Q#路径、ZR#转让行（转让切片/对内对外路径/同等条件/名册接口/登记接口/未缴出资接口/E#）。开闸材料是可编号转让方受让方或股权碎片，不是口头签了就是股东。转让闸打开不等于已取得股东权不等于已变更登记。签署协议不是已取得对内股东权。付款不是已变更登记。通知发出不是优先购买已放弃。错误主张不关窗：签署即已取得股东权、付款即已变更登记、通知即已放弃、把对外当内部，只关对应格，闸已开仍出其他ZR#。范本只借栏目。双方秘密、倒签放弃声明或伪造签章第一次即整体停止，不得选边。闸关仍交十节，第6节不出ZR#终稿。本窗闸名只能是转让闸，禁止复用召集闸、决议闸、优先购买闸。不执行发送是交付禁令不是负触发，不选定法院，不给胜诉率，未知不写零。"
