interface:
  display_name: "提起利润分配之诉"
  short_description: "分配诉闸与FS#草案；诉状草稿不是已立案，无具体方案决议不是已可强制分配起诉终稿"
  default_prompt: "使用 $提起利润分配之诉，在单方无冲突拟起诉股东立场下形成中国大陆发送前利润分配之诉起诉包草案：分配诉闸、主体与强制接口、Q#路径、FS#分配诉行（原告资格/决议或具体方案切片/给付或强制接口/被告列法/六个月与滥权接口/管辖接口/E#）。开闸材料是可编号资格、决议或未支付碎片，不是口头已经立案了。分配诉闸打开不等于已立案不等于已提交。诉状草稿不是已立案。无载明具体分配方案的股东会决议不是已可强制分配起诉终稿。被告原则上是公司。六个月是执行期不是时效。错误主张不关窗：草稿即已立案、无具体方案即强制分配起诉终稿、有利润即强制分起诉、认缴即分配比例、六个月即请求已成立、滥权默认打开、选定某院、网交即已提交、未知写零、唯一必得总额，只关对应格，闸已开仍出其他FS#。范本只借栏目。双方秘密、伪造分配决议或倒签起诉第一次即整体停止，不得选边。闸关仍交十节，第6节不出FS#终稿。本窗闸名只能是分配诉闸，禁止复用分配闸、测算闸、起诉闸。主行只能是FS#，禁止FP#、DJ#、SZ#、CY#、A#。主路径只用Q-给，禁止Q-分、Q-代。不得问代表哪一方后继续。不代提交、不定法院、不写唯一必得总额是交付禁令不是负触发。未知不写零。"
