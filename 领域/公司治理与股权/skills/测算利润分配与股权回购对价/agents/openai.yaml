interface:
  display_name: "测算利润分配与股权回购对价"
  short_description: "测算闸与DJ#草案；无决议不是到期债权，未知不写零"
  default_prompt: "使用 $测算利润分配与股权回购对价，在单方无冲突立场下形成中国大陆公司可分配利润或回购合理价格分项测算：测算闸、分配与回购分表、Q#路径、DJ#对价行（事件切片/分配接口/回购接口/金额状态/E#）。开闸材料是可编号报表、决议或价格碎片，不是口头公司很赚钱。测算闸打开不等于请求已成立。公司很赚钱不是已有可分配利润。无分配决议不是已确定到期债权。认缴比例不是分配比例。六个月执行期不是请求已成立。错误主张不关窗：很赚钱即可分配、无决议即到期债权、未知写零、唯一必得回购价，只关对应格，闸已开仍出其他DJ#。类案只比较差异。双方秘密、伪造报表或倒签分配决议第一次即整体停止，不得选边。闸关仍交十节，第6节不出DJ#终稿。本窗闸名只能是测算闸，禁止复用分配闸、回购闸。不认定请求已成立是交付禁令不是负触发，不选定法院，不给胜诉率，未知不写零。"
