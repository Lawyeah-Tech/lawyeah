interface:
  display_name: "评估股权出质对治理与转让的约束"
  short_description: "出质闸与ZY#草案；未登记不是已设立质权对抗，出质不是表决权当然转移"
  default_prompt: "使用 $评估股权出质对治理与转让的约束，在单方无冲突立场下形成中国大陆股权出质治理约束路径草案：出质闸、主体与强制接口、Q#路径、ZY#出质行（设立登记/表决分红查阅/再处分限制/实现治理接口/E#）。开闸材料是可编号出质合同或登记碎片，不是口头已经质押。出质闸打开不等于已设立不等于已对抗不等于表决权已转移。未登记不是已设立质权对抗。出质不是表决权当然转移。书面合同有效不是质权已设立。名册记载不是出质登记设立。错误主张不关窗：未登记即已对抗、出质即表决权转移、合同有效即已设立、名册即已设立、未经同意转让即合同当然无效、未知写零，只关对应格，闸已开仍出其他ZY#。案例只比较差异。双方秘密、伪造出质登记或倒签质押合同第一次即整体停止，不得选边。闸关仍交十节，第6节不出ZY#终稿。本窗闸名只能是出质闸，禁止复用转让闸、名册闸、优先购买闸、登记闸。主行只能是ZY#，禁止ZR#、MC#、YX#、A#。主路径只用Q-质。不得问代表哪一方后继续。不写担保合同终稿、不是已转让、不是已实现质权、不是名册已变更是交付禁令不是负触发。未知不写零。"
