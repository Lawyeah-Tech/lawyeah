interface:
  display_name: "评估股东争议管辖与仲裁条款"
  short_description: "管辖闸与XG#草案；评估不是已选定法院，仲裁条款不是当然有效"
  default_prompt: "使用 $评估股东争议管辖与仲裁条款，在单方无冲突立场下形成中国大陆股东争议管辖与仲裁条款评估草案：管辖闸、主体与强制接口、Q#路径、XG#管辖行（条款切片/书面合意与覆盖/机构可确定性/可仲裁性接口/连结点与异议期/E#）。开闸材料是可编号章程、股东协议、转让协议争议解决条款或连结点碎片，不是口头去某中院告。管辖闸打开不等于已选定法院不等于有效仲裁已排除不等于已提出异议不等于已应诉管辖。评估不是已选定法院。仲裁条款不是当然有效。章程仲裁条款对未签署股东待核。公司诉讼不是一律专属管辖。劳动仲裁前置不是股东资格决议解散的前置。或裁或诉机构不明不是当然有效。错误主张不关窗：评估即已选定法院、仲裁条款当然有效、未签署股东亦受仲裁约束、公司诉讼一律专属、劳动仲裁套股东资格、有效仲裁仍应直接起诉、未知写零，只关对应格，闸已开仍出其他XG#。类案只比较差异。双方秘密、伪造仲裁协议、倒签签署日、抢夺印章、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出XG#终稿。本窗闸名只能是管辖闸，禁止复用起诉闸、答辩闸、庭审闸、上诉闸。预留不得占用立案闸、保全闸。主行只能是XG#，禁止SZ#、SS#、TS#、DB#、GX#、A#。主路径只用Q-管，禁止Q-诉、Q-上、Q-审、Q-庭作主路径。本窗Q-签只作评估即已选定法院不关窗码。Q-管邻窗是转介码本窗打开为主路径。不代提交、不选定法院、不出起诉包上诉状保全申请是交付禁令不是负触发，未知不写零。"
