interface:
  display_name: "评估法人人格否认"
  short_description: "否认闸与FR#草案；单一往来不是当然否认，一人不是当然连带"
  default_prompt: "使用 $评估法人人格否认，在单方无冲突的债权人或被追责股东／姐妹公司立场下形成中国大陆法人人格否认路径草案：否认闸、主体与强制接口、Q#路径、FR#否认行（否认切片/债务基础/纵向滥用/横向混同/一人举证/范围与主体分列/E#）。开闸材料是可编号公司债碎片或滥用、混同、一人身份碎片，不是口头股东肯定连带。否认闸打开不等于已连带不等于人格已消灭不等于一人已不能证明独立。单一往来不是当然否认。部分混同不是当然横向否认。债不立则否认无附丽。人格否认连带不是未出资补充清偿。一人不能证明则连带，但不得写一定免责或一定成立。错误主张不关窗：单一往来即当然否认、部分混同即当然横向、债不立即写否认、否认即补充清偿、一人一定连带或一定免责、审计即已独立、2018条当现行、未知写零，只关对应格，闸已开仍出其他FR#。案例只比较差异。双方秘密、伪造账册、倒签隔离合同或补造往来第一次即整体停止，不得选边。闸关仍交十节，第6节不出FR#终稿。本窗闸名只能是否认闸，禁止复用清偿闸、一人闸、关系闸。主行只能是FR#，禁止BC#、YR#、GX#、A#。主路径只用Q-否，禁止用Q-责、Q-一、Q-诉作主路径。不得问代表哪一方后继续。不出诉状、不写已连带、不给胜诉率是交付禁令不是负触发。未知不写零。"
