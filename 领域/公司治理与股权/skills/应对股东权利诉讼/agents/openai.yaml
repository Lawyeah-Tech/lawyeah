interface:
  display_name: "应对股东权利诉讼"
  short_description: "答辩闸与DB#草案；草稿不是已答辩，已读不是已送达"
  default_prompt: "使用 $应对股东权利诉讼，在单方无冲突的被诉立场下准备中国大陆股东权利或公司治理一审首次应诉答辩草稿：答辩闸、主体与强制接口、Q#路径、DB#答辩行（被告列法/对方请求类型/送达与期限接口/程序抗辩/实体抗辩/反诉接口/证据目录/E#）。开闸材料是可编号起诉状或应诉通知碎片，不是口头已经被诉。无书面应诉授权但有起诉状碎片＝答辩闸部分打开。答辩闸打开不等于已答辩不等于已提交不等于已送达不等于抗辩已成立不等于保证驳回。草稿不是已答辩。已读不是已送达。微信转发不是法定送达。网交不是已提交。不提出答辩状不是当然败诉。过期只停提交稿不关窗。有效仲裁不是本案必审。无股东资格不是可维持撤销。前置未完成不是代表诉讼已可审。决议之诉原则上以公司为被告。代表诉讼胜诉利益归公司。不选定法院。不给胜诉率。错误主张不关窗：草稿即已答辩、已读即已送达、过期仍要可提交、不答辩即败诉、有效仲裁仍当本案必审、选定某院、保证驳回、未知写零、网交即已提交，只关对应格，闸已开仍出其他DB#。主路径只用Q-辩，禁止Q-应。范本只借民事答辩状栏目，不得升格已答辩或已提交。双方秘密、隐匿账簿、作伪证或抢夺印章第一次即整体停止，不得选边。闸关仍交十节，第6节不出DB#终稿。本窗闸名只能是答辩闸，禁止复用应诉闸、应对闸、起诉闸、立案闸。不代提交是交付禁令不是负触发，未知不写零。"
