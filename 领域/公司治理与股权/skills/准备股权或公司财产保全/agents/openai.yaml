interface:
  display_name: "准备股权或公司财产保全"
  short_description: "保全闸与BQ#草案；申请草稿不是已裁定，线索表不是已冻结"
  default_prompt: "使用 $准备股权或公司财产保全，在单方无冲突立场下形成中国大陆发送前保全申请草稿：保全闸、主体与强制接口、Q#路径、BQ#保全行（措施切片/标的与范围/必要性/担保/线索/E#）。开闸材料是可编号拟保全对象碎片，不是口头先冻住或先把钱转走再申请。保全闸打开不等于已裁定不等于已冻结不等于担保已足额不等于诉前三十日已起算。申请草稿不是已裁定。担保不是已保全。线索不是已冻结。口头紧急不是四十八小时已裁。空泛不诚信不是难以执行已证成。诉前措施不是起诉已完成。冻结股权不是已变更股东。错误主张不关窗：申请即已裁定、担保即已保全、线索即已冻结、保证裁定、未知写零，只关对应格，闸已开仍出其他BQ#。范本只借申请书、担保书、线索清单栏目。双方秘密、隐匿转移、抽逃作担保、抢夺破解、伪造担保、倒签申请日、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出BQ#终稿。本窗闸名只能是保全闸，禁止复用封存闸、管辖闸、起诉闸、印章闸。预留不得占用立案闸、冻结闸。主行只能是BQ#，禁止FC#、XG#、SZ#、YZ#、A#。主路径只用Q-保，禁止Q-账、Q-管、Q-诉、Q-冻作主路径。本窗Q-签只作申请草稿即已提交不关窗码。Q-保邻窗是转介码本窗打开为主路径。不保证裁定、不代提交、不选定法院是交付禁令不是负触发，未知不写零。"
