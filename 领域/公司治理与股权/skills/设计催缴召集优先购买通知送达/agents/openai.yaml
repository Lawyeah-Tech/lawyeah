interface:
  display_name: "设计催缴召集优先购买通知送达"
  short_description: "送达闸与SD#草案；已读不是已送达，发出不是到达"
  default_prompt: "使用 $设计催缴召集优先购买通知送达，在单方无冲突立场下形成中国大陆发送前催缴、召集或优先购买通知的渠道与回证设计草稿：送达闸、主体与强制接口、Q#路径、SD#送达行（文书种类接口/地址权源/渠道组合/回证形态/失败升级/E#）。开闸材料是可编号拟送文书种类或相对方碎片，不是口头微信已读就算送到。送达闸打开不等于已发出不等于已送达不等于已到达。已读不是已送达。发出不是到达。接到书面通知不是已读截图。本窗不写通知实体内容。错误主张不关窗：已读即已送达、微信转发即发出、发出即到达、已读截图即接到书面通知、未知写零，只关对应格，闸已开仍出其他SD#。范本只借回证栏目。双方秘密、伪造回证或已读截图充到达第一次即整体停止，不得选边。闸关仍交十节，第6节不出SD#终稿。本窗闸名只能是送达闸，禁止复用催缴闸、召集闸、优先购买闸。主行只能是SD#，禁止CJ#、ZJ#、YX#、A#。主路径只用Q-送，禁止Q-达作主路径。不执行发送、不写通知正文、不写已送达是交付禁令不是负触发，未知不写零。"
