interface:
  display_name: "准备书面一致同意决定"
  short_description: "书面闸与SM#草案；缺一名股东不是已召开会议，一人书面决定不是可救缺员"
  default_prompt: "使用 $准备书面一致同意决定，在单方无冲突立场下形成中国大陆有限公司发送前书面一致同意决定草稿：书面闸、主体与强制接口、Q#路径、SM#书面行（股东穷尽/职权事项/同文签署/互斥开会/一人与股份接口/置备登记接口/E#）。开闸材料是可编号股东或决定事项碎片，不是口头缺的那个人算弃权。书面闸打开不等于已通过不等于已开会。缺一名股东不是已召开会议。缺一名股东不是已一致通过。书面决定不是已开会。一人公司第六十条不是可救缺员书面决议。多数决不是书面一致。草稿不是已经通过。股份不得未核验套有限第五十九条第三款。成立大会不是可改书面一致。错误主张不关窗：缺一名即已通过、书面决定即已开会、第六十条即救缺员、多数决即书面一致、草稿即已通过、未知写零，只关对应格，闸已开仍出其他SM#。范本只借栏目。双方秘密、伪造缺席股东签名或倒签日期第一次即整体停止，不得选边。闸关仍交十节，第6节不出SM#终稿。本窗闸名只能是书面闸，禁止复用召集闸、决议闸、程序闸、决议诉闸、一人闸。主行只能是SM#，禁止ZJ#、XL#、CX#、XF#、YR#、A#。不得问代表哪一方后继续。不写已通过是交付禁令不是负触发，未知不写零。"
