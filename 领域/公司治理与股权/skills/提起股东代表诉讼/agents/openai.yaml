interface:
  display_name: "提起股东代表诉讼"
  short_description: "代表诉闸与DS#草案；诉状草稿不是已立案，前置未闭合且无紧急不是已可起诉终稿"
  default_prompt: "使用 $提起股东代表诉讼，在单方无冲突拟起诉股东立场下形成中国大陆发送前股东代表诉讼起诉包草案：代表诉闸、主体与强制接口、Q#路径、DS#代表诉行（原告资格/前置或紧急接口/被告与公司地位/请求与利益归属/管辖接口/担保调解接口/E#）。开闸材料是可编号资格、公司损害、前置请求或紧急具体事实碎片，不是口头已经立案了。代表诉闸打开不等于已立案不等于已提交不等于已可起诉终稿。诉状草稿不是已立案。前置未闭合且无紧急具体事实不是已可起诉终稿。被告不是公司自己。胜诉利益不是归原告股东。错误主张不关窗：草稿即已立案、前置未闭合即已可起诉终稿、口头很急即紧急、有限套百分之一、被告列公司、胜诉利益归股东、直接损害即代表诉讼已成立、有效仲裁当然排除、选定某院、网交即已提交、未知写零，只关对应格，闸已开仍出其他DS#。范本只借栏目。双方秘密、伪造请求或倒签起诉第一次即整体停止，不得选边。闸关仍交十节，第6节不出DS#终稿。本窗闸名只能是代表诉闸，禁止复用代表诉讼闸、前置请求闸、起诉闸。主行只能是DS#，禁止DL#、QZ#、SZ#、QH#、A#。主路径只用Q-代诉，禁止Q-代、Q-前、Q-诉。不得问代表哪一方后继续。不代提交、不定法院、不给胜诉率是交付禁令不是负触发。未知不写零。"
