interface:
  display_name: "选择公司类型与机关结构"
  short_description: "选型闸与XX#草案；比较表不是已选定，比较表不是已登记"
  default_prompt: "使用 $选择公司类型与机关结构，在单方无冲突立场下准备中国大陆公司类型与机关结构比较草案：选型闸、主体与强制接口、Q#路径、XX#选型行（类型对照/机关结构/出资缴付对照/必载缺口/登记接口/E#）。开闸材料是可编号拟设碎片，不是口头已经选定。无书面选型授权但有拟设碎片＝选型闸部分打开。选型闸打开不等于已选定不等于已登记不等于已签署章程不等于唯一最优。比较表不是已选定。比较表不是已登记。口头选定不是已选定。以后好上市不是必须股份。创始人方便不是已符合一名董事或不设监事条件。有限加大人数不是股份。有限一名董事加不设监事不是股份可套。有限认缴五年不是股份发起人实缴。缺全体股东一致同意不是可不设监事。范本章程不是已签署。错误主张不关窗：比较表即已选定、比较表即已登记、必须股份、方便即已符合例外、有限套股份、五年套发起人、未知写零、选定唯一最优，只关对应格，闸已开仍出其他XX#。主路径只用Q-选，禁止Q-设。范本只借比较表栏目，不得升格已选定或已登记。双方秘密、倒签设立会议、虚构人数、虚构实缴或抢夺印章第一次即整体停止，不得选边。闸关仍交十节，第6节不出XX#终稿。本窗闸名只能是选型闸，禁止复用设立闸、登记闸、章程闸、变更闸。不代提交、不写已签署章程、不选定唯一最优是交付禁令不是负触发，未知不写零。"
