interface:
  display_name: "评估股东代表诉讼条件"
  short_description: "代表诉讼闸与DL#草案；未书面请求不是已可代位起诉终稿，百分之一持股不是有限公司门槛"
  default_prompt: "使用 $评估股东代表诉讼条件，在单方无冲突立场下形成中国大陆代表诉讼条件路径草案：代表诉讼闸、主体与强制接口、Q#路径、DL#代表诉讼行（损害归属/原告资格/前置机关/三十日或紧急/被告与利益归属/全资子公司接口/E#）。开闸材料是可编号股东资格、公司损害或前置请求碎片，不是口头很急就能告。代表诉讼闸打开不等于已可代位起诉不等于前置已闭合不等于紧急已成立。未书面请求不是已可代位起诉终稿。口头很急不是情况紧急。百分之一持股不是有限公司门槛。被告不是公司自己。胜诉利益不是归原告股东。股东直接损害不是代表诉讼已成立。错误主张不关窗：未书面请求即已可代位、口头很急即紧急、有限套百分之一、被告列公司、胜诉利益归股东、直接损害即代表诉讼已成立、未知写零，只关对应格，闸已开仍出其他DL#。案例只比较差异。双方秘密、伪造书面请求或倒签送达第一次即整体停止，不得选边。闸关仍交十节，第6节不出DL#终稿。本窗闸名只能是代表诉讼闸，禁止复用起诉闸、查阅诉闸、书面请求闸。主行只能是DL#，禁止SZ#、QH#、QZ#、DS#、ZS#、A#。主路径只用Q-代，禁止Q-请、Q-诉、Q-直。不得问代表哪一方后继续。不写起诉状、不把公司写成被告是交付禁令不是负触发。未知不写零。"
