interface:
  display_name: "评估表决权拘束与一致行动"
  short_description: "拘束闸与BJ#草案；股东协议对内有效不是对公司当然生效，违反约定不是决议当然不成立"
  default_prompt: "使用 $评估表决权拘束与一致行动，在单方无冲突立场下形成中国大陆表决权拘束路径草案：拘束闸、主体与强制接口、Q#路径、BJ#拘束行（签署人与覆盖议案/对内拘束/对公司／机关效力/违约救济/章程冲突接口/E#）。开闸材料是可编号协议、签署人、覆盖议案或委托碎片，不是口头协议签了就能管公司。拘束闸打开不等于对公司已生效不等于决议已因违约不成立。股东协议不是当然对公司发生效力。违约投票不是决议不成立。未签署股东不受约束。委托通知公司不是委托对内已生效。错误主张不关窗：协议即对公司生效、违约即决议不成立、未签署亦受拘束、未通知公司即对公司计票、法院必然责令按约定投票、认缴即当然表决权、未知写零，只关对应格，闸已开仍出其他BJ#。案例只比较差异。双方秘密、伪造决议、倒签一致行动或抢夺印章证照第一次即整体停止，不得选边。闸关仍交十节，第6节不出BJ#终稿。本窗闸名只能是拘束闸，禁止复用控制闸、结构闸、决议闸、书面闸、关系闸、起诉闸。主行只能是BJ#，禁止KZ#、GQ#、XL#、SM#、GX#、SZ#、A#。主路径只用Q-束，禁止用Q-争、Q-构作主路径。不得问代表哪一方后继续。不把对内有效写成对公司生效、不把违约写成决议当然不成立是交付禁令不是负触发。未知不写零。"
