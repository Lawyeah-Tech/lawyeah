interface:
  display_name: "评估股东知情查阅权"
  short_description: "查阅闸与CK#草案；账簿凭证不是当然可复制，未书面或十五日未满不是已违法拒绝"
  default_prompt: "使用 $评估股东知情查阅权，在单方无冲突立场下形成中国大陆知情查阅路径草案：查阅闸、主体与强制接口、Q#路径、CK#查阅行（材料切片/查阅或复制/书面与十五日/不正当目的接口/资格接口/E#）。开闸材料是可编号资格或查阅请求碎片，不是口头微信说了就算书面。查阅闸打开不等于已获准不等于已书面提出不等于公司已违法拒绝。有限第一款材料可查阅并复制；账簿凭证只是查阅，须书面目的加十五日。账簿凭证不是当然可复制。股份第一百一十条不得混套有限第五十七条全文。未书面或十五日未满不是已违法拒绝。不正当目的由公司举证。曾起诉不是当然不正当目的。错误主张不关窗：未书面即违法拒绝、十五日未满即违法拒绝、账簿凭证当然可复制、2018否定凭证、股份套有限第五十七条、曾起诉即不正当目的、口头即已书面、名册未载即当然无资格、未知写零，只关对应格，闸已开仍出其他CK#。案例只比较差异。双方秘密、伪造查阅请求或倒签送达第一次即整体停止，不得选边。闸关仍交十节，第6节不出CK#终稿。本窗闸名只能是查阅闸，禁止复用知情闸、书面闸、起诉闸、名册闸。主行只能是CK#，禁止MC#、SZ#、A#。主路径只用Q-阅，禁止Q-代。不得问代表哪一方后继续。不写诉状、不写已获准是交付禁令不是负触发。未知不写零。"
