interface:
  display_name: "谈判章程与治理重置"
  short_description: "谈判闸与TP#草案；要点不是已通过修正案，口头同意不是已改章程"
  default_prompt: "使用 $谈判章程与治理重置，在单方无冲突立场下形成中国大陆治理重置谈判要点草案：谈判闸、主体与强制接口、Q#路径、TP#谈判行（重置切片/底线/让步至/改章或仅协议/决议门槛与登记/E#）。开闸材料是可编号重置碎片，不是口头已经谈妥改章程。谈判闸打开不等于已通过修正案不等于已改章程不等于已对抗善意相对人不等于必须解散不等于可签协议。谈判要点不是已通过修正案。口头同意不是已改章程。未改章程未登记不得对抗善意相对人。修改章程三分之二是法定门槛不是惯例。书面一致同意只开接口不是已通过。僵局不是必须解散。盈利不是无僵局。错误主张不关窗：要点即已通过、口头即已改章程、未登记即对抗善意相对人、三分之二是惯例、僵局必须解散、盈利即无僵局、未知写零，只关对应格，闸已开仍出其他TP#。范本只借让步表栏目。双方秘密、伪造决议、倒签通过日、抢夺印章、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出TP#终稿。本窗闸名只能是谈判闸，禁止复用章程闸、协议闸、和解闸、退出闸、僵局闸。主行只能是TP#，禁止CZ#、XY#、HJ#、TC#、JJ#、A#。主路径只用Q-重，禁止Q-章、Q-协、Q-和、Q-束、Q-谈、Q-签作主路径。本窗Q-签只作要点即已签署或已通过不关窗码。Q-谈只开接口转谈判股东退出与僵局安排。不写已通过、不代签署、不代替决议是交付禁令不是负触发，未知不写零。"
