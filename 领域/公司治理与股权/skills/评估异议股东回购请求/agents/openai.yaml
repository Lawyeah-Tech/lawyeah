interface:
  display_name: "评估异议股东回购请求"
  short_description: "回购闸与HG#草案；未投反对票不是已满足第八十九条第一款，股份公司不得机械套第八十九条全文"
  default_prompt: "使用 $评估异议股东回购请求，在单方无冲突立场下形成中国大陆异议回购路径草案：回购闸、主体与强制接口、Q#路径、HG#回购行（情形切片/反对票或滥权/六十日协议/九十日起诉/合理价格接口/库股清理接口/E#）。开闸材料是可编号决议、反对票记录、滥权事实或五年盈利不分碎片，不是口头必须买回去。回购闸打开不等于已满足第八十九条第一款不等于已满足第一百六十一条不等于合理价格已确定。未投反对票不是已满足第八十九条第一款。不满不是控股股东滥权。未参会不是视同反对。任一资产不是当然主要财产。股份公司不得机械套第八十九条全文。公开发行不是打开第一百六十一条。五年不分不是已确定分红债权。合理价格不是唯一收购价。错误主张不关窗：未投反对票即已满足、不满即滥权、未参会即视同反对、任一资产即主要财产、股份套第八十九条全文、公开发行仍开第一百六十一条、五年不分即分红债权、未知写零、唯一收购价，只关对应格，闸已开仍出其他HG#。案例只比较差异。双方秘密、伪造决议或倒签会议第一次即整体停止，不得选边。闸关仍交十节，第6节不出HG#终稿。本窗闸名只能是回购闸，禁止复用测算闸、分配闸、起诉闸。主行只能是HG#，禁止DJ#、FP#、FS#、SZ#、A#。主路径只用Q-购，禁止Q-测、Q-分、Q-代。不得问代表哪一方后继续。不输出唯一收购价、不把未投反对票写成已满足是交付禁令不是负触发。未知不写零。"
