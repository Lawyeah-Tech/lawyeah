interface:
  display_name: "准备股东会决议与召集"
  short_description: "召集闸与ZJ#草案；草稿不是已经通过，无权召集不是待发送终稿"
  default_prompt: "使用 $准备股东会决议与召集，在单方无冲突立场下准备中国大陆公司股东会发送前召集通知和可签署决议草稿：召集闸、召集权与通知期、Q#路径、ZJ#召集行（机关/召集权/通知对象/会议时地/议题/表决门槛/E#）。开闸材料是可编号召集权或议题碎片，不是口头大股东当然能召集。召集闸打开不等于已召开不等于已通过。草稿不是已经通过。今天发出不是已召开。无权召集不是待发送终稿。缺员书面同意不是已开会。错误主张不关窗：草稿即已通过、今天发出即已召开、无权召集即待发送，只关对应格，闸已开仍出其他ZJ#。范本只借栏目。双方秘密、伪造出席或倒签会议第一次即整体停止，不得选边。闸关仍交十节，第6节不出ZJ#终稿。本窗闸名只能是召集闸，禁止复用决议闸、关系闸、瑕疵闸、催缴闸。不执行发送是交付禁令不是负触发，不选定法院，不给胜诉率，未知不写零。"
