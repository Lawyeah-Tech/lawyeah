interface:
  display_name: "建立公司治理与股东争议证据案卷"
  short_description: "案卷闸与AJ#草案；对方控制不是推定有利，已读不是已送达"
  default_prompt: "使用 $建立公司治理与股东争议证据案卷，在单方无冲突立场下整理中国大陆公司治理或股东争议的合法证据矩阵：案卷闸、要件路径、Q#路径、AJ#案卷行（待证事实/材料/形式/控制方/合法性/缺口/E#）。开闸材料是可编号待证事实或材料碎片，不是口头已经备份。案卷闸打开不等于已可提交诉状不等于已保全。账簿在对方控制不是推定内容有利。存在诉讼不是不正当目的。微信已读不是已送达。错误主张不关窗：对方控制即推定有利、诉讼即不正当目的、已读即已送达、案卷即诉状，只关对应格，闸已开仍出其他AJ#。范本只借目录栏目。双方秘密、抢夺印章或违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出AJ#终稿。本窗闸名只能是案卷闸，禁止复用保全闸、起诉闸。不写诉状是交付禁令不是负触发，不选定法院，不给胜诉率，未知不写零。"
