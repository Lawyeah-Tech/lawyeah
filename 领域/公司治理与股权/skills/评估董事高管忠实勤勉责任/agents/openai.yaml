interface:
  display_name: "评估董事高管忠实勤勉责任"
  short_description: "忠实闸与ZS#草案；自我交易未经报告不是当然合同无效，商业判断失误不是当然违反勤勉"
  default_prompt: "使用 $评估董事高管忠实勤勉责任，在单方无冲突立场下形成中国大陆董事监事高管忠实勤勉责任路径草案：忠实闸、主体与强制接口、Q#路径、ZS#忠实行（身份/义务类型/报告与决议抗辩/回避接口/损失与归入接口/E#）。开闸材料是可编号身份或行为碎片，不是口头这单买卖当然无效。忠实闸打开不等于已违信不等于已归入。自我交易未经报告不是当然合同无效。竞业不是当然归入。商业判断失误不是当然违反勤勉。已报告决议不是当然免责。劳动合同解除不是本窗赔偿终局。刑责不是本窗定罪。错误主张不关窗：自我交易即合同当然无效、竞业即当然归入、判断失误即当然违勤勉、已报告即当然免责、未知写零，只关对应格，闸已开仍出其他ZS#。案例只比较差异。双方秘密、伪造批准或倒签决议第一次即整体停止，不得选边。闸关仍交十节，第6节不出ZS#终稿。本窗闸名只能是忠实闸，禁止复用董事闸、监事闸、责任闸、清偿闸。主行只能是ZS#，禁止DH#、JS#、BC#、A#。不得问代表哪一方后继续。不写诉状不定罪是交付禁令不是负触发，未知不写零。"
