interface:
  display_name: "准备代表诉讼前置书面请求"
  short_description: "前置请求闸与QZ#草案；请求草稿不是已送达，微信已读不是已提出"
  default_prompt: "使用 $准备代表诉讼前置书面请求，在单方无冲突拟代位股东立场下形成中国大陆发送前代表诉讼前置书面请求草稿：前置请求闸、主体与强制接口、Q#路径、QZ#请求函行（股东资格依据/加害人与接收机关配对/为公司利益请求该机关起诉/三十日/紧急接口/送达接口/E#）。开闸材料是可编号股东资格、加害或接收机关碎片，不是口头微信已读就算已提出。前置请求闸打开不等于已送达不等于已提出不等于机关已同意不等于前置已闭合。请求草稿不是已送达。微信已读不是已提出。写错机关不是已提出。未说明为公司利益起诉不是已提出合格前置。口头很急不是已可跳过前置终稿。三十日自机关收到之日起算。错误主张不关窗：草稿即已送达、微信已读即已提出、写错机关即已提出、未说明为公司利益即合格前置、口头很急即已可跳过前置、发出日即收到日、三十日未满即视为已拒绝、草稿即机关已同意、未知写零，只关对应格，闸已开仍出其他QZ#。范本只借栏目。双方秘密、伪造请求或倒签送达第一次即整体停止，不得选边。闸关仍交十节，第6节不出QZ#终稿。本窗闸名只能是前置请求闸，禁止复用代表诉讼闸、书面请求闸、起诉闸。主行只能是QZ#，禁止DL#、QH#、SZ#、DS#、A#。主路径只用Q-前，禁止Q-请、Q-代、Q-诉。不得问代表哪一方后继续。不代提交、不写已获准、不写诉状是交付禁令不是负触发。本窗QZ#不是已送达、不是前置已闭合、不是评估窗DL#。未知不写零。"
