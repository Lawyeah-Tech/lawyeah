interface:
  display_name: "准备有限公司与股份公司形式变更"
  short_description: "变更闸与BG#草案；决议不是已换发执照，改股份不是已上市"
  default_prompt: "使用 $准备有限公司与股份公司形式变更，在单方无冲突立场下准备中国大陆已成立公司有限⇄股份形式变更文件与登记核验草案：变更闸、主体与强制接口、Q#路径、BG#变更行（方向/折股与人数/特别决议要点/债权人接口/机关重置/登记核验/E#）。开闸材料是可编号变更决定碎片，不是口头已经改成股份，不是决议已经换发执照。无书面授权但有变更决定碎片＝变更闸部分打开。变更闸打开不等于已变更完成不等于已换发执照不等于已通过不等于已提交不等于已上市。决议不是已换发执照。草稿不是已变更完成。改股份不是已上市。有限机关例外不是股份可套。有限五年认缴不是发起人折股实缴。净资产未审计不得估整数或写零。纯形式变更不得直接套减资或合并债权人程序。错误主张不关窗：决议即已换发执照、改股份即已上市、不设监事延续、估净资产或写零、未知写零，只关对应格，闸已开仍出其他BG#。主路径只用Q-形，禁止Q-选、Q-设作主路径。范本只借决议和变更登记栏目，不得升格已换发执照或已上市。双方秘密、倒签变更决议、虚构净资产或抢夺印章第一次即整体停止，不得选边。闸关仍交十节，第6节不出BG#终稿。本窗闸名只能是变更闸，禁止复用选型闸、设立闸、章程闸、减资闸。不代提交、不写已换发执照、不出上市文件是交付禁令不是负触发，未知不写零。"
