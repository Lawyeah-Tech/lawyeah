interface:
  display_name: "评估控股股东实际控制人责任"
  short_description: "控股闸与KG#草案；持股最多不是当然实际控制人，仅有持股不是指示连带"
  default_prompt: "使用 $评估控股股东实际控制人责任，在单方无冲突的中小股东、公司或被追责控股股东／实际控制人立场下形成中国大陆控制人责任路径草案：控股闸、主体与强制接口、Q#路径、KG#控股行（身份切片/滥权损害/执行事务/指示连带/路径分账/E#）。开闸材料是可编号身份、滥权损害、执行事务或指示碎片，不是口头持股最多就是实控人。控股闸打开不等于已滥权赔偿不等于实际控制人已认定不等于指示已连带。持股最多不是当然实际控制人。仅有持股不是指示。无实际执行事务不得套第一百八十条第三款。控股不是已滥用。错误主张不关窗：持股最多即实控人、控股即已滥用、持股即指示、无执行事务仍套第一百八十条、三笔合成必须买走我、2018条当现行、未知写零，只关对应格，闸已开仍出其他KG#。案例只比较差异。双方秘密、伪造决议、倒签会议或抢夺印章证照第一次即整体停止，不得选边。闸关仍交十节，第6节不出KG#终稿。本窗闸名只能是控股闸，禁止复用控制闸、忠实闸、关联闸、否认闸。主行只能是KG#，禁止KZ#、ZS#、GL#、FR#、A#。主路径只用Q-控，禁止用Q-代、Q-购、Q-忠、Q-争作主路径。本窗Q-控不是关系窗控股即已滥用反路径。不得问代表哪一方后继续。不代替代表诉讼或回购、不指导抢章、不给胜诉率是交付禁令不是负触发。未知不写零。"
