interface:
  display_name: "提起司法解散之诉"
  short_description: "解散诉闸与JF#草案；诉状草稿不是已立案，其他途径未穷尽且无两年失灵不是已可起诉终稿"
  default_prompt: "使用 $提起司法解散之诉，在单方无冲突拟起诉股东立场下形成中国大陆发送前司法解散起诉包草案：解散诉闸、主体与强制接口、Q#路径、JF#解散诉行（原告资格/严重困难切片/重大损失接口/其他途径不能解决/被告与其他股东地位/管辖调解接口/E#）。开闸材料是可编号表决权、机关失灵、失败召集或对峙碎片，不是口头已经立案了。解散诉闸打开不等于已立案不等于已提交不等于已可起诉终稿不等于必须解散。诉状草稿不是已立案。盈利不是不得解散。一次流会不是经营管理严重困难。亏损不是必须解散。持股百分之十是表决权不是当然出资额。其他途径未尝试不是已满足。被告是公司。同时申请清算不是应一并清算。判决效力及于全体股东。错误主张不关窗：草稿即已立案、一次流会即已可起诉终稿、盈利即不得解散、亏损即必须解散、出资额即百分之十门槛、未尝试即其他途径已穷尽、知情或分红即解散、表决权不足即关窗、漏列公司、同时申请清算即应一并清算、有效仲裁当然排除、选定某院、网交即已提交、未知写零，只关对应格，闸已开仍出其他JF#。范本只借栏目。双方秘密、伪造决议或倒签起诉第一次即整体停止，不得选边。闸关仍交十节，第6节不出JF#终稿。本窗闸名只能是解散诉闸，禁止复用僵局闸、起诉闸、代表诉闸。主行只能是JF#，禁止JJ#、SZ#、JS#、DS#、CY#、FS#、A#。主路径只用Q-散，禁止Q-僵、Q-诉、Q-代。不得问代表哪一方后继续。不代提交、不定法院、不给胜诉率是交付禁令不是负触发。未知不写零。"
