interface:
  display_name: "评估增资优先认缴权"
  short_description: "优先认缴闸与YJ#草案；认缴比例不是优先认缴比例，未通知不是增资登记当然无效"
  default_prompt: "使用 $评估增资优先认缴权，在单方无冲突立场下形成中国大陆增资优先认缴路径草案：优先认缴闸、主体与强制接口、Q#路径、YJ#优先认缴行（有限或股份/同等条件与实缴比例/通知或全体另定/放弃范围/稀释与救济接口/E#）。开闸材料是可编号增资切片、实缴比例、通知或放弃碎片，不是口头不说话就算放弃。优先认缴闸打开不等于已放弃不等于登记当然无效。认缴比例不是优先认缴比例。沉默不是默认放弃。已读不是已放弃。第八十四条三十日未答复视为放弃不得套第二百二十七条。股份不得机械套有限公司第二百二十七条第一款。未通知不是增资登记当然无效。稀释不是当然无效。错误主张不关窗：沉默即放弃、认缴即优先认缴比例、股份套有限第一款、第八十四条三十日套第二百二十七条、未通知即登记当然无效、稀释即当然无效、未签字全体另定已排除、未知写零、唯一公允价，只关对应格，闸已开仍出其他YJ#。案例只比较差异。双方秘密、伪造放弃或倒签增资决议第一次即整体停止，不得选边。闸关仍交十节，第6节不出YJ#终稿。本窗闸名只能是优先认缴闸，禁止复用增资闸、优先购买闸。主行只能是YJ#，禁止ZZ#、YX#、RZ#、A#。主路径只用Q-评，禁止Q-增、Q-优。不得问代表哪一方后继续。不写交易文件、不写当然无效是交付禁令不是负触发。未知不写零。"
