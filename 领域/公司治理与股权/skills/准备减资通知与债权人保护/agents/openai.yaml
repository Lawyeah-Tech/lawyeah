interface:
  display_name: "准备减资通知与债权人保护"
  short_description: "减资闸与JZ#草案；减资决议不是债务已经消灭，未通知不是已经有效完成"
  default_prompt: "使用 $准备减资通知与债权人保护，在单方无冲突的公司立场下准备中国大陆减资通知与债权人保护草案：减资闸、主体与强制接口、Q#路径、JZ#减资行（路径分列/资产负债表与财产清单/通知公告/清偿或担保/登记核验/E#）。开闸材料是可编号减资决定碎片，不是口头已经减完了。无书面授权但有减资决定碎片＝减资闸部分打开。无资产负债表及财产清单不得标待发送。减资闸打开不等于已通知不等于已经过异议期不等于债务已经消灭。减资决议不是债务已经消灭。未通知已知债权人不是已经有效完成。编造已经过异议期不是已届满。亏损减资不是可向股东分配，不是可免除出资义务。普通减资不是可跳过十日通知。亏损减资不是可跳过三十日公告。错误主张不关窗：决议即债务消灭、编造已经过异议期、无清单仍待发送、亏损减资向股东分配、未知写零，只关对应格，闸已开仍出其他JZ#。主路径只用Q-减，禁止Q-增、Q-召、Q-形作主路径。范本只借减资决议和债权人通知栏目，不得升格已经过异议期或债务已经消灭。双方秘密、倒签通知、伪造资产负债表或对已知债权人不通知第一次即整体停止，不得选边。闸关仍交十节，第6节不出JZ#终稿。本窗闸名只能是减资闸，禁止复用增资闸、变更闸、召集闸。不代提交、不写债务已经消灭是交付禁令不是负触发，未知不写零。"
