interface:
  display_name: "准备股东名册与工商变更衔接"
  short_description: "名册闸与MC#草案；记载请求草稿不是已记载名册，登记完成不是对内股东权唯一时点"
  default_prompt: "使用 $准备股东名册与工商变更衔接，在单方无冲突立场下形成中国大陆发送前股东名册记载与变更登记请求草稿：名册闸、主体与强制接口、Q#路径、MC#名册行（基础变动/记载请求/登记对抗接口/权利起算/拒绝抗辩接口/E#）。开闸材料是可编号受让人或记载请求碎片，不是口头请求发出去就算记上了。名册闸打开不等于已记载不等于已变更登记。记载请求草稿不是已记载名册。登记完成不是对内股东权已取得的唯一时点。未记载不是权利已消灭。名册记载不是对外对抗已完成。网交回执不是已变更登记。错误主张不关窗：草稿即已记载、登记完成即对内唯一时点、未记载即权利消灭、名册即已对外对抗、回执即已变更登记、未知写零，只关对应格，闸已开仍出其他MC#。范本只借栏目。双方秘密、伪造名册或倒签记载第一次即整体停止，不得选边。闸关仍交十节，第6节不出MC#终稿。本窗闸名只能是名册闸，禁止复用转让闸、结构闸、任免闸、登记闸。主行只能是MC#，禁止ZR#、GQ#、RM#、A#。不得问代表哪一方后继续。不代提交不写已记载是交付禁令不是负触发，未知不写零。"
