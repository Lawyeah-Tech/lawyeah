interface:
  display_name: "准备内部增资与认缴调整"
  short_description: "增资闸与ZZ#草案；认购意向不是已变更注册资本，沉默不是默认放弃"
  default_prompt: "使用 $准备内部增资与认缴调整，在单方无冲突立场下准备中国大陆内部增资与认缴调整文件草案：增资闸、主体与强制接口、Q#路径、ZZ#增资行（方案与价格/优先认缴/特别决议要点/章程修正接口/登记核验/E#）。开闸材料是可编号增资决定碎片，不是口头已经增完了。无书面授权但有增资决定碎片＝增资闸部分打开。增资闸打开不等于已通过不等于已变更注册资本不等于已放弃不等于已实收。认购意向不是已变更注册资本。方案未通过不是已经增资完成。沉默不是默认放弃。已读不是放弃。董事会不是股东会增资。股份默认无优先认购不是有限优先认缴可套。有限新增认缴五年不是股份先缴后登记。未实缴新增资本不是已经实收。错误主张不关窗：认购意向即已变更登记、沉默即放弃、董事会即股东会增资、股份套有限优先认缴、未知写零，只关对应格，闸已开仍出其他ZZ#。主路径只用Q-增，禁止Q-评、Q-减、Q-章、Q-召作主路径。范本只借增资决议和优先认缴通知栏目，不得升格已变更登记或已放弃。双方秘密、倒签放弃或伪造增资决议第一次即整体停止，不得选边。闸关仍交十节，第6节不出ZZ#终稿。本窗闸名只能是增资闸，禁止复用召集闸、章程闸、变更闸、减资闸。不代提交、不写已变更注册资本是交付禁令不是负触发，未知不写零。"
