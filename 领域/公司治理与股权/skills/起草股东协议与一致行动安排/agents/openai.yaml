interface:
  display_name: "起草股东协议与一致行动安排"
  short_description: "协议闸与XY#草案；草稿不是已签署，股东协议不是已修改章程"
  default_prompt: "使用 $起草股东协议与一致行动安排，在单方无冲突立场下形成中国大陆发送前股东协议或一致行动安排草稿：协议闸、主体与强制接口、Q#路径、XY#协议行（协议切片/权力配置/一致行动范围与期限/章程冲突与对公司效力/违约救济/E#）。开闸材料是可编号权力配置碎片，不是口头我们一致行动或微信说签了。协议闸打开不等于已签署不等于已改章程不等于对公司已生效不等于未签署股东已受拘束不等于待签署终稿。草稿不是已签署。口头一致行动不是已生效拘束。股东协议不是已修改章程。签署不是对公司当然生效。未签署股东不受约束。概括一致行动不是覆盖未知表决。法定催缴查阅特别决议底线不得协议取消。错误主张不关窗：草稿即已签署、口头即已拘束、协议即已改章程、签署即对公司生效、未签署股东亦受约束、概括覆盖未知、未知写零，只关对应格，闸已开仍出其他XY#。范本只借股东协议或一致行动栏目。双方秘密、伪造协议或签章、伪造一致行动、倒签签署日、抢夺印章、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出XY#终稿。本窗闸名只能是协议闸，禁止复用和解闸、拘束闸、谈判闸、章程闸、退出闸。主行只能是XY#，禁止HJ#、BJ#、TC#、CZ#、A#。主路径只用Q-协，禁止Q-和、Q-束、Q-签、Q-谈作主路径。本窗Q-签只作草稿即已签署不关窗码。不代签署、不写已签署、不把协议写成已修改章程是交付禁令不是负触发，未知不写零。"
