interface:
  display_name: "评估员工股权激励的公司安排"
  short_description: "股权激励闸与JL#草案；口头承诺不是已授予，期权未行权不是已经是股东"
  default_prompt: "使用 $评估员工股权激励的公司安排，在单方无冲突立场下形成中国大陆员工股权激励公司侧路径草案：股权激励闸、主体与强制接口、Q#路径、JL#激励行（工具类型/权源路径/授予闭合/股东资格接口/离职回购公司接口/E#）。开闸材料是可编号工具或授予碎片，不是口头给过期权就算已授予。股权激励闸打开不等于已授予不等于已行权不等于已是名册股东。口头承诺不是已授予。期权未行权不是已经是股东。平台份额不是目标公司股东。离职不是当然收回已登记股权。有限公司不得机械套用第162条。股权激励不是当然第163条资助例外。错误主张不关窗：口头即已授予、未行权即已是股东、平台即目标公司股东、离职即当然收回、激励即劳动报酬已变更、有限套第162条当然合法、未知写零，只关对应格，闸已开仍出其他JL#。案例只比较差异。双方秘密、伪造授予或倒签行权第一次即整体停止，不得选边。闸关仍交十节，第6节不出JL#终稿。本窗闸名只能是股权激励闸，禁止复用激励闸、结构闸、代持闸、名册闸、转让闸、授予闸。主行只能是JL#，禁止RP#、GQ#、DT#、ZR#、MC#、A#。主路径只用Q-激，禁止Q-代。不得问代表哪一方后继续。不把口头承诺写成已授予、不把期权未行权写成已经是股东是交付禁令不是负触发。本窗JL#不是准备窗文件终稿，不是劳动方案，不是个税。未知不写零。"
