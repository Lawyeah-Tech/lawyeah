interface:
  display_name: "应对股权冻结或行为保全"
  short_description: "冻结闸与FZ#草案；复议草稿不是已解除，交保不是已解冻"
  default_prompt: "使用 $应对股权冻结或行为保全，在单方无冲突被保全方立场下形成中国大陆发送前保全应对草稿：冻结闸、主体与强制接口、Q#路径、FZ#冻结行（文书切片/措施与范围/复议/异议接口/担保置换/经营限制/E#）。开闸材料是可编号已作出保全文书碎片，不是口头听说冻了或先把股权过户再说。冻结闸打开不等于已解除不等于已解冻不等于复议期间停止执行不等于行为保全应当解除。复议草稿不是已解除。交保不是已解冻。异议不是已排除。复议期间不是停止执行。财产纠纷交保应当解除不是行为保全当然交保即解除。等值担保可以变更不是应当解除。冻结股权不是已变更股东，不是默认无表决权。口头传说不是已冻结。错误主张不关窗：复议即已解除、交保即已解冻、异议即已排除、复议期间停止执行、冻结即无表决权、行为保全交保即应当解除、可以变更即应当解除、保证解除、未知写零，只关对应格，闸已开仍出其他FZ#。范本只借复议申请书、变更保全标的物申请书、解除保全申请书、担保置换栏目。双方秘密、转移隐匿、违反裁定、串通解冻、换章对抗、抽逃作置换担保、伪造权属、倒签复议日、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出FZ#终稿。本窗闸名只能是冻结闸，禁止复用保全闸、封存闸、管辖闸、起诉闸、印章闸。预留不得占用立案闸。主行只能是FZ#，禁止BQ#、FC#、XG#、SZ#、YZ#、A#。主路径只用Q-冻，禁止Q-保、Q-账、Q-管、Q-诉、Q-印作主路径。本窗Q-签只作复议或置换草稿即已提交不关窗码。本窗Q-议只作复议草稿即已解除不关窗码。本窗Q-额只作交保即已解冻不关窗码。禁止用Q-换（任免窗草稿即已换证）。禁止用Q-担、Q-线、Q-准、Q-到（申请窗不关窗码）。Q-冻邻窗是转介码本窗打开为主路径。不保证解除、不代提交、不选定法院是交付禁令不是负触发，未知不写零。"
