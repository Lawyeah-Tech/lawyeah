interface:
  display_name: "准备代持还原或显名变更"
  short_description: "还原闸与HY#草案；未同意不是已经显名，还原草稿不是已变更登记"
  default_prompt: "使用 $准备代持还原或显名变更，在单方无冲突立场下形成中国大陆发送前代持还原或显名文件草稿：还原闸、主体与强制接口、Q#路径、HY#还原行（决定闭合/其他股东同意/文件要点/登记对抗接口/负担与监管接口/E#）。开闸材料是可编号还原决定或同意碎片，不是口头他们答应了就算同意。还原闸打开不等于已显名不等于已变更登记。未同意不是已经显名。还原草稿不是已变更登记。半数同意不足不是可出还原终稿。网交回执不是已核准。效力未闭合不是可出还原终稿。错误主张不关窗：未同意即已显名、草稿即已变更登记、半数不足即可出终稿、回执即已核准、效力未闭合即可出终稿、未知写零，只关对应格，闸已开仍出其他HY#。范本只借栏目。双方秘密、伪造其他股东同意或倒签同意书第一次即整体停止，不得选边。闸关仍交十节，第6节不出HY#终稿。本窗闸名只能是还原闸，禁止复用代持闸、显名闸、名册闸。主行只能是HY#，禁止DT#、MC#、ZR#、XM#、A#。主路径只用Q-还。不得问代表哪一方后继续。不代提交不重判效力是交付禁令不是负触发，未知不写零。"
