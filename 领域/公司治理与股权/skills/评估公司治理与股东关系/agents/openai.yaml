interface:
  display_name: "评估公司治理与股东关系"
  short_description: "关系闸与GX#草案；登记不是实质股东，控股不是已滥用，僵局不是必须解散"
  default_prompt: "使用 $评估公司治理与股东关系，在单方无冲突立场下形成中国大陆公司治理与股东关系总图：关系闸、主体与章程版本、Q#路径、GX#关系行（主体切片/持股与名册登记/机关角色/冲突点/打开接口/E#）。开闸材料是可编号主体或机关碎片，不是口头登记上就是股东。关系闸打开不等于已是实质股东不等于已滥用不等于必须解散。登记不是实质股东。名册不是对外对抗已完成。控股不是已滥用。僵局不是必须解散。查阅催缴决议不得合成一笔股东权益。错误主张不关窗：登记即股东、控股即滥用、僵局必须解散、人格否认已成立，只关对应格，闸已开仍出其他GX#。类案只比较差异。双方秘密、伪造决议或抢夺印章第一次即整体停止，不得选边。闸关仍交十节，第6节不出GX#终稿。本窗闸名只能是关系闸。不写发送版催缴或诉状，不选定法院，不给胜诉率，未知不写零。"
