interface:
  display_name: "提起股东权利诉讼"
  short_description: "立案闸与LA#草案；草案不是已立案，有效仲裁不是应起诉"
  default_prompt: "使用 $提起股东权利诉讼，在单方无冲突的拟起诉原告立场下准备中国大陆股东权利或公司治理一审起诉文书草案：立案闸、主体与前置期限接口、Q#路径、LA#立案行（请求类型/原被告列法/前置与期限/管辖接口/证据目录/起诉状栏目衔接/E#）。开闸材料是可编号请求碎片或明确被告，不是口头交了就算立案。立案闸打开不等于已立案不等于已提交不等于应起诉。草案不是已立案。网交不是已提交。有效仲裁未排除不是应起诉。类案不是必然立案。决议之诉原则上以公司为被告。代表诉讼利益归公司。不选定法院。不代提交。不保证立案。不给胜诉率。错误主张不关窗：草案即已立案、有效仲裁仍应起诉、选定某院、网交即已提交、类案必然立案、未知写零，只关对应格，闸已开仍出其他LA#。范本只借起诉状栏目。禁止用类案写成必然立案。双方秘密、伪造证据或倒签会议第一次即整体停止，不得选边。闸关仍交十节，第6节不出LA#终稿。本窗闸名只能是立案闸，禁止复用起诉闸、诉材闸、提交闸、保全闸、案卷闸。主行是LA#，禁止P#和SZ#。不代提交是交付禁令不是负触发，未知不写零。"
