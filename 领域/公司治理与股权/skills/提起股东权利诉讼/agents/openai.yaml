interface:
  display_name: "提起股东权利诉讼"
  short_description: "起诉闸与SZ#草案；草稿不是已立案，有效仲裁不是应起诉"
  default_prompt: "使用 $提起股东权利诉讼，在单方无冲突的拟起诉股东立场下准备中国大陆股东权利或公司治理一审起诉包草案：起诉闸、主体与强制接口、Q#路径、SZ#诉状行（原告适格/请求类型/被告列法/前置接口/管辖接口/期限接口/证据目录/E#）。开闸材料是可编号原告适格或请求类型碎片，不是口头已经立案。起诉闸打开不等于已立案不等于已提交不等于应起诉。草稿不是已立案。网交不是已提交。有效仲裁协议不是应起诉。无股东资格不是可提决议撤销。前置未完成不是可提代表诉讼。决议之诉原则上以公司为被告。代表诉讼胜诉利益归公司。不选定法院。不保证七日立案。不给胜诉率。错误主张不关窗：草稿即已立案、有效仲裁仍应直接起诉、无资格仍提撤销、前置未完成仍写应起诉、选定某院、保证胜诉、未知写零、网交即已提交，只关对应格，闸已开仍出其他SZ#。范本只借起诉状栏目。双方秘密、伪造决议、倒签起诉状或抢夺印章第一次即整体停止，不得选边。闸关仍交十节，第6节不出SZ#终稿。本窗闸名只能是起诉闸，禁止复用立案闸、诉材闸、案卷闸、退出闸、决议闸。不代提交是交付禁令不是负触发，未知不写零。"
