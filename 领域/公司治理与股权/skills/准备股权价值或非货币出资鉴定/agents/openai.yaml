interface:
  display_name: "准备股权价值或非货币出资鉴定"
  short_description: "鉴定闸与JD#草案；申请草稿不是鉴定意见，评估报告不是司法鉴定"
  default_prompt: "使用 $准备股权价值或非货币出资鉴定，在单方无冲突立场下形成中国大陆发送前鉴定事项、检材与申请稿草案：鉴定闸、主体与强制接口、Q#路径、JD#鉴定行（鉴定切片/事项/基准日/检材/机构与申请接口/E#）。开闸材料是可编号待鉴定碎片，不是口头值一个亿或法院会支持这个价。鉴定闸打开不等于已委托不等于已作出意见不等于唯一公允价。申请草稿不是鉴定意见。评估报告不是司法鉴定。历史谈判价不是鉴定结论。测算工作表不是鉴定。挑选最有利一天不是唯一基准日。错误主张不关窗：申请即已作出、评估报告即司法鉴定、谈判价即结论、最有利一天即唯一基准日、未知写零、预测唯一公允价，只关对应格，闸已开仍出其他JD#。范本只借申请书栏目。双方秘密、补造账册或伪造评估第一次即整体停止，不得选边。闸关仍交十节，第6节不出JD#终稿。本窗闸名只能是鉴定闸，禁止复用非货币闸、差额闸、测算闸、封存闸。主行只能是JD#，禁止FB#、CE#、DJ#、FC#、A#。主路径只用Q-鉴，禁止Q-非、Q-差、Q-测作主路径。不预测鉴定意见、未知不写零、不输出唯一公允价是交付禁令不是负触发，未知不写零。"
