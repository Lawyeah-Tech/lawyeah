interface:
  display_name: "评估失权与股权丧失"
  short_description: "失权闸与SQ#草案；催缴未闭合不是已失权，微信已读不是发出"
  default_prompt: "使用 $评估失权与股权丧失，在单方无冲突的公司或被催缴股东立场下评估中国大陆股权失权条件与异议路径：失权闸、主体与强制接口、Q#路径、SQ#失权行（催缴闭合/董事会决议/通知效果/三十日异议/六个月处理接口/E#）。开闸材料是可编号催缴闭合碎片或失权通知碎片，不是口头已经失权了。无书面授权但有碎片＝失权闸部分打开。催缴未闭合＝闸可半开，不得写已失权。失权闸打开不等于已失权不等于已发出不等于必须立即失权。催缴未闭合不是已失权。宽限期未满不是已失权。微信已读不是发出。解释三第17条不是2024年后唯一失权路径。失权范围不是已缴股权当然一并丧失。董事会可以向不是必须立即失权。错误主张不关窗：催缴未闭合即已失权、已读即发出、解释三当唯一路径、宽限期未满即已失权、未知写零，只关对应格，闸已开仍出其他SQ#。主路径只用Q-失，禁止Q-催、Q-减、Q-诉作主路径。类案只比较差异，禁止用范本生成已失权证明或失权通知终稿。双方秘密、倒签失权发出日或伪造董事会决议第一次即整体停止，不得选边。闸关仍交十节，第6节不出SQ#终稿。本窗闸名只能是失权闸，禁止复用催缴闸、瑕疵闸、减资闸。不出失权通知终稿、不写已失权是交付禁令不是负触发，未知不写零。"
