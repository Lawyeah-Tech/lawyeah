interface:
  display_name: "评估召集主持表决程序瑕疵"
  short_description: "程序闸与CX#草案；通知迟一天不是当然可撤销，无权召集不是本窗不成立终局"
  default_prompt: "使用 $评估召集主持表决程序瑕疵，在单方无冲突立场下形成中国大陆股东会或董事会会议程序瑕疵表草案：程序闸、主体与强制接口、Q#路径、CX#程序行（会议切片/召集权/通知期与议题/主持/表决计算/轻微与实质影响接口/E#）。开闸材料是可编号会议切片或通知碎片，不是口头迟一天就必须撤。程序闸打开不等于应撤销不等于不成立终局。通知迟一天不是当然可撤销。无权召集不是本窗不成立终局。视频开会不是未召开。已读不是已送达。错误主张不关窗：迟一天即应撤销、无权召集即不成立、视频开会即未召开、已读即已送达、未知写零，只关对应格，闸已开仍出其他CX#。案例只比较差异。双方秘密、伪造通知或倒签签到第一次即整体停止，不得选边。闸关仍交十节，第6节不出CX#终稿。本窗闸名只能是程序闸，禁止复用召集闸、决议闸、决议诉闸、瑕疵闸。主行只能是CX#，禁止ZJ#、XL#、XF#、XC#。不写应撤销终局是交付禁令不是负触发，未知不写零。"
