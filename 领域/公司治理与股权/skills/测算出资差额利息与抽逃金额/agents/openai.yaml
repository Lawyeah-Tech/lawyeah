interface:
  display_name: "测算出资差额利息与抽逃金额"
  short_description: "差额闸与CE#草案；大额转出不是抽逃金额；未缴抽逃不得双计；未知不写零"
  default_prompt: "使用 $测算出资差额利息与抽逃金额，在单方无冲突立场下形成中国大陆未出资本息或抽逃返还分项测算：差额闸、未缴与抽逃分表、Q#路径、CE#差额行（资金切片/未缴接口/抽逃接口/利息与已承担/金额状态/E#）。开闸材料是可编号认缴实缴、资金流或已承担碎片，不是口头转出去了就是抽逃。差额闸打开不等于瑕疵已成立不等于已抽逃不等于已到期必缴不等于唯一必得总额。大额转出不是当然抽逃。认缴登记不是已实缴。未届期不是已到期必缴额。未缴与抽逃就同一笔资金不得双计。利息起算不是催缴宽限期不是诉讼时效。错误主张不关窗：大额转出即抽逃、认缴即已实缴、未届期即已到期必缴、同一笔双计、未知写零、唯一必得总额，只关对应格，闸已开仍出其他CE#。类案只比较差异。测算类禁止search_template。双方秘密、伪造出资凭证或倒签缴款日第一次即整体停止，不得选边。闸关仍交十节，第6节不出CE#终稿。本窗闸名只能是差额闸，禁止复用测算闸、瑕疵闸、催缴闸。主行只能是CE#，禁止DJ#、XC#、YZ#、A#。主路径只用Q-差，禁止Q-测、Q-抽作主路径。不认定瑕疵已成立、未知不写零、不输出唯一必得总额是交付禁令不是负触发，未知不写零。"
