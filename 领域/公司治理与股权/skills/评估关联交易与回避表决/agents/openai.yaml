interface:
  display_name: "评估关联交易与回避表决"
  short_description: "关联闸与GL#草案；未回避不是合同当然无效，价格争议不是当然关联交易"
  default_prompt: "使用 $评估关联交易与回避表决，在单方无冲突立场下形成中国大陆关联交易与回避路径草案：关联闸、主体与强制接口、Q#路径、GL#关联行（关联路径/报告决议/回避/合同效力接口/损害与归入接口/E#）。开闸材料是可编号交易相对方或内部人碎片，不是口头没回避合同就废了。关联闸打开不等于合同已无效不等于已构成关联。未回避不是合同当然无效。价格争议不是当然关联交易。已报告决议不是当然免责。归入是第一百八十六条不是第一百八十五条。上市公司第一百三十九条不得套有限。错误主张不关窗：未回避即合同当然无效、价格争议即当然关联、已报告即当然免责、未知写零，只关对应格，闸已开仍出其他GL#。案例只比较差异。双方秘密、伪造回避声明或倒签批准第一次即整体停止，不得选边。闸关仍交十节，第6节不出GL#终稿。本窗闸名只能是关联闸，禁止复用回避闸、忠实闸、董事闸、决议闸。主行只能是GL#，禁止AV#、ZS#、DH#、XL#、JY#、A#。不得问代表哪一方后继续。不写合同当然无效是交付禁令不是负触发，未知不写零。"
