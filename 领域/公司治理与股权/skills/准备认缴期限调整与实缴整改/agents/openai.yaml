interface:
  display_name: "准备认缴期限调整与实缴整改"
  short_description: "认缴闸与RZ#草案；调整方案不是已经公示完成，调整期限不是已实缴"
  default_prompt: "使用 $准备认缴期限调整与实缴整改，在单方无冲突的公司或股东立场下准备中国大陆存量公司认缴期限调整与实缴整改方案：认缴闸、主体与强制接口、Q#路径、RZ#认缴整改行（存量/新设分表/是否必须调整/方案分列/章程公示登记接口/E#）。开闸材料是可编号存量公司碎片或责令调整碎片，不是口头已经改完了。无书面授权但有碎片＝认缴闸部分打开。是否必须调整未闭合＝闸可半开，不得写已经公示完成或已实缴。认缴闸打开不等于已经公示完成不等于已实缴不等于必须调整。调整方案不是已经公示完成。调整期限不是已实缴。剩余自2027-07-01起不足五年不是必须调整。已缴足不是必须调整。新设有限五年不是存量必须立刻套第47条。股份发起人2027-06-30前缴足不是有限调整期限可套。地方办理日起算五年不是唯一截止日。二十个工作日公示不是已公示完成。责令改正不是已另册。调整合规不是治愈抽逃。错误主张不关窗：调整方案即已经公示完成、调整期限即已实缴、剩余不足五年即必须调整、新设五年即存量必须立刻整改、股份缴足套有限调整、办理日起算五年即唯一截止日、未知写零，只关对应格，闸已开仍出其他RZ#。主路径只用Q-调，禁止Q-增、Q-减、Q-章、Q-设、Q-催作主路径。范本只借栏目，禁止升格已经公示完成或已实缴。双方秘密、倒签缴款日、垫资走账制造已实缴或伪造公示第一次即整体停止，不得选边。闸关仍交十节，第6节不出RZ#终稿。本窗闸名只能是认缴闸，禁止复用增资闸、减资闸、章程闸、整改闸。不代提交、不写已经公示完成是交付禁令不是负触发，未知不写零。"
