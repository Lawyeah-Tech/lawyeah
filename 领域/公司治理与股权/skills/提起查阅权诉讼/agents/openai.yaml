interface:
  display_name: "提起查阅权诉讼"
  short_description: "查阅诉闸与CY#草案；诉状草稿不是已立案，未书面或十五日未满不是已可起诉终稿"
  default_prompt: "使用 $提起查阅权诉讼，在单方无冲突拟起诉股东立场下形成中国大陆发送前查阅之诉起诉包草案：查阅诉闸、主体与强制接口、Q#路径、CY#查阅诉行（原告资格/材料切片/查阅或复制/前置接口/被告与管辖接口/E#）。开闸材料是可编号资格、书面请求或拒绝逾期碎片，不是口头已经立案了。查阅诉闸打开不等于已立案不等于已提交。诉状草稿不是已立案。十五日未满或账簿凭证未书面请求不是已可起诉终稿。账簿凭证诉讼请求写查阅，不得写成复制除非核验支持。被告原则上是公司。错误主张不关窗：草稿即已立案、未书面或十五日未满即已可起诉终稿、账簿凭证当然可复制、有效仲裁当然排除起诉、选定某院、网交即已提交、未知写零，只关对应格，闸已开仍出其他CY#。范本只借栏目。双方秘密、伪造请求或倒签起诉第一次即整体停止，不得选边。闸关仍交十节，第6节不出CY#终稿。本窗闸名只能是查阅诉闸，禁止复用查阅闸、书面请求闸、起诉闸。主行只能是CY#，禁止CK#、QH#、SZ#、CS#、A#。主路径只用Q-查，禁止Q-阅、Q-请、Q-代。不得问代表哪一方后继续。不代提交、不定法院、不给胜诉率是交付禁令不是负触发。未知不写零。"
