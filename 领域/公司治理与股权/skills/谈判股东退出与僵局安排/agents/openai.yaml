interface:
  display_name: "谈判股东退出与僵局安排"
  short_description: "退出闸与TC#草案；谈判方案不是已签署，僵局不是必须解散"
  default_prompt: "使用 $谈判股东退出与僵局安排，在单方无冲突立场下准备中国大陆股东退出或僵局谈判方案草案：退出闸、主体与强制接口、Q#路径、TC#退出行（相对人/标的股权/退出接口/底线/让步至/弃权范围/章证照与账户/执行力提示/E#）。开闸材料是可编号相对人或标的股权碎片，不是口头已经谈拢。退出闸打开不等于已谈拢不等于已签署不等于已退出不等于已可执行不等于必须解散。谈判方案不是已签署协议。口头同意不是已退出。概括弃权不得覆盖未知请求。盈利不是无僵局也不是必须解散。章证照不得一并处理省略。单独和解不是已可强制执行。付款不是已过户。错误主张不关窗：口头谈拢即已签署、僵局必须解散、盈利即无僵局、概括弃权、未知写零，只关对应格，闸已开仍出其他TC#。范本只借让步表栏目。禁止用类案写成必然谈成。双方秘密、虚假减资或抢夺印章第一次即整体停止，不得选边。闸关仍交十节，第6节不出TC#终稿。本窗闸名只能是退出闸，禁止复用僵局闸、和解闸、返还闸、关系闸、转让闸。不写已签署协议是交付禁令不是负触发，不选定法院，不给胜诉率，未知不写零。"
