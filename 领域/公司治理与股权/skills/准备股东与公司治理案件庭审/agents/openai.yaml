interface:
  display_name: "准备股东与公司治理案件庭审"
  short_description: "庭审闸与TS#草案；提纲不是已开庭，口头已质证不是已质证"
  default_prompt: "使用 $准备股东与公司治理案件庭审，在单方无冲突立场下形成中国大陆股东与公司治理案件庭审提纲草案：庭审闸、主体与强制接口、Q#路径、TS#庭审行（争点切片/本证反证/质证三性/询问与承认风险/调解权限接口/E#）。开闸材料是可编号案号、传票、开庭通知或举证通知，不是口头明天开庭。庭审闸打开不等于已开庭不等于已质证不等于已胜诉不等于已提交不等于调解已生效。提纲不是已开庭。口头已质证不是已质证。网交不是已提交。逾期证据不是当然可提交。对方控制不是内容有利。调解提纲不是已和解生效。错误主张不关窗：提纲即已开庭、口头已质证即已质证、网交即已提交、逾期即当然可提交、对方控制即有利、调解即已生效、保证胜诉、未知写零，只关对应格，闸已开仍出其他TS#。范本只借代理词、质证与发问栏目。双方秘密、伪造证据或笔录、倒签开庭材料、抢夺印章、隐匿账簿、指使作伪证、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出TS#终稿。本窗闸名只能是庭审闸，禁止复用起诉闸、答辩闸、案卷闸、和解闸、谈判闸、协议闸。主行只能是TS#，禁止SZ#、DB#、AJ#、HJ#、TP#、XY#、A#。主路径只用Q-审，禁止Q-诉、Q-庭、Q-辩、Q-卷、Q-和作主路径。本窗Q-签只作提纲即已提交不关窗码。Q-庭是邻窗转介码本窗不打开。不代提交、不给胜诉率、不选定法院是交付禁令不是负触发，未知不写零。"
