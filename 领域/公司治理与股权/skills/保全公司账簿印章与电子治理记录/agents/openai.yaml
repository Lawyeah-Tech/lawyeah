interface:
  display_name: "保全公司账簿印章与电子治理记录"
  short_description: "封存闸与FC#草案；复制不是已封存，哈希不是已公证，申请不是已裁定"
  default_prompt: "使用 $保全公司账簿印章与电子治理记录，在单方无冲突立场下形成中国大陆账簿、印章与电子治理记录合法封存草稿：封存闸、主体与强制接口、Q#路径、FC#封存行（对象切片/持有范围/合法自固/公证与保全接口/禁止动作红旗/E#）。开闸材料是可编号对象或持有范围碎片，不是口头已经备份或今晚去把账抢回来。封存闸打开不等于已封存不等于已公证不等于已裁定保全。复制不是已封存。哈希不是已公证。申请草稿不是已准许。对方控制不是内容有利。占有不是合法封存。错误主张不关窗：复制即已封存、哈希即已公证、申请即已准许、对方控制即内容有利、占有即合法封存、未知写零，只关对应格，闸已开仍出其他FC#。范本只借清单、公证检材和保全申请栏目。双方秘密、抢夺、破解或侵入系统第一次即整体停止，不得选边。闸关仍交十节，第6节不出FC#终稿。本窗闸名只能是封存闸，禁止复用保全闸、印章闸、案卷闸。主行只能是FC#，禁止YZ#、AJ#、A#。主路径只用Q-账，禁止Q-保、Q-印作主路径。不代提交、不写已封存、不指导抢夺是交付禁令不是负触发，未知不写零。"
