interface:
  display_name: "评估优先购买权是否成立"
  short_description: "优先购买闸与YX#草案；对内转让不是当然有法定优先购买，侵害优先购买不是合同当然无效"
  default_prompt: "使用 $评估优先购买权是否成立，在单方无冲突立场下形成中国大陆有限公司优先购买路径草案：优先购买闸、主体与强制接口、Q#路径、YX#优先购买行（对内对外/书面通知/同等条件/期间与放弃/章程另定与强制执行接口/E#）。开闸材料是可编号转让或股东碎片，不是口头群里说过了。优先购买闸打开不等于已成立不等于已放弃。对内转让不是当然有法定优先购买。口头通知不是已完成书面通知。未接到书面通知起算不是三十日已放弃。侵害优先购买不是转让合同当然无效。2018年第七十一条过半数同意不是现行对外程序。强制执行是第八十五条二十日不是第八十四条三十日。错误主张不关窗：对内当然有优先购买、口头即已通知、未接到即已放弃、侵害即合同无效、仍须过半数同意、未知写零，只关对应格，闸已开仍出其他YX#。案例只比较差异。双方秘密、伪造放弃声明或倒签通知第一次即整体停止，不得选边。闸关仍交十节，第6节不出YX#终稿。本窗闸名只能是优先购买闸，禁止复用转让闸。主行只能是YX#，禁止ZR#、YG#、A#。不得问代表哪一方后继续。不写转让协议终稿不写合同当然无效是交付禁令不是负触发，未知不写零。"
