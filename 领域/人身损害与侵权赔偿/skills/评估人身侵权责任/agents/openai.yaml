interface:
  display_name: "评估人身侵权责任"
  short_description: "侵权闸与QG#草案；构成侵权不是伤残已定，认定书不是民事终局，构成侵权不是项目必得"
  default_prompt: "使用 $评估人身侵权责任，在单方无冲突立场下形成中国大陆人身侵权责任总图草案：侵权闸、主体与材料版本、Q#路径、QG#侵权总图行（侵害切片/请求抗辩/论坛期限/金额接口/打开接口/E#）。开闸材料是可编号侵害、认定书、病历、保单或程序碎片，不是口头已经构成侵权了或先按十级。侵权闸打开不等于已构成侵权不等于伤残已定不等于应起诉不等于认定书即民事终局。构成侵权不是伤残已定。构成侵权不是项目必得。认定书不是民事终局比例。口头或已读不是已送达。无责不是关闭交强险。先按十级不是开鉴定闸。错误主张不关窗：构成侵权即伤残已定、构成侵权即项目必得、认定书即民事终局、已读即送达、无责即关交强险、先按十级、未知写零，只关对应格，闸已开仍出其他QG#。评估窗第四槽用search_case_by_fact，禁止用范本生成索赔函或诉状。双方秘密、伪造伤情、隐匿既往、倒签出险或鉴定日、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出QG#终稿。本窗闸名只能是侵权闸，禁止复用争议闸、评估闸、鉴定闸、发送闸、起诉闸。预留不得占用立案闸、鉴定闸、发送闸、起诉闸。主行只能是QG#，禁止ZT#、A#、M#、EV#、PTY#。主路径只用Q-责，禁止Q-总、Q-侵、Q-诉、Q-测、Q-过作主路径。邻窗Q-责只作转介进本窗本窗打开为主路径不是已构成侵权。不写发送版函、不定残、不选定法院是交付禁令不是负触发，未知不写零。"
