interface:
  display_name: "准备监控保存通知"
  short_description: "发送前保存通知与最小到达设计；不等于保全，不侵入，不代发"
  default_prompt: "使用 $准备监控保存通知，在单方无冲突立场下准备人身损害相关监控或后台记录的发送前保存通知和最小到达设计。不等于法院证据保全，不是搜查令。不执行发送，不倒签，不指导侵入系统或收买监控员私下拷贝。不知地点时段仍正触发，发送闸关闭则不出发送前终稿。不编造法定覆盖天数，答复期非法定，拒不保存不是必然败诉。不夹带索赔项目表。用户要唯一覆盖天数、七日法定答复、必然败诉或今天必须发出时窗口仍开。侵入、倒签、双方秘密第一次即整体停止，不得选边。不代提交，不选定法院。"
