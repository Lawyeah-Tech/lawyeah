interface:
  display_name: "应对人身损害一审"
  short_description: "答辩闸与RD#草案；草稿不是已答辩，认定书不是民事终局，无责不是关闭交强险"
  default_prompt: "使用 $应对人身损害一审，在单方无冲突立场下形成中国大陆人身损害一审首次答辩草稿：答辩闸、被诉碎片、Q#路径、RD#答辩行（请求抗辩切片/主体与保险人地位/期限与缺席风险/管辖时效抗辩接口/证据与自认红旗/E#）。开闸材料是可编号起诉状或应诉通知碎片，不是口头已经被诉了或微信已读。答辩闸打开不等于已答辩不等于已提交不等于已送达。草稿不是已答辩。已读不是已送达。不提出答辩状不是当然败诉。逾期只停该提交稿不关窗。认定书不是民事终局。无责不是关闭交强险。过时效须抗辩才审。驾驶人自认不是保险人自认。错误主张不关窗：草稿即已答辩、已读即送达、不答辩即败诉、认定书即终局、无责即关交强险、未知写零，只关对应格，闸已开仍出其他RD#。应对窗第四槽用search_template只借答辩状栏目，禁止升格已提交。双方秘密、伪造答辩、隐匿证据、倒签第一次即整体停止，不得选边。闸关仍交十节，第6节不出RD#终稿。本窗闸名只能是答辩闸，禁止复用应诉闸、起诉闸、鉴定闸。预留不得占用立案闸、起诉闸、鉴定闸。主行只能是RD#，禁止DB#、RQ#、K#、H#、A#。主路径只用Q-辩，禁止Q-诉、Q-责、Q-签作主路径。邻窗Q-辩只作转介进本窗本窗打开为主路径不是已答辩。不代提交、不选定法院、不定残是交付禁令不是负触发，未知不写零。"
