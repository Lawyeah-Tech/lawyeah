interface:
  display_name: "申请道路救助基金或垫付"
  short_description: "交强险抢救垫付或救助基金申请包；不保证拨付，残疾金不得写入基金，虚构逃逸第一次即停"
  default_prompt: "使用 $申请道路救助基金或垫付，在权利人单方无冲突立场下准备交强险保险公司抢救费用垫付或道路救助基金垫付申请。成果是申请闸与A#行，入口袋分列，项目仅抢救费或丧葬费。不保证拨付，不代提交，不编造当地机关名称。不等于索赔材料包、分账、侵权人不明总路径或起诉状。用户要保证拨付、把残疾金写入基金或把七日写成唯一截止时窗口仍开。虚构逃逸、伪造费用、双方秘密第一次即整体停止，不得选边。"
