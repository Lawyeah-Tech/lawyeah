interface:
  display_name: "评估人身损害诉讼时效"
  short_description: "时效闸与LX#草案；事故日不是当然唯一起算，已读不是到达，过时效不是不能立案"
  default_prompt: "使用 $评估人身损害诉讼时效，在单方无冲突立场下形成中国大陆人身损害诉讼时效表草案：时效闸、相对人与期间类型、Q#路径、LX#时效行（相对人与期间类型切片/起算事件并行/中断中止或二十年/届满风险/打开接口/E#）。开闸材料是可编号侵害日、知悉或义务人碎片、催告到达、报案回执或起诉提交碎片，不是口头应该还没过或最晚哪天起诉。时效闸打开不等于已届满不等于已中断不等于法院将主动审查不等于应起诉。事故日不是当然唯一起算。三年须自知道权利受损以及义务人。二十年不是三年的替代，不适用中止中断。已读不是到达。保险报案不当然中断对侵权人。持续治疗不是中止。过时效不是不能立案。法院不依职权适用时效。未成年人普通损害不套第一百九十一条。第一百九十条只对法定代理人本人。保险法第二十六条与民法典第一百八十八条并列待核禁止写死。错误主张不关窗：事故日当然起算、唯一截止日、已读即中断、持续治疗即中止、保险报案当然中断对侵权人、过期不能立案、法院主动审查、未知写零，只关对应格，闸已开仍出其他LX#。评估窗第四槽用search_case_by_fact，禁止用范本生成截止日证明或催告函。双方秘密、倒签催告、伪造签收或中断材料、隐匿送达、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出LX#终稿。本窗闸名只能是时效闸，禁止复用期间闸、时线闸、评估闸、侵权闸、起诉闸。预留不得占用立案闸、鉴定闸、起诉闸。主行只能是LX#，禁止T#、QJ#、SX#、QG#、A#。主路径只用Q-钟，禁止Q-期、Q-历、Q-时、Q-效、Q-日、Q-签、Q-责作主路径。邻窗Q-钟只作转介进本窗本窗打开为主路径不是已届满。不写唯一截止日、不给剩余天数、不选定法院是交付禁令不是负触发，未知不写零。"
