interface:
  display_name: "提起人身损害一审"
  short_description: "起诉闸与RQ#草案；草稿不是已立案，过时效不是不能立案，垫付不是可不列交强险"
  default_prompt: "使用 $提起人身损害一审，在单方无冲突立场下形成中国大陆人身损害一审起诉包草案：起诉闸、请求与主体碎片、Q#路径、RQ#诉状行（请求切片/原告适格与被告明确/仲裁阻却与排除/管辖连结点/证据目录与保全红旗/E#）。开闸材料是可编号原告适格、请求类型或损害碎片，不是口头已经立案了或先按十级。起诉闸打开不等于已立案不等于已提交不等于应起诉不等于管辖已定。草稿不是已立案。网交回执不是已受理。此致某院不是管辖已定。过时效不是不能立案。交强险保险人应当列为共同被告。垫付医疗费不是可不列。未稳定不得填写确定残疾金。错误主张不关窗：草稿即已立案、网交即已受理、过时效即不能立案、此致某院、垫付即可不列交强险、先按十级、未知写零，只关对应格，闸已开仍出其他RQ#。起诉窗第四槽用search_template只借起诉状栏目，禁止升格已提交或此致某院。双方秘密、虚假诉讼、编造被告、倒签落款第一次即整体停止，不得选边。闸关仍交十节，第6节不出RQ#终稿。本窗闸名只能是起诉闸，禁止复用立案闸、鉴定闸、答辩闸。预留不得占用立案闸、鉴定闸、答辩闸。主行只能是RQ#，禁止QT#、SZ#、P#、J#、A#。主路径只用Q-诉，禁止Q-责、Q-伤鉴、Q-签、Q-院作主路径。邻窗Q-诉只作转介进本窗本窗打开为主路径不是已立案。不代提交、不选定法院、不定残是交付禁令不是负触发，未知不写零。"
