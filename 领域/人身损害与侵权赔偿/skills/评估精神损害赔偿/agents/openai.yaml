interface:
  display_name: "评估精神损害赔偿"
  short_description: "判断严重精神损害是否成立及交强险优先开闭；不唯一金额，伤残非当然，优先须提出且不加限额"
  default_prompt: "使用 $评估精神损害赔偿，在单方无冲突立场下评估人身损害精神损害赔偿的成立条件和交强险优先接口。伤残不是成立的唯一门槛也不是当然成立。不编造唯一抚慰金额或十级惯例必得。交强险优先须被侵权人或近亲属提出，只改死亡伤残限额内排序，不增加限额，未投保无此接口。工伤待遇通常无此项目但第三人侵权民事可留。刑附民开闭只打红旗。不测算、不分账、不编死亡清单、不写诉状。用户要必得额、评残即成立、优先加限额或未提出自动优先时窗口仍开，该格不支持。伪造精神疾病诊断第一次即整体停止，不得选边。不代提交，不选定法院，不定残。"
