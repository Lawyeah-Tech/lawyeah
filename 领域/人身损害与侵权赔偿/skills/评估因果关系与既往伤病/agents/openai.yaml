interface:
  display_name: "评估因果关系与既往伤病"
  short_description: "判断事实与法律因果、既往伤病与参与度接口；有病不是不赔，参与度不得打全部项目"
  default_prompt: "使用 $评估因果关系与既往伤病，在单方无冲突立场下评估事实因果、法律相当因果、既往伤病、介入因素和参与度鉴定接口。不作医学诊断。不输出唯一参与度百分比。时间先后不是事实因果。有病不是不赔。参与度不得乘到全部赔偿项目。特殊体质不得单独减免须待核，禁止蛋壳一律全赔或一律减免。不写过错百分比终稿、伤残等级争议、鉴定异议文书、医疗损害鉴定或测算。不代提交，不选定法院。"
