interface:
  display_name: "准备侵权索赔通知"
  short_description: "求偿闸与QC#草案；草稿不是已发送，已读不是到达，发出不是当然中断"
  default_prompt: "使用 $准备侵权索赔通知，在单方无冲突立场下形成中国大陆人身损害发送前索赔通知草案：求偿闸、收件人与项目碎片、Q#路径、QC#求偿行（收件人切片/项目与金额假设/到达渠道与回证/中断接口/打开接口/E#）。开闸材料是可编号拟收件人名称或地址线索且侵害或损害碎片可编号，不是口头今晚发函。求偿闸打开不等于已发送不等于已到达不等于已中断不等于项目必得不等于对方已认责。草稿不是已发送。已读不是到达。发出不是当然中断。发错主体不当然中断对真正义务人。对保险人到达不当然中断对侵权人。认定书不是民事终局。构成侵权不是伤残已定不是项目必得。诉讼外索赔函无法定答复期。逾期不是视为同意。未知不写零。错误主张不关窗：草稿即已发送、已读即到达、发出即中断、未知写零、逾期视为同意、先按十级、认定书即终局，只关对应格，闸已开仍出其他QC#。准备窗第四槽用search_template只借栏目，禁止升格已发送或改写成起诉状。双方秘密、倒签、伪造送达或回证、虚增伤情、威胁曝光、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出QC#终稿。本窗闸名只能是求偿闸，禁止复用发送闸、催告闸、索赔闸、侵权闸、时效闸。预留不得占用立案闸、鉴定闸、起诉闸、发送闸。主行只能是QC#，禁止QG#、TB#、LX#、SH#、HF#、A#。主路径只用Q-求，禁止Q-函、Q-索、Q-告、Q-钟、Q-责、Q-签作主路径。邻窗Q-求只作转介进本窗本窗打开为主路径不是已发送。不执行发送、不写精算终稿、不写起诉状是交付禁令不是负触发，未知不写零。"
