interface:
  display_name: "评估后续治疗费另行主张"
  short_description: "判断后续治疗费三档与另主张开闭；未知不写零，概括弃权不是当然阻断"
  default_prompt: "使用 $评估后续治疗费另行主张，在权利人或抗辩方单方无冲突立场下评估后续治疗费是已发生、必然发生可一并，还是待实际发生后另行主张。未知不得写零。必然发生须医疗证明或鉴定结论，禁止口述升格。已判不等于绝对不能再告。概括弃权不是当然阻断。不测算数字，不写另诉状，不写唯一截止日，不写鉴定委托，不把解释第十九条继续给付当成本窗，不核定工伤待遇。用户要写零、编造必得额、绝对不能再告或弃权当然消灭时窗口仍开，该格不支持。伪造未发生票据第一次即整体停止，不得选边。不代提交，不选定法院，不定残。"
