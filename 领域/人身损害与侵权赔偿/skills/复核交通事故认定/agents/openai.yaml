interface:
  display_name: "复核交通事故认定"
  short_description: "认定复核期限卡与不代提交草稿；已读不得起算，过期不关窗，认定书不是民事终局"
  default_prompt: "使用 $复核交通事故认定，在单方无冲突立场下对道路交通事故认定书或事故证明准备复核期限卡、证据对照和不代提交的申请草稿。送达日起算，已读和作出日不得起算。过期不关窗，只停止可提交稿，民事证明力提示可留。认定书不是民事终局，主次责不得映射三七开。不写行政诉讼状，不代提交，不保证改责。用户要必须改责或已读起算时窗口仍开。伪造痕迹、倒签送达、双方秘密第一次即整体停止，不得选边。"
