interface:
  display_name: "评估死亡赔偿权利人与分配"
  short_description: "编目死亡赔偿近亲属与分配接口；死亡赔偿金不是遗产，不得按继承第一顺序排除或选边独吞"
  default_prompt: "使用 $评估死亡赔偿权利人与分配，在权利人或抗辩方单方无冲突立场下评估人身损害死亡赔偿的近亲属范围和分配接口。按民法典第一千零四十五条闭集逐名编目，不得按继承第一顺序排除兄弟姐妹。死亡赔偿金一般不是遗产，不得用遗嘱处分，不得输出唯一分配比例或均等必得。不得代弃未授权份额。工亡待遇转劳动但第三人侵权民事请求可留。不测算金额，不写抚慰金必得额，不办遗产管理，不写诉状。多名近亲属冲突或伪造亲属关系第一次即整体停止，不得选边。不代提交，不选定法院。"
