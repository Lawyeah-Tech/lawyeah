interface:
  display_name: "应对保险代位求偿"
  short_description: "代位以实赔为限；人身险金不得当然代位，指导双领第一次停"
  default_prompt: "使用 $应对保险代位求偿，在保险人追偿或第三人／受害人被追的单方无冲突立场下评估代位范围、重复受偿和抗辩。财产保险代位与人身保险金不得代位、交强险法定追偿必须分列。代位不得超出实际赔付。不保证追回。不选定法院。用户要超额代位、人身险当然代位、保证追回、选定某院时窗口仍开，该格不支持。双方秘密、指导同一票据两头领、伪造赔付或倒签权益转让第一次即整体停止，不得选边。工伤基金追偿与民事代位同时出现：基金段分流，民事行可留。"
