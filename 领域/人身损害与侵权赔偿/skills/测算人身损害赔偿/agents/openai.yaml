interface:
  display_name: "测算人身损害赔偿"
  short_description: "人测闸与RS#草案；构成侵权不是项目必得，未知不写零，被扶养人计入两金禁止双计"
  default_prompt: "使用 $测算人身损害赔偿，在单方无冲突立场下形成中国大陆人身损害赔偿分项测算草案：人测闸、项目切片与参数、Q#路径、RS#人测行（项目切片/事件与假设/参数与未舍入公式/已付扣减/互斥计入接口/E#）。开闸材料是可编号票据、病历、项目切片或已付碎片，不是口头必须赔多少或先按十级。人测闸打开不等于侵权已成立不等于伤残已定不等于项目必得不等于保险人必担。构成侵权不是项目必得。未知不写零。被扶养人计入两金禁止双计。治疗未稳定残疾金护理依赖无法估计禁止先按十级禁止转介启动评残。交强险只开接口不出必担额。基金已付不是第三人责任消灭。认定书不是民事终局比例。咨询日统计值不是已核定上一年度。超龄不是误工当然为零。错误主张不关窗：未知写零、先按十级、构成侵权即项目必得、测算即已成立、双计两金，只关对应格，闸已开仍出其他RS#。测算窗第四槽用search_case_by_fact，禁止用范本生成必得总额或诉状。双方秘密、伪造票据、隐匿已收款、倒签基准日第一次即整体停止，不得选边。闸关仍交十节，第6节不出RS#终稿。本窗闸名只能是人测闸，禁止复用鉴定闸、精算闸、测算闸、侵权闸。预留不得占用立案闸、起诉闸、鉴定闸。主行只能是RS#，禁止M#、EVT#、SJ#、JT#、A#。主路径只用Q-人测，禁止Q-测、Q-残、Q-必、Q-签、Q-责作主路径。邻窗Q-人测只作转介进本窗本窗打开为主路径不是已核实。不定侵权已成立、不给必得总额是交付禁令不是负触发，未知不写零。"
