interface:
  display_name: "谈判人身损害和解"
  short_description: "人谈闸与RN#草案；要点不是已签署，单独和解不是已可强制执行，未稳定不得概括放弃伤残"
  default_prompt: "使用 $谈判人身损害和解，在单方无冲突立场下形成中国大陆人身损害和解方案草案：人谈闸、争点与报价碎片、Q#路径、RN#人谈行（争点切片/底线/让步至/弃权范围/执行力路径/E#）。开闸材料是可编号争点、报价档位或弃权碎片，不是口头已经谈拢或微信说行。人谈闸打开不等于已签署不等于已生效不等于已可强制执行不等于伤残已定。要点不是已签署。口头谈拢不是已生效。单独和解不是已可强制执行。永不追究不得覆盖未知伤残。未稳定不得概括放弃伤残或后续治疗。先按十级不是成交。保险人限额内付款不当然消灭对侵权人其余请求。报价草稿不是当然中断时效。已读不是到达。错误主张不关窗：要点即已签署、口头即已生效、单独和解即已可执行、永不追究覆盖未知、先按十级、未知写零，只关对应格，闸已开仍出其他RN#。谈判窗第四槽用search_template只借让步表栏目，禁止升格可签正文。双方秘密、隐瞒已收款、骗保、以刑逼民、伪造倒签第一次即整体停止，不得选边。闸关仍交十节，第6节不出RN#终稿。本窗闸名只能是人谈闸，禁止复用方案闸、和解闸、谈判闸、鉴定闸。预留不得占用立案闸、和解闸、起诉闸、鉴定闸。主行只能是RN#，禁止FA#、HJ#、N#、W#、A#。主路径只用Q-人谈，禁止Q-方、Q-和、Q-谈、Q-签、Q-执作主路径。邻窗Q-人谈只作转介进本窗本窗打开为主路径不是已签署。不写已签署、不代签署、不定残是交付禁令不是负触发，未知不写零。"
