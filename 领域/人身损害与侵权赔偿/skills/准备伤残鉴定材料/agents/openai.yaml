interface:
  display_name: "准备伤残鉴定材料"
  short_description: "鉴定闸与JT#草案；治疗未稳定不是开评残切片，申请不是已出具意见，先按十级不是开闸"
  default_prompt: "使用 $准备伤残鉴定材料，在单方无冲突立场下形成中国大陆人身损害发送前伤残或相关鉴定申请草案：鉴定闸、鉴定切片与检材、Q#路径、JT#鉴定行（鉴定切片/事项/标准与稳定/检材/机构与申请接口/E#）。开闸材料是可编号待鉴定事项或检材碎片，不是口头差不多好了或先按十级。鉴定闸打开不等于已委托不等于已出具不等于伤残已定。治疗未稳定不是开评残切片。先按十级不是开鉴定闸。申请不是已出具意见。单方委托不是法院委托。废止道路标准不是现行。工伤劳鉴不是民事致残终稿。错误主张不关窗：申请即已出具、先按十级、单方即法院委托、废止道路标准即现行、未知写零，只关对应格，闸已开仍出其他JT#。准备窗第四槽用search_template只借栏目，禁止升格已委托或改写成意见书。双方秘密、伪造病历、改诊断、倒签鉴定日、威胁鉴定人第一次即整体停止，不得选边。闸关仍交十节，第6节不出JT#终稿。本窗闸名只能是鉴定闸，禁止复用伤残闸、申鉴闸、求偿闸、侵权闸。预留不得占用立案闸、起诉闸、鉴异闸。主行只能是JT#，禁止APP#、JA#、JD#、A#。主路径只用Q-伤鉴，禁止Q-鉴、Q-申鉴、Q-残、Q-签、Q-责作主路径。邻窗Q-伤鉴只作转介进本窗本窗打开为主路径不是已委托。不预测等级、不代提交、不指定唯一机构是交付禁令不是负触发，未知不写零。"
