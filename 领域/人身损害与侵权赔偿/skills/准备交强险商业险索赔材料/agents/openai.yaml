interface:
  display_name: "准备交强险商业险索赔材料"
  short_description: "交强险或商业三者材料包与限额接口；不代交，旧限额不得默写，酒驾不是当然拒赔"
  default_prompt: "使用 $准备交强险商业险索赔材料，在权利人或被保险人单方无冲突立场下准备交强险或商业三者的索赔材料包。成果是M#材料行、分项限额接口待核、精神损害优先开闭。不代报案、不代提交、不保证赔付。不等于分账、拒赔拆解、起诉状、测算或对侵权人催告。用户要必得额、旧十一万、未提出自动优先或酒驾交强险当然不赔时窗口仍开，该格不支持。伪造票据、顶包、双方秘密第一次即整体停止，不得选边。不选定法院，不定残。"
