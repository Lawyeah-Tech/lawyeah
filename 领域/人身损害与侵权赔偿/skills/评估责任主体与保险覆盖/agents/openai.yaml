interface:
  display_name: "评估责任主体与保险覆盖"
  short_description: "名单闸与TB#草案；租赁借用不是所有人当然连带，未投保不是连带，无责不是关闭交强险"
  default_prompt: "使用 $评估责任主体与保险覆盖，在单方无冲突立场下形成中国大陆人身损害责任主体与保险覆盖表草案：名单闸、主体与关系碎片、Q#路径、TB#主体保险行（名称变体/角色假设/关系事实/形态候选/保险能否进入/打开接口/E#）。开闸材料是可编号名称、车牌、保单、用工或场所碎片，不是口头就是那家店或车主当然赔。名单闸打开不等于唯一被告不等于交强险已分账不等于应起诉。租赁借用不是所有人当然连带。未投保不是连带。无责不是关闭交强险。认定书不是民事终局比例。交强险顺序只开第一千二百一十三条接口本窗不出分项数字。错误主张不关窗：唯一被告、限额内必得、无责关交强险、未投保即连带、所有人当然连带、未知写零，只关对应格，闸已开仍出其他TB#。评估窗第四槽用search_case_by_fact，禁止用范本生成诉状或唯一被告名单。双方秘密、虚构被告、伪造保单、倒签出险、顶包、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出TB#终稿。本窗闸名只能是名单闸，禁止复用侵权闸、评估闸、主体闸、保险闸、起诉闸。预留不得占用立案闸、鉴定闸、起诉闸。主行只能是TB#，禁止PTY#、INS#、QG#、A#、ZT#。主路径只用Q-体，禁止Q-责、Q-险、Q-总、Q-诉作主路径。邻窗Q-体只作转介进本窗本窗打开为主路径不是已锁定义务人。不写诉状、不选定唯一被告、不定残是交付禁令不是负触发，未知不写零。"
