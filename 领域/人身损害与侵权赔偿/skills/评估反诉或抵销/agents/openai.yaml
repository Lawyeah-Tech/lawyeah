interface:
  display_name: "评估反诉或抵销"
  short_description: "反诉与抵销三分型；已付款不是反诉，侵权人不得抵销人身之债"
  default_prompt: "使用 $评估反诉或抵销，在本诉被告无冲突立场下评估人身损害案件的反诉、清偿抗辩与抵销。不自动生成反诉状终稿。不保证准许或受理。不选定法院。已付款通常是清偿抗辩，不是反诉。侵权人主张抵销人身损害债务通常不支持。提出反诉可能视为应诉，管辖异议未决则提交稿停止。用户要终稿、保证准许、选定某院、保险垫付当然抵销全部、还手即防卫必须反诉、辩论终结后仍保证准许时窗口仍开，该格不支持。双方秘密、虚构伤害或伪造付款第一次即整体停止，不得选边。"
