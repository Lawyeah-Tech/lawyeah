interface:
  display_name: "准备后续治疗费另诉"
  short_description: "后续治疗另诉草稿；概括弃权不是当然阻断，未知不得写零"
  default_prompt: "使用 $准备后续治疗费另诉，在权利人无冲突立场下，于另诉闸打开后准备不代提交的后续治疗费或新鉴定另诉包。不保证可诉或受理。不选定法院。未知不得写零。尚未发生手术不得写死确定额。概括弃权不是当然阻断。已判不等于绝对不能再告。仅对旧事实再评残可能受阻。前案已覆盖仍保证可诉、选定某院、保证受理不关窗，该格不支持。双方秘密、伪造新票据或倒签手术日第一次即整体停止，不得选边。工伤夹带第三人侵权民事另诉时民事请求可留。"
