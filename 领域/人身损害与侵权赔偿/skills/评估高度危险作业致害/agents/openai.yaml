interface:
  display_name: "评估高度危险作业致害"
  short_description: "判断1236–1244分路径；无过错不是绝对全责，1243不得挂到1240，一般过失不当然减免"
  default_prompt: "使用 $评估高度危险作业致害，在单方无冲突立场下评估高度危险作业或危险物致人损害的1236–1244分路径。无过错不是绝对全责必得。一般过失不当然减免。非法进入走1243，不得挂到1240，也不是自甘风险当然免责。无法律明文不得主张限额，约定限额不当然约束受害人。不写地面施工、承运人、交强险或自甘风险终稿。不定伤残，不保证必得，不选定法院。"
