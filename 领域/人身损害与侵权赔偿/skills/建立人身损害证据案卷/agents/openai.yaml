interface:
  display_name: "建立人身损害证据案卷"
  short_description: "人据闸与RJ#草案；截图不是原件，对方控制不得推定有利，保存通知不是证据保全"
  default_prompt: "使用 $建立人身损害证据案卷，在单方无冲突立场下形成中国大陆人身损害证据案卷草案：人据闸、待证要件与材料碎片、Q#路径、RJ#人据行（待证要件/材料形态/支持不利/控制方/合法取得/E#）。开闸材料是可编号待证要件或材料碎片，不是口头已经备份或对方一定有监控。人据闸打开不等于已入卷不等于已质证不等于已保全不等于伤残已定。截图不是电子数据原件。对方控制不得推定存在或有利。材料缺失不是事件未发生。认定书不是举证责任转移。场所安保不是过错推定。普通保存通知不是证据保全。治疗未稳定不得转介启动评残。错误主张不关窗：对方控制即有利、截图即原件、案卷即已质证、未知写零、先按十级，只关对应格，闸已开仍出其他RJ#。建立窗第四槽用search_case_by_fact，禁止用范本升格已入卷或诉状。双方秘密、伪造、隐匿、偷拷、违法取证第一次即整体停止，不得选边，不得给替代违法方案。闸关仍交十节，第6节不出RJ#终稿。本窗闸名只能是人据闸，禁止复用证据闸、案卷闸、鉴定闸、人测闸。预留不得占用立案闸、起诉闸、鉴定闸。主行只能是RJ#，禁止EV#、JE#、A#。主路径只用Q-人据，禁止Q-据、Q-卷、Q-责、Q-伤鉴作主路径。邻窗Q-人据只作转介进本窗本窗打开为主路径不是已入卷。不写诉状、不指导违法取证是交付禁令不是负触发，未知不写零。"
