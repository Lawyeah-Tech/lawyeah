interface:
  display_name: "建立双向履行时间线"
  short_description: "时线闸与SX#草案；口头不是已履行，已读不是到达，签收不是验收"
  default_prompt: "使用 $建立双向履行时间线，在单方无冲突立场下形成中国大陆一般合同履行时间线草案：时线闸、主体与强制接口、Q#路径、SX#时线行（义务切片/义务人与文本来源/约定日与先决/实际行为日/异常与冲突日/E#）。开闸材料是可编号义务切片、约定日或实际行为碎片，不是口头已经给了或画完就算齐。时线闸打开不等于已履行不等于已到达不等于已验收不等于已违约不等于已解除。口头不是已履行。已读不是到达。签收不是验收。发出不是到达。部分不是全部。异常不是已违约终局。禁止唯一截止日。错误主张不关窗：口头即已履行、已读即到达、签收即验收、异常即已违约或已解除、唯一截止日、未知写零，只关对应格，闸已开仍出其他SX#。范本只借履行对照表栏目。双方秘密、伪造履行记录、倒签节点或物流回单或签收日、隐匿对账单、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出SX#终稿。本窗闸名只能是时线闸，禁止复用期间闸、争议闸、证据闸、催告闸、解除闸。预留不得占用立案闸。主行只能是SX#，禁止OB#、XL#、QJ#、JE#、ZT#、A#。主路径只用Q-历，禁止Q-期、Q-时、Q-日、Q-据、Q-总、Q-签作主路径。邻窗Q-历只作转介进本窗本窗打开为主路径不是已履行。不认定违约、不写唯一截止日、不发函是交付禁令不是负触发，未知不写零。"
