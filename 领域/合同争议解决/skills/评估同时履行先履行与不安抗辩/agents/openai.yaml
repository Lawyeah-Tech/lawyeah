interface:
  display_name: "评估同时履行先履行与不安抗辩"
  short_description: "履抗闸与LK#草案；停给不是已违约，无确切证据中止不是合法不安，抗辩不是解除"
  default_prompt: "使用 $评估同时履行先履行与不安抗辩，在单方无冲突立场下形成中国大陆一般合同履行抗辩评估草案：履抗闸、主体与强制接口、Q#路径、LK#抗辩行（对待给付与约定顺序切片/同时或先履行相应性/不安情形与确切证据/通知担保与恢复/解除迟延抵销接口/E#）。开闸材料是可编号对待给付、约定先后、停给行为或中止通知碎片，不是口头可以停了或没有证据也能不安。履抗闸打开不等于抗辩已成立不等于中止已合法不等于已解除。停给不是已违约。无确切证据中止不是合法不安。抗辩不是解除。相应不是全部停付。非主要债务未履行不是可拒自己的主要债务。传闻不是确切证据。已读不是中止通知到达。错误主张不关窗：停给即已违约、无确切证据中止即合法不安、抗辩即已解除、部分不符即全部停付、传闻即确切证据、已读即到达、未知写零，只关对应格，闸已开仍出其他LK#。类案只比较差异。双方秘密、伪造不安证据或中止通知、倒签中止日、隐匿担保或对账单、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出LK#终稿。本窗闸名只能是履抗闸，禁止复用抗辩闸、顺序闸、履行闸、答辩闸、形态闸、解除闸。预留不得占用立案闸。主行只能是LK#，禁止XT#、ZL#、SX#、JC#、DB#、A#。主路径只用Q-抗，禁止Q-辩、Q-履、Q-序、Q-态、Q-除、Q-签作主路径。邻窗Q-抗只作转介进本窗本窗打开为主路径不是抗辩已成立。不把抗辩写成解除、不发函是交付禁令不是负触发，未知不写零。"
