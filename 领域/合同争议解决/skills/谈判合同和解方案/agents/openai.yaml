interface:
  display_name: "谈判合同和解方案"
  short_description: "方案闸与FA#草案；要点不是已签署，口头谈拢不是已生效，单独和解不是已可强制执行"
  default_prompt: "使用 $谈判合同和解方案，在单方无冲突立场下形成中国大陆一般合同和解方案草案：方案闸、主体与强制接口、Q#路径、FA#方案行（争点切片/底线/让步至/弃权范围/执行力路径/E#）。开闸材料是可编号争点或报价碎片，不是口头已经谈拢或微信说没问题。方案闸打开不等于已签署不等于已生效不等于已可强制执行不等于已放弃请求。要点不是已签署。口头谈拢不是已生效。单独和解不是已可强制执行。永不追究不得覆盖未知损害或第三人权利。约定数字不是必得。构成违约不是必须以解除为成交条件。已读不是已到达。报价不是已中断时效。错误主张不关窗：要点即已签署、口头谈拢即已生效、单独和解即已可执行、永不追究覆盖未知、约定金即必得、打包了结、已读即到达、报价即已中断时效、谈不拢即应起诉、未知写零，只关对应格，闸已开仍出其他FA#。范本只借让步表栏目。双方秘密、伪造协议或签章、倒签签署日、伪造流水、以和解掩盖犯罪或逃废债务、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出FA#终稿。本窗闸名只能是方案闸，禁止复用和解闸、谈判闸、让步闸、谈拢闸、争议闸、精算闸。预留不得占用立案闸、和解闸。主行只能是FA#，禁止HJ#、TP#、RB#、N#、A#。主路径只用Q-方，禁止Q-和、Q-谈、Q-让、Q-签作主路径。本窗Q-签只作要点即已签署不关窗码。Q-和只开接口转起草合同和解协议。不写已签署、不代签署、不保证执行是交付禁令不是负触发，未知不写零。"
