interface:
  display_name: "评估定金罚则争议"
  short_description: "金罚闸与DN#草案；订金不是定金，未交付不是已成立，超百分之二十超过部分不产生定金效力"
  default_prompt: "使用 $评估定金罚则争议，在单方无冲突立场下形成中国大陆一般合同定金评估草案：金罚闸、主体与强制接口、Q#路径、DN#罚则行（款项切片/名称与性质/交付与百分之二十上限/罚则条件/选用与互斥接口/E#）。开闸材料是可编号款项切片、收据或交付碎片，不是口头收据写了订金就算定金或没给也算成立。金罚闸打开不等于已适用罚则不等于已双倍不等于已没收不等于已选用。订金不是定金。未实际交付不是定金合同已成立。超过标的额百分之二十的超过部分不产生定金效力。轻微违约不是当然没收或双倍。定金与违约金不是当然双计。错误主张不关窗：订金即定金、未交付即已成立、超百分之二十全部产生定金效力、轻微违约即没收或双倍、定金与违约金双计、评估即已双倍、未知写零，只关对应格，闸已开仍出其他DN#。类案只比较差异。双方秘密、伪造交付凭证、倒签交付日、隐匿已返还、虚增标的额凑百分之二十、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出DN#终稿。本窗闸名只能是金罚闸，禁止复用定金闸、罚金闸、订金闸、精算闸、索赔闸。预留不得占用立案闸。主行只能是DN#，禁止DJ#、JS#、SJ#、SH#、FJ#、A#。主路径只用Q-则，禁止Q-测、Q-索、Q-订、Q-双、Q-签作主路径。邻窗Q-则只作转介进本窗本窗打开为主路径不是已适用罚则。不定罚则已适用、不给必得双倍是交付禁令不是负触发，未知不写零。"
