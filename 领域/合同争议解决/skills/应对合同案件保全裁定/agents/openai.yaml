interface:
  display_name: "应对合同案件保全裁定"
  short_description: "应保闸与NS#草案；复议草稿不是已解除，交保不是已解冻，复议期间不是停止执行"
  default_prompt: "使用 $应对合同案件保全裁定，在单方无冲突立场下形成中国大陆一般合同发送前保全复议或担保置换草稿：应保闸、主体与强制接口、Q#路径、NS#应保行（文书切片/措施与范围/复议／五日/担保置换/超范围／错误赔偿接口/E#）。开闸材料是可编号已作出保全文书碎片，不是口头听说冻了或交保就能解。应保闸打开不等于已解除不等于已解冻不等于复议期间停止执行。复议草稿不是已解除。交保不是已解冻。复议期间不是停止执行。财产纠纷交保应当解除不是行为保全当然解除。等值担保可以变更不是应当解除。错误主张不关窗：复议即已解除、交保即已解冻、复议期间停止执行、可以变更即应当解除、行为保全交保即应当解除、保证解除、未知写零，只关对应格，闸已开仍出其他NS#。双方秘密、转移隐匿或毁损被保全财产、违反裁定、串通解冻、抽逃作置换担保、伪造权属、倒签复议日、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出NS#终稿。本窗闸名只能是应保闸，禁止复用冻结闸、保全闸、申保闸、要保闸、应对闸、复议闸。预留不得占用立案闸、和解闸、冻结闸、申保闸。主行只能是NS#，禁止FZ#、BQ#、SB#、YB#、CB#、A#。主路径只用Q-应保，禁止Q-冻、Q-保、Q-申保、Q-要、Q-议、Q-额、Q-应、Q-辩、Q-签作主路径。邻窗Q-应保只作转介进本窗本窗打开为主路径不是已解除。不保证解除、不代提交、不提供转移隐匿方案是交付禁令不是负触发，未知不写零。先予执行、行为保全应对、案外人执行异议之诉主成果unavailable。"
