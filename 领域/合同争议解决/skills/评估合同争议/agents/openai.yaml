interface:
  display_name: "评估合同争议"
  short_description: "争议闸与ZT#草案；构成违约不是当然解除，约定金不是必得，仲裁条款不是应起诉"
  default_prompt: "使用 $评估合同争议，在单方无冲突立场下形成中国大陆一般合同争议总图：争议闸、主体与文本版本、Q#路径、ZT#总图行（合同切片/请求抗辩/论坛期限/金额区间/打开接口/E#）。开闸材料是可编号合同或履行程序碎片，不是口头已经违约了或今天发函就算解除。争议闸打开不等于已违约不等于已解除不等于应起诉不等于约定金必得。构成违约不是当然解除。约定违约金不是必得。仲裁条款不是应起诉。口头或已读不是已送达。准备起诉不是已解除。未异议不能补正解除权缺失。继续履行催告解除违约金赔偿定金不得合成一笔合同权益。错误主张不关窗：违约即解除、约定金即必得、仲裁即应起诉、已读即到达、准备起诉即已解除、未异议即已解除、未知写零，只关对应格，闸已开仍出其他ZT#。类案只比较差异。双方秘密、伪造合同或倒签第一次即整体停止，不得选边。闸关仍交十节，第6节不出ZT#终稿。本窗闸名只能是争议闸，禁止复用催告闸、解除闸、论坛闸、精算闸。预留不得占用立案闸、催告闸、解除闸、论坛闸、精算闸。主行只能是ZT#，禁止GX#、FZ#、BQ#、A#。主路径只用Q-总，禁止Q-催、Q-解、Q-清、Q-管、Q-诉作主路径。不写发送版催告或诉状、不选定法院、不给胜诉率是交付禁令不是负触发，未知不写零。"
