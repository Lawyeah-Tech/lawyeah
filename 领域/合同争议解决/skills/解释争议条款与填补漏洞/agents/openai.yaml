interface:
  display_name: "解释争议条款与填补漏洞"
  short_description: "解释闸与JX#草案；填补漏洞不是已经改约，有歧义不是当然不利格式提供方"
  default_prompt: "使用 $解释争议条款与填补漏洞，在单方无冲突立场下形成中国大陆一般合同争议条款解释草案：解释闸、主体与强制接口、Q#路径、JX#解释行（条款切片/文义与体系/目的习惯诚信/格式不利解释接口/漏洞填补候选/E#）。开闸材料是可编号争议条款、冲突文本或约定不明碎片，不是口头按对我们有利的意思。解释闸打开不等于已改约不等于补充协议已成立不等于习惯已证成不等于不利解释已适用。填补漏洞不是已经改约。有歧义不是当然不利格式提供方。单方惯例不是双方习惯。对我方有利不是唯一解释。目的不是推翻清晰文义。错误主张不关窗：填补即已改约、有歧义即不利提供方、单方惯例即双方习惯、对我方有利即唯一解释、目的推翻清晰文义、选有利文本冒充唯一、未知写零，只关对应格，闸已开仍出其他JX#。类案只比较差异。双方秘密、伪造合同或修订、倒签修订日、隐匿文本、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出JX#终稿。本窗闸名只能是解释闸，禁止复用条款闸、格式闸、成立闸、争议闸。预留不得占用立案闸。主行只能是JX#，禁止SY#、CL#、ZT#、A#。主路径只用Q-释，禁止Q-契、Q-条、Q-漏、Q-补、Q-格、Q-签作主路径。邻窗Q-释只作转介进本窗本窗打开为主路径不是已改约。不重写合同、不把解释写成已改约是交付禁令不是负触发，未知不写零。"
