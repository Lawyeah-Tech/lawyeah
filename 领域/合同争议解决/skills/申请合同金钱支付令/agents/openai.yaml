interface:
  display_name: "申请合同金钱支付令"
  short_description: "支付闸与LF#草案；申请不是已发令，草稿不是已可执行，有实质对待给付不是适格"
  default_prompt: "使用 $申请合同金钱支付令，在单方无冲突立场下形成中国大陆一般合同发送前支付令申请草稿：支付闸、主体与强制接口、Q#路径、LF#支付令行（债权切片/适格三要件/送达可能/异议与转入诉讼接口/申请接口/E#）。开闸材料是可编号金钱债权或有价证券碎片，不是口头今晚发出就能执行。支付闸打开不等于已受理不等于已发令不等于已可执行。申请不是已发令。草稿不是已可执行。有实质对待给付不是适格。书面异议须审查成立才终结不是当然败诉。仅清偿能力延缓期限或变更方式异议通常不影响。口头异议无效。有效仲裁通常阻却督促，不得设计支付令规避仲裁。未到期或数额不确定不是适格。下落不明不是能够送达。已申请诉前保全通常阻却受理。支付令对担保人没有拘束力。错误主张不关窗：申请即已发令、草稿即已可执行、有实质对待给付即适格、有效仲裁仍应发支付令、口头异议即有效、仅清偿能力即当然终结、未知写零、此致某院即管辖已定，只关对应格，闸已开仍出其他LF#。双方秘密、伪造债权或履行凭证、倒签、虚假诉讼、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出LF#终稿。本窗闸名只能是支付闸，禁止复用止付闸、择径闸、起诉闸、督促闸、立案闸。预留不得占用立案闸、保全闸、择径闸、起诉闸。主行只能是LF#，禁止ZF#、ZL#、XH#、QT#、A#。主路径只用Q-金令，禁止Q-令、Q-付、Q-督、Q-执、Q-诉、Q-坛、Q-签作主路径。邻窗Q-金令只作转介进本窗本窗打开为主路径不是已发令。不保证发出、不代提交是交付禁令不是负触发，未知不写零。"
