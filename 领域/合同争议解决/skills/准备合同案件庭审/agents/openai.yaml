interface:
  display_name: "准备合同案件庭审"
  short_description: "开庭闸与KT#草案；提纲不是已开庭，口头已质证不是已质证，不利证据必须入列"
  default_prompt: "使用 $准备合同案件庭审，在单方无冲突立场下形成中国大陆一般合同诉讼或仲裁发送前庭审提纲草案：开庭闸、主体与强制接口、Q#路径、KT#开庭行（争点切片/本证反证/质证三性/询问与承认风险/调解权限接口/E#）。开闸材料是可编号案号、传票、开庭通知、组庭通知或争点碎片，不是口头明天开庭一定赢。开庭闸打开不等于已开庭不等于已质证不等于已胜诉不等于已提交不等于调解已生效。提纲不是已开庭。口头已质证不是已质证。网交不是已提交。逾期证据不是当然可提交也不是当然失权。缺席不是当然胜诉。鉴定人拒不出庭该意见不得作为认定根据不是全案必败。不利证据必须入列，不得教唆否认已知真实。错误主张不关窗：提纲即已开庭、口头已质证即已质证、网交即已提交、逾期即当然可提交、缺席即当然胜诉、保证胜诉、选定法院、未知写零，只关对应格，闸已开仍出其他KT#。双方秘密、伪造证据或笔录、倒签开庭材料、指导隐匿、诱导作伪证、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出KT#终稿。本窗闸名只能是开庭闸，禁止复用庭审闸、举证闸、证据闸、起诉闸、质证闸。预留不得占用立案闸、举证闸、庭审闸。主行只能是KT#，禁止TS#、JQ#、JE#、QT#、A#。主路径只用Q-开庭，禁止Q-审、Q-庭、Q-举证、Q-据、Q-诉、Q-签作主路径。邻窗Q-开庭只作转介进本窗本窗打开为主路径不是已开庭。不代开庭、不给胜诉率是交付禁令不是负触发，未知不写零。"
