interface:
  display_name: "提出合同案件管辖异议"
  short_description: "异议闸与GY#草案；草稿不是已提出，已读不是已送达，逾期不是仍可提交终稿"
  default_prompt: "使用 $提出合同案件管辖异议，在单方无冲突的被诉立场下形成中国大陆一般合同法院管辖异议草稿：异议闸、主体与强制接口、Q#路径、GY#异议行（受诉与案号切片/送达与异议期/连结点与协议管辖/专属级别与应诉风险/仲裁并行接口/E#）。开闸材料是可编号起诉状、应诉通知或案号碎片，不是口头这家法院不管或已读就算送达。异议闸打开不等于已提出不等于已提交不等于已送达不等于已移送不等于应诉管辖已排除不等于管辖已定。草稿不是已提出。已读不是已送达。网交回执不是已提交。逾期只停该提交稿不关窗。同时答辩不消灭异议审查。应诉答辩不是管辖已定闭集。应诉不是放弃仲裁。有效仲裁不是本案必审。此致某院不是管辖已定。错误主张不关窗：草稿即已提出、已读即已送达、网交即已提交、逾期仍要可提交终稿、应诉即管辖已定、应诉即放弃仲裁、此致某院即管辖已定、保证移送、未知写零，只关对应格，闸已开仍出其他GY#。范本只借管辖权异议申请书栏目。双方秘密、伪造连结点或送达、倒签送达、隐匿仲裁条款、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出GY#终稿。本窗闸名只能是异议闸，禁止复用管辖闸、论坛闸、答辩闸、起诉闸。预留不得占用立案闸。主行只能是GY#，禁止YS#、XG#、LT#、DB#、QT#、K#、A#。主路径只用Q-异，禁止Q-管、Q-坛、Q-辩、Q-诉、Q-签作主路径。邻窗Q-异只作转介进本窗本窗打开为主路径不是已提出。应对窗Q-管只开接口进本窗进窗改走Q-异。不代提交、不选定法院、不保证移送是交付禁令不是负触发，未知不写零。"
