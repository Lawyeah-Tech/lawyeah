interface:
  display_name: "评估债权人代位权"
  short_description: "代权闸与DQ#草案；催告不是怠于，专属不是可代位，起诉状不是已代位成立"
  default_prompt: "使用 $评估债权人代位权，在单方无冲突立场下形成中国大陆一般合同代权评估草案：代权闸、主体与强制接口、Q#路径、DQ#代权行（债权切片/到期合法确定与影响实现/怠于行使与专属排除/范围费用与从权利/相对人抗辩保全破产与仲裁接口/E#）。开闸材料是可编号两层债权与相对人碎片，不是口头已经催过就算怠于或起诉状交了就算成立。代权闸打开不等于已代位成立不等于已胜诉不等于已立案。催告不是怠于。专属不是可代位。起诉状不是已代位成立。未到期保存不是直接受领。错误主张不关窗：催告即怠于、专属即可代位、起诉状即已代位成立、未到期即当然可代位、一揽子全部对外债权、未知写零，只关对应格，闸已开仍出其他DQ#。类案只比较差异。双方秘密、伪造次债权或怠于证据、倒签到期或催告、隐匿责任财产、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出DQ#终稿。本窗闸名只能是代权闸，禁止复用代位闸、撤销闸、起诉闸。预留不得占用立案闸。主行只能是DQ#，禁止DW#、WQ#、JH#、A#。主路径只用Q-位，禁止Q-代、Q-撤、Q-诉、Q-签作主路径。邻窗Q-位只作转介进本窗本窗打开为主路径不是已代位成立。不写诉状、不代提交是交付禁令不是负触发，未知不写零。"
