interface:
  display_name: "准备合同仲裁协议异议材料"
  short_description: "仲异闸与ZX#草案；草稿不是已提出，已读不是已开庭，应诉不是放弃仲裁"
  default_prompt: "使用 $准备合同仲裁协议异议材料，在单方无冲突的被诉或被申请立场下形成中国大陆一般合同仲裁协议异议或效力确认材料草稿：仲异闸、主体与强制接口、Q#路径、ZX#仲异行（协议切片/书面形式与仲裁意思/事项覆盖与机构/效力或不适用与独立性/时点与机关路径/E#）。开闸材料是可编号仲裁条款、起诉状、仲裁申请或开庭通知碎片，不是口头条款无效或已读就算开庭。仲异闸打开不等于已提出不等于已提交不等于协议已无效不等于法院必驳回不等于已放弃。草稿不是已提出。已读不是已开庭。应诉不是放弃仲裁。答辩十五日不是仲裁异议截止。合同无效不是仲裁消灭。或裁或诉不是当然有效或当然无效。首次开庭前未异议不是仍可提交有效异议终稿。错误主张不关窗：草稿即已提出、已读即已开庭、应诉即放弃、答辩十五日即截止、合同无效即消灭、或裁或诉当然有效或当然无效、逾期仍要可提交终稿、保证无效、未知写零，只关对应格，闸已开仍出其他ZX#。范本只借确认仲裁协议效力或管辖权异议栏目。双方秘密、伪造仲裁条款、倒签签署日或异议日或开庭日、隐匿条款、伪造送达、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出ZX#终稿。本窗闸名只能是仲异闸，禁止复用异议闸、论坛闸、管辖闸、协议闸、答辩闸、起诉闸。预留不得占用立案闸、和解闸。主行只能是ZX#，禁止GY#、YS#、LT#、DB#、QT#、ZY#、XY#、K#、A#。主路径只用Q-仲异，禁止Q-异、Q-坛、Q-辩、Q-诉、Q-仲、Q-裁、Q-签作主路径。邻窗Q-仲异只作转介进本窗本窗打开为主路径不是已提出。不代提交、不保证无效、不写管辖异议书是交付禁令不是负触发，未知不写零。"
