interface:
  display_name: "处理解除后返还与清理"
  short_description: "清理闸与QL#草案；返还不是当然已返还，折价不是唯一必得价，结算清理条款不因终止失效"
  default_prompt: "使用 $处理解除后返还与清理，在单方无冲突立场下形成中国大陆一般合同清理方案草案：清理闸、主体与强制接口、Q#路径、QL#清理行（标的切片/解除或终止假设/返还或折价/结算清理条款效力/保管减损与金钱接口/E#）。开闸材料是可编号标的切片、占有或履行碎片，不是口头东西已经还了或终止了清理条款就没了。清理闸打开不等于已解除不等于已返还不等于已折价不等于已结清。返还不是当然已返还。折价不是唯一必得价。保管费用不是当然由对方承担。结算清理条款不因终止失效。不能返还原物不是写零。立案日不是解除时点。本窗不重判解除。错误主张不关窗：返还即已返还、折价即唯一必得、保管费当然对方承担、终止即清理条款失效、口头即已返还、不能原物返还即写零、立案日即解除时点、未知写零，只关对应格，闸已开仍出其他QL#。范本只借返还清单或结算清理表栏目。双方秘密、伪造返还或折价凭证、倒签解除或返还日、隐匿标的或已付款、指导毁损藏匿、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出QL#终稿。本窗闸名只能是清理闸，禁止复用返还闸、折价闸、结算闸、解除闸、发送闸。预留不得占用立案闸。主行只能是QL#，禁止ZP#、JC#、HF#、FH#、JS#、DJ#、SJ#、A#。主路径只用Q-理，禁止Q-清、Q-票、Q-除、Q-函、Q-还、Q-签作主路径。邻窗Q-清只作转介进本窗本窗打开为主路径不是已返还。不重判解除、不写发送版是交付禁令不是负触发，未知不写零。"
