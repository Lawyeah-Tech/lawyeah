interface:
  display_name: "准备代位权诉讼材料"
  short_description: "位诉闸与WQ#草案；草稿不是已提交，被告是相对人，未列债务人应当追加第三人"
  default_prompt: "使用 $准备代位权诉讼材料，在单方无冲突立场下形成中国大陆一般合同代位起诉材料草稿：位诉闸、主体与强制接口、Q#路径、WQ#位诉行（请求切片/原告适格与被告第三人列法/次债权管辖与仲裁中止/范围费用与从权利/证据目录通知债务人与保全红旗/E#）。开闸材料是可编号两层债权、相对人或起诉决定碎片，不是口头今晚交出去或此致某院先填上。位诉闸打开不等于已提交不等于已立案不等于已代位成立不等于管辖已定。草稿不是已提交。评估不是已代位成立。被告是相对人，未列债务人应当追加为第三人。管辖由被告住所地，次债权管辖协议异议不予支持。错误主张不关窗：草稿即已提交、评估即已代位成立、催告即怠于、一揽子全部对外债权、未列第三人仍可交终稿、此致某院即管辖已定、未知写零，只关对应格，闸已开仍出其他WQ#。范本只借栏目。双方秘密、伪造次债权或怠于证据、倒签、虚假诉讼、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出WQ#终稿。本窗闸名只能是位诉闸，禁止复用起诉闸、代权闸、诉材闸、立案闸。预留不得占用立案闸。主行只能是WQ#，禁止DQ#、QT#、CQ#、A#。主路径只用Q-位诉，禁止Q-位、Q-代、Q-诉、Q-签作主路径。邻窗Q-位诉只作转介进本窗本窗打开为主路径不是已立案。不代提交、不选定法院是交付禁令不是负触发，未知不写零。"
