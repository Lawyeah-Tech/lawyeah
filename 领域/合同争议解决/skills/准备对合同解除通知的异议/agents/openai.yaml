interface:
  display_name: "准备对合同解除通知的异议"
  short_description: "解异闸与YY#草案；收到通知不是已解除，未异议不能补正解除权缺失，草稿不是已发送"
  default_prompt: "使用 $准备对合同解除通知的异议，在单方无冲突的相对方立场下形成中国大陆一般合同解除通知异议函草稿：解异闸、主体与强制接口、Q#路径、YY#解异行（通知切片/到达与异议期/解除权缺口/异议要点与继续履行/渠道与回证/E#）。开闸材料是可编号解除通知文本或到达碎片，不是口头今晚发出去就算提出了或没回就是认了。解异闸打开不等于已提出不等于已发送不等于已到达不等于已解除不等于已未解除。收到通知不是已解除。已读不是到达。口头异议不是已提出。未异议不是已解除。约定异议期不是解除权补正。立案日不是解除时点。错误主张不关窗：收到通知即已解除、已读即到达、口头异议即已提出、未异议即已解除、草稿即已发送、约定异议期补正解除权、立案日即解除、未知写零，只关对应格，闸已开仍出其他YY#。范本只借异议函栏目。双方秘密、伪造异议函、倒签发出日、伪造送达、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出YY#终稿。本窗闸名只能是解异闸，禁止复用解除闸、发送闸、异议闸、催告闸。预留不得占用立案闸。主行只能是YY#，禁止JC#、HF#、GY#、YJ#、JY#、A#。主路径只用Q-解异，禁止Q-除、Q-函、Q-异、Q-签作主路径。邻窗Q-解异只作转介进本窗本窗打开为主路径不是已发送。不执行发送、不写诉状是交付禁令不是负触发，未知不写零。"
