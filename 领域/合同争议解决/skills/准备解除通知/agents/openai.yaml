interface:
  display_name: "准备解除通知"
  short_description: "发送闸与HF#草案；解除通知草稿不是已发送，已读不是已到达，草稿不是已解除"
  default_prompt: "使用 $准备解除通知，在单方无冲突拟解除方立场下形成中国大陆发送前解除通知草稿：发送闸、主体与强制接口、Q#路径、HF#函行（路径切片/催告闭合/除斥并行情景/正文与生效设计/渠道与回证/E#）。开闸材料是可编号路径切片、等价解除权材料或催告闭合碎片，不是口头今天发函就算解除。发送闸打开不等于已发送不等于已到达不等于已解除。解除通知草稿不是已发送。已读不是已到达。草稿不是已解除。无解除权通知不因未异议而生效。须催告未催告不是已解除。依法须催告且催告未完成仍正触发，闸关或半开仍交十节，禁止改走负触发。错误主张不关窗：发出即已解除、须催告未催告即已解除、已读即已到达、草稿即已发送、未异议即已解除、准备起诉即已解除、一律十五日、未知写零，只关对应格，闸已开仍出其他HF#。范本只借解除通知栏目。双方秘密、伪造解除函、倒签发出日、伪造送达第一次即整体停止，不得选边。闸关仍交十节，第6节不出HF#终稿。本窗闸名只能是发送闸，禁止复用解除闸、催告闸、争议闸。预留不得占用立案闸、催告闸、解除闸、精算闸。主行只能是HF#，禁止ZT#、JC#、CG#、FS#、A#。主路径只用Q-函，禁止Q-解、Q-告、Q-除、Q-催作主路径。禁止用Q-解作不关窗码。邻窗Q-函只作转介进本窗本窗打开为主路径不是已发出。不执行发送、不代提交、不保证到达、不写已解除是交付禁令不是负触发，未知不写零。"
