interface:
  display_name: "准备催告履行或补救通知"
  short_description: "催告闸与CG#草案；催告草稿不是已发送，已读不是已到达，催告不是已解除"
  default_prompt: "使用 $准备催告履行或补救通知，在单方无冲突催告方立场下形成中国大陆发送前催告草稿：催告闸、主体与强制接口、Q#路径、CG#催告行（请求切片/义务与原履行期/现状与补救请求/期限依据/渠道与回证/E#）。开闸材料是可编号义务、迟延或瑕疵事实或既有催告切片，不是口头尽快催一下或逾期即解除。催告闸打开不等于已发送不等于已到达不等于催告期已起算不等于已解除。催告草稿不是已发送。已读不是已到达。催告不是已解除。构成违约不是当然解除。合理期限不是一律十五日。错误主张不关窗：催告即已解除、逾期即已解除、已读即已到达、草稿即已发送、一律十五日、未知写零，只关对应格，闸已开仍出其他CG#。范本只借催告函栏目。双方秘密、伪造履行、倒签催告、伪造送达第一次即整体停止，不得选边。闸关仍交十节，第6节不出CG#终稿。本窗闸名只能是催告闸，禁止复用争议闸、解除闸、发送闸。预留不得占用立案闸、发送闸、精算闸。主行只能是CG#，禁止ZT#、LT#、JC#、A#。主路径只用Q-告，禁止Q-催、Q-函、Q-解、Q-除作主路径。邻窗Q-告只作转介进本窗本窗打开为主路径不是已发出。不执行发送、不代提交、不保证到达是交付禁令不是负触发，未知不写零。"
