interface:
  display_name: "评估合同管辖与仲裁协议"
  short_description: "论坛闸与LT#草案；评估不是已选定法院，仲裁条款不是当然有效"
  default_prompt: "使用 $评估合同管辖与仲裁协议，在单方无冲突立场下形成中国大陆一般合同论坛评估草案：论坛闸、主体与强制接口、Q#路径、LT#论坛行（条款切片/书面形式与仲裁意思/事项覆盖与机构/或裁或诉与独立性/连结点与异议期/E#）。开闸材料是可编号合同争议解决条款或连结点碎片，不是口头去某院告或以后仲裁。论坛闸打开不等于已选定法院不等于有效仲裁已排除不等于已提出异议不等于已应诉管辖。评估不是已选定法院。仲裁条款不是当然有效。或裁或诉不是当然有效。合同条款对未签署人待核。口头不是书面协议。已读不是已送达不得起算异议期。有效仲裁未排除不得写应起诉。合同无效不当然消灭仲裁协议。错误主张不关窗：评估即已选定法院、仲裁条款当然有效、或裁或诉当然有效、未签署人已受约束、有效仲裁仍应直接起诉、已读即异议期起算、未知写零，只关对应格，闸已开仍出其他LT#。类案只比较差异。双方秘密、伪造连结点、隐匿仲裁条款、倒签签署日第一次即整体停止，不得选边。闸关仍交十节，第6节不出LT#终稿。本窗闸名只能是论坛闸，禁止复用管辖闸、争议闸、起诉闸。预留不得占用立案闸、催告闸、解除闸、精算闸。主行只能是LT#，禁止XG#、ZT#、A#。主路径只用Q-坛，禁止Q-管、Q-总、Q-诉、Q-裁作主路径。邻窗Q-管只作转介进本窗，本窗不打开Q-管为主路径。本窗Q-签只作评估即已选定法院不关窗码。Q-坛邻窗是转介码本窗打开为主路径。不选定法院、不写异议书、不给胜诉率是交付禁令不是负触发，未知不写零。"
