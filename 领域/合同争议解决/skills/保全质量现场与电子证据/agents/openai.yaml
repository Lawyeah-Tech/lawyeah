interface:
  display_name: "保全质量现场与电子证据"
  short_description: "现证闸与XZ#草案；草稿不是已保全，截图不是原件，哈希不是已公证，申请不是已准许"
  default_prompt: "使用 $保全质量现场与电子证据，在单方无冲突立场下形成中国大陆一般合同质量现场与电子证据合法自固草稿：现证闸、主体与强制接口、Q#路径、XZ#现证行（对象切片/灭失风险/合法自固步骤/公证／鉴定／法院证据保全分流/禁止动作红旗/E#）。开闸材料是可编号对象或灭失风险碎片，不是口头已经截过图或哈希就算公证。现证闸打开不等于已保全不等于已固定不等于已公证不等于已准许。草稿不是已保全。口头或已读不是已固定。截图不是原件。哈希不是已公证。申请不是已准许。红旗不是已保全。对方控制不是内容有利。公证不是必然可采。错误主张不关窗：草稿即已保全、口头或已读即已固定、截图即原件、哈希即已公证、申请即已准许、红旗即已保全、对方控制即内容有利、未知写零，只关对应格，闸已开仍出其他XZ#。双方秘密、伪造聊天或时间戳、倒签提取日、隐匿不利视频、破坏现场、侵入系统、盗号窃听、购买非法数据、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出XZ#终稿。本窗闸名只能是现证闸，禁止复用固证闸、证据闸、质量闸、时线闸、保全闸、封存闸。预留不得占用立案闸、和解闸、保全闸。主行只能是XZ#，禁止JE#、ZL#、SX#、FC#、AJ#、GD#、GZ#、BQ#、A#。主路径只用Q-现，禁止Q-据、Q-疵、Q-历、Q-保、Q-账、Q-卷、Q-固、Q-签作主路径。邻窗Q-现只作转介进本窗本窗打开为主路径不是已保全。不代提交、不指导违法取证是交付禁令不是负触发，未知不写零。"
