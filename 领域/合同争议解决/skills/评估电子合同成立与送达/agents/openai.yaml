interface:
  display_name: "评估电子合同成立与送达"
  short_description: "电约闸与DY#草案；已读不是到达，截图不是原件，电子章不是当然可靠签名"
  default_prompt: "使用 $评估电子合同成立与送达，在单方无冲突立场下形成中国大陆一般合同电约评估草案：电约闸、主体与强制接口、Q#路径、DY#电约行（电文或订单切片/指定系统与到达/要约承诺或提交订单/电子签名与完整性/鉴定公证接口/E#）。开闸材料是可编号电文、订单、电子章或日志碎片，不是口头已经读了就算到了或截图就是原件。电约闸打开不等于已到达不等于已成立不等于可靠电子签名已具备不等于鉴定意见已出。已读不是到达。截图不是原件。提交订单成功不是排除另有约定后当然成立。电子章不是当然可靠电子签名。错误主张不关窗：已读即到达、截图即原件、点击即成立、电子章即可靠签名、进入垃圾箱即到达、未知写零，只关对应格，闸已开仍出其他DY#。类案只比较差异。双方秘密、伪造时间戳或电子章或日志、倒签到达日、违法侵入取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出DY#终稿。本窗闸名只能是电约闸，禁止复用成立闸、发送闸、送达闸、电文闸。预留不得占用立案闸。主行只能是DY#，禁止CL#、HF#、SD#、BY#、A#。主路径只用Q-电，禁止Q-契、Q-函、Q-送、Q-达、Q-签作主路径。邻窗Q-电只作转介进本窗本窗打开为主路径不是已到达。不代鉴定、不写已到达是交付禁令不是负触发，未知不写零。"
