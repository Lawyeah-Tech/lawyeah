interface:
  display_name: "提起合同案件上诉"
  short_description: "上诉闸与HS#草案；草稿不是已提起，口头不服不是已上诉，已生效不是可普通上诉"
  default_prompt: "使用 $提起合同案件上诉，在单方无冲突立场下形成中国大陆一般合同发送前上诉状草稿：上诉闸、主体与强制接口、Q#路径、HS#上诉行（范围切片/送达与上诉期/事实法律程序理由/新证据接口/一审请求边界/E#）。开闸材料是可编号一审裁判或上诉期碎片，不是口头判决刚到不服。上诉闸打开不等于已上诉不等于已提交不等于已改判不等于未声明部分未生效。草稿不是已提起。口头不服不是已上诉。逾期不是当然仍可普通上诉。已生效不是可普通上诉。判决十五日与裁定十日不得混卡。已读不是送达起算。调解书不是普通上诉。对仲裁裁决不是普通上诉。超出一审请求不当然允许。错误主张不关窗：草稿即已提起、口头不服即已上诉、逾期当然仍可、已生效仍可普通上诉、保证改判、选定二审法院、未知写零，只关对应格，闸已开仍出其他HS#。双方秘密、伪造上诉材料、倒签送达、虚假诉讼、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出HS#终稿。本窗闸名只能是上诉闸，禁止复用起诉闸、开庭闸、庭审闸、支付闸、仲裁闸、立案闸。主行只能是HS#，禁止SS#、QT#、KT#、LF#、ZC#、A#。主路径只用Q-上，禁止Q-诉、Q-辩、Q-开庭、Q-审、Q-申、Q-签作主路径。邻窗Q-上只作转介进本窗本窗打开为主路径不是已上诉。不代提交、不保证改判、不选定二审法院是交付禁令不是负触发，未知不写零。"
