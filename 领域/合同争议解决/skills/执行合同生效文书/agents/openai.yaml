interface:
  display_name: "执行合同生效文书"
  short_description: "执行闸与ZE#草案；申请不是已立案执行，调解书签收才生效，单独和解不是已可强制执行"
  default_prompt: "使用 $执行合同生效文书，在单方无冲突的权利人立场下形成中国大陆一般合同发送前强制执行申请草稿：执行闸、主体与强制接口、Q#路径、ZE#执申行（名义切片/生效与申请期间/金额本金迟延已履行/管辖连结点与财产线索/申请接口/E#）。开闸材料是可编号判决、调解书、裁决、支付令或赋强文书碎片，不是口头对方不给钱今晚去查封。执行闸打开不等于已提交不等于已立案执行不等于已控制财产。申请不是已立案执行。草稿不是已采取强制措施。网交不是已立案。财产线索不是已查封冻结扣划。调解书双方签收才生效。已读不是签收。单独和解不是已可强制执行。申请执行期间二年，分期从最后一期届满起算，不是每次分别起算。已读不是二年起算。过期只停该提交稿不关窗。判决调解书走第一审或同级财产地，仲裁裁决不得一律套一审法院。错误主张不关窗：申请即已立案、草稿即已查控、未签收即已可执行、单独和解即已可强制执行、已读即起算、过期仍要可提交普通终稿、未知写零、执行中重审实体，只关对应格，闸已开仍出其他ZE#。范本只借强制执行申请书、财产线索表栏目。双方秘密、伪造文书或线索、倒签签收、指导隐匿转移、违法查人第一次即整体停止，不得选边。闸关仍交十节，第6节不出ZE#终稿。本窗闸名只能是执行闸，禁止复用不执闸、支付闸、申请闸、保全闸。预留不得占用立案闸、保全闸。主行只能是ZE#，禁止ZX#、BZ#、LF#、ZC#、QF#、A#。主路径只用Q-执申，禁止Q-执、Q-申、Q-金令、Q-不执、Q-签作主路径。邻窗Q-执申只作转介进本窗本窗打开为主路径不是已立案。不代提交、不保证控制财产、不重审实体是交付禁令不是负触发，未知不写零。"
