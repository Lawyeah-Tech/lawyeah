interface:
  display_name: "提起合同成立或效力确认之诉"
  short_description: "确诉闸与QR#草案；草稿不是已提交，确认之诉不是给付之诉，确认成立不是已生效履行"
  default_prompt: "使用 $提起合同成立或效力确认之诉，在单方无冲突立场下形成中国大陆一般合同确认成立、不成立、无效或请求撤销的材料草稿：确诉闸、主体与强制接口、Q#路径、QR#确诉行（请求切片/原告适格与被告明确/确认利益与给付吸收/管辖与仲裁独立性/除斥互斥与证据目录保全红旗/E#）。开闸材料是可编号原告适格、请求类型或合同碎片，不是口头今晚交出去或先确认有效再要钱。确诉闸打开不等于已提交不等于已立案不等于已确认成立不等于已生效履行不等于应起诉不等于管辖已定。草稿不是已提交。确认之诉不是给付之诉。确认成立不是已生效履行。可撤销不是当然无效。除斥不是时效。有效仲裁不是应起诉。主合同无效不是仲裁消灭。错误主张不关窗：草稿即已提交、确认之诉即给付、确认成立即已生效履行、可撤销即当然无效、除斥即时效、除斥届满仍要撤销确认终稿、有效仲裁仍应直接起诉、此致某院即管辖已定、未知写零，只关对应格，闸已开仍出其他QR#。范本只借民事起诉状栏目。双方秘密、伪造合同或诉状、倒签落款或签署日、虚假诉讼、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出QR#终稿。本窗闸名只能是确诉闸，禁止复用起诉闸、成立闸、效力闸、位诉闸、撤诉闸。预留不得占用立案闸。主行只能是QR#，禁止QT#、CL#、WQ#、XQ#、QS#、A#。主路径只用Q-确诉，禁止Q-诉、Q-契、Q-签、Q-位诉、Q-撤诉作主路径。邻窗Q-确诉只作转介进本窗本窗打开为主路径不是已立案。不代提交、不选定法院是交付禁令不是负触发，未知不写零。"
