interface:
  display_name: "选择诉讼仲裁或督促程序"
  short_description: "择径闸与XH#草案；有效仲裁不是应起诉，比较不是已选定法院，支付令不是已可执行"
  default_prompt: "使用 $选择诉讼仲裁或督促程序，在单方无冲突立场下形成中国大陆一般合同程序选择评估草案：择径闸、主体与强制接口、Q#路径、XH#择径行（请求切片/仲裁条款接口/诉讼接口/督促支付令接口/互斥与失败分流/E#）。开闸材料是可编号请求、仲裁条款或金钱债权碎片，不是口头直接去法院更快。择径闸打开不等于已选定程序不等于应起诉不等于已发支付令。有效仲裁不是应起诉。比较不是已选定法院。支付令不是已可执行。有实质对待给付争议不是支付令适格。或裁或诉不是当然有效。构成违约不是当然解除。错误主张不关窗：有效仲裁仍应起诉、比较即已选定或已立案、支付令即已可执行、未知写零、此致某院即管辖已定，只关对应格，闸已开仍出其他XH#。双方秘密、伪造仲裁条款或连结点、隐匿仲裁协议、倒签、虚假诉讼、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出XH#终稿。本窗闸名只能是择径闸，禁止复用论坛闸、起诉闸、答辩闸、竞合闸、程序闸、路径闸。预留不得占用立案闸、论坛闸、起诉闸。主行只能是XH#，禁止LT#、QT#、DB#、JH#、CX#、A#。主路径只用Q-督，禁止Q-坛、Q-诉、Q-辩、Q-择、Q-径、Q-选、Q-签、Q-金令作主路径。邻窗Q-督只作转介进本窗本窗打开为主路径不是已选定。邻窗Q-金令只转介申请合同金钱支付令。不写完整申请书、不选定法院是交付禁令不是负触发，未知不写零。评估类禁止用search_template顶第四槽。"
