interface:
  display_name: "评估合同成立与效力"
  short_description: "成立闸与CL#草案；口头或已读不是已成立，无权代理不是当然有效或当然无效"
  default_prompt: "使用 $评估合同成立与效力，在单方无冲突立场下形成中国大陆一般合同成立与效力评估草案：成立闸、主体与强制接口、Q#路径、CL#成立效力行（文本切片/要约承诺或履行成立/代理代表与追认/无效可撤销待定/除斥与后果独立性/E#）。开闸材料是可编号合同、要约承诺、印章或履行碎片，不是口头早就成立了或盖了章就算数。成立闸打开不等于已成立不等于已生效不等于已无效不等于已追认。口头或已读不是已成立。无权代理不是当然有效或当然无效。未追认不是已追认。无效不是未成立。可撤销不是当然无效。盖章不是表见。假章不是一律无效。未生效不是无效。错误主张不关窗：口头即已成立、已读即到达、无权代理当然有效或无效、未追认即已追认、无效即未成立、可撤销即当然无效、盖章即表见、假章一律无效、未生效即无效、未知写零，只关对应格，闸已开仍出其他CL#。类案只比较差异。双方秘密、伪造合同、倒签签署日、伪造印章、隐匿文本、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出CL#终稿。本窗闸名只能是成立闸，禁止复用效力闸、争议闸、评估闸。预留不得占用立案闸。主行只能是CL#，禁止ZT#、XL#、A#。主路径只用Q-契，禁止Q-立、Q-成、Q-效、Q-总、Q-签作主路径。邻窗Q-契只作转介进本窗本窗打开为主路径不是已成立。不写诉状、不把口头写成已成立是交付禁令不是负触发，未知不写零。"
