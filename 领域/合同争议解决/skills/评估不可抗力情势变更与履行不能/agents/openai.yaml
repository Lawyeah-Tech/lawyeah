interface:
  display_name: "评估不可抗力情势变更与履行不能"
  short_description: "变故闸与WG#草案；不可抗力不是当然免责，情势变更不是当然改约，商业不能不是法律不能"
  default_prompt: "使用 $评估不可抗力情势变更与履行不能，在单方无冲突立场下形成中国大陆一般合同变故评估草案：变故闸、主体与强制接口、Q#路径、WG#变故行（事件切片/三不能与商业风险分列/通知减损/再交涉与第五百八十条接口/免责改约解除分流/E#）。开闸材料是可编号合同与事件起止、影响义务或通知减损碎片，不是口头行情不好或今天发解除。变故闸打开不等于已免责不等于已改约不等于法律不能不等于已解除。不可抗力不是当然免责。情势变更不是当然改约也不得单方通知解除。商业不能不是法律不能。金钱债务原则上不能免付款。第五百八十条终止不是通知解除，终止时点不是立案日。错误主张不关窗：不可抗力即当然免责、情势即当然改约或单方通知解除、商业不能即法律不能、金钱之债免付、起诉当日即终止、未知写零，只关对应格，闸已开仍出其他WG#。类案只比较差异。双方秘密、伪造不可抗力证明、倒签通知日、隐匿再交涉或减损记录、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出WG#终稿。本窗闸名只能是变故闸，禁止复用力变闸、情势闸、不能闸、变更闸、解除闸。预留不得占用立案闸。主行只能是WG#，禁止LB#、BG#、LK#、XT#、JC#、A#。主路径只用Q-故，禁止Q-力、Q-变、Q-履、Q-免、Q-能、Q-签作主路径。邻窗Q-故只作转介进本窗本窗打开为主路径不是已免责。不认定免责、不发函、不出情势诉状是交付禁令不是负触发，未知不写零。"
