interface:
  display_name: "评估合同调解方案与效力"
  short_description: "调解闸与TJ#草案；调解书签收才生效，拒收不是已可执行，评估不是已出调解书"
  default_prompt: "使用 $评估合同调解方案与效力，在单方无冲突立场下形成中国大陆一般合同调解评估草案：调解闸、主体与强制接口、Q#路径、TJ#调解行（方案切片/程序前提/签收或生效/反悔或无效接口/与确认赋强分流/E#）。开闸材料是可编号调解类型、方案对照或效力碎片，不是口头已经调成了。调解闸打开不等于已签收不等于已出调解书不等于已可强制执行。调解书双方签收才生效。拒收不是已可执行。评估不是已出调解书。口头同意不是已生效。人民调解未确认不是已可强制执行。调解妥协原则上不得作后续不利自认。错误主张不关窗：评估即已出调解书、拒收即已可执行、口头即已调解、反悔未核即已确定、未知写零，只关对应格，闸已开仍出其他TJ#。双方秘密、伪造调解书或签章、倒签签收日、以调解掩盖犯罪或逃废债务、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出TJ#终稿。本窗闸名只能是调解闸，禁止复用方案闸、和解闸、力补闸、公证闸、媒效闸。预留不得占用立案闸、和解闸、方案闸、力补闸。主行只能是TJ#，禁止FA#、HJ#、QF#、MD#、A#。主路径只用Q-媒，禁止Q-方、Q-和、Q-力、Q-调、Q-签作主路径。邻窗Q-媒只作转介进本窗本窗打开为主路径不是已出调解书。不代替庭审、不保证出调解书是交付禁令不是负触发，未知不写零。评估类禁止用search_template顶第四槽。"
