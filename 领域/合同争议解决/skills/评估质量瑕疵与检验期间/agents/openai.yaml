interface:
  display_name: "评估质量瑕疵与检验期间"
  short_description: "质量闸与ZL#草案；签收不是验收，质保期不是检验异议期，构成瑕疵不是当然解除"
  default_prompt: "使用 $评估质量瑕疵与检验期间，在单方无冲突立场下形成中国大陆一般合同质量瑕疵评估草案：质量闸、主体与强制接口、Q#路径、ZL#质量行（标的与标准切片/检验期间与通知/外观隐蔽与因果/补救减价赔偿接口/解除与鉴定分流/E#）。开闸材料是可编号标的、批次、标准、交付或检验异议碎片，不是口头已经不合格或签收了就算验收。质量闸打开不等于已构成瑕疵不等于已逾期视为合格不等于已解除不等于鉴定已成立。签收不是验收。质保期不是检验异议期。付款或使用不是当然放弃异议。过短约定检验期不是全面闭集。构成瑕疵不是当然解除。禁止唯一截止日。错误主张不关窗：签收即验收、质保期即检验异议期、付款或使用即弃权、构成瑕疵即当然解除、唯一截止日、未知写零，只关对应格，闸已开仍出其他ZL#。类案只比较差异。双方秘密、伪造检验记录、倒签检验或异议日、隐匿通知、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出ZL#终稿。本窗闸名只能是质量闸，禁止复用瑕疵闸、验收闸、期间闸、时线闸、解除闸。预留不得占用立案闸、鉴定闸。主行只能是ZL#，禁止SX#、QJ#、JE#、JC#、A#。主路径只用Q-疵，禁止Q-质、Q-历、Q-期、Q-除、Q-收、Q-签作主路径。邻窗Q-疵只作转介进本窗本窗打开为主路径不是已构成瑕疵。不写唯一截止日、不认定解除、不发函是交付禁令不是负触发，未知不写零。"
