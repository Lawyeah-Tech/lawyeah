interface:
  display_name: "评估合同财产保全必要性"
  short_description: "要保闸与YB#草案；单纯担心不是难以执行，申请草稿不是已裁定，担保不是已保全"
  default_prompt: "使用 $评估合同财产保全必要性，在单方无冲突立场下形成中国大陆一般合同财产保全必要性评估草案：要保闸、主体与强制接口、Q#路径、YB#要保行（请求切片/难以执行或损害迹象/担保与错误赔偿/诉前诉中与三十日/申请／复议／先予／行为接口/E#）。开闸材料是可编号给付请求或对象、迹象碎片，不是口头他肯定在转钱或必须今晚冻。要保闸打开不等于已必要不等于已裁定不等于已申请。单纯担心不是难以执行。申请草稿不是已裁定。担保不是已保全。诉前三十日不是已起诉。口头紧急不是四十八小时已裁。未知金额不写零。错误主张不关窗：担心即难以执行、申请即已裁定、担保即已保全、三十日即已起诉、口头紧急即四十八小时已裁、未知写零，只关对应格，闸已开仍出其他YB#。双方秘密、虚构紧急、伪造转移迹象、倒签申请日、伪造担保、指导隐匿或转移对方财产、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出YB#终稿。本窗闸名只能是要保闸，禁止复用保全闸、冻结闸、现证闸、封存闸。预留不得占用立案闸、和解闸、保全闸。主行只能是YB#，禁止BQ#、FZ#、XZ#、FC#、A#。主路径只用Q-要，禁止Q-保、Q-冻、Q-账、Q-现、Q-必、Q-急、Q-签作主路径。邻窗Q-要只作转介进本窗本窗打开为主路径不是已裁定。不代写申请、不保证裁定是交付禁令不是负触发，未知不写零。先予执行与行为保全申请主成果unavailable。"
