interface:
  display_name: "评估框架协议与订单冲突"
  short_description: "框约闸与KY#草案；送货单不是当然覆盖框架，对账单不是当然改约"
  default_prompt: "使用 $评估框架协议与订单冲突，在单方无冲突立场下形成中国大陆一般合同框约评估草案：框约闸、主体与强制接口、Q#路径、KY#框约行（文件切片/预约或本约与受约束意思/层级条款与冲突点/双方确认与履行补正/仲裁或填补接口/E#）。开闸材料是可编号框架或订单或送货或对账碎片，不是口头框架当然优先或送货单就算改了。框约闸打开不等于已成为内容不等于已本约不等于订单已覆盖不等于已改约。送货单不是当然覆盖框架。对账单不是当然改约。框架不是当然本约。后文件不是当然覆盖。沉默不是承诺。错误主张不关窗：送货单即覆盖、对账单即改约、框架即当然本约、后文件即当然覆盖、沉默即承诺、未知写零，只关对应格，闸已开仍出其他KY#。类案只比较差异。双方秘密、伪造订单或对账或确认、倒签回签日、隐匿框架或订单、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出KY#终稿。本窗闸名只能是框约闸，禁止复用框架闸、层级闸、变约闸、解释闸。预留不得占用立案闸。主行只能是KY#，禁止KJ#、CL#、BY#、JX#、DOC#、A#。主路径只用Q-架，禁止Q-框、Q-层、Q-变、Q-释、Q-签作主路径。邻窗Q-架只作转介进本窗本窗打开为主路径不是已成为内容。不写确认书、不编单价是交付禁令不是负触发，未知不写零。不按单张订单另建技能。"
