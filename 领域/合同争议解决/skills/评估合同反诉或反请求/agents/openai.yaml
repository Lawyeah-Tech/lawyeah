interface:
  display_name: "评估合同反诉或反请求"
  short_description: "反诉闸与FQ#草案；评估不是已提起，无牵连不是可反诉，二审反诉不是当然一并"
  default_prompt: "使用 $评估合同反诉或反请求，在单方无冲突的被告或被申请立场下形成中国大陆一般合同反诉或反请求条件评估草案：反诉闸、主体与强制接口、Q#路径、FQ#反请行（本诉或仲裁请求切片/牵连或另诉/论坛与应诉风险/期间与规则期限/利弊与请求草案接口/E#）。开闸材料是可编号本诉起诉状、应诉通知、仲裁申请书副本、案号或拟反请求切片，不是口头要反诉。反诉闸打开不等于已提起不等于已受理不等于牵连已闭合不等于应诉管辖已成立。评估不是已提起。草稿不是已受理。无牵连不是可反诉。专属他院不是可合并。答辩期内未提不是当然失权。辩论结束前才是一审合并窗口。提出反诉可能构成应诉管辖，不是当然放弃仲裁。民诉十五日不是仲裁反请求截止。二审反诉不是当然一并。抵销抗辩不是必须反诉。错误主张不关窗：评估即已提起、草稿即已受理、无关债当然牵连、答辩期满即失权、二审当然一并、反诉即放弃仲裁、未知写零，只关对应格，闸已开仍出其他FQ#。评估窗第四槽用search_case_by_fact，禁止用范本生成反诉状终稿。双方秘密、伪造牵连、倒签反诉日、把无关债塞进反诉且拒限缩、隐匿证据、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出FQ#终稿。本窗闸名只能是反诉闸，禁止复用评估闸、反请求闸、答辩闸、应裁闸、起诉闸。预留不得占用立案闸、保全闸。主行只能是FQ#，禁止FS#、DB#、YC#、QT#、DX#、A#。主路径只用Q-反，禁止Q-反请、Q-辩、Q-应裁、Q-诉、Q-签作主路径。邻窗Q-反只作转介进本窗本窗打开为主路径不是已提起。不出反诉状终稿、不代提交是交付禁令不是负触发，未知不写零。"
