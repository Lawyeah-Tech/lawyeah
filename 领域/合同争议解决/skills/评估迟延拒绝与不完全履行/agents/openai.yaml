interface:
  display_name: "评估迟延拒绝与不完全履行"
  short_description: "形态闸与XT#草案；构成违约不是当然解除，迟延主要债务原则上须催告"
  default_prompt: "使用 $评估迟延拒绝与不完全履行，在单方无冲突立场下形成中国大陆一般合同违约形态评估草案：形态闸、主体与强制接口、Q#路径、XT#形态行（义务切片/形态分列迟延预期拒绝拒绝受领不完全/催告必要与合理期限/目的能否实现/补救继续履行赔偿接口/E#）。开闸材料是可编号义务、履行期或拒绝不符碎片，不是口头对方违约了或可以解除了。形态闸打开不等于已违约不等于已催告届满不等于目的不能实现不等于当然解除。构成违约不是当然解除。迟延主要债务原则上须催告并给合理期限。须催告未催告不是已成立。合理期限不是一律十五日。已读不是到达。错误主张不关窗：构成违约即当然解除、迟延即当然解除、须催告未催告即已成立、合理期限一律十五日、已读即到达、未知写零，只关对应格，闸已开仍出其他XT#。类案只比较差异。双方秘密、伪造履行记录、倒签催告或到达日、隐匿对账单、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出XT#终稿。本窗闸名只能是形态闸，禁止复用违约闸、履行闸、质量闸、时线闸、解除闸、催告闸。预留不得占用立案闸、催告闸、解除闸。主行只能是XT#，禁止ZL#、SX#、QJ#、JC#、ZT#、CG#、A#。主路径只用Q-态，禁止Q-违、Q-迟、Q-履、Q-历、Q-疵、Q-除、Q-形、Q-签作主路径。邻窗Q-态只作转介进本窗本窗打开为主路径不是已违约。不认定解除、不发函是交付禁令不是负触发，未知不写零。"
