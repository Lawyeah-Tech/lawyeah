interface:
  display_name: "评估解除权是否成立"
  short_description: "解除闸与JC#草案；构成违约不是当然解除，催告不是已解除"
  default_prompt: "使用 $评估解除权是否成立，在单方无冲突立场下形成中国大陆解除权专项评估草案：解除闸、主体与强制接口、Q#路径、JC#解除权行（路径切片/约定或法定该当/催告必要与合理期限/除斥并行情景/到达与通知效力/E#）。开闸材料是可编号合同、催告、解除通知或履行碎片，不是口头已经违约了或今天发函就算解除。解除闸打开不等于已违约不等于解除权已成立不等于已行使不等于已到达。构成违约不是当然解除。催告不是已解除。解除通知草稿不是已到达解除。对方未异议不能补正解除权缺失。准备起诉不是已解除。除斥不是诉讼时效。口头或已读不是已送达。错误主张不关窗：违约即解除、须催告未催告即已成立、已读即到达、准备起诉即已解除、未异议即已解除、未知写零，只关对应格，闸已开仍出其他JC#。类案只比较差异。双方秘密、伪造催告或倒签解除日第一次即整体停止，不得选边。闸关仍交十节，第6节不出JC#终稿。本窗闸名只能是解除闸，禁止复用争议闸、论坛闸、催告闸、发送闸。预留不得占用立案闸、催告闸、发送闸、精算闸。主行只能是JC#，禁止ZT#、LT#、A#。主路径只用Q-除，禁止Q-解、Q-催、Q-告、Q-函作主路径。邻窗Q-除只作转介进本窗本窗打开为主路径。不写发送版解除函、不给胜诉率是交付禁令不是负触发，未知不写零。"
