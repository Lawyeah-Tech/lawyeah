interface:
  display_name: "建立合同争议证据案卷"
  short_description: "证据闸与JE#草案；对方控制不是内容有利，复制不是已固定，未知不写零"
  default_prompt: "使用 $建立合同争议证据案卷，在单方无冲突立场下形成中国大陆合同争议证据案卷草案：证据闸、主体与强制接口、Q#路径、JE#证据行（待证要件/材料形态/支持/不利/控制方/合法取得/E#）。开闸材料是可编号待证要件或材料碎片，不是口头已经备份或对方电脑里一定有。证据闸打开不等于已入卷不等于已质证不等于已立案。对方控制材料不得推定内容有利。复制不是已固定。哈希不是已公证。已读不是已到达。红旗不是保全已完成。案卷不是诉状。错误主张不关窗：对方控制即有利、复制即已固定、已读即到达、案卷即已质证或已立案、未知写零，只关对应格，闸已开仍出其他JE#。范本只借编目栏目。双方秘密、伪造证据、偷拷电脑、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出JE#终稿。本窗闸名只能是证据闸，禁止复用案卷闸、争议闸、精算闸。预留不得占用立案闸、案卷闸。主行只能是JE#，禁止AJ#、EV#、A#。主路径只用Q-据，禁止Q-卷、Q-总、Q-诉作主路径。邻窗Q-卷只作转介进本窗本窗不打开Q-卷为主路径。不写诉状、不指导违法取证、不代提交是交付禁令不是负触发，未知不写零。"
