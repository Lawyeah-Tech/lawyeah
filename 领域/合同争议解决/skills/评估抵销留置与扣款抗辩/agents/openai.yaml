interface:
  display_name: "评估抵销留置与扣款抗辩"
  short_description: "抵留闸与DX#草案；抵销须通知到达，扣款不是当然抵销，留置须合法占有"
  default_prompt: "使用 $评估抵销留置与扣款抗辩，在单方无冲突立场下形成中国大陆一般合同抵留评估草案：抵留闸、主体与强制接口、Q#路径、DX#抵留行（两债或占有切片/种类品质到期与主体对应/法定约定抵销与通知到达/禁止抵销或扣款成就/留置占有与同一法律关系接口/E#）。开闸材料是可编号两债或合法占有碎片，不是口头已经抵掉了或扣了就算抵销。抵留闸打开不等于已抵销不等于通知已到达不等于留置已成立不等于扣款已合法。抵销须通知到达。已读不是到达。扣款不是当然抵销。留置须合法占有动产。提存不是抵销。错误主张不关窗：未通知即已抵销、已读即到达、扣款即当然抵销、持有即留置、提存即抵销、九民溯及、未知写零，只关对应格，闸已开仍出其他DX#。类案只比较差异。双方秘密、伪造抵销通知或扣款凭证或占有、倒签到达日、教唆隐匿留置物、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出DX#终稿。本窗闸名只能是抵留闸，禁止复用抵销闸、留置闸、扣款闸、抗辩闸、履抗闸。预留不得占用立案闸。主行只能是DX#，禁止LK#、Set#、ZX#、DL#、A#。主路径只用Q-销，禁止Q-抵、Q-扣、Q-留、Q-抗、Q-持、Q-签作主路径。邻窗Q-销只作转介进本窗本窗打开为主路径不是已抵销。不代发送、不写变卖方案是交付禁令不是负触发，未知不写零。"
