interface:
  display_name: "评估争议中的格式条款"
  short_description: "格式闸与GS#草案；未提示说明不是当然无效，勾选不是已经提示说明"
  default_prompt: "使用 $评估争议中的格式条款，在单方无冲突立场下形成中国大陆一般合同格式条款评估草案：格式闸、主体与强制接口、Q#路径、GS#格式条款行（条款切片/格式定性/重大利害异常/提示说明与是否成为内容/无效不利解释接口/E#）。开闸材料是可编号争议条款碎片，不是口头签了就算提示。格式闸打开不等于已构成格式不等于已提示说明不等于不成为内容不等于条款已无效。未提示说明不是当然无效。有歧义不是一律不利提供方。非格式条款优先不是非格式当然有效。签名或勾选不是已经提示说明。政府示范不是当然非格式。错误主张不关窗：未提示即当然无效、有歧义即一律不利提供方、勾选即已提示、示范即非格式、已协商修改仍当然格式、对我们不利即当然无效、未知写零，只关对应格，闸已开仍出其他GS#。类案只比较差异。双方秘密、伪造提示记录、倒签勾选、隐匿文本、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出GS#终稿。本窗闸名只能是格式闸，禁止复用解释闸、提示闸、成立闸、争议闸。预留不得占用立案闸。主行只能是GS#，禁止JX#、SY#、CL#、A#。主路径只用Q-格，禁止Q-释、Q-契、Q-总、Q-签作主路径。邻窗Q-格只作转介进本窗本窗打开为主路径不是已提示。不重写格式文本、不给胜诉率是交付禁令不是负触发，未知不写零。"
