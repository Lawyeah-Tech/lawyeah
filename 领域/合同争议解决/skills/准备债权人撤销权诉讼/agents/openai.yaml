interface:
  display_name: "准备债权人撤销权诉讼"
  short_description: "撤诉闸与XQ#草案；草稿不是已提交，共同被告是债务人和相对人，除斥不是时效"
  default_prompt: "使用 $准备债权人撤销权诉讼，在单方无冲突立场下形成中国大陆一般合同撤销起诉材料草稿：撤诉闸、主体与强制接口、Q#路径、XQ#撤诉行（请求切片/原告适格与债务人相对人共同被告列法/管辖与仲裁接口/除斥一年五年与范围费用返还/证据目录处分对价明知与保全红旗/E#）。开闸材料是可编号债权人债权、处分行为或起诉决定碎片，不是口头今晚交出去或只告相对人。撤诉闸打开不等于已提交不等于已立案不等于已撤销成立不等于管辖已定。草稿不是已提交。评估不是已撤销成立。共同被告是债务人和相对人。除斥不是时效。错误主张不关窗：草稿即已提交、评估即已撤销成立、除斥即时效、只列一方仍可交终稿、此致某院即管辖已定、未知写零，只关对应格，闸已开仍出其他XQ#。范本只借栏目。双方秘密、伪造低价或无偿证据、倒签处分或除斥起算、虚假诉讼、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出XQ#终稿。本窗闸名只能是撤诉闸，禁止复用起诉闸、撤权闸、位诉闸、撤销闸。预留不得占用立案闸。主行只能是XQ#，禁止CQ#、WQ#、CX#、A#。主路径只用Q-撤诉，禁止Q-撤、Q-位诉、Q-诉、Q-签作主路径。邻窗Q-撤诉只作转介进本窗本窗打开为主路径不是已立案。不代提交、不选定法院是交付禁令不是负触发，未知不写零。"
