interface:
  display_name: "起草合同和解协议"
  short_description: "和解闸与HJ#草案；草稿不是已签署，口头谈拢不是已和解，单独和解不是已可强制执行"
  default_prompt: "使用 $起草合同和解协议，在单方无冲突立场下形成中国大陆一般合同发送前和解协议草稿：和解闸、主体与强制接口、Q#路径、HJ#和解行（标的切片/给付与了断范围/效力与执行力接口/撤回或违约后果/签署接口/E#）。开闸材料是可编号标的、给付或了断碎片，不是口头已经和解或微信说签了。和解闸打开不等于已签署不等于已和解不等于已可强制执行。草稿不是已签署。口头谈拢不是已和解。单独和解不是已可强制执行。概括弃权不是覆盖未知请求。打包了结不是分项已闭合。错误主张不关窗：草稿即已签署、口头即已和解、单独和解即已可强制执行、概括弃权覆盖未知、未知写零，只关对应格，闸已开仍出其他HJ#。双方秘密、伪造协议或签章、倒签签署日、伪造流水、以和解掩盖犯罪或逃废债务、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出HJ#终稿。本窗闸名只能是和解闸，禁止复用方案闸、谈判闸、发送闸、起诉闸、清理闸。预留不得占用立案闸、方案闸。主行只能是HJ#，禁止FA#、TP#、QT#、HF#、QL#、A#。主路径只用Q-和，禁止Q-方、Q-谈、Q-签、Q-诉、Q-函、Q-理作主路径。邻窗Q-和只作转介进本窗本窗打开为主路径不是已签署。公司治理起草股东和解同用和解闸HJ#Q-和本窗不得抄名册章证照列。不代签署、不保证司法确认是交付禁令不是负触发，未知不写零。"
