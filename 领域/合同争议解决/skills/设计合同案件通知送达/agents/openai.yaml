interface:
  display_name: "设计合同案件通知送达"
  short_description: "达证闸与CD#草案；已读不是到达，发出不是到达，微信转发不是发出，草稿不是已送达"
  default_prompt: "使用 $设计合同案件通知送达，在单方无冲突立场下形成中国大陆一般合同发送前通知送达设计草稿：达证闸、主体与强制接口、Q#路径、CD#达证行（文书种类接口/地址权源/渠道组合/回证形态/失败升级/E#）。开闸材料是可编号拟送文书种类或相对方、约定地址或系统碎片，不是口头微信已读就算到了。达证闸打开不等于已发出不等于已送达不等于已到达。已读不是到达。发出不是到达。微信转发不是发出。草稿不是已送达。拒收或退件不是当然已到达。民诉电子送达未经同意不得套民事到达。错误主张不关窗：已读即到达、发出即到达、微信转发即发出、草稿即已送达、拒收或退件即当然已到达、民诉电子送达未同意即民事到达、未知写零或唯一到达日，只关对应格，闸已开仍出其他CD#。双方秘密、伪造回证、已读截图充到达、倒签交寄或签收、隐匿退件、伪造物流、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出CD#终稿。本窗闸名只能是达证闸，禁止复用送达闸、到达闸、通知闸、发送闸、催告闸、电约闸。预留不得占用立案闸、和解闸。主行只能是CD#，禁止SD#、HF#、CG#、DY#、DZ#、HZ#、A#。主路径只用Q-道，禁止Q-送、Q-达、Q-函、Q-告、Q-电、Q-渠、Q-址、Q-签作主路径。邻窗Q-道只作转介进本窗本窗打开为主路径不是已到达。不写通知正文、不执行发送是交付禁令不是负触发，未知不写零。"
