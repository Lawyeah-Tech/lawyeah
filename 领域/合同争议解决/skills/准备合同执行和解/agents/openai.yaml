interface:
  display_name: "准备合同执行和解"
  short_description: "执和闸与TH#草案；草稿不是已记入笔录，私下和解不是已可强制执行，不履行可申请恢复"
  default_prompt: "使用 $准备合同执行和解，在单方无冲突的申请执行人或被执行立场下形成中国大陆一般合同发送前执行和解协议或笔录草稿：执和闸、主体与强制接口、Q#路径、TH#执和行（执行案与名义切片/分期或抵债方案/弃权边界/违约恢复执行/抵债物权属与负担/E#）。开闸材料是可编号执行案号、执行通知或裁定、已生效名义碎片，不是口头今晚签了就能停执行。执和闸打开不等于已签署不等于已记入笔录不等于已中止不等于已终结不等于新执行名义。草稿不是已记入笔录。口头不是已执行和解。私下和解不是已可强制执行。执行外和解不是当然中止。不履行可申请恢复原生效文书，已履行部分扣除，不是自动恢复。分期不是当然消灭执行名义。沉默不是放弃已生效债权。以物抵债协议不是法院必须作出以物抵债裁定。代理人代为执行和解须特别授权。错误主张不关窗：草稿即已记入笔录、私下即已可强制执行、口头即已执和、不履行不可恢复、沉默即弃权、分期即消灭名义、以物抵债即裁定或已过户、保证中止、未知写零，只关对应格，闸已开仍出其他TH#。范本只借执行和解协议、执行和解笔录栏目。双方秘密、隐匿转移、以执和逃废、伪造笔录或签章、倒签和解日、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出TH#终稿。本窗闸名只能是执和闸，禁止复用和解闸、执行闸、应执闸、力补闸、调解闸、方案闸。预留不得占用立案闸、保全闸、执行闸、应执闸。主行只能是TH#，禁止HJ#、ZE#、YE#、QF#、FA#、A#。主路径只用Q-执和，禁止Q-执、Q-执申、Q-应执、Q-和、Q-力、Q-签作主路径。邻窗Q-执和只作转介进本窗本窗打开为主路径不是已记入笔录。不代提交、不保证中止或终结、不提供隐匿转移方案是交付禁令不是负触发，未知不写零。"
