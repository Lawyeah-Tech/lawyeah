interface:
  display_name: "应对合同案件执行"
  short_description: "应执闸与YE#草案；草稿不是已提出，申请异议不是已停止执行，实体不服不是执行异议"
  default_prompt: "使用 $应对合同案件执行，在单方无冲突的被执行立场下形成中国大陆一般合同发送前执行应对草稿：应执闸、主体与强制接口、Q#路径、YE#应执行（执行案与措施切片/名义与已履行对照/行为异议／书面与期限/超标的或豁免主张/报告财产／履行或执和接口/E#）。开闸材料是可编号执行通知、执行裁定、查封扣押冻结扣划通知、报告财产令、执行案号或协助执行碎片，不是口头收到执行了或异议交了就算停了。应执闸打开不等于已提出不等于已提交不等于已停止执行不等于豁免已准许。草稿不是已提出。已读不是已送达。网交不是已提交。申请异议不是已停止执行。实体不服不是执行异议。超标的不是当然全部解除。生活必需住房可以查封但不得拍卖，不是当然豁免。未报告不是当然拒执刑责闭集。执行和解违约一般可恢复原生效文书执行。错误主张不关窗：草稿即已提出、申请异议即已停止执行、实体不服即执行异议、超标的即当然全部解除、生活住房当然豁免、未报告即当然拒执刑责、执和违约不可恢复、保证停止执行、未知写零，只关对应格，闸已开仍出其他YE#。范本只借执行异议申请书、复议申请书、报告财产表栏目。双方秘密、隐匿转移或毁损被查封财产、虚假报告、伪造异议或送达回证、倒签提出日、违法取证、指导拒执第一次即整体停止，不得选边。闸关仍交十节，第6节不出YE#终稿。本窗闸名只能是应执闸，禁止复用执行闸、执申闸、不执闸、执和闸、保全闸、冻结闸、应保闸、答辩闸、应对闸。预留不得占用立案闸、保全闸、执行闸、执和闸。主行只能是YE#，禁止ZE#、ZX#、FZ#、BZ#、YC#、NS#、TH#、NZ#、A#。主路径只用Q-应执，禁止Q-执、Q-执申、Q-不执、Q-冻、Q-保、Q-应、Q-辩、Q-签作主路径。邻窗Q-应执只作转介进本窗本窗打开为主路径不是已提出。不代提交、不出执和终稿、不保证停止执行、不提供隐匿转移方案是交付禁令不是负触发，未知不写零。案外人执行异议之诉、复杂追加、拒执刑责终稿主成果unavailable。"
