interface:
  display_name: "申请律师调查令或法院调查取证"
  short_description: "调令闸与DC#草案；申请不是已准许，草稿不是已调取，律师调查令不是搜查证"
  default_prompt: "使用 $申请律师调查令或法院调查取证，在单方无冲突立场下形成中国大陆一般合同发送前调查令或法院调查取证申请草稿：调令闸、主体与强制接口、Q#路径、DC#调令行（对象切片/不能自行收集原因/律师调查令或法院调查分流/范围与禁止动作/申请接口/E#）。开闸材料是可编号第三方对象或不能自行收集碎片，不是口头今晚把对方账户全掏出来。调令闸打开不等于已准许不等于已签发不等于已调取。申请不是已准许。草稿不是已调取。律师调查令不是搜查证，不是全国统一立法。律师有权调查收集不是调查令已立法。对方控制不是内容有利。范围最小化。错误主张不关窗：申请即已准许、草稿即已调取、对方控制即内容有利、调查令即搜查证、超范围隐私、未知写零，只关对应格，闸已开仍出其他DC#。双方秘密、购买数据、侵入系统、偷拷、变造令文、违法调取个人信息、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出DC#终稿。本窗闸名只能是调令闸，禁止复用调查闸、证据闸、现证闸、举证闸、申鉴闸。预留不得占用立案闸、和解闸、调查闸。主行只能是DC#，禁止JE#、XZ#、JQ#、DL#、DY#、A#。主路径只用Q-调令，禁止Q-据、Q-现、Q-调、Q-令、Q-取、Q-查、Q-签作主路径。邻窗Q-调令只作转介进本窗本窗打开为主路径不是已调取。不保证签发、不代提交是交付禁令不是负触发，未知不写零。"
