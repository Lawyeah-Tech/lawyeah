interface:
  display_name: "办理合同和解执行力补强"
  short_description: "力补闸与QF#草案；单独和解不是已可强制执行，申请不是已裁定，赋强不是证据保全公证"
  default_prompt: "使用 $办理合同和解执行力补强，在单方无冲突立场下形成中国大陆一般合同发送前执行力补强手续草稿：力补闸、主体与强制接口、Q#路径、QF#力补行（名义切片/路径分流司法确认／公证赋强／调解书/给付是否确定/申请接口/失败分流/E#）。开闸材料是可编号给付和解碎片或路径前提，不是口头签了就能强制执行。力补闸打开不等于已提交不等于已裁定不等于已赋强不等于已出调解书不等于已可强制执行。单独和解不是已可强制执行。申请不是已裁定。赋强不是证据保全公证。私下微信和解不是人民调解协议。给付不确定不是可赋强。错误主张不关窗：单独和解即已可强制执行、申请即已裁定、赋强即证据保全公证、私下微信即人民调解、未知写零、此致某院即管辖已定，只关对应格，闸已开仍出其他QF#。双方秘密、伪造调解组织、伪造赋强承诺、倒签调解或公证日、以确认或赋强掩盖犯罪或逃废债务、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出QF#终稿。本窗闸名只能是力补闸，禁止复用和解闸、方案闸、公证闸、补强闸。预留不得占用立案闸、和解闸、方案闸、公证闸。主行只能是QF#，禁止HJ#、FA#、GD#、Pth#、LB#、A#。主路径只用Q-力，禁止Q-和、Q-方、Q-公、Q-执、Q-赋、Q-强、Q-签作主路径。邻窗Q-力只作转介进本窗本窗打开为主路径不是已可执行。不代申请、不保证确认是交付禁令不是负触发，未知不写零。"
