interface:
  display_name: "测算违约金与损害赔偿"
  short_description: "精算闸与SJ#草案；约定数字不是必得，过分高于对照损失不是合同总价，未知不写零"
  default_prompt: "使用 $测算违约金与损害赔偿，在单方无冲突立场下形成中国大陆分项测算草案：精算闸、主体与强制接口、Q#路径、SJ#测算行（项目切片/性质与事件/参数与未舍入公式/已付/扣减/互斥/调整接口/E#）。开闸材料是可编号条款数字、付款、损失或缺口，不是口头必须赔多少。精算闸打开不等于已违约不等于约定金必得不等于调整已确定。约定数字不是必得。过分高于对照损失不是合同总价。增减须当事人请求。未知不写零。定金与违约金选用不明两项待核不双计。服务合同不得直接套买卖解释第二十条。本任务不认定违约已经成立。错误主张不关窗：约定金即必得、总价百分之三十即过分高于、未知写零、测算即违约已成立、定金违约金双计，只关对应格，闸已开仍出其他SJ#。类案只比较差异。双方秘密、伪造流水、虚增损失、隐匿已收款第一次即整体停止，不得选边。闸关仍交十节，第6节不出SJ#终稿。本窗闸名只能是精算闸，禁止复用争议闸、发送闸、测算闸。预留不得占用立案闸。主行只能是SJ#，禁止JS#、DJ#、M#、A#。主路径只用Q-测，禁止Q-总、Q-告、Q-函、Q-诉作主路径。邻窗Q-测只作转介进本窗本窗打开为主路径不是已核实。不定违约已成立、不给必得总额、不写诉状是交付禁令不是负触发，未知不写零。"
