interface:
  display_name: "申请不予执行仲裁裁决"
  short_description: "不执闸与BZ#草案；草稿不是已裁定不予执行，执行开始后才可能，相同事由交叉提通常不支持"
  default_prompt: "使用 $申请不予执行仲裁裁决，在单方无冲突被执行立场下形成中国大陆一般合同商事仲裁发送前不予执行申请草稿：不执闸、主体与强制接口、Q#路径、BZ#不执行（裁决切片/执行案与管辖接口/法定事由对照/交叉提禁令与中止接口/申请接口/E#）。开闸材料是可编号裁决碎片且有执行开始碎片，不是口头今晚卡住执行。不执闸打开不等于已提交不等于已裁定不予执行不等于已停止执行。草稿不是已裁定不予执行。执行开始后才可能。执行通知送达起十五日书面申请。已读不是送达起算。实体不服通常不足。撤销不是不予执行。相同事由交叉提通常不支持。不执须适当担保才应当中止执行，不保证停止处分。错误主张不关窗：草稿即已裁定、实体不服即应不予执行、相同事由交叉提、逾期仍可提交终稿、此致某中院即管辖已定、未知写零，只关对应格，闸已开仍出其他BZ#。双方秘密、伪造材料、倒签执行通知日、转移隐匿财产、虚假仲裁、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出BZ#终稿。本窗闸名只能是不执闸，禁止复用执行闸、撤裁闸、申请闸。预留不得占用立案闸、保全闸、执行闸、撤裁闸。主行只能是BZ#，禁止HC#、ZC#、HS#、A#。主路径只用Q-不执，禁止Q-撤裁、Q-执、Q-签作主路径。邻窗Q-不执只作转介进本窗本窗打开为主路径不是已裁定。不保证不予执行、不代提交是交付禁令不是负触发，未知不写零。"
