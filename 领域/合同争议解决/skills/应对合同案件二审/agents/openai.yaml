interface:
  display_name: "应对合同案件二审"
  short_description: "应上闸与BS#草案；草稿不是已答辩，不答辩不是当然败诉，答辩不是独立上诉"
  default_prompt: "使用 $应对合同案件二审，在单方无冲突的被上诉立场下形成中国大陆一般合同二审答辩草稿：应上闸、主体与强制接口、Q#路径、BS#应上行（上诉请求切片/送达与答辩期/审理范围／未上诉判项／独立上诉接口/事实法律程序答辩/新证据意见/E#）。开闸材料是可编号上诉状副本、二审应诉或答辩通知、案号或一审裁判加对方已上诉碎片，不是口头对方上诉了或微信已读就算送达。应上闸打开不等于已答辩不等于已提交不等于已送达不等于保证维持。草稿不是已答辩。已读不是已送达。微信转发不是法定送达。网交不是已提交。不提出答辩状不是当然败诉。逾期只停该提交稿不关窗。答辩不是独立上诉。判决十五日与裁定十日不是本窗答辩截止。已生效不是可普通二审答辩。未上诉部分不是当然全改。错误主张不关窗：草稿即已答辩、已读即已送达、网交即已提交、不答辩即败诉、答辩即独立上诉、过期仍要可提交、已生效仍当普通二审答辩、未上诉部分当然全改、保证维持、未知写零，只关对应格，闸已开仍出其他BS#。范本只借民事二审答辩状栏目。双方秘密、用上诉人未授权秘密、伪造或倒签答辩或送达回证、隐匿证据、虚假陈述、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出BS#终稿。本窗闸名只能是应上闸，禁止复用上诉闸、答辩闸、应裁闸、开庭闸、应诉闸、应对闸。预留不得占用立案闸、保全闸。主行只能是BS#，禁止HS#、SS#、DB#、YC#、KT#、YS#、ES#、A#。主路径只用Q-应上，禁止Q-上、Q-辩、Q-应、Q-开庭、Q-签作主路径。邻窗Q-应上只作转介进本窗本窗打开为主路径不是已答辩。不代提交、不出上诉状终稿、不保证维持是交付禁令不是负触发，未知不写零。"
