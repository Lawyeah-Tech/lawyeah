interface:
  display_name: "提起合同仲裁"
  short_description: "仲裁闸与ZC#草案；草稿不是已受理，口头约定不是书面协议，或裁或诉不是当然有效"
  default_prompt: "使用 $提起合同仲裁，在单方无冲突立场下形成中国大陆一般合同发送前商事仲裁申请包草稿：仲裁闸、主体与强制接口、Q#路径、ZC#申请行（请求切片/申请人适格与被申请人明确/书面协议与机构可确定/规则组庭与保全转交/证据目录与保全红旗/E#）。开闸材料是可编号请求、书面条款或机构碎片，不是口头已经受理了。仲裁闸打开不等于已提交不等于已受理不等于已组庭。草稿不是已受理。口头约定不是书面仲裁协议。或裁或诉不是当然有效。机构不明不是已可申请。有效仲裁不是应起诉。合同无效不是仲裁协议消灭。构成违约不是当然解除。未通知而申请仲裁主张解除，确认后自申请书副本送达时解除，不是受理日。五日审查不是保证受理。保全须机构转交法院不是已保全。错误主张不关窗：草稿即已受理、网交即已提交、口头即书面、或裁或诉当然有效、机构不明仍可申请、有效仲裁应起诉、合同无效即仲裁消灭、构成违约即当然解除、未知写零、此致某会即机构已定，只关对应格，闸已开仍出其他ZC#。双方秘密、伪造协议或签署页、倒签、隐匿不利条款、虚假仲裁、指导隐匿证据、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出ZC#终稿。本窗闸名只能是仲裁闸，禁止复用仲异闸、论坛闸、起诉闸、择径闸、支付闸、立案闸。预留不得占用立案闸、保全闸、应裁闸。主行只能是ZC#，禁止ZX#、QT#、LT#、XH#、ZS#、P#、A#。主路径只用Q-申，禁止Q-仲、Q-裁、Q-仲异、Q-诉、Q-坛、Q-督、Q-签作主路径。邻窗Q-申只作转介进本窗本窗打开为主路径不是已受理。不保证受理、不代提交是交付禁令不是负触发，未知不写零。"
