interface:
  display_name: "提起合同纠纷一审"
  short_description: "起诉闸与QT#草案；草稿不是已立案，网交不是已受理，有效仲裁不是应起诉"
  default_prompt: "使用 $提起合同纠纷一审，在单方无冲突的拟起诉立场下形成中国大陆一般合同纠纷一审起诉包草案：起诉闸、主体与强制接口、Q#路径、QT#诉状行（请求切片/原告适格与被告明确/仲裁阻却与排除/管辖连结点/证据目录与保全红旗/E#）。开闸材料是可编号原告适格、请求类型或合同碎片，不是口头已经立案或某院一定管。起诉闸打开不等于已立案不等于已提交不等于已受理不等于应起诉不等于管辖已定。草稿不是已立案。网交回执不是已受理。有效仲裁协议不是应起诉。构成违约不是当然解除。未通知而起诉主张解除，解除时点不是起诉当日。口头或已读不是已送达。此致某院不是管辖已定。错误主张不关窗：草稿即已立案、网交即已受理、有效仲裁仍应直接起诉、构成违约即当然解除、起诉当日即已解除、此致某院即管辖已定、约定金即必得、未知写零、七日立案已保证，只关对应格，闸已开仍出其他QT#。范本只借民事起诉状栏目。双方秘密、伪造诉状或连结点、倒签落款、隐匿仲裁条款、虚假诉讼、伪造送达、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出QT#终稿。本窗闸名只能是起诉闸，禁止复用立案闸、管辖闸、论坛闸、证据闸。预留不得占用立案闸。主行只能是QT#，禁止SZ#、P#、J#、LA#、A#。主路径只用Q-诉，禁止Q-管、Q-坛、Q-总、Q-辩、Q-签作主路径。邻窗Q-诉只作转介进本窗本窗打开为主路径不是已立案。不代提交、不选定法院、不保证立案是交付禁令不是负触发，未知不写零。"
