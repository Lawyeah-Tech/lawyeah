interface:
  display_name: "提出合同鉴定异议或重新鉴定"
  short_description: "鉴异闸与JI#草案；异议草稿不是已撤销鉴定意见，重新鉴定申请不是已启动，有缺陷可补正不是必须重鉴"
  default_prompt: "使用 $提出合同鉴定异议或重新鉴定，在单方无冲突立场下形成中国大陆一般合同发送前鉴定异议或重新鉴定申请草稿：鉴异闸、主体与强制接口、Q#路径、JI#鉴异行（意见切片/异议事由/出庭或补正/重新鉴定条件/申请接口/E#）。开闸材料是可编号已作出鉴定意见或异议事由碎片，不是口头这份鉴定废了。鉴异闸打开不等于已提出不等于已准许不等于已撤销意见不等于已重新鉴定。异议草稿不是已撤销鉴定意见。重新鉴定申请不是已启动新鉴定。有缺陷可补正不是必须重新鉴定。拒不出庭不得作为认定根据不是当然已准许重鉴。不预交出庭费用视为放弃异议不是实体已败诉。错误主张不关窗：异议即已撤销、申请即已准许、申请即已启动重新鉴定、瑕疵即必须重鉴、未知写零、此致某所即已委托，只关对应格，闸已开仍出其他JI#。双方秘密、伪造反鉴定、收买鉴定人、调包检材、倒签异议日、隐匿不利意见、未授权破坏性取样、违法取证、自行重做鉴定冒充法院委托第一次即整体停止，不得选边。闸关仍交十节，第6节不出JI#终稿。本窗闸名只能是鉴异闸，禁止复用申鉴闸、鉴定闸、异议闸、解异闸、质量闸。预留不得占用立案闸、和解闸、鉴定闸、申鉴闸。主行只能是JI#，禁止JA#、JD#、GY#、YY#、JY#、YJ#、A#。主路径只用Q-鉴异，禁止Q-申鉴、Q-鉴、Q-异、Q-解异、Q-疵、Q-重、Q-签作主路径。邻窗Q-鉴异只作转介进本窗本窗打开为主路径不是已准许。不重新做鉴定意见、不保证准许、不代提交是交付禁令不是负触发，未知不写零。"
