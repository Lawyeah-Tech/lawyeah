interface:
  display_name: "提起情势变更变更或解除之诉"
  short_description: "情诉闸与QY#草案；通知不是解除，商业风险不是情势，请求变更不是法院可径行解除"
  default_prompt: "使用 $提起情势变更变更或解除之诉，在单方无冲突立场下形成中国大陆一般合同情势变更形成之诉材料草稿：情诉闸、主体与强制接口、Q#路径、QY#情诉行（请求切片/原告适格与被告明确/管辖与仲裁接口/再交涉与变更解除互斥时点/证据目录重大变化商业风险排除与保全红旗/E#）。开闸材料是可编号原告适格、重大变化碎片或起诉决定碎片，不是口头今晚交出去或发个通知就算解除。情诉闸打开不等于已提交不等于已立案不等于已改约不等于已解除不等于应起诉不等于管辖已定。草稿不是已提交。通知不是解除。商业风险不是情势。请求变更不是法院可径行解除。立案日不是变更或解除时点。排除第五百三十三条特约不是有效。错误主张不关窗：草稿即已提交、通知即解除、商业风险即情势、请求变更即径行解除、立案日即变更时点、排除特约有效、此致某院即管辖已定、未知写零，只关对应格，闸已开仍出其他QY#。范本只借民事起诉状栏目。双方秘密、伪造指数或疫情政策证明、倒签再交涉或落款、虚假诉讼、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出QY#终稿。本窗闸名只能是情诉闸，禁止复用起诉闸、变故闸、变约闸、解除闸、确诉闸、情势闸。预留不得占用立案闸。主行只能是QY#，禁止QT#、WG#、BY#、JC#、QR#、QS#、A#。主路径只用Q-情诉，禁止Q-诉、Q-故、Q-变、Q-除、Q-签作主路径。邻窗Q-情诉只作转介进本窗本窗打开为主路径不是已立案。不代提交、不选定法院是交付禁令不是负触发，未知不写零。"
