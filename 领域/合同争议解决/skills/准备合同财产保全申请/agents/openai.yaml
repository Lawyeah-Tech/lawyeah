interface:
  display_name: "准备合同财产保全申请"
  short_description: "申保闸与SB#草案；草稿不是已裁定，担保不是已保全，线索不是已冻结，不抢保全闸BQ#Q-保"
  default_prompt: "使用 $准备合同财产保全申请，在单方无冲突立场下形成中国大陆一般合同发送前财产保全申请草稿：申保闸、主体与强制接口、Q#路径、SB#申保行（措施切片/标的与范围/担保/线索/管辖接口/E#）。开闸材料是可编号拟保全对象碎片，不是口头先冻住或一定会准。申保闸打开不等于已裁定不等于已冻结不等于担保已足额。草稿不是已裁定。担保不是已保全。线索不是已冻结。口头紧急不是四十八小时已裁。诉前三十日不是已起诉。此致某院不是管辖已定。错误主张不关窗：草稿即已裁定、担保即已保全、线索即已冻结、口头紧急即四十八小时已裁、三十日即已起诉、此致某院即管辖已定、保证准许、未知写零，只关对应格，闸已开仍出其他SB#。双方秘密、虚构紧急、伪造转移迹象或担保或线索、倒签申请日、指导隐匿或转移对方财产、查封无关生活必需且拒绝限缩、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出SB#终稿。本窗闸名只能是申保闸，禁止复用保全闸、要保闸、冻结闸、现证闸、封存闸。预留不得占用立案闸、和解闸、保全闸。主行只能是SB#，禁止BQ#、YB#、FZ#、XZ#、FC#、CB#、NS#、A#。主路径只用Q-申保，禁止Q-保、Q-要、Q-冻、Q-账、Q-现、Q-申、Q-诉、Q-签作主路径。邻窗Q-保只作转介进本窗本窗不打开Q-保为主路径改走Q-申保。不保证裁定、不代提交是交付禁令不是负触发，未知不写零。先予执行与行为保全申请主成果unavailable。"
