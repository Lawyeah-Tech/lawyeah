interface:
  display_name: "申请撤销仲裁裁决"
  short_description: "撤裁闸与HC#草案；草稿不是已撤销，三个月除斥不是时效，实体不服通常不足"
  default_prompt: "使用 $申请撤销仲裁裁决，在单方无冲突立场下形成中国大陆一般合同商事仲裁发送前撤销申请草稿：撤裁闸、主体与强制接口、Q#路径、HC#撤裁行（裁决切片/送达与撤销期/法定事由对照/中院管辖与重新仲裁接口/申请接口/E#）。开闸材料是可编号裁决书或收到日碎片，不是口头裁决不公今晚交出去。撤裁闸打开不等于已提交不等于已撤销。草稿不是已撤销。三个月除斥不是时效。已读不是收到起算。实体不服通常不足。未获通知不是国内闭集。撤销不是不予执行。驳回后再以相同事由交叉提通常不支持。错误主张不关窗：草稿即已撤销、六个月仍现行、实体不服即应撤销、逾期仍可提交终稿、此致某中院即管辖已定、未知写零，只关对应格，闸已开仍出其他HC#。双方秘密、伪造裁决或程序材料、倒签收到日、虚假仲裁、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出HC#终稿。本窗闸名只能是撤裁闸，禁止复用撤销闸、撤权闸、撤诉闸、仲裁闸、上诉闸。预留不得占用立案闸、保全闸、不执闸。主行只能是HC#，禁止CC#、ZC#、HS#、XQ#、CQ#、A#。主路径只用Q-撤裁，禁止Q-撤、Q-撤诉、Q-申、Q-上、Q-裁、Q-签作主路径。邻窗Q-撤裁只作转介进本窗本窗打开为主路径不是已撤销。不保证撤销、不代提交是交付禁令不是负触发，未知不写零。"
