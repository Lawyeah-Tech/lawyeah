interface:
  display_name: "准备质量或损失鉴定申请"
  short_description: "申鉴闸与JA#草案；申请不是已出具鉴定意见，单方委托不是法院委托，抽样破坏须先公证现状"
  default_prompt: "使用 $准备质量或损失鉴定申请，在单方无冲突立场下形成中国大陆一般合同发送前鉴定申请草稿：申鉴闸、主体与强制接口、Q#路径、JA#申鉴行（鉴定切片/事项/检材/机构与启动/申请接口/E#）。开闸材料是可编号待鉴定事项或检材碎片，不是口头写一份对方全责的鉴定。申鉴闸打开不等于已委托不等于已准许不等于已出具。申请不是已出具鉴定意见。单方委托不是法院委托。评估报告不是司法鉴定。法律评价不是鉴定事项。破坏性检测须授权，抽样破坏须先公证现状。错误主张不关窗：申请即已出具、单方委托即法院委托、评估报告即司法鉴定、未知写零、此致某所即已委托，只关对应格，闸已开仍出其他JA#。双方秘密、伪造检材、调包送检、倒签取样日、破坏现场、未授权破坏性取样、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出JA#终稿。本窗闸名只能是申鉴闸，禁止复用鉴定闸、质量闸、现证闸、公证闸、精算闸。预留不得占用立案闸、和解闸、鉴定闸、鉴异闸。主行只能是JA#，禁止JD#、ZL#、XZ#、GD#、SJ#、A#。主路径只用Q-申鉴，禁止Q-鉴、Q-疵、Q-现、Q-公、Q-测、Q-签作主路径。邻窗Q-鉴只作转介进本窗本窗不打开Q-鉴为主路径改走Q-申鉴。不预测意见、不代提交是交付禁令不是负触发，未知不写零。"
