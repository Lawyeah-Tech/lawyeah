interface:
  display_name: "规划举证期限与证据交换"
  short_description: "举证闸与JQ#草案；逾期不是当然失权，协商期限须法院准许，网交回执不是已交换"
  default_prompt: "使用 $规划举证期限与证据交换，在单方无冲突立场下形成中国大陆一般合同已立案案件的举证期限与交换计划草案：举证闸、主体与强制接口、Q#路径、JQ#举证行（通知切片/指定期限与起算/目录与待证绑定/逾期与补证/交换方式与回证/E#）。开闸材料是可编号举证通知、指定期限、待交换目录或逾期风险碎片，不是口头逾期了也必须全收。举证闸打开不等于已交换不等于已提交不等于已失权不等于已质证。逾期不是当然失权。协商期限须法院准许。不得一律十五日或三十日。作出日不是送达日。已读不是送达起算。网交回执不是已交换。目录不是已质证。延长须届满前书面。错误主张不关窗：逾期即当然失权、口头协商即已改期、一律十五日或三十日、作出日即送达起算、已读或网交即已交换、目录即已质证、计划即已提交、未知写零，只关对应格，闸已开仍出其他JQ#。双方秘密、伪造逾期理由、伪造新发现、隐匿证据、倒签提交日、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出JQ#终稿。本窗闸名只能是举证闸，禁止复用期间闸、证据闸、时线闸、交换闸、举期闸。预留不得占用立案闸、和解闸、期间闸、证据闸、时线闸、鉴异闸。主行只能是JQ#，禁止JE#、QJ#、SX#、JZ#、JH#、ZQ#、A#。主路径只用Q-举证，禁止Q-举、Q-期、Q-据、Q-历、Q-换、Q-交、Q-证、Q-签作主路径。邻窗Q-举证只作转介进本窗本窗打开为主路径不是已交换。不代提交、不保证采纳是交付禁令不是负触发，未知不写零。规划类禁止用search_template顶第四槽。"
