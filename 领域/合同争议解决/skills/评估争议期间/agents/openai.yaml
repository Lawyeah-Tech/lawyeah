interface:
  display_name: "评估争议期间"
  short_description: "期间闸与QJ#草案；除斥不是诉讼时效，已读不是起算，禁止唯一截止日"
  default_prompt: "使用 $评估争议期间，在单方无冲突立场下形成中国大陆一般合同期间评估草案：期间闸、主体与强制接口、Q#路径、QJ#期间行（期间类型切片/起算事件/中断中止或除斥并行/届满风险/效力接口/E#）。开闸材料是可编号请求、解除事由、检验或催告碎片，不是口头已经过了或最晚哪天起诉。期间闸打开不等于已届满不等于已中断不等于除斥已消灭不等于法院将主动审查。除斥不是诉讼时效。已读不是起算。签收不是验收。约定催告期不是法定除斥。质保期不是检验异议期。法院不主动审查时效。错误主张不关窗：除斥当时效、唯一截止日、已读即起算、签收即验收、催告期即法定除斥、法院主动审查时效、未知写零，只关对应格，闸已开仍出其他QJ#。类案只比较差异。双方秘密、伪造催告或检验通知、倒签期间起算日、隐匿送达、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出QJ#终稿。本窗闸名只能是期间闸，禁止复用时效闸、期限闸、解除闸、争议闸。预留不得占用立案闸。主行只能是QJ#，禁止ZT#、JC#、A#。主路径只用Q-期，禁止Q-时、Q-日、Q-总、Q-除、Q-签作主路径。本窗Q-时只作除斥当时效不关窗码。本窗Q-日只作唯一截止日不关窗码。不写唯一截止日、不给胜诉率是交付禁令不是负触发，未知不写零。"
