interface:
  display_name: "评估价款结算与发票争议"
  short_description: "结算闸与ZP#草案；对账单不是当然改约，发票不是当然结算，质保金扣留不是当然抵销"
  default_prompt: "使用 $评估价款结算与发票争议，在单方无冲突立场下形成中国大陆一般合同结算评估草案：结算闸、主体与强制接口、Q#路径、ZP#账票行（批次切片/约定价与已付/付款条件与发票牵连/对账确认效力/质保金扣款抗辩接口/E#）。开闸材料是可编号价款、对账、发票、质保金或付款碎片，不是口头对过账就算结了或开了票就算付了。结算闸打开不等于已结算不等于已付款不等于已改约不等于已抵销。对账单不是当然改约。发票不是当然结算也不是当然已付款。未开票不是当然拒付全部。质保金扣留不是当然抵销。错误主张不关窗：对账单即改约、发票即已结算或已付款、质保金扣留即抵销、未开票即拒付全部、沉默即确认、未知写零，只关对应格，闸已开仍出其他ZP#。类案只比较差异。双方秘密、伪造对账单或发票或流水、虚开、隐匿已付款或已开票、倒签对账日或开票日、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出ZP#终稿。本窗闸名只能是结算闸，禁止复用对账闸、发票闸、抵留闸、精算闸、金罚闸。预留不得占用立案闸。主行只能是ZP#，禁止JS#、DJ#、SJ#、DN#、SH#、DX#、A#。主路径只用Q-票，禁止Q-对、Q-结、Q-测、Q-销、Q-签作主路径。邻窗Q-票只作转介进本窗本窗打开为主路径不是已结算。不定已结清、不写催收函是交付禁令不是负触发，未知不写零。"
