interface:
  display_name: "准备合同案件公证保全"
  short_description: "公证闸与GD#草案；草稿不是已公证，哈希不是已公证，公证不是必然可采"
  default_prompt: "使用 $准备合同案件公证保全，在单方无冲突立场下形成中国大陆一般合同发送前公证申请与提纲草稿：公证闸、主体与强制接口、Q#路径、GD#公证行（公证切片/事项/机构与预约/检材／操作提纲/鉴定／法院证据保全／送达分流/E#）。开闸材料是可编号待公证事项或检材碎片，不是口头已经截过图或哈希就算公证。公证闸打开不等于已公证不等于已出证不等于必然可采。草稿不是已公证。哈希不是已公证。截图不是原件。检材不是公证效力。申请不是已出证。公证不是必然可采。送达过程公证不是已到达。鉴定性判断不属公证。错误主张不关窗：草稿即已公证、哈希即已公证、截图即原件、检材即公证效力、申请即已出证、公证即必然可采或不可推翻、未知写零，只关对应格，闸已开仍出其他GD#。双方秘密、伪造过程、倒签提取日或公证日、预先打开污染现场、补拍不存在页面、盗号侵入、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出GD#终稿。本窗闸名只能是公证闸，禁止复用现证闸、固证闸、申保闸、鉴定闸、公保闸。预留不得占用立案闸、和解闸、保全闸、鉴定闸。主行只能是GD#，禁止XZ#、GZ#、GN#、JE#、A#。主路径只用Q-公，禁止Q-现、Q-据、Q-证、Q-道、Q-固、Q-签作主路径。邻窗Q-公只作转介进本窗本窗打开为主路径不是已公证。不代替鉴定、不保证效力、不代办理是交付禁令不是负触发，未知不写零。"
