interface:
  display_name: "选择合同违约与侵权竞合路径"
  short_description: "竞合闸与JH#草案；择一不是已胜诉，同一损失不得双份重复索赔"
  default_prompt: "使用 $选择合同违约与侵权竞合路径，在单方无冲突立场下形成中国大陆一般合同竞合路径草案：竞合闸、主体与强制接口、Q#路径、JH#竞合行（损害切片/择一范围与并行分界/违约路径成立与效果/侵权路径成立与效果/时效管辖仲裁与填平接口/E#）。开闸材料是可编号同一事实与相对方碎片，不是口头两份都要拿或选了就算赢了。竞合闸打开不等于已选定不等于已胜诉不等于已立案不等于双份可赔。择一不是已胜诉。同一损失不得双份重复索赔。选违约不是当然不得精神损害。选侵权不是当然避开仲裁。错误主张不关窗：双份全额、选择即已胜诉、选侵权当然避开仲裁、违约当然不赔精神损害、纯金钱迟延即独立侵权、未知写零，只关对应格，闸已开仍出其他JH#。类案只比较差异。双方秘密、伪造合同或损失、倒签、隐匿路径、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出JH#终稿。本窗闸名只能是竞合闸，禁止复用选择闸、侵权闸、精算闸、争议闸。预留不得占用立案闸。主行只能是JH#，禁止SJ#、ZT#、JJ#、A#。主路径只用Q-择，禁止Q-合、Q-竞、Q-违、Q-侵、Q-签作主路径。邻窗Q-择只作转介进本窗本窗打开为主路径不是已选定。不写诉状、不双份索赔是交付禁令不是负触发，未知不写零。"
