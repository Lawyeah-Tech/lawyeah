interface:
  display_name: "应对合同仲裁"
  short_description: "应裁闸与YC#草案；草稿不是已答辩，应裁不是放弃协议异议，不答辩不是当然败诉"
  default_prompt: "使用 $应对合同仲裁，在单方无冲突的被申请立场下形成中国大陆一般合同商事仲裁首次应裁草稿：应裁闸、主体与强制接口、Q#路径、YC#应裁行（请求切片/送达与期限接口/协议异议接口/实体抗辩/反请求接口/E#）。开闸材料是可编号申请书副本、受理或答辩通知、组庭或开庭通知或案号碎片，不是口头已经被裁或微信已读就算送达。应裁闸打开不等于已答辩不等于已提交不等于已送达不等于已放弃协议异议。草稿不是已答辩。已读不是已送达。微信转发不是法定送达。网交不是已提交。未提交答辩书不是当然败诉。逾期只停该提交稿不关窗。应裁本身不是放弃协议异议，但须在仲裁庭首次开庭前单独提出。民诉答辩十五日不是本窗截止，也不是仲裁异议截止。第三十七条是法院应诉条不是本窗异议截止。选定仲裁员不是当然弃权。构成违约不是当然解除。合同无效不是仲裁协议消灭。错误主张不关窗：草稿即已答辩、已读即已送达、网交即已提交、不答辩即败诉、应裁即放弃异议、民诉十五日即本窗截止、第三十七条即仲裁庭异议截止、过期仍要可提交有效异议终稿、保证驳回、未知写零，只关对应格，闸已开仍出其他YC#。范本只借仲裁答辩书栏目。双方秘密、用申请方未授权秘密、伪造或倒签答辩或送达回证、隐匿证据、虚假陈述、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出YC#终稿。本窗闸名只能是应裁闸，禁止复用答辩闸、应诉闸、应对闸、仲裁闸、仲异闸、开庭闸、撤裁闸、不执闸。预留不得占用立案闸、保全闸。主行只能是YC#，禁止DB#、ZC#、ZX#、KT#、HC#、BZ#、A#。主路径只用Q-应裁，禁止Q-辩、Q-应、Q-申、Q-开庭、Q-仲异、Q-签作主路径。邻窗Q-应裁只作转介进本窗本窗打开为主路径不是已答辩。不代提交、不出反请求终稿、不出仲异终稿是交付禁令不是负触发，未知不写零。"
