interface:
  display_name: "准备合同反诉或仲裁反请求"
  short_description: "反状闸与FT#草案；草稿不是已提起，评估不是已提起，无牵连不是可提交终稿"
  default_prompt: "使用 $准备合同反诉或仲裁反请求，在单方无冲突的反诉原告或反请求申请人立场下形成中国大陆一般合同发送前反诉状或仲裁反请求草稿：反状闸、主体与强制接口、Q#路径、FT#反状行（反诉或反请求切片/当事人与本诉对应/牵连覆盖/期间与规则期限/证据目录接口/E#）。开闸材料是可编号拟反请求切片、本诉起诉状、应诉通知、仲裁申请书副本或案号，不是口头已经决定反了。反状闸打开不等于已提起不等于已受理不等于已提交。草稿不是已提起。网交不是已提交。评估不是已提起。无牵连不是可提交终稿。答辩期满不是当然失权。辩论结束前才是一审合并窗口。民诉十五日不是仲裁反请求截止。二审反诉不是当然一并。提出反诉可能构成应诉管辖，不是当然放弃仲裁。答辩与反诉必须分开成稿。错误主张不关窗：草稿即已提起、评估即已提起、无牵连仍要可提交、答辩期满即失权、二审当然一并、混成一份答辩终稿、未知写零，只关对应格，闸已开仍出其他FT#。范本只借民事反诉状、仲裁反请求申请书栏目。双方秘密、伪造牵连、倒签、把无关债塞进状稿且拒限缩、隐匿证据、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出FT#终稿。本窗闸名只能是反状闸，禁止复用反诉闸、反请求闸、答辩闸、应裁闸、起诉闸、决定闸。预留不得占用立案闸、保全闸、反诉闸。主行只能是FT#，禁止FQ#、FS#、DB#、YC#、QT#、A#。主路径只用Q-反请，禁止Q-反、Q-状、Q-辩、Q-应裁、Q-签作主路径。邻窗Q-反请只作转介进本窗本窗打开为主路径不是已提起。不代提交、不保证准许是交付禁令不是负触发，未知不写零。"
