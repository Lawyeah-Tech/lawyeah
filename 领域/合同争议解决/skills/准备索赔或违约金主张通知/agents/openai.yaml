interface:
  display_name: "准备索赔或违约金主张通知"
  short_description: "索赔闸与SH#草案；约定数字不是必得，过分高于对照损失不是合同总价，草稿不是已发送"
  default_prompt: "使用 $准备索赔或违约金主张通知，在单方无冲突主张方立场下形成中国大陆一般合同发送前索赔或违约金主张通知草稿：索赔闸、主体与强制接口、Q#路径、SH#索函行（项目切片/性质与请求/金额与假设/互斥与调整接口/渠道与回证/E#）。开闸材料是可编号金钱请求切片、条款数字或已付款碎片，不是口头今晚发索赔或约定多少就得多少。索赔闸打开不等于已发送不等于已到达不等于已违约不等于约定金必得不等于时效已中断。约定数字不是必得。过分高于对照损失不是合同总价。增减须当事人请求。草稿不是已发送。口头或已读不是已到达。错误主张不关窗：约定数字即必得、总价百分之三十即过分高于、草稿即已发送、已读即到达、索赔即违约已成立、发出即已中断时效、定金违约金双计、未知写零，只关对应格，闸已开仍出其他SH#。范本只借索赔函栏目。双方秘密、伪造流水或索赔函、虚增损失、倒签发出日、伪造送达、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出SH#终稿。本窗闸名只能是索赔闸，禁止复用催告闸、发送闸、精算闸、解除闸、起诉闸。预留不得占用立案闸。主行只能是SH#，禁止SJ#、JS#、DJ#、CG#、HF#、QT#、SP#、A#。主路径只用Q-索，禁止Q-测、Q-告、Q-函、Q-诉、Q-签作主路径。邻窗Q-索只作转介进本窗本窗打开为主路径不是已发送。不执行发送、不写精算终稿、不写起诉状是交付禁令不是负触发，未知不写零。"
