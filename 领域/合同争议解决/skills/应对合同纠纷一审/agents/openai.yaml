interface:
  display_name: "应对合同纠纷一审"
  short_description: "答辩闸与DB#草案；草稿不是已答辩，已读不是已送达，不答辩不是当然败诉"
  default_prompt: "使用 $应对合同纠纷一审，在单方无冲突的被告立场下形成中国大陆一般合同纠纷一审首次答辩草稿：答辩闸、主体与强制接口、Q#路径、DB#答辩行（请求切片/送达与期限接口/程序抗辩/实体抗辩/反诉接口/E#）。开闸材料是可编号起诉状、应诉通知、传票或案号碎片，不是口头已经被诉或微信已读就算送达。答辩闸打开不等于已答辩不等于已提交不等于已送达不等于应诉管辖已成立。草稿不是已答辩。已读不是已送达。微信转发不是法定送达。网交不是已提交。不提出答辩状不是当然败诉。逾期只停该提交稿不关窗。有效仲裁协议不是本案必审。构成违约不是当然解除。错误主张不关窗：草稿即已答辩、已读即已送达、网交即已提交、不答辩即败诉、过期仍要可提交、有效仲裁仍当本案必审、应诉即管辖已定、保证驳回、未知写零，只关对应格，闸已开仍出其他DB#。范本只借民事答辩状栏目。双方秘密、伪造或倒签答辩或送达回证、隐匿证据、虚假陈述、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出DB#终稿。本窗闸名只能是答辩闸，禁止复用应诉闸、起诉闸、立案闸、管辖闸。预留不得占用立案闸、起诉闸。主行只能是DB#，禁止QT#、K#、H#、A#。主路径只用Q-辩，禁止Q-应、Q-诉、Q-管、Q-签作主路径。邻窗Q-辩只作转介进本窗本窗打开为主路径不是已提交。不代提交、不选定法院、不出反诉终稿是交付禁令不是负触发，未知不写零。"
