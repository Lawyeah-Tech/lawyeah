interface:
  display_name: "评估债权转让与债务承担争议"
  short_description: "转承闸与RY#草案；转让须通知到达，加入不是免责，内部转债不是对债权人免责"
  default_prompt: "使用 $评估债权转让与债务承担争议，在单方无冲突立场下形成中国大陆一般合同转承评估草案：转承闸、主体与强制接口、Q#路径、RY#转承行（关系切片/可转让性或同意要件/通知到达或债权人同意/抗辩抵销延续/相对人与论坛接口/E#）。开闸材料是可编号基础债权、让与或承担或加入文本、通知或同意碎片，不是口头已经转给你了或内部已经换人。转承闸打开不等于已对债务人生效不等于已免责承担不等于加入已连带不等于抗辩已切断。转让须通知到达。已读不是到达。未通知不是对债务人生效也不是让与合同无效。加入不是免责承担。内部转债不是对债权人免责。错误主张不关窗：未通知即对债务人生效、已读即到达、内部转债即免责、加入即免责、未通知即让与合同无效、立案日即到达、未知写零，只关对应格，闸已开仍出其他RY#。类案只比较差异。双方秘密、伪造转让通知或同意或签收、倒签到达日、教唆隐匿通知、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出RY#终稿。本窗闸名只能是转承闸，禁止复用转让闸、承担闸、加入闸、抵留闸、变更闸。预留不得占用立案闸。主行只能是RY#，禁止CR#、TC#、ZR#、ZC#、DX#、A#。主路径只用Q-与，禁止Q-转、Q-让、Q-承、Q-移、Q-签作主路径。邻窗Q-与只作转介进本窗本窗打开为主路径不是已对债务人生效。不代发送、不写通知函是交付禁令不是负触发，未知不写零。"
