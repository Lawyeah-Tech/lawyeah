interface:
  display_name: "评估债权人撤销权"
  short_description: "撤权闸与CQ#草案；无偿不是当然已撤销，除斥不是时效，起诉状不是已撤销成立"
  default_prompt: "使用 $评估债权人撤销权，在单方无冲突立场下形成中国大陆一般合同撤权评估草案：撤权闸、主体与强制接口、Q#路径、CQ#撤权行（处分切片/到期合法确定与影响实现/无偿或明显不合理对价与相对人明知/除斥一年五年与范围费用返还/代位保全破产家事仲裁接口/E#）。开闸材料是可编号债权人债权与处分行为碎片，不是口头无偿就算能撤或起诉状交了就算撤了。撤权闸打开不等于已撤销成立不等于已胜诉不等于已立案。无偿不是当然已撤销。除斥不是时效。起诉状不是已撤销成立。百分之七十或百分之三十是一般认定不是唯一标准。错误主张不关窗：无偿即当然已撤销、除斥即时效、起诉状即已撤销成立、责任财产充足仍可撤、未知写零，只关对应格，闸已开仍出其他CQ#。类案只比较差异。双方秘密、伪造低价或无偿证据、倒签处分或除斥起算、隐匿责任财产、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出CQ#终稿。本窗闸名只能是撤权闸，禁止复用撤销闸、代权闸、起诉闸。预留不得占用立案闸。主行只能是CQ#，禁止DQ#、WQ#、A#。主路径只用Q-撤，禁止Q-位、Q-代、Q-诉、Q-签作主路径。邻窗Q-撤只作转介进本窗本窗打开为主路径不是已撤销成立。不写诉状、不代提交是交付禁令不是负触发，未知不写零。"
