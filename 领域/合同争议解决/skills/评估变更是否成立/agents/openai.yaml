interface:
  display_name: "评估变更是否成立"
  short_description: "变约闸与BY#草案；口头不是已改约，纪要不是当然变更，填补不是已改约"
  default_prompt: "使用 $评估变更是否成立，在单方无冲突立场下形成中国大陆一般合同变约评估草案：变约闸、主体与强制接口、Q#路径、BY#变约行（文本切片/协商一致或内容明确/书面特约与形式补正/变更范围/弃权或禁止反言接口/E#）。开闸材料是可编号书面合同与冲突文本或履行碎片，不是口头已经改了或纪要上写了就算改了。变约闸打开不等于已改约不等于形式已补正不等于整份作废不等于全面弃权。口头不是已改约。纪要不是当然变更。内容不明推定未变更。填补不是已改约。一次让步不是全面弃权。错误主张不关窗：口头即已改约、纪要即当然变更、内容不明仍已变更、填补即已改约、一次让步即全面弃权、长期履行即整份作废、未知写零，只关对应格，闸已开仍出其他BY#。类案只比较差异。双方秘密、伪造补充协议或纪要或聊天、倒签变更日、教唆隐匿原合同、违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出BY#终稿。本窗闸名只能是变约闸，禁止复用变更闸、变故闸、解释闸、成立闸。预留不得占用立案闸。主行只能是BY#，禁止BG#、GY#、MOD#、WG#、JX#、A#。主路径只用Q-变，禁止Q-改、Q-形、Q-故、Q-释、Q-填、Q-签作主路径。邻窗Q-变只作转介进本窗本窗打开为主路径不是已改约。不代签署、不写补充协议是交付禁令不是负触发，未知不写零。"
