interface:
  display_name: "评估单件举报可查性"
  short_description: "单件可查性草案；可查不是属实，匿名不是不实，不出调查结论"
  default_prompt: "使用 $评估单件举报可查性，在单方无冲突公司立场下评估已收到的实名或匿名举报能否初核并分流：可查闸、Q#路径、CS#可查性行（要素/三态/保护接口/回避/分流）、E#回链。可查不是属实。匿名不是不实。HR已沟通不是立案评估。错误主张不关窗：匿名即不实、否认即不查、可查即属实、民企套42号令第24条必须立案只关对应格，闸已开仍出其他CS#。双方秘密、伪造线索、指导追踪匿名、打击报复第一次即整体停止，不得选边。闸关仍交十节，第6节不出CS#终稿。有件无书面授权则部分打开。不代立案，不代调查，不代提交，未知不写零。"
