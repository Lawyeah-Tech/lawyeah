interface:
  display_name: "评估集团与子公司合规穿透"
  short_description: "总部机制能否覆盖子公司；并表不是穿透，总部制度不能直接在独立法人子公司生效"
  default_prompt: "使用 $评估集团与子公司合规穿透，在单方无冲突立场下评估中国大陆集团总部合规机制对子公司的穿透：穿透闸、控制关系、Q#路径、U#穿透单元（政策是否生效/举报是否可达/取证是否合法/处分主体）、E#证据回链。并表不是穿透。集团与子公司立场互斥。错误主张不关窗：并表即已覆盖、总部可调阅全球邮箱当然合法、民企套42号令第39条、未穿透即母公司连带只关对应格，闸已开仍出其他U#。无书面授权但立场已闭合：闸关仍交十节，不是整体停止。双方秘密、伪造控制图或并表口径第一次即整体停止，不得选边，不得问代表哪一方后继续。不设计股权，不给出境方案，不选定机关，不代提交，未知不写零。"
