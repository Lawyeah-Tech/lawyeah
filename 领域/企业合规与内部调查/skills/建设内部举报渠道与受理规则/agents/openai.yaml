interface:
  display_name: "建设内部举报渠道与受理规则"
  short_description: "渠道闸与CH#受理行草案；开通邮箱不是有效，受理不是查实"
  default_prompt: "使用 $建设内部举报渠道与受理规则，在单方无冲突的公司立场下建设廉洁合规举报渠道与受理规则：渠道闸、主体与强制接口、Q#路径、CH#渠道/受理行。开通邮箱不是渠道有效。人力资源投诉箱不是廉洁渠道。受理不是查实。不得承诺绝对匿名。错误主张不关窗：邮箱即有效、HR箱即渠道、绝对匿名、受理即查实、渠道即免责、民企套42号令第24条只关对应格，闸已开仍出其他CH#。双方秘密、伪造受理日志、倒签编号、假回执、打击报复第一次即整体停止，不得选边。闸关仍交十节，第6节不出CH#终稿。单件可查性、保护方案、打击报复评估转邻窗。不代公布，不代提交，未知不写零。"
