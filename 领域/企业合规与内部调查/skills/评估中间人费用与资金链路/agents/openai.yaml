interface:
  display_name: "评估中间人费用与资金链路"
  short_description: "中间闸与MJ#草案；明示入账佣金不是贿赂，成功费不是行贿，个人卡不是单位行贿既遂"
  default_prompt: "使用 $评估中间人费用与资金链路，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）评估咨询费、佣金或成功费：中间闸、主体与强制接口、Q#路径、MJ#中间人行（费用类型/名义收款人/账户控制人/最终受益人/对价成果/入账三态/红旗/E#）。开闸材料是可编号费用碎片，不是口头中间人都是回扣。中间闸打开不等于已贿赂不等于已合法。明示入账佣金不是贿赂。成功费本身不是贿赂。个人卡不是单位行贿既遂。无成果不是自动定罪。错误主张不关窗：中间人一律贿赂、成功费即行贿、入账即合法闭集、个人卡即既遂、无成果即已犯罪、空壳即已贿赂、本表已定罪，只关对应格，闸已开仍出其他MJ#。不用search_template生成已合法佣金证明。双方秘密、指导账外佣金或伪造成果第一次即整体停止，不得选边。闸关仍交十节，第6节不出MJ#终稿。不定罪，不审改中介合同全文，不输出唯一总额，不代提交，未知不写零。"
