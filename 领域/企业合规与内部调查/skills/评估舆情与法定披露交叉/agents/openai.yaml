interface:
  display_name: "评估舆情与法定披露交叉"
  short_description: "舆情闸与Dsc#草案；媒体在问不是已触发，澄清稿不是公告"
  default_prompt: "使用 $评估舆情与法定披露交叉，在单方无冲突的公司立场下评估调查、检查或媒体材料是否交叉法定披露：舆情闸、上市架构与义务人、Q#路径、Dsc#触发行（舆情切片/已披露冲突/触发判断三值/口径·合同·检查接口/E#）。开闸材料是可编号舆情切片或已披露冲突，不是口头媒体在问或已经澄清过了。舆情闸打开不等于必须公告不等于无需披露不等于已依法披露。媒体在问不是已触发。热搜不是必须公告。澄清稿不是公告。新闻发布不能代替法定公告。金额不重大不是无需披露。内部口径不是必须公告。证券法78/80只约束境内义务人，港股-only该格不支持。错误主张不关窗：媒体在问即必须公告、金额不重大即无需披露、澄清稿即公告、新闻发布即已履行、港股或非上市套证券法、交表即从轻，只关对应格，闸已开仍出其他Dsc#。公告只比对已披露差异，不代写正文。双方秘密、隐瞒已知红旗或伪造无需披露底稿第一次即整体停止，不得选边。闸关仍交十节，第6节不出Dsc#终稿，第7节不得出披露终稿或公告一句。本窗闸名只能是舆情闸，禁止复用交叉闸、口径闸。不写公告正文，不出CM#拟用句，不代提交，未知不写零。"
