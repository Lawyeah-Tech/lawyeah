interface:
  display_name: "准备合规整改方案"
  short_description: "根因与可验收动作表；整改闸可关仍交十节；计划不是完成证明"
  default_prompt: "使用 $准备合规整改方案，在单方无冲突立场下形成中国大陆企业调查或检查后的整改方案：整改闸、RC#根因、A#可验收动作（责任人、时点、验收证据、计划/进行中/已验证）。不把计划写成已完成，不替代检察合规验收包，不写处分决定，不保证免罚。错误主张不关窗：保证已全面整改、今天必须交验收、把尚未实施写成已完成、整改即免罚、民企套42号令第二十三条只关对应格。整改闸可关，仍交十节，闸关则第6节不出整改终稿。双方秘密、虚假完成证明、隐瞒未改项第一次即整体停止，不得选边。把尚未实施写成已完成同时要求伪造验收才整案停。不给胜诉率，不写唯一截止日，不选定机关，不代提交，未知不写零。"
