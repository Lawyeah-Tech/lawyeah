interface:
  display_name: "准备合规整改方案"
  short_description: "整改闸与ZG#草案；计划不是已完成，交整改不是已免罚，42号令不是民企上报义务"
  default_prompt: "使用 $准备合规整改方案，在单方无冲突立场下形成中国大陆企业普通内部或监管后整改动作表草案：整改闸、RC#根因辅行、Q#路径、ZG#整改行（动作切片/责任人与时点/验收证据形态/完成状态/打开接口/E#）。开闸材料是可编号根因或动作缺口，不是口头已经改完了。整改闸打开不等于已全面整改不等于已获从轻不等于机关已验收。计划不是已完成。交方案不是已免罚。无E#不得写已验证。42号令第二十三条不是民企上报义务。行政处罚法第三十二条从轻须单核。错误主张不关窗：保证已全面整改、今天必须交验收、把尚未实施写成已完成、整改即免罚、民企套42号令、选定某局，只关对应格，闸已开仍出其他ZG#。准备窗第四槽用search_template只借栏目，禁止升格已完成证明或验收合格封面。双方秘密、虚假完成、隐瞒未改、倒签、指导删账第一次即整体停止，不得选边。夹带过验收或保证不起诉负触发验收窗。闸关仍交十节，第6节不出ZG#终稿。本窗闸名只能是整改闸，禁止复用验收闸、评估闸、报告闸、启动闸。预留不得占用立案闸、调查闸、检查闸。主行只能是ZG#，禁止A#、N#、F#、ACT#。RC#只作根因辅行。主路径只用Q-整改，禁止Q-改作主路径。邻窗Q-整改只作转介进本窗本窗打开为主路径不是已完成。不定罪、不保证免罚、不代提交是交付禁令不是负触发，未知不写零。"
