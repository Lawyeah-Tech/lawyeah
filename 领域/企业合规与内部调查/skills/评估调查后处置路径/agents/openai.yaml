interface:
  display_name: "评估调查后处置路径"
  short_description: "处置闸与DP#路径草案；红旗不是必须刑事控告，先开除再补证据不是合法"
  default_prompt: "使用 $评估调查后处置路径，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）比较调查后的民事、劳动、监管、刑事路径：处置闸、Q#路径、DP#处置路径行（路径类型/效果/条件/互斥/可逆性/下一步接口）。路径比较不是已经选择并送达。有红旗不等于必须刑事控告。先刑后民不是当然。先开除再补证据不是合法。错误主张不关窗：红旗必须控告、先刑后民当然、先开除再补证据即合法、内部消化即已合规、路径比较即已选择，只关对应格，闸已开仍出其他DP#。双方秘密、伪造证据、指导违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出DP#终稿。不写控告或解除文书，不定罪，不代提交，未知不写零。"
