interface:
  display_name: "评估反商业贿赂风险点"
  short_description: "廉洁闸与BR#草案；明示折扣入账不是贿赂，不定罪，折扣一律回扣不关窗"
  default_prompt: "使用 $评估反商业贿赂风险点，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）评估销售、采购、项目或公职接触面的反商业贿赂风险点：廉洁闸、主体与强制接口、Q#路径、BR#风险点行（场景/给予或收受候选/入账四态/中间人与资金/公职接触/转介）。开闸材料是可编号场景、资金、账簿或公职接触碎片，不是口头都是回扣或制度印了就合规。明示折扣佣金如实入账不是贿赂。有销售费用不是商业贿赂。管理不规范不是商业贿赂。中间人不是已贿赂。红旗不是必须刑事控告。纸面制度不是已合规。不定罪。错误主张不关窗：折扣一律回扣、入账折扣即贿赂、销售费用即贿赂、中间人即已贿赂、红旗必须刑事、纸面即合规，只关对应格，闸已开仍出其他BR#。双方秘密、指导账外暗中或行贿步骤第一次即整体停止，不得选边。闸关仍交十节，第6节不出BR#终稿。不代提交，未知不写零。"
