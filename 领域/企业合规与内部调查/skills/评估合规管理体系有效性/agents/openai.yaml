interface:
  display_name: "评估合规管理体系有效性"
  short_description: "五维判断已有体系是否运转；纸面不是有效，不保证免责"
  default_prompt: "使用 $评估合规管理体系有效性，在单方无冲突立场下评估中国大陆企业已有合规管理体系是否有效运转：有效性闸、组织/政策/执行/监测/整改五维差距。纸面不是有效。不重写全部制度，不替代单件调查。错误主张不关窗：保证体系完备、合规即可免责、把计划写成已完成、民企套42号令只关对应格。有效性闸可关，仍交十节，闸关则第6节不出有效性终稿。双方秘密、伪造运行记录第一次即整体停止，不得选边。"
