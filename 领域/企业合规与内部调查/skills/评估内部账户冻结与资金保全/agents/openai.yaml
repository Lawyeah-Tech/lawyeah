interface:
  display_name: "评估内部账户冻结与资金保全"
  short_description: "止付闸与ZF#草案；内部止付不是法院已保全，公司账户止付不是可划个人账户"
  default_prompt: "使用 $评估内部账户冻结与资金保全，在单方无冲突的公司立场下评估内部止付：止付闸、账户权属、Q#路径、ZF#止付行（账户权属/止付依据/范围与金额/期限/红旗/司法接口/E#）。开闸材料是可编号账户切片或依据碎片，不是口头先冻住。止付闸打开不等于已止付不等于法院已保全。内部止付不是法院已保全。口头冻结不是已止付。公司账户止付不是可划个人账户。担心转走不是必须立即划走。工资卡不得擅自冻结。错误主张不关窗：内部止付即已保全、口头冻结即已止付、公司账户即可划个人、未知写零，只关对应格，闸已开仍出其他ZF#。类案只比较差异。双方秘密、指导划走个人账户或规避司法查冻第一次即整体停止，不得选边。闸关仍交十节，第6节不出ZF#终稿。本窗闸名只能是止付闸。不替代法院保全，不选定法院，不定罪，不代提交，未知不写零。"
