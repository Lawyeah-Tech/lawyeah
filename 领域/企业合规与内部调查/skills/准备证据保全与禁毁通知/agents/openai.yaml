interface:
  display_name: "准备证据保全与禁毁通知"
  short_description: "发送前持有禁毁通知；不等于保全，不代发，不毁证"
  default_prompt: "使用 $准备证据保全与禁毁通知，在单方无冲突立场下准备中国大陆企业对内持有或禁毁通知草案和最小到达设计。不等于法院证据保全。不执行发送。口头备份不是已保全，已读不是到达。错误主张不关窗：全员无范围、今天必须发出、口头备份即已保全、已读即到达、选定某局、保证已固定只关对应格。发送闸可关，仍交十节，闸关则第6节不出可发送正文。删除、格式化、藏匿、倒签、双方秘密第一次即整体停止，不得选边。已有监察文书不得借全员禁毁完成平行灭证。"
