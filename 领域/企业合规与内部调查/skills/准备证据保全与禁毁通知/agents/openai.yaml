interface:
  display_name: "准备证据保全与禁毁通知"
  short_description: "持有闸与LH#草案；持有函不是法院裁定，口头备份不是已保全，已读不是到达"
  default_prompt: "使用 $准备证据保全与禁毁通知，在单方无冲突立场下形成中国大陆企业对内持有或禁毁通知草案：持有闸、范围与接收人碎片、Q#路径、LH#持有行（范围切片系统×期间×对象/接收人与管理员/持有或禁毁义务/到达渠道与回证/打开接口/E#）。开闸材料是可编号范围切片且可列接收人或管理员，不是口头已经备份或今晚发出。持有闸打开不等于已发送不等于已到达不等于已保全不等于法院裁定。口头备份不是已保全。已读不是到达。保存通知不是证据保全。复制或哈希不是已固定不是已公证。草稿不是已发送。全员无边界禁毁不是可发送。持有函无法定答复期。错误主张不关窗：全员无范围、今天必须发出、口头备份即已保全、已读即到达、草稿即已发送、保证已固定、选定某局、未知写零，只关对应格，闸已开仍出其他LH#。准备窗第四槽用search_template只借栏目，禁止升格已发送、法院申请书或已保全证明。双方秘密、删除、格式化、藏匿、倒签、伪造回证、打击报复、限制人身自由、已有监察公安检察文书仍要全员禁毁第一次即整体停止，不得选边，不得借本窗平行灭证。闸关仍交十节，第6节不出LH#终稿。本窗闸名只能是持有闸，禁止复用发送闸、保全闸、通知闸、评估闸、启动闸、检查闸。预留不得占用立案闸、调查闸、检查闸、发送闸、保全闸。主行只能是LH#，禁止N#、A#、GT#、QI#。主路径只用Q-持有，禁止Q-发、Q-函、Q-持、Q-证、Q-保作主路径。邻窗Q-持有只作转介进本窗本窗打开为主路径不是已保全。不定罪、不等于法院保全、不执行发送是交付禁令不是负触发，未知不写零。"
