interface:
  display_name: "评估国企合规管理办法差距"
  short_description: "对照42号令列差距；民企硬套不关窗，第22条第1款不是向国资委报告"
  default_prompt: "使用 $评估国企合规管理办法差距，在单方无冲突立场下对照国资委令第42号评估中央企业或地方国企差距：对照闸、主体与监管层级、Q#路径、B#条款对照、E#证据回链。第二十二条第一款是向本企业合规管理部门报告，第三款才是中央企业向国资委报告。第八条(三)/第十四条(三)/第二十七条是评价条款，不是第二十三条整改。错误主张不关窗：民企必须按42号令上报国务院国资委、把内部报告写成已报国资委、保证监管认可只关对应格，闸已开仍出其他B#。无书面对照授权但立场已闭合：闸关仍交十节，不是整体停止。双方秘密、伪造对照或上报记录、打击报复第一次即整体停止，不得选边，不得问代表哪一方后继续。不建议民企向国资委上报，不给胜诉率，不选定机关，不代提交，未知不写零。"
