interface:
  display_name: "准备第三方尽职调查工作底稿"
  short_description: "底稿闸与DW#草案；底稿完成不是已批准合作，访谈印象不是已证实，未提供不是无问题"
  default_prompt: "使用 $准备第三方尽职调查工作底稿，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）形成高风险第三方廉洁尽调底稿草案：底稿闸、主体与强制接口、Q#路径、DW#底稿行（对象/拟证问题/材料/访谈接口/四态结论/E#）。开闸材料是可编号对象或拟证问题/材料室碎片，不是口头写完就可合作。底稿完成不是已批准合作。访谈印象不是已证实。未提供不是无问题。必须写成可合作该格不支持。依据不足不得改可合作。错误主张不关窗：底稿完成即已批准合作、访谈印象即已证实、未提供即无问题、必须写成可合作、公开检索即已尽职、承诺书即已通过、高风险即必须中止、FCPA即中国法义务，只关对应格，闸已开仍出其他DW#。不用search_template生成可合作或已批准合作底稿。双方秘密、指导买黑客或非法获取个人信息、指导伪造底稿第一次即整体停止，不得选边。闸关仍交十节，第6节不出DW#终稿。不定罪，不保证可合作，不买违法征信，不实施访谈，不发中止通知，不写并购总尽调，不代提交，未知不写零。"
