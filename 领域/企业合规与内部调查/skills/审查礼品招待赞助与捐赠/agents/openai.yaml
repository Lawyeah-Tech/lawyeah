interface:
  display_name: "审查礼品招待赞助与捐赠"
  short_description: "审查闸与GH#草案；小额节日礼品不是自动合法，临近招标不得标允许"
  default_prompt: "使用 $审查礼品招待赞助与捐赠，在单方无冲突的公司立场下审查单笔或一批礼品、招待、赞助或捐赠：审查闸、主体与强制接口、Q#路径、GH#审查行（给付形态/受益人身份/时点/三态允许禁止待核/入账与审批）。开闸材料是可编号给付碎片，不是口头小额即合法或老板点头。小额不是自动允许。节日礼品不是自动合法。临近招标或许可不得标允许。已报销不是已合法。赞助冠名不是捐赠。已发生禁止不得补假批准。错误主张不关窗：小额一律合法、节日自动合法、行业惯例即合法、已报销即合法、口头同意即已批准、公益捐赠一律合法、赞助即市场费用当然合法、低于阈值即合法，只关对应格，闸已开仍出其他GH#。双方秘密、指导补假批准或账外第一次即整体停止，不得选边。闸关仍交十节，第6节不出GH#终稿。不定罪，不代提交，未知不写零。"
