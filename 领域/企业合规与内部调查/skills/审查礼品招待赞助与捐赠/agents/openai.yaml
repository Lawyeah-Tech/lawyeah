interface:
  display_name: "审查礼品招待赞助与捐赠"
  short_description: "审查闸与GF#草案；小额节日礼品不是自动合法，临近招标不得标允许"
  default_prompt: "使用 $审查礼品招待赞助与捐赠，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）审查单笔或一批礼品、招待、赞助或捐赠：审查闸、主体与强制接口、Q#路径、GF#审查行（类型/受益人/形态/时点窗口/入账三态/审批留痕/三态结论）。开闸材料是可编号给付碎片，不是口头小额即合法或老板点头。小额不是自动允许。节日礼品不是自动合法。临近招标或许可不得标允许。已报销不是已合法。赞助冠名不是捐赠。已发生禁止不得补假批准。允许不是已合法终局。错误主张不关窗：小额一律合法、节日自动合法、行业惯例即合法、已报销即合法、口头同意即已批准、公益捐赠一律合法、赞助即市场费用当然合法、低于阈值即合法，只关对应格，闸已开仍出其他GF#。双方秘密、指导补假批准或账外第一次即整体停止，不得选边。闸关仍交十节，第6节不出GF#终稿。不定罪，不代提交，未知不写零。"
