interface:
  display_name: "评估上市公司廉洁与内控交叉"
  short_description: "廉洁红旗与内控、关联方、披露接口对齐；红旗不是必须公告，内控有效不能洗白未闭合红旗"
  default_prompt: "使用 $评估上市公司廉洁与内控交叉，在单方无冲突立场下评估中国大陆上市主体廉洁红旗与内控、关联方、披露触发点交叉：交叉闸、上市架构、Q#路径、X#交叉红旗行（廉洁面/关联方面/内控陈述冲突/披露接口）、E#证据回链。红旗不是已违规成立，不是必须公告。内控评价有效不能洗白未闭合红旗。证券法78/80只约束境内义务人，港股-only该格不支持。错误主张不关窗：无需披露、金额不重大故无需披露、内控有效洗白、关联方即输送、非上市或港股必须按证券法公告只关对应格，闸已开仍出其他X#。闸关则第6节不出X#、第7节不得出披露终稿。双方秘密、伪造内控评价或关联方清单第一次即整体停止，不得选边。不写公告或联交所query正文，不代提交，未知不写零。"
