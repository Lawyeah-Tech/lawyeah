interface:
  display_name: "评估上市公司廉洁与内控交叉"
  short_description: "廉洁红旗与内控、关联方、披露接口对齐；红旗不是必须公告，内控有效不能洗白未闭合红旗"
  default_prompt: "使用 $评估上市公司廉洁与内控交叉，在单方无冲突立场下评估中国大陆上市主体廉洁红旗与内控、关联方、披露触发点交叉：交叉闸、上市架构、Q#路径、X#交叉红旗行（廉洁面/关联方面/内控陈述冲突/披露接口）、E#证据回链。红旗不是已违规成立，不是必须公告。内控评价有效不能洗白未闭合红旗。错误主张不关窗：无需披露、内控有效洗白、关联方即输送、非上市必须按证券法公告只关对应格，闸已开仍出其他X#。无书面授权但立场已闭合：闸关仍交十节，不是整体停止。双方秘密、伪造内控评价或关联方清单第一次即整体停止，不得选边，不得问代表哪一方后继续。不写公告正文，不代提交，不选定机关，不定罪，未知不写零。"
