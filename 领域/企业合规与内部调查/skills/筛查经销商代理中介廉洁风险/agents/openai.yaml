interface:
  display_name: "筛查经销商代理中介廉洁风险"
  short_description: "筛查闸与SC#草案；工商登记不是廉洁，承诺书不是已通过，红旗不是已违法"
  default_prompt: "使用 $筛查经销商代理中介廉洁风险，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）对单个或一批经销商、代理、中介或顾问做公开信息廉洁筛查：筛查闸、主体与强制接口、Q#路径、SC#筛查行（对象/类型/公开来源/红旗/风险级/受益所有人/与我方关系人/E#）。开闸材料是可编号对象，不是口头这批都没问题。筛查闸打开不等于已通过不等于已廉洁。工商登记正常不是廉洁。签了廉洁承诺书不是已通过。红旗待证不是已违法。公开处罚不是本窗定罪。不足不得写成低风险。禁止本批均无问题。错误主张不关窗：登记即廉洁、承诺书即已通过、红旗即已违法、公开处罚即定罪、不足即低风险、本批均无问题、高风险即必须中止、亲属供货即贿赂、空壳待核即已虚假、本表已合规，只关对应格，闸已开仍出其他SC#。不用search_template生成已通过清单。双方秘密、指导买黑客或非法获取个人信息、指导伪造筛查底稿第一次即整体停止，不得选边。闸关仍交十节，第6节不出SC#终稿。不定罪，不买违法征信，不写尽调终稿，不发中止通知，不代提交，未知不写零。"
