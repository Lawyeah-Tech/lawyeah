interface:
  display_name: "评估企业合规风险总图"
  short_description: "合规闸与GT#草案；红旗不是已违规，制度不是已有效运转，培训不是已免责"
  default_prompt: "使用 $评估企业合规风险总图，在单方无冲突立场下形成中国大陆企业合规风险总图草案：合规闸、主体与治理碎片、Q#路径、GT#合规总图行（义务簇切片/红旗与材料/主体岗位/专项分流/打开接口/E#）。开闸材料是可编号主体、治理或红旗碎片，不是口头有人来过或已经合规了。合规闸打开不等于已合规不等于已免责不等于已构罪。红旗不是已违规。红旗不是已构罪。制度文本不是已有效运转。培训记录不是已免责。集团模板不是已落地境内强制规则。公司法第一百七十七条只约束国家出资公司。明示折扣佣金如实入账不是商业贿赂。错误主张不关窗：红旗即已构罪、制度即已有效、培训即已免责、民企套177或42号令、折扣即贿赂、未知写零，只关对应格，闸已开仍出其他GT#。评估窗第四槽用search_case_by_fact，禁止用范本生成调查报告或已合规证明。双方秘密、销毁证据、串供、阻挠检查第一次即整体停止，不得选边。闸关仍交十节，第6节不出GT#终稿。本窗闸名只能是合规闸，禁止复用评估闸、争议闸、调查闸、检查闸。预留不得占用立案闸、调查闸、检查闸。主行只能是GT#，禁止ZT#、QG#、A#。主路径只用Q-风，禁止Q-总、Q-责、Q-合、Q-图作主路径。邻窗Q-风只作转介进本窗本窗打开为主路径不是已合规。不定罪、不保证免责、不发持有通知是交付禁令不是负触发，未知不写零。"
