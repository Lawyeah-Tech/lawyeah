interface:
  display_name: "建立内部调查证据案卷"
  short_description: "建卷闸与证据矩阵；不是结论，不代提交，不违法取证"
  default_prompt: "使用 $建立内部调查证据案卷，在单方无冲突立场下形成中国大陆企业内部调查证据案卷矩阵：建卷闸、Q#待证要件、E#支持与不利编目、合法取得与缺口。不是调查结论，不是诉状，不等于诉讼证据已质证。不执行发送，不代提交。错误主张不关窗：保证已完整、今天必须交卷、把猜测写成已查清、把目录写成结论、未知写零、对方控制推定已持有只关对应格。建卷闸可关，仍交十节，闸关则第6节不出案卷矩阵终稿。入侵、购买黑客数据、偷拷私人设备、伪造、隐匿、双方秘密第一次即整体停止，不得选边。账上可能被删不得整案停，不得指导删除。"
