interface:
  display_name: "建立内部调查证据案卷"
  short_description: "建卷闸与JW#草案；口头备份不是已入卷，案卷不是已质证，对方控制不是已持有"
  default_prompt: "使用 $建立内部调查证据案卷，在单方无冲突立场下形成中国大陆企业内部调查证据案卷草案：建卷闸、待证与材料碎片、Q#路径、JW#建卷行（待证要件/材料形态/支持或不利/控制方/合法取得/打开接口/E#）。开闸材料是可编号材料或可编号缺口，不是口头已经备份。建卷闸打开不等于已入卷不等于已质证不等于已查清不等于已保全。口头备份不是已入卷。已读不是到达。复制或哈希不是已固定不是已公证。截图不是原件。保存通知不是证据保全。案卷不是已质证。对方控制不得推定已持有已灭失或内容有利。私录不是当然排除也不是当然可采。企业设备不是当然可采。个保法第十三条不等于私人设备授权。错误主张不关窗：保证已完整、今天必须交卷、猜测写成已查清、目录即结论、口头即已入卷、复制哈希即已固定、对方控制即已持有、私录一律可采或一律排除、企业设备一律当然可采、民企套177或42号令、未知写零，只关对应格，闸已开仍出其他JW#。建立窗第四槽用search_template只借编目栏目，禁止升格已入卷已质证或调查结论。双方秘密、入侵、黑客数据、偷拷、伪造、隐匿、删除、选择性不入卷、已有监察公安检察文书仍要拿掉不利件第一次即整体停止，不得选边，不得该部分停后继续编其余目录，不得转介持有完成毁证。闸关仍交十节，第6节不出JW#终稿。本窗闸名只能是建卷闸，禁止复用证据闸、案卷闸、人据闸、持有闸、评估闸、启动闸、披露闸。预留不得占用立案闸、调查闸、检查闸、保全闸。主行只能是JW#，禁止E#、N#、A#作主行。主路径只用Q-建卷，禁止Q-卷、Q-人据、Q-持有、Q-启、Q-披露、Q-合作主路径。邻窗Q-建卷只作转介进本窗本窗打开为主路径不是已入卷。不定罪、不等于已质证、不代提交是交付禁令不是负触发，未知不写零。"
