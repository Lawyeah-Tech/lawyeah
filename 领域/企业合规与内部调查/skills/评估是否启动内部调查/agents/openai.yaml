interface:
  display_name: "评估是否启动内部调查"
  short_description: "启动闸与QI#草案；线索不是已查实，不启动不是没有问题，自己人查自己不是已独立"
  default_prompt: "使用 $评估是否启动内部调查，在单方无冲突立场下形成中国大陆企业内部调查启动闸草案：启动闸、线索与回避碎片、Q#路径、QI#启动行（线索切片/可查性与来源等级/回避与独立/范围假设主体×期间×交易或账户×系统/打开接口/E#）。开闸材料是可编号线索碎片，不是口头有人来过或已经立案。启动闸打开不等于已立案不等于已查实不等于已独立。线索不是已查实。不启动不是没有问题。自己人查自己不是已独立。匿名不是已虚假也不是已属实。公司法第一百七十七条只约束国家出资公司。42号令第二十四条只约束中央企业。明示折扣佣金如实入账不是商业贿赂。错误主张不关窗：线索即已查实、不启动即没有问题、自己人查自己即已独立、匿名即虚假或属实、民企套177或42号令、折扣即贿赂、先处分再补查、口头来过即立案、未知写零，只关对应格，闸已开仍出其他QI#。评估窗第四槽用search_case_by_fact，禁止用范本生成调查报告或已立案证明。双方秘密、销毁证据、串供、打击报复、限制人身自由第一次即整体停止，不得选边，不得转介禁毁完成毁证。已有监察或公安文书不得平行灭证。闸关仍交十节，第6节不出QI#终稿。本窗闸名只能是启动闸，禁止复用评估闸、合规闸、争议闸、调查闸、检查闸。预留不得占用立案闸、调查闸、检查闸。主行只能是QI#，禁止GT#、ZT#、QG#、A#。主路径只用Q-启，禁止Q-风、Q-总、Q-责、Q-线作主路径。Q-线只作线索可查性扫描不得升主路径。邻窗Q-启只作转介进本窗本窗打开为主路径不是已立案。不定罪、不保证免责、不发持有通知是交付禁令不是负触发，未知不写零。"
