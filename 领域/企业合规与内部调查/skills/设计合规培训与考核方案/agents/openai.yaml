interface:
  display_name: "设计合规培训与考核方案"
  short_description: "按岗位风险的培训考核草案；签到不是考核，完成培训不是免责"
  default_prompt: "使用 $设计合规培训与考核方案，在单方无冲突立场下按岗位风险设计中国大陆企业合规培训与考核方案：培训闸、主体与强制接口、Q#路径、TR#对象×场景×考核行、E#回链。通识课不是岗位培训。签到不是考核。完成培训不是免责。错误主张不关窗：全员同一课件、签到即合格、培训即免责、民企套42号令第29条只关对应格，闸已开仍出其他TR#。双方秘密、伪造签到或倒签考核第一次即整体停止，不得选边。闸关仍交十节，第6节不出TR#终稿。不替代调查或处分，不写劳动培训制度全文，不代提交，未知不写零。"
