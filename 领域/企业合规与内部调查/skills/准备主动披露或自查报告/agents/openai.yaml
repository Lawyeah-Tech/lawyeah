interface:
  display_name: "准备主动披露或自查报告"
  short_description: "发送前自查披露稿；提交不是宽大，披露不是自首"
  default_prompt: "使用 $准备主动披露或自查报告，在单方无冲突立场下准备中国大陆企业向主管或监管机关提交前的自查或主动披露草案。不执行发送。提交不是已获宽大。披露不是刑事自首。快递发出不是机关已受理或已认定。错误主张不关窗：保证免罚、选定某局、今天必须交、把猜测写成已查清、民企套42号令向国资委报或建议比照上报只关对应格。发送闸可关，仍交十节，闸关则第6节不出可发送正文。双方秘密、虚假情节、隐匿不利事实、倒签第一次即整体停止，不得选边。"
