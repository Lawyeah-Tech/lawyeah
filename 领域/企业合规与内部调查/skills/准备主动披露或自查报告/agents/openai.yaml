interface:
  display_name: "准备主动披露或自查报告"
  short_description: "披露闸与PD#草案；提交不是已获宽大，披露不是自首，42号令22条不是民企上报义务"
  default_prompt: "使用 $准备主动披露或自查报告，在单方无冲突立场下形成中国大陆企业发送前自查或主动披露草案：披露闸、已核实与保留项碎片、Q#路径、PD#披露行（事实切片已核实或情景或无法估计/签发主体与拟接收机关类型/禁止夹带/打开接口/E#）。开闸材料是可编号已核实或保留项碎片，不是口头已经交了。披露闸打开不等于已提交不等于已受理不等于已从轻不等于已自首。草稿不是已提交。已读不是签收。快递揽收不是机关已认定。提交不是免罚。行政处罚法第三十二条条件须单核，提交自查不等于危害后果已消除或已获从轻。第三十三条三层须另核。42号令第二十二条只约束中央企业向国资委报告重大事件。错误主张不关窗：保证免罚、选定某局、今天必须交、猜测写成已查清、民企套42号令、披露即自首、未知写零、草稿即已提交、已读即签收，只关对应格，闸已开仍出其他PD#。准备窗第四槽用search_template只借栏目，禁止升格已提交或保证宽大。双方秘密、虚假情节、隐匿不利事实、顶替、倒签、交虚假自查稿第一次即整体停止，不得选边。闸关仍交十节，第6节不出PD#终稿。本窗闸名只能是披露闸，禁止复用发送闸、报告闸、检查闸、评估闸、启动闸、持有闸。预留不得占用立案闸、调查闸、检查闸、发送闸、报告闸。主行只能是PD#，禁止N#、A#、GT#、QI#、LH#。主路径只用Q-披露，禁止Q-发、Q-披、Q-函、Q-风、Q-启作主路径。邻窗Q-披露只作转介进本窗本窗打开为主路径不是已获宽大。不定罪、不保证免罚、不执行发送是交付禁令不是负触发，未知不写零。"
