interface:
  display_name: "确定调查授权范围与独立"
  short_description: "授权闸与AU#授权行草案；口头不是书面，自签不是独立"
  default_prompt: "使用 $确定调查授权范围与独立，在单方无冲突的公司立场下确定内部调查的书面授权、范围与独立性：授权闸、Q#路径、AU#授权行（来源/范围三要素/独立性接口/禁止事项/汇报线）。口头授权不是书面授权。授权范围不是空白支票。自己人签发对自己的授权不是独立。全员监控不是范围闭合。错误主张不关窗：口头即书面、自签即独立、全员监控即范围、民企套公司法177或42号令只关对应格，闸已开仍出其他AU#。双方秘密、伪造或倒签授权、指导违法取证第一次即整体停止，不得选边。闸关仍交十节，第6节不出AU#终稿。不实施访谈，不代签发，不代提交，未知不写零。"
