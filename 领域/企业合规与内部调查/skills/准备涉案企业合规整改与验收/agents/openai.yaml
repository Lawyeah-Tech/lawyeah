interface:
  display_name: "准备涉案企业合规整改与验收"
  short_description: "检察合规计划与验收接口；验收闸可关仍交十节；不保证不起诉"
  default_prompt: "使用 $准备涉案企业合规整改与验收，在单方无冲突立场下形成中国大陆涉案企业合规材料：验收闸、适用接口、针对涉案原因的P#计划、第三方回避、验收证据对照。不辩护个人刑事责任，不保证不起诉或免罚，无证据不得写已通过验收。机制文件未核验不得写依法应当适用。错误主张不关窗：保证不起诉、法定必然适用、今天必须过验收、合规材料即自首只关对应格。验收闸可关，仍交十节，闸关则第6节不出计划终稿。双方秘密、伪造整改证据、利诱评估人员（含直接付费或宴请）、隐瞒未改第一次即整体停止，不得选边，不得问代表哪一方后继续。复制通用章程当计划只关闸、不关窗。不给胜诉率，不选定检察院，不代提交，未知不写零。"
