interface:
  display_name: "准备涉案企业合规整改与验收"
  short_description: "验收闸与YA#草案；评估是办案参考不是必然不起诉，交计划不是自首，复制章程不是计划"
  default_prompt: "使用 $准备涉案企业合规整改与验收，在单方无冲突企业立场下形成中国大陆检察合规计划与验收对照草案：验收闸、Q#路径、YA#验收行（计划切片须回链涉案原因/责任人与时点/验收证据形态/第三方与回避/打开接口/E#）。开闸材料是可编号能回链涉案原因的计划或证据碎片，不是口头已经过了、检察说没问题或复制通用章程。验收闸打开不等于已通过不等于必然不起诉不等于自首已成立。交计划不是不起诉。企业交合规材料不是刑法第六十七条自首。42号令不是检察合规机制。复制通用章程不是计划。仅有制度缺口不得开验收闸。企业自聘律师不是管委会选任的第三方。小微直接审查只开接口不是已从宽。错误主张不关窗：保证不起诉、法定必然适用、今天必须过验收、计划写成已通过、合规即自首、选定某检察院，只关对应格，闸已开仍出其他YA#。准备窗第四槽用search_template只借栏目，禁止升格已通过或不起诉保证。双方秘密、伪造证据、利诱评估、走过场、隐瞒未改、倒签第一次即整体停止，不得选边。闸关仍交十节，第6节不出YA#终稿。本窗闸名只能是验收闸，禁止复用整改闸、检查闸、监测闸、评估闸。预留不得占用立案闸、调查闸。主行只能是YA#，禁止P#、N#、A#。主路径只用Q-验，禁止Q-检、Q-检合、Q-整改、Q-监作主路径。邻窗Q-验只作转介进本窗本窗打开为主路径不是已通过。不定罪、不保证不起诉、不代提交是交付禁令不是负触发，未知不写零。"
