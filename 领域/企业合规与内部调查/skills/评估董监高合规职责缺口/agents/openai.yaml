interface:
  display_name: "评估董监高合规职责缺口"
  short_description: "董监高合规履职痕迹与缺口；忠实勤勉不是必得追偿，口头知情不是已履职"
  default_prompt: "使用 $评估董监高合规职责缺口，在单方无冲突立场下评估中国大陆企业董事、监事、高级管理人员合规职责缺口：履职闸、出资属性、Q#路径、H#履职痕迹（应上会/实际上会/记录/回避）。董、监、高分列。忠实勤勉不是必得追偿。口头知情不是已履职。错误主张不关窗：保证免责、公司法180必得追偿、191对内追偿、民企套177或42号令只关对应格。履职闸可关，仍交十节，闸关则第6节不出H#终稿。双方秘密、伪造纪要或回避记录第一次即整体停止，不得选边，不得问代表哪一方后继续。不写任免决定，不给胜诉率，不选定机关，不代提交，未知不写零。"
