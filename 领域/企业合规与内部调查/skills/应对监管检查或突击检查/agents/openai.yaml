interface:
  display_name: "应对监管检查或突击检查"
  short_description: "现场纪律与权限核验；检查闸可关仍交十节；不阻挠合法检查、不教藏匿"
  default_prompt: "使用 $应对监管检查或突击检查，在单方无冲突立场下形成中国大陆企业现场与首轮检查应对：检查闸、证件权限核验、现场纪律、K#期限卡、可交/扣下/待核材料。不阻挠合法检查，不写复议诉讼文书，不教藏匿或关门。未出示证件则记录异议、最小必要配合，不等于授权毁证。错误主张不关窗：保证过关、今天必须交完、选定某局、口头尽快当截止日只关对应格。检查闸可关，仍交十节，闸关则第6节不出可交材料终稿。双方秘密、阻挠合法检查、毁证伪证藏匿第一次即整体停止，不得选边，不得问代表哪一方后继续。不给胜诉率，不写唯一截止日，不选定机关，不代提交。"
