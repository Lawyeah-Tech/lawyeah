interface:
  display_name: "应对监管检查或突击检查"
  short_description: "检查闸与XR#草案；拒绝调查不是关门藏匿，未出示证件不是可以藏物，口头尽快不是截止日"
  default_prompt: "使用 $应对监管检查或突击检查，在单方无冲突立场下形成中国大陆企业现场与首轮检查应对草案：检查闸、K#期限辅行、Q#路径、XR#现场应对行（来人与文书切片/证件与权限异议/材料可交或扣下或待核/打开接口/E#）。开闸材料是到场人员或已到达的检查通知或文书，不是口头尽快、已读、快递揽收或电话预约。检查闸打开不等于已过关不等于已提交不等于可以不配合合法检查不等于授权关门藏物。拒绝接受调查不是授权关门藏匿。未出示执法证件不是可以关门藏物。口头尽快不是法定截止日。已读不是送达。先行登记保存七日不是企业内部期限。扣下不是藏匿。待核不是拖延合法检查。律师在场不是美国式特权。个保法第十三条不是私人设备因检查即可交。42号令不是民企必须接待国资委检查。错误主张不关窗：保证过关、今天必须交完、选定某局、口头尽快当截止日、未出示即可关门，只关对应格，闸已开仍出其他XR#。未出示证件则记录异议、最小必要配合，不教关门藏物。应对窗第四槽用search_template只借栏目，禁止升格已过关证明或机关检查笔录终稿。双方秘密、阻挠、毁证、伪证、藏匿、关门藏物、指导拒绝合法检查、已有监察文书仍要平行灭证第一次即整体停止，不得选边。闸关仍交十节，第6节不出XR#终稿。本窗闸名只能是检查闸，禁止复用交卷闸、预案闸、评估闸、应对闸。预留不得占用立案闸、调查闸。主行只能是XR#，禁止K#、SL#、YU#、A#、N#升主行。K#只作期限辅行。主路径只用Q-检，禁止Q-交、Q-预、Q-监、Q-证作主路径。邻窗Q-检只作转介进本窗本窗打开为主路径不是已过关。不定罪、不保证过关、不代提交、不阻挠合法检查是交付禁令不是负触发，未知不写零。"
