interface:
  display_name: "评估利益冲突与关联交易廉洁面"
  short_description: "冲突闸与IC#草案；打开不等于已回避不等于已廉洁，清单口头180都不是已处理"
  default_prompt: "使用 $评估利益冲突与关联交易廉洁面，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）评估员工、高管或第三方与公司的利益冲突及关联交易廉洁面：冲突闸、主体与强制接口、Q#路径、IC#冲突行（关系主体×相对方/冲突类型/披露时点三态/回避有效性/交易接口/E#）。开闸材料是可编号冲突主体或交易碎片，不是口头在清单上或会上说过。冲突闸打开不等于已回避不等于已廉洁不等于冲突已处理。清单不是已廉洁。口头披露不是已披露。决策后补披露不是有效披露。公司法180不是已回避或已批准。185表决回避不是调查已回避，也不是廉洁面已处理。关联批准不是当然合法。亲属供货不是当然贿赂。忠实勤勉不是已履职。利益冲突未解仍正触发。错误主张不关窗：清单即已廉洁、口头即已披露、补披露即有效、180即已回避、185即调查已回避、关联批准即合法、亲属供货即贿赂、忠实勤勉即已履职，只关对应格，闸已开仍出其他IC#。不用search_template生成已廉洁清单、决议正文或合同改稿。双方秘密、指导隐瞒关联关系或伪造披露第一次即整体停止，不得选边。闸关仍交十节，第6节不出IC#终稿。不写决议、不审合同、不定罪，不代提交，未知不写零。"
