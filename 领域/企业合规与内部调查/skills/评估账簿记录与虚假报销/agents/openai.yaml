interface:
  display_name: "评估账簿记录与虚假报销"
  short_description: "账簿闸与VR#凭证行草案；打开不等于已虚假不等于已合法，红旗不是已虚假"
  default_prompt: "使用 $评估账簿记录与虚假报销，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）评估账簿完整性与虚假报销红旗：账簿闸、主体与强制接口、Q#路径、VR#凭证行（科目或报销件/付款形态/发票三态/附件与事实/受益人/审批链/红旗/E#）。本窗VR#不是税务函调。开闸材料是可编号凭证碎片，不是口头已经报销所以合法。账簿闸打开不等于已虚假不等于已合法。已报销不是已合法。有发票不是真实劳务。红旗是待证不是已虚假。账簿问题不是回扣既遂。缺附件不写零。不输出补税金额。错误主张不关窗：已报销即合法、有发票即真实、咨询费即合法对价、红旗即已虚假、本表已定罪，只关对应格，闸已开仍出其他VR#。不用search_template生成已入账合法证明。双方秘密、指导改账掩盖或补假发票第一次即整体停止，不得选边。闸关仍交十节，第6节不出VR#终稿。不定罪，不作出税务处理决定，不代提交，未知不写零。"
