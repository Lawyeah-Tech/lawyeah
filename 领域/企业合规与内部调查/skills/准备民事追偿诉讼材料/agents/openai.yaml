interface:
  display_name: "准备民事追偿诉讼材料"
  short_description: "诉材闸与QS#草案；调查报告不是诉状，草案不是已立案"
  default_prompt: "使用 $准备民事追偿诉讼材料，在单方无冲突的公司立场下准备对责任人或不法得利人的民事追偿诉讼材料草案：诉材闸、主体与强制接口、Q#路径、QS#诉材行（请求权/被告/管辖接口/时效接口/证据目录/调查报告衔接/E#）。开闸材料是可编号被告或请求权碎片，不是口头报告就能当诉状。诉材闸打开不等于已立案不等于已提交不等于已胜诉。本窗闸名只能是诉材闸，禁止复用起诉闸。调查报告不是诉状。草案不是已立案。民事起诉不是刑事报案。不代提交。不选定法院。不给胜诉率。管辖或时效未核验不得写成仍充足。先刑后民不是当然不能起诉。错误主张不关窗：调查报告即诉状、草案即已立案、选定某院、保证胜诉、时效仍充足未核验、口头返还即无损失、劳动未仲裁即可直接起诉、先刑后民所以不能告，只关对应格，闸已开仍出其他QS#。范本只借栏目。双方秘密、指导伪造证据或夹带刑事控告方法第一次即整体停止，不得选边。闸关仍交十节，第6节不出QS#终稿。不写刑事控告，不定罪，未知不写零。"
