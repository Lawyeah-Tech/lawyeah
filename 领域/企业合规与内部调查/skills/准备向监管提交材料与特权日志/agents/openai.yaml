interface:
  display_name: "准备向监管提交材料与特权日志"
  short_description: "交卷闸与SL#草案；清单不是已从宽，扣下不是藏匿，抄送法务不是特权"
  default_prompt: "使用 $准备向监管提交材料与特权日志，在单方无冲突的公司立场下准备检查文书范围内的交卷三态清单草案：交卷闸、主体与强制接口、Q#路径、SL#交卷行（材料/范围内外/可交/应扣/待核/扣下理由/副本控制/WP#回链/E#）。开闸材料是可编号材料或检查文书碎片，不是口头全交了就从宽。交卷闸打开不等于已提交不等于已从宽不等于已免交。交卷清单不是已从宽。扣下不是藏匿。超范围记录异议不擅自扩大，不等于关门藏物。抄送法务不是中国法特权。律师在场不是免交。美国ACP不是中国法免交。待核不是拖延合法检查。错误主张不关窗：全面配合即全部交出、扣下即藏匿、抄送法务即特权、ACP即免交、交清单即从轻、待核即可拖延、今天必须保证过关、选定某局，只关对应格，闸已开仍出其他SL#。范本只借栏目。双方秘密、指导伪造补件或藏匿范围内材料第一次即整体停止，不得选边。闸关仍交十节，第6节不出SL#终稿。不代提交，不保证从宽，不定罪，不阻挠合法检查，不教藏匿，未知不写零。"
