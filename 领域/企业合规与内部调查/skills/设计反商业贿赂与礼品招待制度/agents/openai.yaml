interface:
  display_name: "设计反商业贿赂与礼品招待制度"
  short_description: "制度闸与GP#草案；阈值不是安全港，印发不是已生效，无稽核不是有效制度"
  default_prompt: "使用 $设计反商业贿赂与礼品招待制度，在单方无冲突的公司立场下设计反商业贿赂与礼品招待制度草案：制度闸、主体与强制接口、Q#路径、GP#制度行（禁止/可批准/例外/账簿/稽核）。开闸材料是可编号拟设制度行或现行礼品政策碎片，不是口头小额即合法或印了就合规。草案不是已生效。阈值不是法定安全港。有礼品政策不是已合规。无稽核则框架不支持有效制度。小额广告礼品除外不是空白支票。例外审批人不得是申请业务最终受益决策人。错误主张不关窗：印发即生效、纸面即有效、低于阈值即合法、小额一律合法、行业惯例即合法、民企套42号令第18条必须专项、FCPA即中国法义务、制度印发即免责，只关对应格，闸已开仍出其他GP#。双方秘密、指导账外或行贿写入制度第一次即整体停止，不得选边。闸关仍交十节，第6节不出GP#终稿。不代印发，不代提交，未知不写零。"
