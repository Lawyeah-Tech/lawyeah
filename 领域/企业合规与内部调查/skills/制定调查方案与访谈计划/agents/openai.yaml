interface:
  display_name: "制定调查方案与访谈计划"
  short_description: "方案闸与PL#方案草案；方案不是已执行，先谈不是合法，无授权不是全员约谈"
  default_prompt: "使用 $制定调查方案与访谈计划，在单方无冲突的公司或其调查受托律师立场下制定内部调查方案与访谈计划：方案闸、Q#路径、PL#方案行（步骤类型/优先级与时序/访谈对象分层与顺序/禁止动作）。方案稿不是已执行。先谈开再取证不是合法顺序。无授权不是全员约谈。个保法第13条不是全员约谈。错误主张不关窗：先谈即合法、方案即已执行、无授权可全员约谈、个保13即全员约谈、第14条即方案已执行、统一口径即配合监察、交方案即从轻只关对应格，闸已开仍出其他PL#。双方秘密、威胁诱供、入侵黑客、秘密违法录音、扣留证件、向证人透露他人陈述施压、指导删除、伪造或倒签方案、阻挠检查方法第一次即整体停止，不得选边。闸关仍交十节，第6节不出PL#终稿。不实施访谈，不代取证，不代提交，未知不写零。"
