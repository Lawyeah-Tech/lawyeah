interface:
  display_name: "制定调查方案与访谈计划"
  short_description: "方案闸与PL#步骤草案；方案不是已调查，先谈话后取证不是可靠方案，第14条不是方案已执行"
  default_prompt: "使用 $制定调查方案与访谈计划，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）制定内部调查的步骤优先级与访谈顺序：方案闸、Q#路径、PL#方案行（步骤类型/顺序位/优先级/授权与个保边界/禁止动作/证人保护接口）。方案不是已经调查。提纲不是已访谈。计划不是完成。先谈话后取证不是可靠方案。全员监控不是调查步骤。口头授权不是可实施访谈。统一口径不是配合监察。第十四条不是方案已执行。错误主张不关窗：先谈话后取证即可靠、方案即已调查、提纲即已访谈、全员监控即步骤、口头即可实施、授权稿即已合法取证、统一口径即配合监察、第十四条即方案已执行，只关对应格，闸已开仍出其他PL#。双方秘密、伪造或倒签方案、指导违法取证、限制人身自由第一次即整体停止，不得选边。闸关仍交十节，第6节不出PL#终稿。不实施访谈，不违法取证，不代提交，未知不写零。"
