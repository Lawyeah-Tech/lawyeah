interface:
  display_name: "起草合规管理办法或章程级制度"
  short_description: "可审议的合规基本制度草案；不是已生效，遵守本办法不是免责"
  default_prompt: "使用 $起草合规管理办法或章程级制度，在单方无冲突立场下起草中国大陆企业可审议的合规基本制度草案：起草闸、制定机关与效力层级、Q#路径、N#办法草案（职责/例外批准/冲突规则/生效废止）、E#回链。草案不是已生效，不是已合规，不是公司章程已通过。错误主张不关窗：草案即已生效、遵守即免责、无留痕例外、民企套42号令第8条只关对应格，闸已开仍出其他N#。双方秘密、伪造已审议或倒签生效第一次即整体停止，不得选边。闸关仍交十节，第6节不出N#终稿。不替股东会改章程，不写劳动规章全文，不代提交，未知不写零。"
