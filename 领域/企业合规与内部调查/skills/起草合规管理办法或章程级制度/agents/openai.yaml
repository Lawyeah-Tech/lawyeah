interface:
  display_name: "起草合规管理办法或章程级制度"
  short_description: "可审议的合规基本制度草案；未审议不得写已生效，办法不是免责"
  default_prompt: "使用 $起草合规管理办法或章程级制度，在单方无冲突立场下起草中国大陆企业合规管理办法或章程级制度可审议草案：审议闸、主体与强制接口、Q#路径、T#制度条文、E#回链。可审议草案不是已生效，不是已审议通过，不是劳动规章，不是公司章程。未审议不得写已生效。错误主张不关窗：办法即免责、今天视为已生效、口头突破、民企套42号令或177、FCPA当中国法只关对应格，闸已开仍出其他T#。双方秘密、伪造审议记录、倒签生效第一次即整体停止，不得选边。闸关仍交十节，第6节不出T#终稿。不代提交，未知不写零。"
