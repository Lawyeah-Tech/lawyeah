interface:
  display_name: "评估打击报复风险"
  short_description: "迹象闸与RF#迹象草案；迹象不是已构成报复，有绩效不是没有报复"
  default_prompt: "使用 $评估打击报复风险，在单方无冲突、公司或举报人代理互斥立场下评估举报后不利人事或合同动作的报复迹象：迹象闸、主体与强制接口、Q#路径、RF#迹象行（对象/保护性活动时点/不利动作/决策人知情/官方理由可回链/三态）、E#回链。迹象不是已构成报复。不利动作不是当然报复。有绩效不是没有报复。错误主张不关窗：不利动作即当然报复、有绩效即没有报复、劳动法101套全部内部举报、会计法43当然恢复原职、民企套42号令第24条、迹象即已构罪、交表即从轻只关对应格，闸已开仍出其他RF#。双方秘密、指导继续实施打击报复、伪造或倒签绩效、指导删除第一次即整体停止，不得选边，不得问代表哪一方后继续。闸关仍交十节，第6节不出RF#终稿。有件无书面授权则部分打开。保护方案终稿、解除决定、原案属实转邻窗。不代处分，不代提交，未知不写零。"
