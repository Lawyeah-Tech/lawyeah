interface:
  display_name: "评估打击报复风险"
  short_description: "报复闸与RT#迹象草案；绩效不等于无报复，不写解除决定"
  default_prompt: "使用 $评估打击报复风险，在公司或举报人代理的单一无冲突立场下评估举报后不利人事或合同动作的报复迹象：报复闸、Q#路径、RT#迹象行（时序/知情/理由可回链性/三态）。有绩效记录不等于没有报复。组织调整不自动洗白。事后补做绩效不得覆盖原始时序。错误主张不关窗：绩效即无报复、组织调整洗白、已读即送达、匿名即诬告可处分、民企套42号令第24条必须认定报复只关对应格，闸已开仍出其他RT#。双方秘密、伪造绩效、倒签解除、继续实施报复第一次即整体停止，不得选边。闸关仍交十节，第6节不出RT#终稿。不认定原案属实，不写解除决定，不代提交，未知不写零。"
