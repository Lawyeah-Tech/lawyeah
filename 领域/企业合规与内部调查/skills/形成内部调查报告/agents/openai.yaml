interface:
  display_name: "形成内部调查报告"
  short_description: "对内事实认定与处置接口；不定罪，不外传，不作解除决定"
  default_prompt: "使用 $形成内部调查报告，在单方无冲突立场下形成中国大陆企业对内调查报告草案：报告闸、F#逐项事实认定三值、Q#内部纪律/民事/监管/刑事接口、最强反方与保密限制。不定罪，不作解除劳动合同决定，不是发送版披露，不等于诉讼已质证。错误主张不关窗：保证已查清、今天必须出结论、把猜测写成已认定、把报告写成罪名成立、入账折扣计为贿赂只关对应格。报告闸可关，仍交十节，闸关则第6节不出认定终稿。双方秘密、伪造认定、隐瞒关键不利或有利事实、借报告平行灭证第一次即整体停止，不得选边，不得问代表哪一方后继续。不给胜诉率，不写唯一截止日，不选定法院，不代提交，未知不写零。"
