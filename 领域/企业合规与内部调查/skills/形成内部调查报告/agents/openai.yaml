interface:
  display_name: "形成内部调查报告"
  short_description: "报告闸与F#草案；内部认定不是定罪，报告不是已查清终局，不是解除决定"
  default_prompt: "使用 $形成内部调查报告，在单方无冲突立场下形成中国大陆企业对内调查报告草案：报告闸、待证命题与材料碎片、Q#路径、F#认定行（命题/支持事实/不利事实/控制方/E#/判断三值）。开闸材料是可编号命题或缺口，不是口头已经查清。报告闸打开不等于已查清不等于罪名成立不等于已质证不等于解除已合法。口头已经查清不是已认定。材料不足不是没有问题。入账折扣不是贿赂。内部报告不是自首不是已获从轻。42号令第二十四条不是民企上报义务。无E#不得写已核实。错误主张不关窗：保证已查清、今天必须出结论、猜测写成已认定、报告写成罪名成立、入账折扣当贿赂、民企套177或42号令，只关对应格，闸已开仍出其他F#。报告窗第四槽用search_case_by_fact，禁止用范本生成已查清证明或解除决定。双方秘密、伪造认定、隐瞒关键事实、倒签、选择性不写、已有监察公安检察文书仍要拿掉不利段第一次即整体停止，不得选边。闸关仍交十节，第6节不出F#终稿。本窗闸名只能是报告闸，禁止复用调查闸、评估闸、启动闸、披露闸。预留不得占用立案闸、调查闸、检查闸。主行只能是F#，禁止A#、N#、JW#、BM#、PD#。主路径只用Q-认定，禁止Q-报、Q-认作主路径。邻窗Q-认定只作转介进本窗本窗打开为主路径不是已查清。不定罪、不作解除、不保证免责是交付禁令不是负触发，未知不写零。"
