interface:
  display_name: "协调跨境内部调查并分流涉外"
  short_description: "跨境闸与KJ#草案；境外母公司不是已可全球调取，外国特权不是中国法免交"
  default_prompt: "使用 $协调跨境内部调查并分流涉外，在单方无冲突的公司立场下划分跨境内部调查的境内可做段并分流涉外与数据：跨境闸、主体与法域切片、Q#路径、KJ#跨境行（法域切片/证据或证人所在/境内可做/冲突点/涉外接口/数据接口/E#）。开闸材料是可编号法域切片或境外证据碎片，不是口头总部全球一套。跨境闸打开不等于已可全球调取不等于外国特权已免交。境外母公司不是已可全球调取邮箱。外国特权不是中国法免交。FCPA不是中国法义务。境外证人不是必须出境调取。境外服务器不是必须本地镜像。外国律师函不是已阻断中国监管。错误主张不关窗：总部即可全球调取、ACP即免交、FCPA即中国法、证人必须出境、服务器必须镜像，只关对应格，闸已开仍出其他KJ#。类案只比较差异。双方秘密、隐匿境外证据或删除境外日志第一次即整体停止，不得选边。闸关仍交十节，第6节不出KJ#终稿。本窗闸名只能是跨境闸。不给出境传输方案，不写外国法结论，不定罪，不代提交，未知不写零。"
