interface:
  display_name: "合法收集书证电子证与财务痕迹"
  short_description: "收集闸与LG#日志草案；IT拷贝不是合法收集，缺校验不是已完整"
  default_prompt: "使用 $合法收集书证电子证与财务痕迹，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）按合法权限形成书证、电子数据与财务痕迹的收集日志草案：收集闸、Q#路径、LG#收集行（行类/载体/权限依据/提取人与见证人/范围/校验值/存放）。IT拷贝不是合法收集。无权限全盘镜像不是勤勉。口头授权不是可提取。授权稿不是已合法取证。手册邮箱查看权不是私人设备当然可取。缺校验不是已完整。错误主张不关窗：IT拷贝即合法、无权限镜像即勤勉、手册即私人设备可取、口头即可提取、授权稿即已合法取证、缺校验仍已完整、账外常见做法即已收集，只关对应格，闸已开仍出其他LG#。双方秘密、指导违法取证、入侵黑客、选择性毁证第一次即整体停止，不得选边。闸关仍交十节，第6节不出LG#终稿。不写调查结论，不给出境方案，不代提取，不代提交，未知不写零。"
