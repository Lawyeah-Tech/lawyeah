interface:
  display_name: "设计合规管理体系框架"
  short_description: "预防—发现—应对—整改闭环框架；不是已合规，缺一段不得称闭环"
  default_prompt: "使用 $设计合规管理体系框架，在单方无冲突立场下设计中国大陆企业综合合规管理体系框架：框架闸、主体与强制接口、Q#路径、W#框架模块（预防/发现/应对/整改×组织/政策/流程/监测/资源）、E#回链。从零可出W#草案，缺项记G#。框架不是已合规，缺一段不得称闭环。错误主张不关窗：框架即免责、最佳实践填满、民企套42号令或177、FCPA或萨班斯当中国法只关对应格，不得建议民企上报国资委。双方秘密、伪造已落地或先做假运行记录第一次即整体停止，不得选边。闸关仍交十节，第6节不出W#终稿。不写劳动规章全文，不代提交，未知不写零。"
