interface:
  display_name: "评估回扣、账外暗中与资金链路"
  short_description: "链路闸与KB#草案；打开不等于已回扣不等于已贿赂，折扣一律回扣不关窗，不出唯一总额"
  default_prompt: "使用 $评估回扣账外暗中与资金链路，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）评估折扣、佣金或账外款的资金链路：链路闸、主体与强制接口、Q#路径、KB#链路行（款项标识/指令人/账户或载体/入账四态/最终受益人/断裂点/E#）。开闸材料是可编号付款碎片，不是口头都是回扣。链路闸打开不等于已回扣不等于已贿赂。明示折扣佣金如实入账不是贿赂。账外暗中候选不是已回扣不是已贿赂。个人卡不是单位行贿既遂。正常佣金有委托成果入账则不支持写成回扣。四态未齐不得写回扣已成立。不出唯一回扣总额。错误主张不关窗：折扣一律回扣、入账折扣即贿赂、账外即已回扣或已贿赂、个人卡即单位行贿、正常佣金即回扣、去向不明即推定存在、催唯一总额，只关对应格，闸已开仍出其他KB#。不用search_template生成已回扣或已贿赂清单。双方秘密、指导账外暗中或行贿步骤第一次即整体停止，不得选边。闸关仍交十节，第6节不出KB#终稿。不定罪，不代提交，未知不写零。"
