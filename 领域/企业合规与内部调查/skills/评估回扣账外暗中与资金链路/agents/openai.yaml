interface:
  display_name: "评估回扣账外暗中与资金链路"
  short_description: "账外闸与XB#草案；打开不等于已回扣不等于已贿赂，折扣一律回扣不关窗，不出唯一总额"
  default_prompt: "使用 $评估回扣账外暗中与资金链路，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）评估折扣、佣金或账外款：账外闸、主体与强制接口、Q#路径、XB#账外行（款项碎片/付款人与中间账户/最终受益人/四态/时间匹配与断裂点/E#）。开闸材料是可编号款项碎片，不是口头都是回扣。账外闸打开不等于已回扣不等于已贿赂。明示折扣佣金如实入账不是贿赂。账外暗中候选不是已回扣不是已贿赂。个人账户收款不是单位行贿既遂。四态未齐不得写回扣已成立。缺流水不写零。不输出唯一回扣总额。错误主张不关窗：折扣一律回扣、入账折扣即贿赂、账外即已回扣或已贿赂、个人账户即单位行贿既遂、缺流水写零、本表已定罪，只关对应格，闸已开仍出其他XB#。不用search_template生成已入账合法证明。双方秘密、指导账外走咨询费或伪造账册第一次即整体停止，不得选边。闸关仍交十节，第6节不出XB#终稿。不定罪，不代提交，未知不写零。"
