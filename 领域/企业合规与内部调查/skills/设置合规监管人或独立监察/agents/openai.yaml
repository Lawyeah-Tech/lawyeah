interface:
  display_name: "设置合规监管人或独立监察"
  short_description: "监察闸与MO#草案；设置了不是监管已认可，顾问不是当然独立，辩护兼任不是独立"
  default_prompt: "使用 $设置合规监管人或独立监察，在单方无冲突的公司立场下设置董事会、监管协议或整改安排下的独立监察人选条件草案：监察闸、主体与强制接口、Q#路径、MO#监察行（人选/独立性/权限/报告线/任期/E#）。开闸材料是可编号整改来源或人选碎片，不是口头顾问就能当。监察闸打开不等于已任命不等于已独立不等于监管已认可。设置了不是监管已认可。项目顾问不是当然独立。现任辩护律师兼任不是独立。业务线选任考核不是独立。监管人不是第三道，不是CCO，不是检察第三方。错误主张不关窗：设置即已认可、顾问即独立、辩护兼任即独立、业务线选任即独立、自聘即检察第三方、民企必须外聘、FCPA monitor即中国法，只关对应格，闸已开仍出其他MO#。范本只借栏目，聘用合同或检察第三方协议不得升格已任命。双方秘密、指导被整改人改稿或伪造独立性第一次即整体停止，不得选边。闸关仍交十节，第6节不出MO#终稿。不保证监管认可，不签聘用合同正文，不含人事处分权，不代任免，未知不写零。"
