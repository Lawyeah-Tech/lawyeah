interface:
  display_name: "设置合规监管人或独立监察"
  short_description: "监察闸与MO#草案；设置不是监管已认可，原顾问不是独立"
  default_prompt: "使用 $设置合规监管人或独立监察，在单方无冲突的公司立场下设置独立监督整改的监管人或独立监察草案：监察闸、主体与强制接口、Q#路径、MO#监管人行（人选条件/选任考核/权限/报告线/利益冲突/任期更换/E#）。开闸材料是可编号来源或候选人碎片，不是口头已经有监察。监察闸打开不等于已任命不等于已独立不等于监管已认可。设置不是监管已认可。原顾问通常不独立。现任辩护律师同时当监察须拆分，该格不支持，窗口不关。独立监察不是国家监察机关。监管人不是检察第三方、不是第三道、不是首席合规官。不得由被整改业务线选任考核。报告线不得经被整改业务负责人改稿。权限不含人事处分、对外披露、阻挠检查。错误主张不关窗：设置即监管已认可、原顾问即独立、辩护律师兼监察即已隔离、向业务线汇报即独立、民企套42号令第十五条、FCPA monitor当中国法、保证过关，只关对应格，闸已开仍出其他MO#。范本只借栏目。双方秘密、指导伪造无冲突声明或阻挠合法检查第一次即整体停止，不得选边。闸关仍交十节，第6节不出MO#终稿。不签聘用合同正文，不保证监管认可，不定罪，不代提交，未知不写零。"
