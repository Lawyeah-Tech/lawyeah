interface:
  display_name: "落地集团政策到境内实体"
  short_description: "集团模板境内对照草案；总部印发不是已生效，原则适用不是已落地"
  default_prompt: "使用 $落地集团政策到境内实体，在单方无冲突的境内实体立场下把集团或境外模板落地为中国大陆可执行政策对照：落地闸、主体与强制本地接口、Q#路径、LD#保留／改写／删除行、E#回链。总部印发不是境内已生效。原则适用不是已落地。美国特权条款不能写成中国法免交理由。错误主张不关窗：原样适用、盖章即生效、FCPA当中国法、禁止外举只关对应格，闸已开仍出其他LD#。双方秘密、伪造境内审议或倒签生效第一次即整体停止，不得选边。闸关仍交十节，第6节不出LD#终稿。不给出境方案，不写境外当地法，不代提交，未知不写零。"
