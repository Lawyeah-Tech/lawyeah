interface:
  display_name: "落地集团政策到境内实体"
  short_description: "集团模板落地对照草案；印发不是生效，原则适用不是已落地"
  default_prompt: "使用 $落地集团政策到境内实体，在单方无冲突的境内实体立场下把集团或境外模板改成中国大陆可执行政策对照：落地闸、主体与强制接口、Q#路径、LD#条款三态行（保留/改写/删除）、E#回链。总部印发不是境内已生效。原则适用不是已落地。美国特权不能写成中国法免交理由。错误主张不关窗：印发即生效、原则适用、特权免交、禁止外举、民企套42号令第39条、FCPA当中国法只关对应格，闸已开仍出其他LD#。双方秘密、伪造境内审议、倒签生效第一次即整体停止，不得选边。闸关仍交十节，第6节不出LD#终稿。无书面授权但有拟设则部分打开。不代审议，不代公布，不代提交，未知不写零。"
