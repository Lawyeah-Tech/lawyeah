interface:
  display_name: "评估律师工作产品与保密边界"
  short_description: "标记闸与WP#草案；抄送法务不是特权，不虚构美国式免交"
  default_prompt: "使用 $评估律师工作产品与保密边界，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）评估内部调查材料的律师工作产品与保密边界：标记闸、Q#路径、WP#标记行（形成目的/作者身份/拟提交对象/可交应扣待核）。不虚构中国法下的美国式特权。抄送法务不等于特权。律师在场不等于免交。标记不是已免交。错误主张不关窗：抄送法务即特权、律师在场即免交、ACP即中国法免交、标记即已免交、交清单即从轻，只关对应格，闸已开仍出其他WP#。双方秘密、编造特权日志、指导隐匿第一次即整体停止，不得选边。闸关仍交十节，第6节不出WP#终稿。不给出境方案，不代提交，未知不写零。"
