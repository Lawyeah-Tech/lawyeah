interface:
  display_name: "准备根因分析与控制补强"
  short_description: "根因闸与YG#草案；品德不是根因闭合，再培训不是控制补强"
  default_prompt: "使用 $准备根因分析与控制补强，在单方无冲突的公司立场下对单件事件做控制失效根因与可验收补强草案：根因闸、主体与强制接口、Q#路径、YG#根因行（直接原因/控制缺口/治理缺口/补强动作/验收点/E#）。开闸材料是可编号事件或控制碎片，不是口头就是人品问题。根因闸打开不等于根因已闭合不等于控制已补强不等于已完成。处分员工不是根因闭合。再培训一次不是控制补强。员工品德不是唯一根因。计划不是已完成。入账折扣不是贿赂根因。错误主张不关窗：品德即根因、再培训即补强、计划即已完成、处分人即根因闭合、民企套42号令第23条、补强即免罚，只关对应格，闸已开仍出其他YG#。范本只借栏目。双方秘密、虚假完成或指导删除会计资料第一次即整体停止，不得选边。闸关仍交十节，第6节不出YG#终稿。不写处分决定，不定罪，不代提交，未知不写零。"
