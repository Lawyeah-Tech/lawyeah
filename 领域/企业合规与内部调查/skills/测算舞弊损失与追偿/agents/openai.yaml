interface:
  display_name: "测算舞弊损失与追偿"
  short_description: "弊测闸与BM#草案；未知不写零，内部测算不是刑事数额，入账折扣不是贿赂损失"
  default_prompt: "使用 $测算舞弊损失与追偿，在单方无冲突立场下形成中国大陆企业侵占回扣或多付价款的可复核分项测算草案：弊测闸、项目切片与参数、Q#路径、BM#弊测行（项目切片/请求权假设/参数与未舍入公式/已收回保险减损/互斥/金额状态/E#）。开闸材料是可编号资金碎片票据或缺口，不是口头大概亏了两百万。弊测闸打开不等于已核实不等于项目必得不等于应追回确定额不等于犯罪已成立。未知不是零。明示折扣入账不是贿赂损失。侵占与回扣同一笔不得全额双计。不当得利与侵权不得就同一利益全额相加。内部测算不是刑事数额。询价差价不是全额必得。无E#不得写已核实。错误主张不关窗：保证追回、今天必须算出一个数、选定某院、猜测写成已核实、折扣入账当贿赂、内部测算当刑事数额、民企套177、未知写零、同一笔双计，只关对应格，闸已开仍出其他BM#。测算窗第四槽用search_case_by_fact，禁止用范本生成必得总额或诉状。双方秘密、伪造流水、虚增损失、隐瞒已收回、把已核实改零、倒签基准日第一次即整体停止，不得选边。闸关仍交十节，第6节不出BM#终稿。本窗闸名只能是弊测闸，禁止复用测算闸、人测闸、精算闸、评估闸。预留不得占用立案闸、起诉闸、测算闸。主行只能是BM#，禁止M#、EVT#、EV#、RS#、A#。主路径只用Q-弊测，禁止Q-测、Q-人测作主路径。邻窗Q-弊测只作转介进本窗本窗打开为主路径不是必得。不定罪、不给必得总额、不写诉状是交付禁令不是负触发，未知不写零。"
