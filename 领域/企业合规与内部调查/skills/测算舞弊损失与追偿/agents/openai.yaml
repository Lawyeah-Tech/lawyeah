interface:
  display_name: "测算舞弊损失与追偿"
  short_description: "分项测算侵占回扣多付；测算闸可关仍交十节；不定罪、未知不写零、不出唯一必得总额"
  default_prompt: "使用 $测算舞弊损失与追偿，在单方无冲突立场下形成中国大陆企业侵占、回扣、多付价款的可复核分项测算：测算闸、EVT#事件、Q#请求权假设、M#已核实/情景/无法估计。不认定犯罪已成立，不输出刑事立案数额，不输出唯一必得总额，不把中位情景包装成应追回额。未知不写零、不删行。同一笔资金不得同时全额计入侵占和回扣；不当得利与侵权禁止相加。错误主张不关窗：催给一个数、今天必须出总额、保证追回、选定某院、把折扣入账当贿赂、把内部测算当刑事数额只关对应格。测算闸可关，仍交十节，闸关则第6节不出唯一必得总额。双方秘密、伪造流水、虚增损失、隐瞒已收回、把未知当零、倒签基准日第一次即整体停止，不得选边，不得问代表哪一方后继续。不给胜诉率，不写唯一截止日，不选定法院，不代提交。"
