interface:
  display_name: "准备董事会合规汇报材料"
  short_description: "可上会的合规提纲；不是已履职证据，总体可控不得覆盖未核验红旗，拿掉红旗第一次停"
  default_prompt: "使用 $准备董事会合规汇报材料，在单方无冲突立场下准备中国大陆企业向董事会或股东提交的合规状态书面提纲：汇报闸、对象与回避、Q#路径、N#提纲草稿（状态三态/已知红旗/待决/限制声明）、E#红旗回链。提纲不是已履职证据，不是审计意见，不是公告正文，不替董事会作决议。错误主张不关窗：总体可控覆盖红旗、提纲即已履职、汇报当审计、民企套42号令第8条只关对应格，闸已开仍出其他N#。要求拿掉已记录红旗第一次即整体停止，不提供干净版，不得选边。闸关仍交十节，第6节不出N#终稿。不代提交，未知不写零。"
