interface:
  display_name: "评估行业叠加义务并分流"
  short_description: "多专项信号并存时判定主成果归属；出现某词不是整案转出，不代做专项实体结论"
  default_prompt: "使用 $评估行业叠加义务并分流，在单方无冲突立场下评估中国大陆企业行业叠加义务并给出本领域保留段与转出清单：分流闸、专项信号、Q#路径、HD#主成果归属与转出对照。出现数据或竞争词汇不是整案转出。本窗不代做PIPL合法性、垄断协议效力、税务处理、劳动解除或刑事构成。错误主张不关窗：全面意见一次给完、出现某词即整案转、综合即可覆盖专项只关对应格。分流闸可关，仍交十节，闸关则第6节不出HD#终稿。双方秘密、伪造分流或移交记录第一次即整体停止，不得选边，不得问代表哪一方后继续。不选定机关，不代提交，未知不写零。"
