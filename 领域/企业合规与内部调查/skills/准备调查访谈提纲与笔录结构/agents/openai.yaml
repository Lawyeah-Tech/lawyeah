interface:
  display_name: "准备调查访谈提纲与笔录结构"
  short_description: "提纲闸与IQ#提纲笔录草案；提纲不是已访谈，笔录结构不是已签字，讯问笔录不是内部法定格式"
  default_prompt: "使用 $准备调查访谈提纲与笔录结构，在单方无冲突的公司或其调查受托律师立场下准备知情人或被调查人访谈提纲与笔录结构：提纲闸、Q#路径、IQ#行（对象分层/告知/问题簇/笔录栏目/双人/阅读修改确认/禁止口径）。提纲不是已访谈。笔录结构不是已签字。讯问笔录不是内部法定格式。单人闭门不是已可靠。交提纲不是从轻。错误主张不关窗：提纲即已访谈、笔录结构即已签字、讯问笔录即内部法定格式、单人闭门也可靠、交提纲即从轻只关对应格，闸已开仍出其他IQ#。双方秘密、强迫自证、威胁诱供、朗读他人陈述施压、秘密录音、伪造或倒签笔录、空白签名作为方法第一次即整体停止，不得选边。闸关仍交十节，第6节不出IQ#终稿。不实施访谈，不代讯问，不代提交，未知不写零。"
