interface:
  display_name: "设计第三方合规管理机制"
  short_description: "机制闸与TM#草案；承诺书不是已覆盖，无监测不是有效机制，印发不是已生效"
  default_prompt: "使用 $设计第三方合规管理机制，在单方无冲突的公司立场下设计经销商、代理、中介、顾问或高风险供应商廉洁管理机制草案：机制闸、主体与强制接口、Q#路径、TM#机制行（对象类型/风险级/准入/合同接口/监测复评/退出）。开闸材料是可编号拟设机制行或现行第三方管理碎片，不是口头签了承诺书就覆盖或印了就生效。承诺书不是已覆盖。准入表不是已覆盖。印发不是已生效。无监测则框架不支持有效机制。范本不是法定格式。中间人经销商代理同一套不得另开账外。错误主张不关窗：签承诺书即覆盖、准入表即已覆盖、印发即生效、纸面即有效、无监测即有效、范本即法定格式、民企套42号令第18条必须覆盖第三方、交机制稿即从轻或自首、FCPA即中国法义务，只关对应格，闸已开仍出其他TM#。双方秘密、指导账外佣金第一次即整体停止，不得选边。闸关仍交十节，第6节不出TM#终稿。不代印发，不代提交，未知不写零。"
