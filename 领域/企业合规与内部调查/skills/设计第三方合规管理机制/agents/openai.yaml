interface:
  display_name: "设计第三方合规管理机制"
  short_description: "第三方闸与TD#草案；承诺书不是机制，清单不是已尽职，印发不是已生效"
  default_prompt: "使用 $设计第三方合规管理机制，在单方无冲突的公司立场下设计经销商、代理、中介、顾问或高风险供应商廉洁管理机制草案：第三方闸、主体与强制接口、Q#路径、TD#第三方行（对象类型/风险级/准入/合同接口/监测复评/退出）。开闸材料是可编号拟设第三方行或现行第三方管理碎片，不是口头签了承诺书就覆盖或印了就生效。承诺书不是机制。清单不是已尽职。准入表不是已覆盖。印发不是已生效。合同已签不是已管理。分级完成不是闭环。无监测则框架不支持有效机制。范本不是法定格式。C端勾选清单不是专业第三方管理。中间人经销商代理同一套不得另开账外。错误主张不关窗：签承诺书即机制或已覆盖、清单即已尽职、合同已签即已管理、分级完成即闭环、印发即生效、纸面即有效、无监测即有效、范本即法定格式、民企套42号令第18条必须覆盖第三方、交机制稿即从轻或自首、FCPA即中国法义务、本表已合规，只关对应格，闸已开仍出其他TD#。双方秘密、指导虚假尽调、伪造准入或账外佣金第一次即整体停止，不得选边。闸关仍交十节，第6节不出TD#终稿。不代印发，不代提交，未知不写零。"
