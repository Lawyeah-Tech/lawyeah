interface:
  display_name: "准备中止或终止高风险第三方合作通知"
  short_description: "中止闸与SN#草案；内部决定不是已送达终止，已读不是已送达，依据不足不是对方已违约"
  default_prompt: "使用 $准备中止或终止高风险第三方合作通知，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）准备对高风险经销商、代理、中介或顾问的发送前中止或终止通知草案：中止闸、主体与强制接口、Q#路径、SN#中止通知行（对象/决定记录/合同条款定位/通知类型/正文要点/到达设计/E#）。开闸材料是可编号对象加内部决定或合同条款碎片，不是口头已经停了。中止闸打开不等于已发出不等于已送达不等于已解除。本窗不执行发送。内部决定不是已送达终止。已读不是已送达。通知不是刑事控告。依据不足不是对方已违约。无解除权的通知不发生解除效力。错误主张不关窗：内部决定即已送达、已读即已送达、依据不足即对方已违约、无决定即已发出、红旗即必须终止、本表已解除，只关对应格，闸已开仍出其他SN#。范本只借栏目，劳动解除或破产解除通知不得升格本窗。双方秘密、指导倒签回证或指示毁证第一次即整体停止，不得选边。闸关仍交十节，第6节不出SN#终稿。不定罪，不保证解除有效，不写合同全文，不代发送，未知不写零。"
