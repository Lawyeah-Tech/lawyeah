interface:
  display_name: "谈判民事追偿与返还方案"
  short_description: "追偿闸与ZC#草案；口头同意不是已返还，返还不是刑事从宽"
  default_prompt: "使用 $谈判民事追偿与返还方案，在单方无冲突的公司立场下准备对责任人或第三人的民事追偿与返还谈判方案草案：追偿闸、主体与强制接口、Q#路径、ZC#追偿行（相对人/请求权接口/底线/弃权范围/执行力提示/M#回链/E#）。开闸材料是可编号相对人或请求权碎片，不是口头他答应还了。追偿闸打开不等于已谈拢不等于已返还不等于已可执行。谈判方案不是已达成和解。口头同意不是已返还。谈拢不是已履行。返还不是刑事从宽承诺，不能承诺不起诉。概括弃权不得覆盖未知账户。无测算不得写唯一必得总额。错误主张不关窗：口头同意即已返还、谈拢即已履行、返还即不起诉、无测算写唯一总额、保证法院支持底线、选定某法院，只关对应格，闸已开仍出其他ZC#。范本只借栏目。双方秘密、指导伪造返还凭证或威胁第一次即整体停止，不得选边。闸关仍交十节，第6节不出ZC#终稿。不写已谈拢协议终稿，不定罪，不代提交，不代收款，未知不写零。"
