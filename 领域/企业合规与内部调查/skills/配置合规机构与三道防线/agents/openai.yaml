interface:
  display_name: "配置合规机构与三道防线"
  short_description: "职责矩阵与报告线草案；任命一人不是三道已建立，不保证监管认可"
  default_prompt: "使用 $配置合规机构与三道防线，在单方无冲突立场下配置中国大陆企业合规机构与三道防线：配置闸、主体与强制接口、Q#路径、OR#岗位行（一道/二道/三道×职责/隔离/报告线/授权边界）、E#回链。任命一人不是三道防线已建立。合同审核岗不是二道。挂名无授权不是已配置。错误主张不关窗：保证监管认可、民企套42号令第12条、一二道兼岗仍独立只关对应格，闸已开仍出其他OR#。双方秘密、伪造任命或组织图第一次即整体停止，不得选边。闸关仍交十节，第6节不出OR#终稿。不任免，不写劳动合同，不代提交，未知不写零。"
