interface:
  display_name: "配置合规机构与三道防线"
  short_description: "三道防线岗位草案；拟设不是已任命，挂名总监不是已建立"
  default_prompt: "使用 $配置合规机构与三道防线，在单方无冲突立场下配置中国大陆企业合规负责人、部门、业务管理员和报告线：配置闸、主体与强制接口、Q#路径、P#岗位行（职责/报告线/授权边界/兼岗隔离）、E#回链。拟设不是已任命，不是已独立，不是已合规。挂名总监不是三道已建立。合同审核不是二道。错误主张不关窗：挂名即已建立、合同审核即二道、配置即免责、民企套42号令或177、第十二条必须新增副总、保证监管认可、群已读即已任命只关对应格，闸已开仍出其他P#。双方秘密、伪造任命或隔离记录、倒签任命第一次即整体停止，不得选边。闸关仍交十节，第6节不出P#终稿。不代任免，不代签劳动合同，不代提交，未知不写零。"
