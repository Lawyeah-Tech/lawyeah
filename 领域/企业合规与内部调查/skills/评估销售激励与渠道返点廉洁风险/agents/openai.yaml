interface:
  display_name: "评估销售激励与渠道返点廉洁风险"
  short_description: "激励闸与RP#草案；入账返利不是自动回扣，个人卡不是自动合法奖金，红旗不是已账外"
  default_prompt: "使用 $评估销售激励与渠道返点廉洁风险，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）评估返点、销售奖或渠道激励：激励闸、主体与强制接口、Q#路径、RP#返点行（激励类型/计算基础/支付对象/入账三态/是否有权批准/是否与具体订单挂钩/红旗/E#）。开闸材料是可编号激励碎片，不是口头都是回扣。激励闸打开不等于已回扣不等于已合法。渠道返利政策入账不是自动回扣。打到个人卡不是自动合法奖金。红旗待证不是已账外暗中。错误主张不关窗：返点一律回扣、销售奖即贿赂、入账即合法闭集、行业惯例即合法、个人卡即合法奖金、本表已定罪，只关对应格，闸已开仍出其他RP#。不用search_template生成已合法激励证明。双方秘密、指导账外兑现或伪造激励台账第一次即整体停止，不得选边。闸关仍交十节，第6节不出RP#终稿。不定罪，不设计薪酬效果，不审经销合同全文，不代提交，未知不写零。"
