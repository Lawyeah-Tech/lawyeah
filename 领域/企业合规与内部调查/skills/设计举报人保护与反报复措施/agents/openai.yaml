interface:
  display_name: "设计举报人保护与反报复措施"
  short_description: "保护闸与PT#措施草案；方案不是已实施，调岗不是当然保护"
  default_prompt: "使用 $设计举报人保护与反报复措施，在单方无冲突的公司立场下设计举报人或证人的保护与反报复措施：保护闸、主体与强制接口、Q#路径、PT#措施行（对象/知悉范围/禁止动作/监测点）。保护方案不是已实施。纸面制度不是已有效。调岗隔离不是当然合法保护。公开表彰可能二次暴露。错误主张不关窗：纸面即已保护、调岗即保护、公开表彰即激励、绝对不泄露、民企套42号令第24条只关对应格，闸已开仍出其他PT#。双方秘密、以保护为名打击被举报人、伪造保护日志第一次即整体停止，不得选边。闸关仍交十节，第6节不出PT#终稿。报复是否已发生、劳动解除转邻窗。不代公布，不代提交，未知不写零。"
