interface:
  display_name: "设计举报人保护与反报复措施"
  short_description: "保护方案草案；公开表彰不是保护，不保证绝对不泄露，不写劳动处分"
  default_prompt: "使用 $设计举报人保护与反报复措施，在单方无冲突公司立场下设计举报人或证人的保护方案、知悉范围和报复监测点：保护闸、Q#路径、PR#保护行（对象/暴露/知悉名单/禁止动作/监测点）、E#回链。保护不是处分被举报人。公开表彰不是保护。不保证绝对不泄露。不写劳动处分。错误主张不关窗：表彰即保护、绝对不泄露、未立案推迟保护、民企套42号令第24条只关对应格，闸已开仍出其他PR#。双方秘密、以保护为名打击被举报人、指导追踪匿名、伪造保护记录第一次即整体停止，不得选边。闸关仍交十节，第6节不出PR#终稿。无书面授权但有对象则部分打开。不代处分，不代调岗，不代提交，未知不写零。"
