interface:
  display_name: "开展合规有效性评价"
  short_description: "可抽样可分级的正式评价草案；纸面不是有效，自选样本不是独立"
  default_prompt: "使用 $开展合规有效性评价，在单方无冲突立场下开展中国大陆企业可抽样、可分级的正式合规有效性评价：评价闸、期间与抽样框、Q#路径、SP#指标×样本×缺陷行、E#回链。纸面不是有效。自选样本不是独立。隐瞒样本外红旗不得写成总体有效。错误主张不关窗：评价即免责、体系完备、民企套42号令第27条、访谈填满缺口只关对应格，闸已开仍出其他SP#。双方秘密、伪造样本或抽掉不利样本第一次即整体停止，不得选边。闸关仍交十节，第6节不出SP#终稿。不替代财务审计或单件调查，不代提交，未知不写零。"
