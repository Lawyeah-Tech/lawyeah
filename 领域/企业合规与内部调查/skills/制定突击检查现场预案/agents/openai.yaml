interface:
  display_name: "制定突击检查现场预案"
  short_description: "预案闸与YU#草案；印发不是已过关，等律师不是拒绝配合，无证件不是关门藏物"
  default_prompt: "使用 $制定突击检查现场预案，在单方无冲突的公司立场下制定尚未被查时的突击检查现场预案草案：预案闸、主体与强制接口、Q#路径、YU#预案行（角色值班/证件核验/封存配合/禁止动作/演练/E#）。开闸材料是可编号角色或场所碎片，不是口头印了就过关。预案闸打开不等于已过关不等于已有效。印发不是已过关。演练不是已有效。联系律师不是拒绝配合。无证件不得视为合法检查，但不得暴力阻挠、不得关门藏物。错误主张不关窗：印发即已过关、演练即已有效、等律师即可拒绝配合、无证件即可关门藏物、今天必须保证过关、选定某局，只关对应格，闸已开仍出其他YU#。范本只借栏目。双方秘密、指导销毁藏匿或阻挠合法检查第一次即整体停止，不得选边。闸关仍交十节，第6节不出YU#终稿。不阻挠合法检查，不教藏匿，不保证过关，不选定机关，不代到场，未知不写零。"
