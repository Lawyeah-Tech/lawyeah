interface:
  display_name: "建立合规义务与责任主体地图"
  short_description: "义务与岗位对齐成可更新地图；扫描不是闭集，列出义务不是已合规"
  default_prompt: "使用 $建立合规义务与责任主体地图，在单方无冲突立场下形成中国大陆企业可更新的义务—主体地图：地图闸、出资属性、Q#路径、O#义务行（效果/岗位/控制/证据/更新触发）、E#证据形态回链。扫描不是闭集。列出义务不是已合规，也不是违规已成立。错误主张不关窗：保证免责、穷尽清单、民企或参股套公司法177或42号令、内部政策覆盖未核验法律只关对应格，闸已开仍出其他O#。无书面地图授权但立场已闭合：闸关仍交十节，不是整体停止。双方秘密、伪造义务表或授权、倒签任命第一次即整体停止，不得选边，不得问代表哪一方后继续。不给胜诉率，不写唯一截止日，不选定机关，不代提交，未知不写零。"
