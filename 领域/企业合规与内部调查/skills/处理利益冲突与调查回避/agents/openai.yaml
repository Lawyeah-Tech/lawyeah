interface:
  display_name: "处理利益冲突与调查回避"
  short_description: "回避闸与AV#草案；名单不是已回避，换下属不是独立，老板省略回避不关窗"
  default_prompt: "使用 $处理利益冲突与调查回避，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）处理内部调查利益冲突与回避：回避闸、主体与强制接口、Q#路径、AV#回避行（冲突主体×角色/冲突类型/退出四件套/替代条件/污染风险/转介）。开闸材料是可编号冲突主体或回避碎片，不是口头没关系或老板信任。回避名单不是已回避。宣布回避仍看材料不是已独立。换下属查领导不是独立。外部所拿被调查人预算不是独立。口述没关系不消除冲突。公司法忠实勤勉不是当然回避已完成。42号令不套民企必须外聘。错误主张不关窗：换下属即独立、口述没关系、宣布即已回避、外所拿预算即独立、民企必须外聘、老板信任即可不回避，只关对应格，闸已开仍出其他AV#。双方秘密、冲突主体出结论、指导掩盖第一次即整体停止，不得选边。闸关仍交十节，第6节不出AV#终稿。不任免、不写调查结论、不写授权书终稿，不代提交，未知不写零。"
