interface:
  display_name: "准备对内通报与对外口径"
  short_description: "口径闸与CM#分层草案；口径不是已披露，拟设句不是已发送，不出可发送N#"
  default_prompt: "使用 $准备对内通报与对外口径，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）准备调查后的对内通报与对外有限口径：口径闸、Q#路径、CM#口径行（受众/信息层级/事实三态/禁止项/拟用句/E#回链）。开闸材料是可编号受众或拟设口径句，不是口头已经对外说了或群已读。无书面授权但有拟设则部分打开。对外口径不是调查报告摘要公开。发送前稿不是已生效。群已读不是已送达。内部口径不是必须公告。一套稿打天下禁止。说个别员工仍可能可识别。未核验不得写成已查清。无验收不得写已全面整改。交口径表不是从轻或自首。民企套42号令不是必须通报。本窗不出可发送N#，不写公告正文，范本只借栏目不得升格已发送，不代发送，不选定媒体。错误主张不关窗：一套稿打天下、未核验即已查清、已全面整改、无问题、群已读即已通报、交表即从轻或自首、民企必须通报、口径即已披露，只关对应格或该句删除，闸已开仍出其他CM#。双方秘密、公开攻击举报人、编造已查清对外发布、指导泄露第一次即整体停止，不得选边。闸关仍交十节，第6节不出CM#终稿。"
