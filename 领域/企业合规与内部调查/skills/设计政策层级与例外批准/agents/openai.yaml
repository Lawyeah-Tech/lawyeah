interface:
  display_name: "设计政策层级与例外批准"
  short_description: "效力层级与例外留痕草案；口头不得高于书面，例外不是即合法"
  default_prompt: "使用 $设计政策层级与例外批准，在单方无冲突立场下设计中国大陆企业内部政策效力层级与例外批准机制：层级闸、主体与强制接口、Q#路径、LV#层级／冲突／例外行、E#回链。口头指示不得高于书面。无留痕例外不是已批准。例外批准不是即合法。错误主张不关窗：口头即已批准、例外即合法、只留有利版本、民企套42号令只关对应格，闸已开仍出其他LV#。双方秘密、伪造批准或倒签例外第一次即整体停止，不得选边。闸关仍交十节，第6节不出LV#终稿。不审查单份合同，不写劳动规章全文，不代提交，未知不写零。"
