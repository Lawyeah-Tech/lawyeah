interface:
  display_name: "梳理公职人员接触点与审批"
  short_description: "公职闸与GZ#草案；打开不等于已行贿不等于已批准，见过官员不是行贿，国企员工不是监察对象"
  default_prompt: "使用 $梳理公职人员接触点与审批，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）梳理招标、许可、执法或国企采购中的公职接触点与审批：公职闸、主体与强制接口、Q#路径、GZ#公职行（场景/对方身份三态/事项与时点/我方接触人/决策窗口/批准与双人在场/记录纪要/禁止利益红旗/E#）。开闸材料是可编号接触碎片，不是口头见过领导。公职闸打开不等于已行贿不等于已批准接触。接触不是行贿。见过官员不是行贿既遂。国企员工不是监察对象。身份不足该格停止窗口不关。事后补纪要不是已批准。临近招标评标许可不得标接触已合法。错误主张不关窗：见过官员即行贿、国企员工即监察对象、口头点头即已批准、事后补纪要即已批准、本表已定罪，只关对应格，闸已开仍出其他GZ#。不用search_template生成已批准接触清单。双方秘密、指导向公职行贿或串供第一次即整体停止，不得选边。闸关仍交十节，第6节不出GZ#终稿。不定罪，不辩护职务犯罪，不代提交，未知不写零。"
