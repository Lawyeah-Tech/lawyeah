interface:
  display_name: "梳理公职人员接触点与审批"
  short_description: "接触闸与TP#草案；打开不等于已行贿不等于已穷尽，见过官员不是行贿"
  default_prompt: "使用 $梳理公职人员接触点与审批，在单方无冲突的公司立场下（公司或其调查受托律师，互斥）梳理招标、许可、执法、国企采购等接触点：接触闸、主体与强制接口、Q#路径、TP#接触点行（事项/对方身份待核/我方人员/时点窗口/批准留痕/禁止利益/E#）。开闸材料是可编号接触碎片，不是口头见过局长或国企客户就是公职。接触闸打开不等于已行贿不等于已穷尽。见过官员不是行贿。国企员工不当然国家工作人员或监察对象。身份不足则该格字段停止，不是关窗也不是负触发。双人在场或有纪要不是已合规。事后补纪要不能治愈。不定罪。不辩护职务犯罪。错误主张不关窗：见过官员即行贿、接触即穷尽、身份不足关窗、公务接待一律合法、交表即从轻，只关对应格，闸已开仍出其他TP#。双方秘密、指导行贿或串供、补假批准第一次即整体停止，不得选边。闸关仍交十节，第6节不出TP#终稿。不代提交，未知不写零。"
