interface:
  display_name: "跟踪整改验收与复发监测"
  short_description: "跟踪闸与GZ#草案；台账全绿不是已验收，计划不是已完成"
  default_prompt: "使用 $跟踪整改验收与复发监测，在单方无冲突的公司立场下跟踪已布置整改动作是否真正闭合：跟踪闸、主体与强制接口、Q#路径、GZ#跟踪行（动作回链/到期/验收证据/运行样本/复发指标/观察窗/闭合判断/E#）。开闸材料是可编号动作或清单碎片，不是口头台账都绿了。跟踪闸打开不等于已闭合不等于已验收不等于控制已运行。整改台账全绿不是验收。再发制度不是控制已运行。培训签到单独不足。计划不是已完成。零举报不是无复发。逾期未完成不是阶段性完成。无运行样本不得写已验证。错误主张不关窗：台账全绿即已验收、再发制度即已运行、培训签到即已闭合、零举报即无复发、计划即已完成、逾期即阶段性完成，只关对应格，闸已开仍出其他GZ#。范本只借栏目。双方秘密、倒签验收或虚假完成第一次即整体停止，不得选边。闸关仍交十节，第6节不出GZ#终稿。本窗闸名只能是跟踪闸，禁止复用整改闸、根因闸、验收闸。不替代检察验收，不定罪，不代提交，未知不写零。"
