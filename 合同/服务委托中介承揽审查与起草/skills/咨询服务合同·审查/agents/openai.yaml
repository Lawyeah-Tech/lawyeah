interface:
  display_name: "咨询服务合同·审查"
  short_description: "审查待签咨询服务合同。成果须是咨询意见，不得保证固定节约或回报，顾问不得代决策或拨付款，限额须保留人身损害、故意或重大过失、侵权与泄密除外。"
  default_prompt: "使用 $咨询服务合同·审查，在单一立场下审查中国大陆待签咨询服务合同。核对成果是否仅为咨询意见、是否禁止固定节约或固定回报、权限是否不含代决策或拨付款、责任限额是否保留故意重大过失与泄密除外；给出可回给对方的修改句。不要审查技术咨询合同、委托合同、广告设计合同或广告制作合同；无文本但本类型条件已谈妥则转配对 ·起草 原子。"
