interface:
  display_name: "“一二级联动” 相关合同·起草"
  short_description: "按已谈妥条件起草一二级联动相关合同并自审。一级可委托、二级必须招拍挂；只拆捆绑并补未摘牌退出；禁止保证摘牌、两套文本或排他门槛。"
  default_prompt: "使用 $“一二级联动”相关合同·起草，在单一立场下审查中国大陆待签“一二级联动”相关合同（委托合同）。先核对是不是纯土地一级开发委托（是则转 土地一级开发委托合同·审查），是不是名为一级实为投资或借贷（是则转 名为一级开发实为借贷·审查）；本类型必须拆开一级整理与二级拿地捆绑，经营性用地不得写成保证摘牌或定向出让；招拍挂规避、排他竞买门槛、阴阳合同、出让金直接返还只告知不设计可履行结构；行政协议不得约定有效仲裁。给出可回给对方的修改句。不要输出诉讼或仲裁策略，不要保证协议有效；无文本但本类型条件已谈妥则起草并自审。"
