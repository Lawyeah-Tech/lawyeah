interface:
  display_name: "框架加订单承揽·审查"
  short_description: "审查待签“合同 + 订单”模式承揽合同：核对订单确认才成立、授权名册、框架标准库与批次验收、第七百八十七条预警与呆滞料、对账和最低或预估量；禁止未确认即成立，禁止套用买卖检验或所有权保留默认。"
  default_prompt: "使用 $框架加订单承揽·审查，在单一立场下审查中国大陆待签“合同 + 订单”模式承揽合同。核对订单确认才成立、授权名册、框架标准库与批次验收、第七百八十七条预警与呆滞料、对账和最低或预估量；禁止未确认即成立，禁止套用买卖检验或所有权保留默认。给出可回给对方的修改句。"
