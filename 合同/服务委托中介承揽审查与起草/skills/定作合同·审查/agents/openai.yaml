interface:
  display_name: "定作合同·审查"
  short_description: "审查待签定作合同：核对承揽人供主材、规格图纸封样附件化、主要工作亲自完成、交付前风险由承揽人承担、验收留置和第七百八十七条解除赔偿；规格图纸封样缺一不得放行，禁止解除不赔和货交承运人默认。"
  default_prompt: "使用 $定作合同·审查，在单一立场下审查中国大陆待签定作合同。核对承揽人供主材、规格图纸封样附件化、主要工作亲自完成、交付前风险由承揽人承担、验收留置和第七百八十七条解除赔偿；规格图纸封样缺一不得放行，禁止解除不赔和货交承运人默认。给出可回给对方的修改句。"
