interface:
  display_name: "技术转让中介合同·审查"
  short_description: "审查待签技术转让中介合同：核只报告订立技术转让合同的机会、报酬绑本约生效或首期款或登记、第九百六十五条跳单范围与例外、书面权属成熟度瑕疵报告、核心披露前保密协议；禁止签字即全额和中介自己让与技术。"
  default_prompt: "使用 $技术转让中介合同·审查，在单一立场下审查中国大陆待签技术转让中介合同。核对只报告订立技术转让合同的机会、报酬绑本约生效或首期款或登记、第九百六十五条跳单范围与例外、书面权属成熟度瑕疵报告、核心披露前保密协议；禁止签字即全额和中介自己让与技术。给出可回给对方的修改句。"
