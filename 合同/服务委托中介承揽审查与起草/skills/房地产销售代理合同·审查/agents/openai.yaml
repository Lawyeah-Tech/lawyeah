interface:
  display_name: "房地产销售代理合同·审查"
  short_description: "审查待签房地产销售代理合同：核开发商委托人并以委托人名义推销指定房号、代理佣金基数与节点、购房款进开发商监管账户、经纪备案与预售或现售许可；禁止无证预售、代收房款进私户和返本销售。"
  default_prompt: "使用 $房地产销售代理合同·审查，在单一立场下审查中国大陆待签房地产销售代理合同。核对开发商委托人并以委托人名义推销指定房号、代理佣金基数与节点、购房款进开发商监管账户、经纪备案与预售或现售许可；禁止无证预售、代收房款进私户和返本销售。给出可回给对方的修改句。"
