interface:
  display_name: "建设工程招投标中介合同·审查"
  short_description: "审查待签建设工程招投标中介合同：核投标人委托信息报告或媒介、不保证中标、成功佣金绑中标通知书与施工合同签署、报酬与必要费用拆开；禁止串标回扣、保证中标和要求持旧招标代理资格证。"
  default_prompt: "使用 $建设工程招投标中介合同·审查，在单一立场下审查中国大陆待签建设工程招投标中介合同。核对投标人委托信息报告或媒介、不保证中标、成功佣金绑中标通知书与施工合同签署、报酬与必要费用拆开；禁止串标回扣、保证中标和要求持旧招标代理资格证。给出可回给对方的修改句。"
