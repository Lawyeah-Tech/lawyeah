interface:
  display_name: "房地产销售代理合同·起草"
  short_description: "按已谈妥条件起草房地产销售代理合同并用硬闸自审：写入开发商委托人并以委托人名义推销指定房号、代理佣金基数与节点、购房款进开发商监管账户、经纪备案与预售或现售许可；不得无证预售、代收房款进私户或返本销售。"
  default_prompt: "使用 $房地产销售代理合同·起草，在单一立场下按已谈妥条件起草中国大陆房地产销售代理合同，出稿后用硬闸自审。写入开发商委托人并以委托人名义推销指定房号、代理佣金基数与节点、购房款进开发商监管账户、经纪备案与预售或现售许可；不得无证预售、代收房款进私户或返本销售。"
