interface:
  display_name: "建设工程招投标中介合同·起草"
  short_description: "按已谈妥条件起草建设工程招投标中介合同并用硬闸自审：写入投标人委托信息报告或媒介、不保证中标、成功佣金绑中标通知书与施工合同签署、报酬与必要费用拆开；不得串标回扣、保证中标或要求持旧招标代理资格证。"
  default_prompt: "使用 $建设工程招投标中介合同·起草，在单一立场下按已谈妥条件起草中国大陆建设工程招投标中介合同，出稿后用硬闸自审。写入投标人委托信息报告或媒介、不保证中标、成功佣金绑中标通知书与施工合同签署、报酬与必要费用拆开；不得串标回扣、保证中标或要求持旧招标代理资格证。"
