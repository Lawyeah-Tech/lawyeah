interface:
  display_name: "拆迁委托协议·审查"
  short_description: "审查待签拆迁委托协议。委托人须是征收部门；权限封闭为具体工作；补偿协议由征收部门盖章；固定劳务费；评估另选，拆除另约；征收决定、补偿决定、强执不得外包。"
  default_prompt: "使用 $拆迁委托协议·审查，在单一立场下审查中国大陆待签拆迁委托协议。核对核心给付是否为房屋征收部门委托实施单位承担征收与补偿的具体工作，而不是对被征收人的补偿安置、一级开发、代建或拆除施工；受托权限是否排除征收决定、补偿决定和申请法院强制执行；实施单位是否被写成可自行代签补偿协议并冒充征收机关；费用是否按补偿款抽成或包干结余归乙方；是否约定非法逼迁。给出可回给对方的修改句。不要审查拆迁补偿安置协议，不要打开 的method，禁止把本约改成对被征收人的补偿安置文本。；无文本但本类型条件已谈妥则转配对 ·起草 原子。"
