interface:
  display_name: "委托技术开发合同·起草"
  short_description: "按已谈妥条件起草委托技术开发合同并用硬闸自审：写入三新标的、申请权默认归研究开发人并写清委托人实施与优先受让、任务书量化、技术风险分担、经费与报酬分列；不得把无约定写成归委托人或当然共有。"
  default_prompt: "使用 $委托技术开发合同·起草，在单一立场下按已谈妥条件起草中国大陆委托技术开发合同，出稿后用硬闸自审。写入三新标的、申请权默认归研究开发人并写清委托人实施与优先受让、任务书量化、技术风险分担、经费与报酬分列；不得把无约定写成归委托人或当然共有。"
