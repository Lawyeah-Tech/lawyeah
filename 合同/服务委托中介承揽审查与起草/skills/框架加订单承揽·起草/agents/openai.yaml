interface:
  display_name: "框架加订单承揽·起草"
  short_description: "按已谈妥条件起草“合同 + 订单”模式承揽合同并用硬闸自审：写入订单确认才成立、授权名册、框架标准库与批次验收、第七百八十七条预警与呆滞料、对账和最低或预估量；未确认订单不得写成已成立，不得套用买卖检验或所有权保留默认。"
  default_prompt: "使用 $框架加订单承揽·起草，在单一立场下按已谈妥条件起草中国大陆“合同 + 订单”模式承揽合同，出稿后用硬闸自审。写入订单确认才成立、授权名册、框架标准库与批次验收、第七百八十七条预警与呆滞料、对账和最低或预估量；未确认订单不得写成已成立，不得套用买卖检验或所有权保留默认。"
