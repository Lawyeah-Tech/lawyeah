interface:
  display_name: "房地产委托代建合同·审查"
  short_description: "审查待签房地产委托代建合同。核心是管理费代建，不是施工总包；产权和投资风险留委托方；建设成本由委托方承担；责任以管理过错为限。禁止共担共享、垫资加固定回报或分房抵费。"
  default_prompt: "使用 $房地产委托代建合同·审查，在单一立场下审查中国大陆待签房地产委托代建合同。核对核心给付是否为全过程开发管理、对价是否为代建管理费而不是合作开发共担共享、施工承包、政府投资代建、股权跟投或贷款配资；建设资金是否由委托方承担；产权是否始终归委托方；代建方责任是否被写成无限质量连带；给出可回给对方的修改句。不要审查房地产合作开发合同、土地使用权项下委托代建合同、建设工程施工合同、商业代建合同、政府代建合同、资本代建合同、股权代建合同或商业代建加贷款配资合同；无文本但本类型条件已谈妥则转配对 ·起草 原子。"
