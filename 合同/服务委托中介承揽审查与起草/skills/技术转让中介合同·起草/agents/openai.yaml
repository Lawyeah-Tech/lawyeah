interface:
  display_name: "技术转让中介合同·起草"
  short_description: "按已谈妥条件起草技术转让中介合同并用硬闸自审：写入只报告订立技术转让合同的机会、报酬绑本约生效或首期款或登记、第九百六十五条跳单范围与例外、书面权属成熟度瑕疵报告、核心披露前保密协议；不得签字即全额，不得中介自己让与技术。"
  default_prompt: "使用 $技术转让中介合同·起草，在单一立场下按已谈妥条件起草中国大陆技术转让中介合同，出稿后用硬闸自审。写入只报告订立技术转让合同的机会、报酬绑本约生效或首期款或登记、第九百六十五条跳单范围与例外、书面权属成熟度瑕疵报告、核心披露前保密协议；不得签字即全额，不得中介自己让与技术。"
