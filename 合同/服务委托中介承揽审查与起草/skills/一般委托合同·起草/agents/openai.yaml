interface:
  display_name: "一般委托合同·起草"
  short_description: "按已谈妥条件起草一般委托合同并用硬闸自审：写入事务边界与对外名义、第九百三十三条任意解除及赔偿、费用默认委托人预付、转委托同意、授权四要素和隐名披露；不得写放弃任意解除且无效，不得空白授权。"
  default_prompt: "使用 $一般委托合同·起草，在单一立场下按已谈妥条件起草中国大陆一般委托合同，出稿后用硬闸自审。写入事务边界与对外名义、第九百三十三条任意解除及赔偿、费用默认委托人预付、转委托同意、授权四要素和隐名披露；不得写放弃任意解除且无效，不得空白授权。"
