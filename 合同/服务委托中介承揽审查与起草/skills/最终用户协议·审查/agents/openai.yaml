  short_description: "审查待签最终用户协议：按格式条款与个人信息切开核对点击生效与重大利害提示、账号与封号清算、隐私独立成文、通知删除、七日变更公示和自动续费可取消；禁止最终解释权、概括免责和封号即没收。"
  default_prompt: "使用 $最终用户协议·审查，在单一立场下审查中国大陆待签最终用户协议。按格式条款与个人信息切开核对点击生效与重大利害提示、账号与封号清算、隐私独立成文、通知删除、七日变更公示和自动续费可取消；禁止最终解释权、概括免责和封号即没收。给出可回给对方的修改句。"
