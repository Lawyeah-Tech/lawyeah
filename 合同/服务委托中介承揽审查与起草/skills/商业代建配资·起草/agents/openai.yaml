interface:
  display_name: "商业代建配资·起草"
  short_description: "按已谈妥条件起草商业代建配资并用硬闸自审：写入代建与配资双实联立、利率与费用并表、担保权利人与出借人一致、协助与承诺分列；不得违约即接管或一元收股，不得把利息藏进代建费或默写24%/36%。"
  default_prompt: "使用 $商业代建配资·起草，在单一立场下按已谈妥条件起草中国大陆商业代建配资，出稿后用硬闸自审。写入代建与配资双实联立、利率与费用并表、担保权利人与出借人一致、协助与承诺分列；不得违约即接管或一元收股，不得把利息藏进代建费或默写24%/36%。"
