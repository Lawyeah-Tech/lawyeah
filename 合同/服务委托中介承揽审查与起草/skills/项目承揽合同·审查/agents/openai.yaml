interface:
  display_name: "项目承揽合同·审查"
  short_description: "审查待签项目承揽合同：核对简易项目切开施工、主要工作亲自完成、第一千一百九十三条选任过错与意外险、隐蔽验收、款不超进度和第七百八十七条解除赔偿；禁止占农田或拆承重，禁止写成业主无责保证。"
  default_prompt: "使用 $项目承揽合同·审查，在单一立场下审查中国大陆待签项目承揽合同。核对简易项目切开施工、主要工作亲自完成、第一千一百九十三条选任过错与意外险、隐蔽验收、款不超进度和第七百八十七条解除赔偿；禁止占农田或拆承重，禁止写成业主无责保证。给出可回给对方的修改句。"
