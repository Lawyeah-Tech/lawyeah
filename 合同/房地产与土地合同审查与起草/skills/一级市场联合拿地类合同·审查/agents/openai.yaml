interface:
  display_name: "一级市场联合拿地类合同·审查"
  short_description: "审查待签一级市场联合拿地合同，盯联合体协议不是出让合同、出资轴与操盘轴分条、失败回溯与对外连带。"
  default_prompt: "使用 $一级市场联合拿地类合同·审查，在单一立场下审查中国大陆待签一级市场联合拿地类合同。核对核心给付是否为土地使用权尚未取得前的联合竞买与成交后移交，而不是出让合同、联合勾地或已经持证后的合作开发；出资与操盘是否分条；未竞得是否自动终止后续股权安排；最高限价、截胡、对外连带与对内追偿是否锁定；给出可回给对方的修改句。不要审查国有土地使用权出让合同、联合勾地协议或房地产合作开发类合同；无文本但本类型条件已谈妥则起草并自审。"
