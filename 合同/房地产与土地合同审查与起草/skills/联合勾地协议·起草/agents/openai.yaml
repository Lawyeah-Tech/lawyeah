interface:
  display_name: "联合勾地协议·起草"
  short_description: "起草联合勾地协议，写入联合体或项目公司身份、份额、举牌授权和最高限价，不得写确保摘牌。"
  default_prompt: "使用 $联合勾地协议·起草，在单一立场下审查中国大陆待签联合勾地协议。核对核心给付是否为挂牌前企业间资源互换并锁定联合竞买身份与份额，而不是与非出让人的单方勾地、政府预申请、已公告宗地联合体竞买或拿地后合作开发；竞买身份与保证金／出让金／股权份额是否闭合；举牌人与最高限价是否落句；是否写成确保拿地、陪标或无监管打款；拍不到／超限／规划变更退出是否可执行。给出可回给对方的修改句。不要审查与非出让人签订的勾地协议、用地预申请协议、一级市场联合拿地类合同或房地产合作开发类合同；无文本但本类型条件已谈妥则起草并自审。"
