  default_prompt: "使用 $城市更新项目前期服务合同·起草，在单一立场下审查中国大陆待签城市更新项目前期服务合同（房地产合同）。先核对是不是开发商与前期服务公司合作、村企合作开发或股权合作（是则分别转 城更合作（开发商与前期服务）·审查、城更合作（村集体与企业）·审查、城更股权合作·审查），是不是拆迁委托或普通咨询（是则转 意向合作）。禁止打开上述method当本类型主路径。禁止抄 或 拆迁委托）或／的method当本类型主路径。禁止把拆迁委托拆迁补偿咨询服务或合作开发正文抄进本任务。）。本类型只评改协助与顾问性质的前期服务，不得把服务公司写成当然实施主体或锁死后续开发权；服务费不是投资款；民主决策未见则字段停止。给出可回给对方的修改句。不要输出诉讼或仲裁策略，不要保证协议有效；无文本但本类型条件已谈妥则起草并自审。"
