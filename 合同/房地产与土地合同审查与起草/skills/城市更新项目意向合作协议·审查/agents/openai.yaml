interface:
  display_name: "城市更新项目意向合作协议·审查"
  short_description: "审查待签城更意向合作协议，盯有约束力模块分列、排他有截止日、保证金不是定金，不代表实施主体。"
  default_prompt: "使用 $城市更新项目意向合作协议·审查，在单一立场下审查中国大陆待签城市更新项目意向合作协议。核对核心给付是否为招商或确定合作主体之前的排他谈判、前期配合和意向保证金，而不是前期服务费结算、正式村企开发合作、股权合作或补偿安置；标题写意向是否被误当成整份无约束力，或反过来被写成已锁定实施权；排他期有无上限；保证金是否被当成定金或打入个人账户。给出可回给对方的修改句。不要把意向改成已锁定的实施权，不要打开 城市更新项目前期服务合同·审查 或 城更合作（村集体与企业）·审查；无文本但本类型条件已谈妥则起草并自审。"
