interface:
  display_name: "与非出让人签订的勾地协议·审查"
  short_description: "审查待签非出让人勾地协议，盯管委会平台无权出让、推动挂牌不直接给予，返还出让金只告知。"
  default_prompt: "使用 $与非出让人签订的勾地协议·审查，在单一立场下审查中国大陆待签与非出让人签订的勾地协议。核对相对人是否为管委会、土地储备中心、镇政府等非法定出让人而不是自然资源主管部门，文本是否被写成出让合同或保证拿地，是否免除招拍挂或内定中标，是否返还土地出让金或先缴后返，地块是否毛地，保证金是否被写成定金；给出可回给对方的修改句。不要审查联合勾地协议或国有土地使用权出让合同；无文本但本类型条件已谈妥则起草并自审。"
