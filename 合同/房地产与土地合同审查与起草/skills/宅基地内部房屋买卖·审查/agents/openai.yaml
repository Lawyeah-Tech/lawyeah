interface:
  display_name: "宅基地内部房屋买卖·审查"
  short_description: "审查待签宅基地内部房屋买卖合同，盯买受人须本集体成员、地随房走，对外转让只告知。"
  default_prompt: "使用 $宅基地内部房屋买卖·审查，在单一立场下审查中国大陆待签宅基地房屋买卖合同（集体经济组织内部）。核对买卖双方是否均为同一农村集体经济组织成员，标的是否为地上房屋连同占用范围内宅基地使用权而不是土地所有权，户内共有人是否全体同意，集体书面同意与转移登记是否被误写成签字即物权或未登记则合同未生效，有无把对外转让、永久租赁或合作开发改成可履行结构；给出可回给对方的修改句。不要审查宅基地房屋租赁或委托运营合同、宅基地合作开发合同、一般商品房买卖合同或二手房（存量房）买卖合同。非本集体成员购买只告知无效风险，不改成可过户文本；无文本但本类型条件已谈妥则起草并自审。"
