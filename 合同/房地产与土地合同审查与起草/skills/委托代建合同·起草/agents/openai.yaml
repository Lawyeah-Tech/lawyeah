interface:
  display_name: "委托代建合同·起草"
  short_description: "起草委托代建合同，写入权属仍归委托方、代建费分账，不得写成施工总包或合作开发。"
  default_prompt: "使用 $委托代建合同·起草，在单一立场下审查中国大陆待签委托代建合同（土地使用权）。核对委托方是否土地使用权人、权属是否不转移、对价是管理费还是共担风险或固定回报、对外签约以谁的名义、费用与风险是否分账；给出可回给对方的修改句。不要审查房地产合作开发类合同、建设工程施工合同，也不要按委托合同族房地产/商业/政府代建合同的主路径改；无文本但本类型条件已谈妥则起草并自审。"
