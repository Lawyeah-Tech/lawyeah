interface:
  display_name: "集体建设用地使用权出资入股合同·起草"
  short_description: "起草集体建设用地出资入股合同，写入评估作价与三分之二决议，不得名股实债或住宅化。"
  default_prompt: "使用 $集体建设用地使用权出资入股合同·起草，在单一立场下审查中国大陆待签集体建设用地使用权出资入股合同。核对核心给付是否为已登记集体经营性建设用地使用权作价换股权而不是出让金、租金或利润分成，是否附具法定评估报告和成员大会或成员代表大会三分之二书面决议，入市方案是否已报市、县人民政府，规划条件、产业准入和生态环境保护要求是否写入书面合同，使用权变更登记与公司股权登记是否分列；给出可回给对方的修改句。不要审查集体建设用地使用权出让合同、租赁合同或集体建设用地合作开发合同，不要打开或复制 $集体建设用地使用权出让合同·审查 的方法；无文本但本类型条件已谈妥则起草并自审。"
