interface:
  display_name: "城更合作（开发商与前期服务）·起草"
  short_description: "起草城更开发商与前期服务合作合同，写入服务费阶梯和节点KPI，不得写成利润分成或确保中选。"
  default_prompt: "使用 $城更合作（开发商与前期服务）·起草，在单一立场下审查中国大陆待签城市更新项目合作合同（开发商与前期服务公司）。核对当事人是否为开发商委托前期服务公司、成功标准是否锁在委托方正式签约成为合作企业、对价是否为阶梯服务费而不是利润分成或股权、是否出现包办批文或空转咨询费、村集体筹码与排他跳单是否闭合；给出可回给对方的修改句。不要审查城市更新项目前期服务合同、股权合作合同、村集体与合作企业合同或土地使用权合作开发合同；无文本但本类型条件已谈妥则起草并自审。"
