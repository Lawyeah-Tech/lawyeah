interface:
  display_name: "用地预申请协议·起草"
  short_description: "起草用地预申请协议，写入承诺报价与公开出让安排，承诺价不得当底价，保证金不得当定金，不得锁定向出让。"
  default_prompt: "使用 $用地预申请协议·起草，在单一立场下审查中国大陆待签用地预申请协议。核对相对方是否为市、县自然资源主管部门，核心给付是否只是承诺参加招拍挂、换取约定期限内组织公开出让，而不是非出让人勾地、联合勾地或已经成交的出让合同；删除定向出让和萝卜条款；把承诺价与法定评估底价分开；把保证金与定金分开；给出可回给对方的修改句。不要审查与非出让人签订的勾地协议、联合勾地协议或国有土地使用权出让合同；无文本但本类型条件已谈妥则起草并自审。"
