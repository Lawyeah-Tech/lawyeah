interface:
  display_name: "宅基地房屋租赁运营·审查"
  short_description: "审查待签宅基地房屋租赁或委托运营合同，盯租赁不等于委托运营，租赁截到二十年，名委实租按租赁审。"
  default_prompt: "使用 $宅基地房屋租赁运营·审查，在单一立场下审查中国大陆待签宅基地房屋租赁合同或委托运营合同。核对核心给付是租赁还是委托运营，租期是否超过二十年或被委托标签规避，出租人是否宅基地权利人且户内共有人是否闭合，承租人是否被写成可过户买受人；与宅基地房屋买卖、宅基地合作开发、国有土地房产租赁切开；给出可回给对方的修改句。不要审查宅基地房屋买卖合同、宅基地合作开发合同或城市房产租赁合同；无文本但本类型条件已谈妥则起草并自审。"
