interface:
  display_name: "集体建设用地合作开发合同·审查"
  short_description: "审查待签集体建设用地合作开发合同，盯入市决议、共担亏损、房屋登记在集体名下，禁止分割过户或小产权。"
  default_prompt: "使用 $集体建设用地合作开发合同·审查，在单一立场下审查中国大陆待签集体建设用地合作开发合同。核对核心给付是否为集体以已登记经营性建设用地出地、合作方出资并共同经营、利润或经营权分成且集体不持股，而不是出让金过户、作价入股或租金占场；入市方案和成员书面决议是否闭合；风险是否共担；房屋是否被写成可分割过户或对外销售住宅。给出可回给对方的修改句。不要审查集体建设用地使用权出让合同、出资入股合同、租赁合同，也不要按国有出让地房地产合作开发或宅基地合作开发改完；无文本但本类型条件已谈妥则起草并自审。"
