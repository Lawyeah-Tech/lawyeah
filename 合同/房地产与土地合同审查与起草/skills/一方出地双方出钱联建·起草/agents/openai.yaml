interface:
  display_name: "一方出地双方出钱联建·起草"
  short_description: "起草一方出地双方出钱联建合同，写入双方建设资金、同比例跟投和超支追加，预售款不得充抵出资。"
  default_prompt: "使用 $一方出地双方出钱联建·起草，在单一立场下审查中国大陆待签“一方出地，双方出钱”型联建合同。核对核心给付是否为一方提供国有出让建设用地、出地方与合作方均出建设资金、通常不设项目公司并对实物或销售款分配，而不是出地方只出地、双方各自出地、项目公司股权合作、一方操盘、隐名参建或固定回报。给出可回给对方的修改句。不要打开或复制 一方出地一方出钱联建·审查 的方法，也不要按项目公司合作开发改完；无文本但本类型条件已谈妥则起草并自审。"
