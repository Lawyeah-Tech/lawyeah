interface:
  display_name: "拆迁补偿安置协议·审查"
  short_description: "审查待签拆迁补偿安置协议，盯征收主体与书面委托、国有与集体补偿项目分列、先补偿后搬迁。"
  default_prompt: "使用 $拆迁补偿安置协议·审查，在单一立场下审查中国大陆待签拆迁补偿安置协议。核对征收主体是否为房屋征收部门或县级以上地方人民政府组织的部门，而不是指挥部、项目公司或拆迁事务所冒充征收机关；补偿项目是否分列房屋价值或集体土地法定项目、搬迁费、临时安置、停产停业损失，而不是一口价吞项；核心给付是否为对被征收人的补偿安置，而不是征收部门与实施单位之间的拆迁委托。给出可回给对方的修改句。不要审查拆迁委托协议，不要打开 意向合作）。禁止打开上述method当本类型主路径。禁止抄；无文本但本类型条件已谈妥则起草并自审。"
