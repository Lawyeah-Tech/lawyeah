interface:
  display_name: "集体建设用地使用权租赁合同·起草"
  short_description: "起草集体建设用地租赁合同，写入不超过二十年的租期和租金，不得一次性锁死四五十年。"
  default_prompt: "使用 $集体建设用地使用权租赁合同·起草，在单一立场下审查中国大陆待签集体建设用地使用权租赁合同（土地使用权）并给出可回给对方的修改建议。租期适用民法典第七百零五条，不得超过二十年，超过部分无效；出租方案须经农村集体经济组织成员大会或成员代表大会依法决议；禁止把本约改写成集体建设用地使用权出让或农地承包经营权／土地经营权流转，禁止抄国有建设用地租赁或宅基地房屋租赁审查路径；无文本但本类型条件已谈妥则起草并自审。"
