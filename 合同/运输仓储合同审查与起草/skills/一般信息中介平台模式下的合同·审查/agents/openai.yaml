interface:
  display_name: "一般信息中介平台模式下的合同·审查"
  short_description: "审查待签信息中介平台合同，盯只撮合信息不承运、逐项排除订约签单收运费开运输票，故意重大过失不得预免。"
  default_prompt: "使用 $一般信息中介平台模式下的合同·审查，在单一立场下审查中国大陆待签一般信息中介平台模式下的合同。核对核心给付是否只撮合货源与运力、不承运、不签发运单、不收运费、不开运输发票；与网络货运、货运代理、客运／网约车切开；给出可回给对方的修改句。不要打开网络货运、货运代理、技术转让中介、道路运输总类或客运的审查方法。不要按网货实际承运人或货代改完；无文本但本类型条件已谈妥则起草并自审。"
