interface:
  display_name: "道路货物运输合同·起草"
  short_description: "起草道路货物运输合同，写入道路许可、道路运单、4.5吨核验和危货道路许可。"
  default_prompt: "使用 $道路货物运输合同·起草，在单一立场下审查中国大陆待签道路货物运输合同。核对核心给付是否为机动车公路货移、道路运输经营许可证与车辆道路运输证是否覆盖货类或是否有4500千克以下普通货运豁免事实、运单是否作为合同组成部分、是否引用失效汽车货规、危货是否另有道路危货许可与从业资格、超限超载约定能否对抗行政处罚、挂靠或无资质过车是否被改成可履行结构；给出可回给对方的修改句。不要按一般货运原子把道路特别法省略，也不要把只撮合的货代或网络货运平台入驻规则硬套本类型；无文本但本类型条件已谈妥则起草并自审。"
