interface:
  display_name: "水路运输合同·起草"
  short_description: "起草水路运输合同，先标航区和客货，江海直达分段，不用海商法第四章免责。"
  default_prompt: "使用 $水路运输合同·起草，在单一立场下审查中国大陆待签水路运输合同。先识别航区是内河或国内沿海还是经海路，再识别对象是旅客还是货物，并确认是否夹带公路、铁路或航空区段；核对是否误用海商法第四章、是否引用已废止的国内水路货物运输规则、是否客货混用一张免责、是否货船载客。给出可回给对方的修改句。不要审查已锁定的水路乘客或水路货物专用合同，也不要审查海上运输合同、多式联运合同或道路运输合同；无文本但本类型条件已谈妥则起草并自审。"
