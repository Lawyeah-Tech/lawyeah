interface:
  display_name: "海上运输合同·起草"
  short_description: "起草海上运输合同，写出航区与三轨，单据匹配航区，客货分项分轨。"
  default_prompt: "使用 $海上运输合同·起草，在单一立场下审查中国大陆待签海上运输合同（运输合同总类或框架）。先判定是否经海路、是否适用海商法、适用第四章还是第五章；中国港口之间的海上货物运输不得适用第四章；与海上货物运输合同、海上乘客运输合同以及内河水路运输切开，不要把货或客并进本原子；核对识别表、适用法分轨、单据与航区是否匹配、客货是否混用免责；给出可回给对方的修改句。不要审查已拆清的海上货物或海上旅客本约，不要审查水路运输合同，不要抄水路运输的审查方法；无文本但本类型条件已谈妥则起草并自审。"
