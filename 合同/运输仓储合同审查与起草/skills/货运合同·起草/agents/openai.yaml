interface:
  display_name: "货运合同·起草"
  short_description: "起草货运合同，落运单记载、掌管期间货损、835返还运费、836本票留置和829交付前变更。"
  default_prompt: "使用 $货运合同·起草，在单一立场下审查中国大陆待签货运合同。核对核心给付是否为货物位移与完好交付、运单是否作为合同组成部分并记载品名件数重量包装收货人、货损是否按掌管期间及到达地市价、不可抗力灭失运费是否返还、留置是否限于本票货物、拒领是否走提存、交付前变更是否保留通知时点与费用、危货是否书面说明并有许可；给出可回给对方的修改句。不要审查客运、只存货的仓储、只撮合的货代、多式联运或铁路/航空/海商特别法主路径，也不要把货代签发运单假装已经切开承运责任；无文本但本类型条件已谈妥则起草并自审。"
