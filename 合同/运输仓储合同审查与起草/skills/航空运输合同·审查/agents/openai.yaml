interface:
  display_name: "航空运输合同·审查"
  short_description: "审查待签航空运输合同，先按连结点切开国内或国际，核对许可和代码共享披露，禁止共用一段限额。"
  default_prompt: "使用 $航空运输合同·审查，在单一立场下审查中国大陆待签航空运输合同。先核对出发地点、约定经停地点和目的地点：三点均在境内的单一国内运输转国内航空专项，任一点在境外或接续运输作为一项单一国际业务的转国际航空专项，禁止把国内限额规定与华沙公约或蒙特利尔公约写成同一主路径，禁止把华沙或蒙特利尔印到国内航段。核对是否出具客票或航空货运单并负责运达、公共航空运输经营许可、缔约承运人与实际承运人是否披露、客货责任是否分轨、是否一句“按民航规定/视同国内/排除公约”、延误是否被写成不可抗力、空运单是否被写成提单、是否引用失效客货规；给出可回给对方的修改句。不要按国内航空或国际航空专项把父级切开省略；无文本但本类型条件已谈妥则起草并自审。"
