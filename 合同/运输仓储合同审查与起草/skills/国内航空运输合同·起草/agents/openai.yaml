interface:
  display_name: "国内航空运输合同·起草"
  short_description: "起草国内航空运输合同，三点境内，写入国内限额、声明价值和客货行李分轨。"
  default_prompt: "使用 $国内航空运输合同·起草，在单一立场下审查中国大陆待签国内航空运输合同。核对出发、约定经停和目的是否均在境内，适用民用航空法国内规则和《国内航空运输承运人赔偿责任限额规定》而不是蒙特利尔公约，旅客、行李与货物是否分轨，限额是否提示且不得压低，是否提供声明价值，延误超售是否与法定责任分开，代码共享是否披露实际承运人；给出可回给对方的修改句。不要审查国际航空运输合同或未分流的航空运输合同，不要打开或复制邻类航空 method；无文本但本类型条件已谈妥则起草并自审。"
