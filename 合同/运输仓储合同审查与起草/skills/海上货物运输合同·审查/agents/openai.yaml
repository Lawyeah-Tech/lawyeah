interface:
  display_name: "海上货物运输合同·审查"
  short_description: "审查待签海上货物运输合同，盯装港卸港与航区、提单种类份数电放、责任期间，中国港口间不适用第四章。"
  default_prompt: "使用 $海上货物运输合同·审查，在单一立场下审查中国大陆待签海上货物运输合同或班轮／无船承运提单运输条件。先核装港卸港是否中国港口之间从而决定海商法第四章是否适用，再核集装箱与非集装箱的责任期间是否短于第四十六条，提单或海运单种类、正本份数、电放与凭单放货，单位责任限制是按件还是按公斤及有无申报价值，签单人是承运人还是仅代理；与水路货物运输、海上旅客运输和海上运输总类切开。给出可回给对方的修改句。不要审查水路货物运输合同、海上乘客运输合同或纯订舱货运代理合同；无文本但本类型条件已谈妥则起草并自审。"
