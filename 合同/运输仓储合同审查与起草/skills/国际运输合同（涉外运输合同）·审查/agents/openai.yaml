interface:
  display_name: "国际运输合同（涉外运输合同）·审查"
  short_description: "审查待签国际运输合同，盯跨境连结点、特别法与公约优先于意思自治、强制公约不得排除。"
  default_prompt: "使用 $国际运输合同（涉外运输合同）·审查，在单一立场下审查中国大陆待签国际运输合同（涉外运输合同）。先核出发地、约定经停地、目的地是否跨境并标明海／空／铁／多式，再锁准据法、强制或可约定适用的公约、争议解决和单证；不要按国内货运货损公式审，不要按单一国际航空计算责任限额，不要打开国内运输、国际航空、海上货物、多式联运、一般客运或一般货运的 method。三点均在境内转到国内运输审查，一般客运或一般货运转到对应专档，货损或伤亡限额公式转到国际航空或海上货物运输专档，多式联运区段限额转到多式联运专档，只代办订舱报关转到货运代理。给出可回给对方的修改句；无文本但本类型条件已谈妥则起草并自审。"
