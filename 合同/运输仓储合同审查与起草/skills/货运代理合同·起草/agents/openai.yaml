interface:
  display_name: "货运代理合同·起草"
  short_description: "起草货运代理合同，写清委托事项、代理费和签单身份；以承运人身份签单须按承运人担责。"
  default_prompt: "使用 $货运代理合同·起草，在单一立场下审查中国大陆待签货运代理合同。先核核心给付是处理运输事务、纯信息撮合还是承诺运达，再核是否无船承运或以自己名义签发提单或运单、费用是代理费还是包干差价。给出可回给对方的修改句。不要按一般货运、道路货物、海上货物或网络货运的承运主路径审完，也不要把签单承运外观或无船承运假装已经切开；无文本但本类型条件已谈妥则起草并自审。"
