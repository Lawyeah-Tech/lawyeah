interface:
  display_name: "增信措施类保证合同·审查"
  short_description: "审查增信措施类保证待签文本。先按解释三十六条判断差额补足、流动性支持或回购是保证、债务加入还是仅合同义务，付给谁与触发公式须可算，定性为保证后期间与方式仍须显化。"
  default_prompt: "使用 $增信措施类保证合同·审查，在单一立场下审查中国大陆待签增信措施类保证合同。先按担保制度解释第三十六条判断差额补足、流动性支持或回购承诺是否构成保证、债务加入或仅合同义务，再与安慰函、独立保函切开；核决议是否覆盖该增信、禁止主体、保证期间与方式、差额或回购公式是否可算；给出可回给对方的修改句。不要审查已点名的一般保证或连带责任保证主文件、最高额保证、独立保函或安慰函。"
