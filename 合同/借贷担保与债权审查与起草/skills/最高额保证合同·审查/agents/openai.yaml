interface:
  display_name: "最高额保证合同·审查"
  short_description: "审查最高额保证待签文本。须同时具备限额、连续发生与确定期间，限额是本金还是债权总额须显化，确定期间与保证期间拆开，方式不明按一般保证。"
  default_prompt: "使用 $最高额保证合同·审查，在单一立场下审查中国大陆待签最高额保证合同。主线是最高债权额加上一定期间连续发生的债权，不是单笔保证，也不是独立保函。必须写清限额是本金限额还是债权总限额；决议必须覆盖该限额，决议只批单笔却签最高额按越权红线。债权确定期间和保证期间拆开写：确定期间管哪些债权进入担保池，保证期间按解释第三十条两支起算，还清为止按解释第三十二条六个月处理该段。方式不明仍按一般保证，最高额不自动变成连带。不得把单笔主合同无效写成一律不影响最高额保证，不得改成独立保函。给出可回给对方的修改句，不要保证有效，不要写争议策略。"
