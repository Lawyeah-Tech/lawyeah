interface:
  display_name: "广义民间借款合同·审查"
  short_description: "审查广义民间借款待签文本。出借人须未持牌，混主体书面诺成而非一律实践，利率费用合计不超过成立时一年期LPR四倍，预扣按到账本金，企业侧要决议。"
  default_prompt: "使用 $广义民间借款合同·审查，在单一立场下审查中国大陆待签广义民间借款合同。核对出借人是否未持牌、是否一方自然人与一方非金融企业互借或存在平台/电子外壳、利率是否按合同成立时一年期 LPR 四倍、是否预扣利息、企业侧有无章程规定的决议、不得把合同写成实践合同。给出可回给对方的修改句。不要审查持牌金融机构贷款、双方自然人实践性借款、企业间生产经营拆借或狭义偶发民间借款，不要把职业放贷、转贷或平台资金池改成可履行结构。"
