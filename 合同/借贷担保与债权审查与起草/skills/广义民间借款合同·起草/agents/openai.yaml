interface:
  display_name: "广义民间借款合同·起草"
  short_description: "按已谈妥条件起草广义民间借款合同。点明出借人未持牌、混主体书面诺成、利率费用合计不超成立时一年期LPR四倍、到账本金与企业决议；出稿后按上述硬闸自审。"
  default_prompt: "使用 $广义民间借款合同·起草，按已谈妥条件起草中国大陆广义民间借款合同。核对出借人是否未持牌、是否一方自然人与一方非金融企业互借或存在平台/电子外壳、利率是否按合同成立时一年期 LPR 四倍、是否预扣利息、企业侧有无章程规定的决议、不得把合同写成实践合同。给出可回给对方的修改句。不要审查持牌金融机构贷款、双方自然人实践性借款、企业间生产经营拆借或狭义偶发民间借款，不要把职业放贷、转贷或平台资金池改成可履行结构。"
