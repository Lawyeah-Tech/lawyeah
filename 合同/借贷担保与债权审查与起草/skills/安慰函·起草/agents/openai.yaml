interface:
  display_name: "安慰函·起草"
  short_description: "按已谈妥条件起草安慰函。只写知晓、关注、督促、尽合理努力；硬词出现则提示后果，不改成保证合同或独立保函；出稿后按上述硬闸自审。"
  default_prompt: "使用 $安慰函·起草，按已谈妥条件起草中国大陆安慰函、维好协议、意愿书或支持函。主线是正文有没有担保意思，不是保证期间或先诉抗辩。仅知晓、关注、督促、尽合理努力不得写成已经是保证；出现代为清偿、负责解决欠款、不使债权人受损，只提示可能按保证处理，不得把本函改成保证合同或见索即付。见索即付或 URDG 转 独立保函·审查；差额补足、流动性支持、回购承诺主文件转 增信措施类保证合同·审查。机关或公益主体硬函只出告知，不改成可履行保证。给出可回给对方的修改句，不要保证有效，不要写争议策略。"
