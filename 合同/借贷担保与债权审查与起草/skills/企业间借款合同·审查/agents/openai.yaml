interface:
  display_name: "企业间借款合同·审查"
  short_description: "审查企业间借款待签文本。双方须为非金融企业且出借人未持牌，用途写生产经营，利率走成立时一年期LPR四倍，预扣按到账本金，大额拆借要决议。"
  default_prompt: "使用 $企业间借款合同·审查，在单一立场下审查中国大陆待签企业间借款合同。核对双方是否均为非金融企业、用途是否生产经营、资金是否自有、利率是否按合同成立时一年期 LPR 四倍、是否预扣利息、大额拆出拆入有无章程规定的董事会或股东会决议；给出可回给对方的修改句。不要审查持牌金融机构贷款或自然人之间的借款，不要把职业放贷或转贷改成可履行结构，也不要把保底投资或过户担保写成可履行流质。"
