interface:
  display_name: "安慰函·审查"
  short_description: "审查安慰函、维好协议或支持函待签文本。只看有没有担保意思，知晓、关注、督促、尽合理努力不得写成已经是保证；出现硬词只提示后果，不改成保证或见索即付。"
  default_prompt: "使用 $安慰函·审查，在单一立场下审查中国大陆待签安慰函、维好协议、意愿书或支持函。主线是正文有没有担保意思，不是保证期间或先诉抗辩。仅知晓、关注、督促、尽合理努力不得写成已经是保证；出现代为清偿、负责解决欠款、不使债权人受损，只提示可能按保证处理，不得把本函改成保证合同或见索即付。见索即付或 URDG 转 独立保函·审查；差额补足、流动性支持、回购承诺主文件转 增信措施类保证合同·审查。机关或公益主体硬函只出告知，不改成可履行保证。给出可回给对方的修改句，不要保证有效，不要写争议策略。"
