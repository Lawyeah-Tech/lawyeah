interface:
  display_name: "企业间借款合同·起草"
  short_description: "按已谈妥条件起草企业间借款合同。写明双方非金融企业、出借人未持牌、生产经营用途、成立时一年期LPR四倍、到账本金与大额拆借决议；出稿后按上述硬闸自审。"
  default_prompt: "使用 $企业间借款合同·起草，按已谈妥条件起草中国大陆企业间借款合同。核对双方是否均为非金融企业、用途是否生产经营、资金是否自有、利率是否按合同成立时一年期 LPR 四倍、是否预扣利息、大额拆出拆入有无章程规定的董事会或股东会决议；给出可回给对方的修改句。不要审查持牌金融机构贷款或自然人之间的借款，不要把职业放贷或转贷改成可履行结构，也不要把保底投资或过户担保写成可履行流质。"
