interface:
  display_name: "增信措施类保证合同·起草"
  short_description: "按已谈妥条件起草增信措施类保证合同。分层写清意思，付给谁、触发、公式、划款时限可算，定性为保证后期间与方式显化并按对外担保核决议；出稿后按上述硬闸自审。"
  default_prompt: "使用 $增信措施类保证合同·起草，按已谈妥条件起草中国大陆增信措施类保证合同。先按担保制度解释第三十六条判断差额补足、流动性支持或回购承诺是否构成保证、债务加入或仅合同义务，再与安慰函、独立保函切开；核决议是否覆盖该增信、禁止主体、保证期间与方式、差额或回购公式是否可算；给出可回给对方的修改句。不要审查已点名的一般保证或连带责任保证主文件、最高额保证、独立保函或安慰函。"
