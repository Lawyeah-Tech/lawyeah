interface:
  display_name: "一般保证合同·起草"
  short_description: "按已谈妥条件起草一般保证合同。写明一般保证、先诉路径、主债名称编号金额期限，期间不明按六个月；出稿后按上述硬闸自审。"
  default_prompt: "使用 $一般保证合同·起草，按已谈妥条件起草中国大陆一般保证合同。先诉抗辩是灵魂：修改句必须写清主合同纠纷未经审判或仲裁、并就债务人财产依法强制执行仍不能履行前，保证人有权拒绝；不得改成债权人可直接请求。约定不明按一般保证，不得用原担保法默认连带。未约定或还清为止视为六个月，期间内须对债务人起诉或申请仲裁。主债权必须特定。口头放弃先诉抗辩不成立。连带责任保证、独立保函、安慰函、最高额文本负触发。给出可回给对方的修改句，不要保证有效，不要写争议策略。"
