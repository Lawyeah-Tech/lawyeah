interface:
  display_name: "房产赠与合同·起草"
  short_description: "按已谈妥条件起草房产赠与合同，登记写成物权变动；未公证不得空写不可撤销。逃债或规避限购不得改成可履行稿。出稿后自审。"
  default_prompt: "使用 $房产赠与合同·起草，在单一立场下审查中国大陆待签房产赠与合同。核对核心给付是否为无偿转移房屋权利而不是亲属间房屋赠与或买卖，物权变动是否以登记为准而不是交钥匙，变更登记前第658条任意撤销窗口是否被无公证的“不可撤销”虚假关闭，有无第538条逃债或规避限购信号，税费和受赠人资格是否写清；给出可回给对方的修改句。不要审查亲属间房屋赠与合同、一般赠与合同或房屋买卖合同；无文本但本类型条件已谈妥则起草并自审。"
