interface:
  display_name: "借名购房型赠与·起草"
  short_description: "按已谈妥条件起草借名购房型赠与，三选一写死赠与房屋权益或已付资金；借名留房或规避限购不得改成可履行稿。出稿后自审。"
  default_prompt: "使用 $借名购房型赠与·起草，在单一立场下审查中国大陆待签“以他人名称购房并支付房款” 型赠与合同。先判断借名购房出资外观下究竟是赠与房屋权益、赠与已付资金还是借名留房；核对是否商品房买卖本约或让与担保式房产买卖；房屋权益是否盯登记、金钱是否盯到账；第658条窗口是否被付款或未公证本确认书虚假关闭；有无限购规避或把撤销写成开发商必须改名。给出可回给对方的修改句。不要审查一般商品房买卖合同、让与担保式房产买卖合同、一般赠与合同、公益道德义务赠与、婚姻家庭赠与或不直接支付对价的财产转移；无文本但本类型条件已谈妥则起草并自审。"
