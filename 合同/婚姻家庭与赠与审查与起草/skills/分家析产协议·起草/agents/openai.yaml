interface:
  display_name: "分家析产协议·起草"
  short_description: "按已谈妥条件起草分家析产协议，只分家庭共有并附清单；登记前不写成已取得物权。逃债分割不得入稿。出稿后自审。"
  default_prompt: "使用 $分家析产协议·起草，在单一立场下审查中国大陆待签分家析产协议。核对标的是否属于家庭共有而非夫妻共同财产或父母个人财产赠与、全体共同共有人是否签字、协议是否把签字日写成已经取得物权、未登记能否对抗债权人和善意第三人、分家前共同债务是否仍对外连带；给出可回给对方的修改句。不要审查离婚协议、夫妻财产约定、赠与合同、遗嘱或遗赠扶养协议，也不要把真析产改成可任意撤销的赠与；无文本但本类型条件已谈妥则起草并自审。"
