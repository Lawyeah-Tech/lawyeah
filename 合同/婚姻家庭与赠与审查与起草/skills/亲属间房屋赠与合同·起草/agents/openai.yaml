interface:
  display_name: "亲属间房屋赠与合同·起草"
  short_description: "按已谈妥条件起草亲属间房屋赠与合同，登记写成物权变动时点；未公证不得写不可撤销，交钥匙不得写成已取得所有权。出稿后自审。"
  default_prompt: "使用 $亲属间房屋赠与合同·起草，在单一立场下审查中国大陆待签亲属间房屋赠与合同。核对房屋是否无偿过户而非买卖、登记权利人与共有人是否全部签署、任意撤销是否误用亲属身份替代公证、占有交付是否被写成已经赠与完成；给出可回给对方的修改句。不要审查一般赠与、非亲属房产赠与、商品房或二手房买卖，也不要把商品房五证或买卖网签当主路径；无文本但本类型条件已谈妥则起草并自审。"
