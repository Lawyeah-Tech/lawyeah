interface:
  display_name: "房产赠与合同·审查"
  short_description: "审待签房产赠与合同：登记才物权变动；交钥匙不是已取得所有权；未公证空写不可撤销挡不住第658条；逃债或规避限购只告知。"
  default_prompt: "使用 $房产赠与合同·审查，在单一立场下审查中国大陆待签房产赠与合同。核对核心给付是否为无偿转移房屋权利而不是亲属间房屋赠与或买卖，物权变动是否以登记为准而不是交钥匙，变更登记前第658条任意撤销窗口是否被无公证的“不可撤销”虚假关闭，有无第538条逃债或规避限购信号，税费和受赠人资格是否写清；给出可回给对方的修改句。不要审查亲属间房屋赠与合同、一般赠与合同或房屋买卖合同；无文本但本类型条件已谈妥则起草并自审。"
