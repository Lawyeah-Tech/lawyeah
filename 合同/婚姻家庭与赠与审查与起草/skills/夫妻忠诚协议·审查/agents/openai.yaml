interface:
  display_name: "夫妻忠诚协议·审查"
  short_description: "审待签夫妻忠诚协议：只核可分财产后果；人身限制、强制同居、限制离婚自由删除或降格意愿声明，不得当可履行结构宣传。"
  default_prompt: "使用 $夫妻忠诚协议·审查，在单一立场下审查中国大陆待签夫妻忠诚协议：删除人身自由限制，把财产惩罚按可分性改成特定、可执行且保留生存份额的处分，切开夫妻财产约定和分手协议，给出可回给对方的修改句。不要起草整份协议，不要把人身限制或限制离婚自由改成可履行结构，不要保证整份必然有效或净身出户必然执行。无文本但本类型条件已谈妥则转 $夫妻忠诚协议·起草。"
