interface:
  display_name: "零对价股权赠与·起草"
  short_description: "按已谈妥条件起草零对价股权赠与，落通知与优先购买程序；国资零元、无税承诺或空写不可撤销不得入稿。出稿后自审。"
  default_prompt: "使用 $零对价股权赠与·起草，在单一立场下审查中国大陆待签股权赠与合同或零元股权转让协议。零元或赠与外观不等于有偿股权转让；一块钱、日后补偿、以股抵债按转股切开。核对对外赠与是否书面通知其他股东，零元无法提供同等价格时是否约定公平合理价格供优先购买；章程同意、配偶同意、质权人同意是否作为先决。税费须列承担方，不得约定不申报。是否与股权转让、出资、一般赠与、公益赠与、婚姻家庭赠与切开；名册记载和变更登记是否分列；变更登记前第658条任意撤销窗口是否被无公证的“不可撤销”虚假关闭；零元是否被写成无出资义务；有无第538条逃债信号。给出可回给对方的修改句。不要审查有对价的股权转让合同、出资合同、一般赠与合同、公益道德赠与或婚姻家庭赠与合同；无文本但本类型条件已谈妥则起草并自审。"
