interface:
  display_name: "公益、道德义务性质的赠与合同·起草"
  short_description: "按已谈妥条件起草公益、道德义务性质的赠与合同，用途可回链；虚假公益、个人账户收款或无资格公募不得入稿。出稿后自审。"
  default_prompt: "使用 $公益道德义务性质的赠与合同·起草，在单一立场下审查中国大陆待签公益、道德义务性质的赠与合同或捐赠协议。核对应否与一般赠与、附义务赠与、遗赠切开；用途事实能否打开民法典第658条第2款关闭任意撤销并激活第660条请求交付；第663条法定撤销和第666条穷困抗辩（公开承诺或书面慈善捐赠须向县级以上人民政府民政部门报告并公开说明）是否分轨保留；对公账户和捐赠票据是否写清。给出可回给对方的修改句。不要按普通赠与或遗赠改完，也不要把看护、居住、供养改成公益外壳；无文本但本类型条件已谈妥则起草并自审。"
