interface:
  display_name: "借名购房型赠与·审查"
  short_description: "审待签借名购房型赠与：房屋权益、已付资金、借名代持须三选一写死；规避限购只告知；撤销不等于开发商必须改名。"
  default_prompt: "使用 $借名购房型赠与·审查，在单一立场下审查中国大陆待签“以他人名称购房并支付房款” 型赠与合同。先判断借名购房出资外观下究竟是赠与房屋权益、赠与已付资金还是借名留房；核对是否商品房买卖本约或让与担保式房产买卖；房屋权益是否盯登记、金钱是否盯到账；第658条窗口是否被付款或未公证本确认书虚假关闭；有无限购规避或把撤销写成开发商必须改名。给出可回给对方的修改句。不要审查一般商品房买卖合同、让与担保式房产买卖合同、一般赠与合同、公益道德义务赠与、婚姻家庭赠与或不直接支付对价的财产转移；无文本但本类型条件已谈妥则起草并自审。"
