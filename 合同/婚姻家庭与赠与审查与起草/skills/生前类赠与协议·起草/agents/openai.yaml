interface:
  display_name: "生前类赠与协议·起草"
  short_description: "按已谈妥条件起草生前类赠与协议，死后才过户并写六十日接受；赠与章任意撤销或签字即过户不得入稿。出稿后自审。"
  default_prompt: "使用 $生前类赠与协议·起草，在单一立场下审查中国大陆待签遗赠协议或死后过户协议。先核对过户是死后还是现在、有没有生养死葬对价、受益人是不是法定继承人；死后才生效，签字不是物权变动，生存期间不得请求过户；不要用赠与章第658、660、666条锁定或撤销本文件；给出可回给对方的修改句。不要审查生前赠与合同、遗赠扶养协议或标准遗嘱继承；无文本但本类型条件已谈妥则起草并自审。"
