interface:
  display_name: "遗赠扶养协议·审查"
  short_description: "审待签遗赠扶养协议：生养死葬须量化、死后才转移；签约即过户、第658条任意撤销或第一顺序继承人作扶养人停笔。"
  default_prompt: "使用 $遗赠扶养协议·审查，在单一立场下审查中国大陆待签遗赠扶养协议。核对核心对价是否为生养死葬换死后财产，是否与生前赠与、遗嘱或遗赠切开，扶养人是否为继承人以外，财产是否仅处分个人份额，解除是否分侧处理；给出可回给对方的修改句。不要审查附义务赠与、遗赠、遗嘱或子女赡养协议，也不要把签约即过户或按赠与任意撤销写成可履行结构；无文本但本类型条件已谈妥则起草并自审。"
