interface:
  display_name: "附义务的赠与合同·起草"
  short_description: "按已谈妥条件起草附义务的赠与合同，义务可检验；不履行走法定撤销而非当然无效，附义务不得写成已消灭任意撤销。出稿后自审。"
  default_prompt: "使用 $附义务的赠与合同·起草，在单一立场下审查中国大陆待签附义务赠与合同。核对应否与一般赠与切开、所附义务能否量化到可启动法定撤销、权利转移前第658条任意撤销是否仍在、空写不可撤销有无公证或公益例外、不履行是否写成撤销并返还而不是当然无效；给出可回给对方的修改句。不要审查无负担的一般赠与、公益捐赠或遗赠扶养协议，也不要把附义务写成已经关闭任意撤销；无文本但本类型条件已谈妥则起草并自审。"
