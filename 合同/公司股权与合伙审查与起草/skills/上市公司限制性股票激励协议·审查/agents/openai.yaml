interface:
  display_name: "上市公司限制性股票激励协议·审查"
  short_description: "审查待签上市公司限制性股票激励协议：激励计划上位、12个月间隔、分期不超过50%、未达标回购与回购价上限；禁止未批先授股、公司资助认购。"
  default_prompt: "使用 $上市公司限制性股票激励协议·审查，在单一立场下审查中国大陆待签上市公司限制性股票激励协议。核对核心给付是否为按激励计划授予本公司限制性股票而不是大宗交易过户、有限合伙间接持股或股票期权，激励计划是否已经股东会通过，授予日、价格、限售起算和分期解除是否闭合，未达标是否被写成递延，回购价格与董事会／股东会程序是否突破管理办法第二十六条、第二十七条，公司是否为认购提供财务资助；给出可回给对方的修改句。不要审查上市公司股票大宗交易协议、股权激励型合伙合同或股票期权授予／行权协议；无文本但本类型条件已谈妥则起草并自审。"
