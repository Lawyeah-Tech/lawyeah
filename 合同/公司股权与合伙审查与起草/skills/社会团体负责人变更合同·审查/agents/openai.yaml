interface:
  display_name: "社会团体负责人变更合同·审查"
  short_description: "审查待签社会团体负责人变更合同：交接只执行已作出的章程决议、民政三十日登记；禁止把社团当股权出售、签字即视为已变更。"
  default_prompt: "使用 $社会团体负责人变更合同·审查，在单一立场下审查中国大陆待签社会团体负责人变更合同（公司相关合同）并给出可回给对方的修改建议。变更须回链经核准章程和会员（代表）大会或理事会决议，业务主管单位审查同意后三十日内向民政登记管理机关申请变更登记；禁止把社团写成公司股权买卖或民办学校转让；无文本但本类型条件已谈妥则起草并自审。"
