interface:
  display_name: "投资意向书·起草"
  short_description: "按已谈妥条件起草投资意向书：约束力分账、非终稿、不构成交割或登记申请；禁止本清单即为最终协议、持清单放款／办工商。"
  default_prompt: "使用 $投资意向书·起草，在单一立场下审查中国大陆待签投资意向书或条款清单（Term Sheet）。先做约束力分层，核验排他对象、期限、例外和分手费触发与上限，确认文本不是已锁定交割，也不是已完成的增资或股权转让。检查公司是否签署、未签股东是否被写成已约束、优先权是否标明以正式协议为准、是否出现“本清单即为最终协议”或“无论谁退出均由公司承担全部费用”。给出可回给对方的修改句。不要审查增资协议、股东协议、股权转让本约、出资合同、房地产项目股权取得或代持，不要把本清单当成可以办理增资登记或放款的文件；无文本但本类型条件已谈妥则起草并自审。"
