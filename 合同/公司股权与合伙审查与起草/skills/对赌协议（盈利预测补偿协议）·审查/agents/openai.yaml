interface:
  display_name: "对赌协议（盈利预测补偿协议）·审查"
  short_description: "审查对赌协议（盈利预测补偿协议）待签文本：与公司对赌不当然无效但受资本维持；补偿公式与审计口径须闭合；拦公司无条件现金补偿／回购。输出风险表和修改句。"
  default_prompt: "使用 $对赌协议（盈利预测补偿协议）·审查，在单一立场下审查中国大陆待签对赌协议（盈利预测补偿协议）（公司相关合同）并给出可回给对方的修改建议。与公司对赌不写成当然无效；公司现金补偿或回购必须绑定可分配利润或减资；九民纪要未核原文不得写成已核验结论；无文本但本类型条件已谈妥则起草并自审。"
