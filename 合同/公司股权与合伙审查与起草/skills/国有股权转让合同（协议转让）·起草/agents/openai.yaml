interface:
  display_name: "国有股权转让合同（协议转让）·起草"
  short_description: "按已谈妥条件起草国有股权转让合同（协议转让）并自审：签字成立、批准后生效；非公开仅限法定两类例外；优先购买书面通知；协议转让价不得低于评估结果。"
  default_prompt: "使用 $国有股权转让合同（协议转让）·起草，在单一立场下审查中国大陆待签国有股权转让合同（协议转让）。核对是否落入非公开协议转让例外、国资批准与成立/生效是否分列、转让价格是否不低于评估结果、其他股东优先购买是否书面闭合、付款是否挂钩名册记载和工商变更；给出可回给对方的修改句。不要审查普通股权转让、国有资产协议转让、进场挂牌成交确认、增资或上市公司股份交易；无文本但本类型条件已谈妥则起草并自审。"
