interface:
  display_name: "登记为个体工商户的实质合伙合同·起草"
  short_description: "按已谈妥条件起草登记为个体工商户的实质合伙合同：名为个体户实为合伙、对外不得免责；禁止内部按份对抗善意第三人。"
  default_prompt: "使用 $登记为个体工商户的实质合伙合同·起草，在单一立场下审查中国大陆待签、以个体工商户登记为外观的实质合伙合同。核对是否写明名为个体工商户、实为共同经营共担风险的合伙；对外责任是否与内部追偿分行；是否与隐名合伙、个人合伙或合伙企业切开；给出可回给对方的修改句。不要审查隐名合伙合同、不领个体户执照的个人合伙合同或合伙企业合同；无文本但本类型条件已谈妥则起草并自审。"
