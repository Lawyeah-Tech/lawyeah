interface:
  display_name: "公司分立合同·起草"
  short_description: "按已谈妥条件起草公司分立合同并自审：派生／新设点名，对外连带、对内追偿，财产清单闭合；十日通知、三十日公告；禁止把减资清偿担保请求权粘进分立。"
  default_prompt: "使用 $公司分立合同·起草，在单一立场下审查中国大陆待签公司分立合同。核对核心给付是否为一个公司财产分割并派生或新设公司而不是合并、定向减资、资产收购或单笔债务转移；是否点名存续分立或解散分立；内部债务安排是否冒充对外免责；十日通知与三十日公告义务是否落地；资产负债表及财产清单是否逐项；给出可回给对方的修改句。不要审查公司合并合同、定向减资合同、资产收购合同或债务转移三方协议；无文本但本类型条件已谈妥则起草并自审。"
