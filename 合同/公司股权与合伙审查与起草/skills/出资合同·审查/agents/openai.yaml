interface:
  display_name: "出资合同·审查"
  short_description: "审查待签出资合同：交割＝登记＋实缴＋名册／章程，资金进共管或公司账户；拟设公司不得当回购义务人。"
  default_prompt: "使用 $出资合同·审查，在单一立场下审查中国大陆待签出资合同（股权投资相关合同）。先核公司是否尚未成立、资金是否进入拟设公司而不是老股东、注册资本是否自零生成；核对实缴期限、账户、验资或银行回单是否闭合，交割是否同时具备登记与资金或财产到位；把已设公司增资、存量转股、公司侧纯设立出资、固定回报保本和公司尚未成立即承担回购的条款切开或停笔；给出可回给对方的修改句。不要审查增资协议、股权转让合同或公司相关合同项下的出资合同；无文本但本类型条件已谈妥则起草并自审。"
