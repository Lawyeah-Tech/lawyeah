interface:
  display_name: "PE股权转让·审查"
  short_description: "审查待签PE股权转让：价款进卖方、优先购买闭合、名册／登记分列、估值口径闭合；禁止先全额付款再通知。"
  default_prompt: "使用 $PE股权转让·审查，在单一立场下审查中国大陆待签股权投资相关合同项下股权转让合同。先核对核心给付是不是存量二次交易（价款归转让方、注册资本不因本约增加、存在真实对价），把它和增资、代持、设立出资、零元赠与切开；再查优先购买通知四要素、交割与名册／登记顺序、估值口径和股东协议是否同步；给出可回给对方的修改句。不要审查增资协议、股权代持合同、设立出资合同或零元股权赠与合同；无文本但本类型条件已谈妥则转 $PE股权转让·起草。"
