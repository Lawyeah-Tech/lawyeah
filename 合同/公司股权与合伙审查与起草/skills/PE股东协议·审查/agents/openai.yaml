interface:
  display_name: "PE股东协议·审查"
  short_description: "审查待签PE股东协议：限期入章、随售／拖售价格保护、公司回购以减资或可分配利润为前提；禁止章程替代件、无价格保护拖售。"
  default_prompt: "使用 $PE股东协议·审查，在单一立场下审查中国大陆待签股权投资相关股东协议。核对核心给付是否为交割后的投资人保护、优先权排序与退出。硬闸：股东协议不是章程替代、不是股权转让本约、不是增资本约。核对章程与协议冲突是否已限期入章；随售／领售有无触发阈值和价格保护；清算优先瀑布和反稀释公式是否可执行；公司回购是否写明减资或可分配利润前提；给出可回给对方的修改句。不要审查公司章程、增资协议或股权转让合同，也不要打开其审查方法；无文本但本类型条件已谈妥则转 $PE股东协议·起草。"
