interface:
  display_name: "民办学校转让协议·审查"
  short_description: "审查待签民办学校转让协议：举办者变更核准、先分营利／非营利；核准前不得交章交证交主要价款，不得学校划付补偿。"
  default_prompt: "使用 $民办学校转让协议·审查，在单一立场下审查中国大陆待签民办学校转让协议（公司相关合同）并给出可回给对方的修改建议。先切开普通股权转让和资产买卖；举办者变更必须挂钩审批机关核准；先分营利/非营利；核验办学许可证。禁止写成签字即交章交证、按净资产买卖非营利学校、由学校向原举办者划付补偿，或把2013年合理回报专条当作现行默认权利；无文本但本类型条件已谈妥则起草并自审。"
