interface:
  display_name: "非核心资产转让·起草"
  short_description: "按已谈妥条件起草资产转让合同（单项_非核心资产）并自审：买方只取清单资产、不概括承债，交割确认单特定化；合同生效≠权利变动。"
  default_prompt: "使用 $非核心资产转让·起草，在单一立场下审查中国大陆待签公司单项非核心资产转让合同。核对核心给付是否仅为单台设备、单项知识产权或单套不构成业务的房屋等特定资产、文本是否避免买方概括承受卖方公司债务、是否具备可核验的标的资产清单和交割确认单、合同生效是否与过户或专利权登记分列；给出可回给对方的修改句。不要审查股权转让、控制权收购或营业资产收购，也不要把动产购销本约、二手房本约或专项专利权/商标权转让当本类型审完；无文本但本类型条件已谈妥则起草并自审。"
