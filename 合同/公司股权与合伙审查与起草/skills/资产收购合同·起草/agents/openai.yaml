interface:
  display_name: "资产收购合同·起草"
  short_description: "按已谈妥条件起草资产收购合同并自审：资产／排除／假定债务三清单特定化，重大资产决议闭合；签字≠分项过户；劳动合同与许可不当然转移。"
  default_prompt: "使用 $资产收购合同·起草，在单一立场下审查中国大陆待签资产收购合同。核对核心给付是否为足以构成业务线或营业的一揽子资产、文本是否穷尽列明假定债务并排除卖方其余负债、是否具备可核验的标的资产清单和排除资产清单、重大资产内部决议是否闭合、合同生效是否与不动产过户、专利权登记、商标核准公告和合同权益通知分列；给出可回给对方的修改句。不要审查股权收购或控制权交割，也不要把单项非核心资产转让、动产购销本约、二手房本约或专项专利权/商标权转让当本类型审完；无文本但本类型条件已谈妥则起草并自审。"
