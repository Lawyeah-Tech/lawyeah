interface:
  display_name: "股权托管协议·起草"
  short_description: "按已谈妥条件起草股权托管协议并自审：只移转权利行使、登记股东不变，授权事项／权限／期限写死；可写不可撤销，不得保证排除任意解除。"
  default_prompt: "使用 $股权托管协议·起草，在单一立场下审查中国大陆待签股权托管协议（公司相关合同）并给出可回给对方的修改建议。只审登记股东把股东权利的行使委托给受托人、工商登记不变的文本；必须拆表决权／分红权边界、返还与违约，并与股权代持、股权转让切开。禁止把名为托管实为代持或规避监管改成可履行结构；无文本但本类型条件已谈妥则起草并自审。"
