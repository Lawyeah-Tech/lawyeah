interface:
  display_name: "债权收购合同·审查"
  short_description: "审查债权收购合同待签文本：通知债务人是价款先决，从权利随同；拦把债权人同意写成收购生效条件、签字即视为已通知。输出风险表和修改句。"
  default_prompt: "使用 $债权收购合同·审查，在单一立场下审查中国大陆待签债权收购合同。核对核心给付是否为收购方或其 SPV 取得对目标公司的已成立债权而不是债务转移或普通商事债权让与；通知目标公司是否写成付款先决；从权利是否列入并安排担保变更登记和保证人通知；原债权合同与担保合同有无禁止转让特约；标的是否金融不良及受让资质是否闭合。给出可回给对方的修改句。不要审查债务转移三方协议、普通债权转让合同、代付款三方或保理融资主文件；无文本但本类型条件已谈妥则起草并自审。"
