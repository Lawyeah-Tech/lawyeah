interface:
  display_name: "普通合伙企业合同·审查"
  short_description: "审查待签普通合伙企业合同：领取执照、名称普通合伙、无限连带、入伙退伙对外连带不可豁免；禁止对外免责、设LP。"
  default_prompt: "使用 $普通合伙企业合同·审查，在单一立场下审查中国大陆待签普通合伙企业合伙协议。核对是否领取普通合伙企业营业执照并适用《合伙企业法》、普通合伙人是否对合伙企业债务承担无限连带、是否与个人合伙或有限合伙切开、禁入主体、利润亏损是否禁止全部归一方、入伙退伙对外责任、执行事务内部限制能否对抗第三人；给出可回给对方的修改句。不要审查个人合伙合同、有限合伙企业合同或特殊的普通合伙企业合同；无文本但本类型条件已谈妥则起草并自审。"
