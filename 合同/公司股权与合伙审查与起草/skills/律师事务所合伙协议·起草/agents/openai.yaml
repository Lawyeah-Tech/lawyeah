interface:
  display_name: "律师事务所合伙协议·起草"
  short_description: "按已谈妥条件起草律师事务所合伙协议：律师法／管理办法、合伙人须为专职执业律师、执业责任分层、许可日起生效；禁止设LP、对债权人一律免责。"
  default_prompt: "使用 $律师事务所合伙协议·起草，在单一立场下审查中国大陆待签律师事务所合伙协议。核对是否适用《律师法》和《律师事务所管理办法》、合伙人是否均为专职执业律师自然人、普通合伙所或特殊的普通合伙所的执业责任是否写清、是否禁止有限合伙人、协议是否自省级司法行政机关准予设立决定之日起生效、是否与公司有限合伙或非律所特殊普通合伙切开；给出可回给对方的修改句。不要审查合伙协议（有限合伙）、非律师专业所特殊普通合伙企业合同或普通合伙企业合同；无文本但本类型条件已谈妥则起草并自审。"
