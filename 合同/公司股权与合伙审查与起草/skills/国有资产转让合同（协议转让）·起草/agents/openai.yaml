interface:
  display_name: "国有资产转让合同（协议转让）·起草"
  short_description: "按已谈妥条件起草国有资产转让合同（协议转让）并自审：评估并核准／备案，进场为原则、非公开须适格批准；低于评估百分之九十应暂停；签字成立、批准后生效。"
  default_prompt: "使用 $国有资产转让合同（协议转让）·起草，在单一立场下审查中国大陆待签国有资产转让合同（协议转让）。核对核心给付是否为企业资产而不是国有股权，是否已有经核准或备案的资产评估，协议／非公开是否落在进场豁免条件内，批准层级是否匹配，价格是否触及评估值百分之九十暂停规则，成立与生效是否拆开；给出可回给对方的修改句。不要审查国有股权转让合同（协议转让）、普通股权转让或非国有资产买卖；无文本但本类型条件已谈妥则起草并自审。"
