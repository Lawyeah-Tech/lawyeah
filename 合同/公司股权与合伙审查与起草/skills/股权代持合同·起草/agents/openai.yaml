interface:
  display_name: "股权代持合同·起草"
  short_description: "按已谈妥条件起草股权代持合同：对内权益≠显名（半数以上同意）、处分限制与税负分担；禁止保证一定过户或免税。"
  default_prompt: "使用 $股权代持合同·起草，在单一立场下审查中国大陆待签股权投资相关合同项下股权代持合同。核对核心给付是否为实际出资人出资、名义股东登记、投资权益归隐名方，而不是股权转让、赠与、托管或隐名合伙；拆开隐名对内权益与显名须其他股东半数以上同意；锁住名义股东不得自行转让、质押、赠与；写出税负分担且不保证还原过户免税；规避限购、外资、公职或上市代持只告知。给出可回给对方的修改句。不要按股权转让或赠与改完，不要审查公司侧普通挂名、托管、隐名合伙、增资协议或股东协议主文件；无文本但本类型条件已谈妥则起草并自审。"
