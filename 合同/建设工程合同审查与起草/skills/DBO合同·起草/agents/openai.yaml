interface:
  display_name: "DBO 合同·起草"
  short_description: "按已谈妥条件起草DBO合同：写死设计+建造+长期运营、业主融资、KPI与期满移交≠竣工交付、双重保函。切开BT、EPC。禁止承包人融资回购、十年死固定运营费、空洞运营句留下。出稿后按DBO硬闸自审。"
