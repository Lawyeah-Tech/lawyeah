interface:
  display_name: "工程总承包合同·审查"
  short_description: "审查待签工程总承包（EPC/DB）合同：核设计+采购+施工总责、双资质或联合体连带、书面变更与暂估价、许可作生效或开工条件；切开施工总包、BT、DBO。输出风险表和修改句。"
  default_prompt: "使用 $工程总承包合同·审查，在单一立场下审查中国大陆待签工程总承包（EPC/DB）合同。核设计+采购+施工总责、双资质或联合体连带、书面变更与暂估价、许可作生效或开工条件。切开施工总包、BT、DBO。禁止删掉设计义务当施工总包、假联合体、融资回购或运营分成。给出可回给对方的修改句。"
