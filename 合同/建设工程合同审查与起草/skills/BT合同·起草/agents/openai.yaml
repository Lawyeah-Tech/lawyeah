interface:
  display_name: "BT 合同·起草"
  short_description: "按已谈妥条件起草BT合同：写死融资—移交—回购分账、移交确认书=回购起算、预算/人大决议生效附件。切开施工总包、DBO、代建。禁止政府投资垫资、机关担保、伪装购买服务或特许经营。出稿后按BT硬闸自审。"
  default_prompt: "使用 $BT合同·起草，在单一立场下按已谈妥条件起草中国大陆BT合同。必须写入融资—移交—回购分账、移交确认书=回购起算、预算/人大决议生效附件。切开施工总包、DBO、代建。禁止政府投资垫资、机关担保、伪装购买服务或特许经营。出稿后按BT硬闸自审。"
