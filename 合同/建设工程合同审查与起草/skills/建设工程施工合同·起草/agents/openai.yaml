interface:
  display_name: "建设工程施工合同·起草"
  short_description: "按已谈妥条件起草建设工程施工合同：写死资质安许与项目经理三证、许可作生效或开工条件、主体结构自施、进度款与竣工结算、审计一年、质保金不超过3%、停窝工不进优先受偿。禁止黑白合同、先定后招和挂靠可履行。出稿后按施工硬闸自审。"
  default_prompt: "使用 $建设工程施工合同·起草，在单一立场下按已谈妥条件起草中国大陆建设工程施工合同。必须写入资质安许、项目经理三证、规划/施工许可作条件、主体结构自施、进度款与竣工结算、审计一年、质保金不超过3%、缺陷责任期与保修期分列、停窝工不进优先受偿。禁止黑白合同、先定后招、政府投资垫资、把挂靠或违法分包写成可履行。出稿后按施工硬闸自审。"
