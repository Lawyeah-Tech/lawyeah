interface:
  display_name: "工程总承包合同·起草"
  short_description: "按已谈妥条件起草工程总承包（EPC/DB）合同：写死设计+采购+施工总责、双资质或联合体连带、书面变更与暂估价、许可作条件。禁止删掉设计义务当施工总包、假联合体、融资回购或运营分成（BT/DBO）。出稿后按EPC硬闸自审。"
  default_prompt: "使用 $工程总承包合同·起草，在单一立场下按已谈妥条件起草中国大陆工程总承包（EPC/DB）合同。必须写入设计+采购+施工总责、双资质或联合体连带、书面变更与暂估价、许可作生效或开工条件。禁止删掉设计义务当施工总包、假联合体、融资回购或运营分成（BT/DBO）。出稿后按EPC硬闸自审。"
