interface:
  display_name: "专业分包合同·起草"
  short_description: "合法专业分包才落稿：写死同意函、独立最迟付款日、工资代发、不当然优先受偿。无资质、再分包、主体结构、未经同意、转包或挂靠：停止包装成可履行，只出告知，不是帮他写出能过关的假合同。"
  default_prompt: "使用 $专业分包合同·起草，在单一立场下按已谈妥条件起草中国大陆合法专业分包合同。必须写入发包人同意函、独立最迟付款日、工资代发、分包人不当然优先受偿。无资质、再分包、主体结构、未经同意、转包或挂靠：停止包装成可履行，只出告知，不是帮他写出能过关的假合同。合法稿出稿后按专业分包硬闸自审。"
