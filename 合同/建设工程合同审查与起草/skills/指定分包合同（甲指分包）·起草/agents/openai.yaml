interface:
  display_name: "指定分包合同（甲指分包）·起草"
  short_description: "按已谈妥条件起草指定分包（甲指）合同：写死发包人指定、总包签约、总包管理权与连带不因指定免除、指定函、转付。禁止业主指定则总包免责、平行发包补总包章、主体结构甲指、挂靠可履行。出稿后按甲指硬闸自审。"
  default_prompt: "使用 $指定分包合同（甲指分包）·起草，在单一立场下按已谈妥条件起草中国大陆指定分包（甲指）合同。必须写入发包人指定、总包签约、总包管理权与连带不因指定免除、指定函、转付。禁止业主指定则总包免责、平行发包补总包章、主体结构甲指、挂靠可履行。出稿后按甲指硬闸自审。"
