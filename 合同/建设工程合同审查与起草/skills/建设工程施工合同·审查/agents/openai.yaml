interface:
  display_name: "建设工程施工合同·审查"
  short_description: "审查待签建设工程施工合同：核建筑业资质与安全生产许可、规划/施工许可、禁止黑白合同与先定后招、进度款与竣工结算、审计一年、质保金不超过3%、停窝工不进优先受偿，输出风险表和修改句。"
  default_prompt: "使用 $建设工程施工合同·审查，在单一立场下审查中国大陆待签建设工程施工合同。核承包人建筑业资质与安全生产许可、项目经理三证、规划/施工许可、主体结构自施、黑白合同与先定后招、进度款与竣工结算、审计一年、质保金不超过结算总额3%、停窝工不进优先受偿。挂靠、违法分包、先定后招只告知，不改成可履行。给出可回给对方的修改句。"
