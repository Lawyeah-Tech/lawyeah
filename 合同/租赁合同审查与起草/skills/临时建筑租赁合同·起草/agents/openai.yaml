interface:
  display_name: "临时建筑租赁合同·起草"
  short_description: "按已谈妥条件起草临时建筑租赁：批准文件入附件、租期锁在批准期内且不超二十年、写拆除腾退、禁止转永久或办产权证。"
  default_prompt: "使用 $临时建筑租赁合同·起草，在单一立场下按已谈妥条件起草中国大陆临时建筑租赁合同。核对是否持有城乡规划等主管部门的临建批准、租期是否截在批准使用期限内且不超过二十年、拆除和腾退是否可执行；删除视同永久房屋、自动转永久或办理产权证的写法；给出可回给对方的修改句。不要审查房产租赁、光地租赁或建筑设备租赁，也不要把一审辩论终结前补证写成履约方案；有完整待签文本要评改则转 $临时建筑租赁合同·审查。"
