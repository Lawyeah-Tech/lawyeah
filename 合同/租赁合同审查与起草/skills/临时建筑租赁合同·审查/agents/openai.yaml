interface:
  display_name: "临时建筑租赁合同·审查"
  short_description: "审查待签临时建筑租赁：批准文件入合同并与现场一致、租期不超批准期限且不超二十年、拆除腾退可执行、不得永久化。"
  default_prompt: "使用 $临时建筑租赁合同·审查，在单一立场下审查中国大陆待签临时建筑租赁合同。核对是否持有城乡规划等主管部门的临建批准、租期是否截在批准使用期限内且不超过二十年、拆除和腾退是否可执行；删除视同永久房屋、自动转永久或办理产权证的写法；给出可回给对方的修改句。不要审查房产租赁、光地租赁或建筑设备租赁，也不要把一审辩论终结前补证写成履约方案；无文本但本类型条件已谈妥则转 $临时建筑租赁合同·起草。"
