interface:
  display_name: "农村土地租赁合同·起草"
  short_description: "按已谈妥条件起草农村土地普通租赁：仅债权占用、集体决议后签约、截二十年、书面、农地农用、不办承包权或经营权登记。"
  default_prompt: "使用 $农村土地租赁合同·起草，在单一立场下按已谈妥条件起草中国大陆农村土地租赁合同。先核对租的是哪一层权利：本约只成立债权性占用，不是土地承包经营权，也不是土地经营权；集体作出租人时走农村集体经济组织法成员大会或村委会代行职能参照该法，不要引用2018年村民委员会组织法第二十四条；租期是否按民法典截断在二十年以内；用途是否农地非农、以租代征或宅基地变相买卖。出现承包权保留、经营权流转或五年登记的，转到 土地经营权流转合同（出租类）·审查；把承包经营权当用益物权出租的，转到 农村土地承包经营权租赁合同·审查；城镇房屋转到 房产租赁合同·审查；国有出让光地转到 不动产租赁合同·审查。给出可回给对方的修改句。不要审查经营权流转合同或承包经营权租赁合同，不要保证办证或有效；有完整待签文本要评改则转 $农村土地租赁合同·审查。"
