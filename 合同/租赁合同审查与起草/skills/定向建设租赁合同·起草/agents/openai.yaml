interface:
  display_name: "定向建设租赁合同·起草"
  short_description: "按已谈妥条件起草定向建设租赁：按图建设再租、资金锁一种、交付起租截二十年、规划施工许可生命线。"
  default_prompt: "使用 $定向建设租赁合同·起草，在单一立场下按已谈妥条件起草中国大陆定向建设租赁合同。核对核心给付是否为尚未建成的厂房、仓库或特种设施按承租人要求建设、建成后再出租，而不是融资租赁、建设工程施工或已建成普通房产租赁；资金是预付租金、借款还是投资是否锁定；租期是否自交付起截到二十年；规划与施工许可失败时能否解除并返还；交付起租和占有对抗是否写清；给出可回给对方的修改句。不要审查融资租赁合同、建设工程施工合同、工程总承包合同或售后回租合同；有完整待签文本要评改则转 $定向建设租赁合同·审查。"
