interface:
  display_name: "土地经营权流转合同（出租类）·起草"
  short_description: "按已谈妥条件起草土地经营权出租：只流转经营权、不超过剩余承包期、满五年登记对抗、备案非生效、再流转须承包方书面同意。"
  default_prompt: "使用 $土地经营权流转合同（出租类）·起草，在单一立场下按已谈妥条件起草中国大陆土地经营权流转合同（出租类）。核对是否三权分置、只流转经营权而不是承包权，流转期限是否不超过剩余承包期，满五年是否约定经营权登记对抗，是否与承包经营权租赁或普通农村土地租赁（二十年、无登记）切开，备案是否被误写成生效要件，再流转或融资担保是否经承包方书面同意并备案，工商资本是否经过资格审查和项目审核；给出可回给对方的修改句。不要审查农村土地承包经营权租赁合同、农村土地租赁合同，也不要打开或复制 农村土地承包经营权租赁合同·审查 的方法；有完整待签文本要评改则转 $土地经营权流转合同（出租类）·审查。"
