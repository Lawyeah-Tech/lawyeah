interface:
  display_name: "房产租赁合同·审查"
  short_description: "审查待签住房承租房产租赁（户口/居住证/入学）：租期截二十年、备案非生效、维修转租、押金非定金、买卖不破租赁以占有为前提。"
  default_prompt: "使用 $房产租赁合同·审查，在单一立场下审查中国大陆待签房产租赁合同。核对租期二十年截断、登记备案是否被误写成生效条件、维修义务、转租是否须同意、押金与定金是否切开、买卖不破租赁是否具备占有等条件；给出可回给对方的修改句。不要审查融资租赁、售后回租、农地流转或农村土地租赁文本；无文本但本类型条件已谈妥则转 $房产租赁合同·起草。"
