interface:
  display_name: "定向建设租赁合同·审查"
  short_description: "审查待签定向建设租赁：未建成按图建设再租、资金定性三选一、租期自交付起截二十年、许可生命线、对抗以占有为前提。"
  default_prompt: "使用 $定向建设租赁合同·审查，在单一立场下审查中国大陆待签定向建设租赁合同。核对核心给付是否为尚未建成的厂房、仓库或特种设施按承租人要求建设、建成后再出租，而不是融资租赁、建设工程施工或已建成普通房产租赁；资金是预付租金、借款还是投资是否锁定；租期是否自交付起截到二十年；规划与施工许可失败时能否解除并返还；交付起租和占有对抗是否写清；给出可回给对方的修改句。不要审查融资租赁合同、建设工程施工合同、工程总承包合同或售后回租合同；无文本但本类型条件已谈妥则转 $定向建设租赁合同·起草。"
