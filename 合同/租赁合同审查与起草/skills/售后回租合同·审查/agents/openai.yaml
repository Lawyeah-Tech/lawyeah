interface:
  display_name: "售后回租合同·审查"
  short_description: "审查待签售后回租：卖方即承租人先卖后租、转让+回租双条款、价款付给承租人、占有改定、还租表勾稽转让价款、取回须清算。"
  default_prompt: "使用 $售后回租合同·审查，在单一立场下审查中国大陆待签售后回租合同。核对是否先卖后租、卖方与承租人同一、买方与出租人同一，而不是出租人向第三人采购的直租；核对租赁物是否真实、特定、评估与转让价款匹配，而不是名买卖实借贷或所有权仅作担保；必须写出可回给对方的修改句。不要审查直租融资租赁，不要打开 融资租赁合同·审查；无文本但本类型条件已谈妥则转 $售后回租合同·起草。"
