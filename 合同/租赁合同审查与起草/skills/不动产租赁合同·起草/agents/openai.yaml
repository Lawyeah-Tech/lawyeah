interface:
  display_name: "不动产租赁合同·起草"
  short_description: "按已谈妥条件起草土地、厂房、商铺、写字楼不动产租赁：租期截二十年、备案非生效、维修转租分列、押金非定金、对抗以占有为前提。"
  default_prompt: "使用 $不动产租赁合同·起草，在单一立场下按已谈妥条件起草中国大陆不动产租赁合同。对象锁在土地、厂房、商铺、写字楼，不要把户口/住宅专档、动产租赁、融资租赁、临时建筑或建筑设备当成本任务。核对不动产租赁与房产住宅租赁/动产租赁/融资租赁切开、租期二十年截断、登记备案是否被误写成生效条件、维修第七百一十二/七百一十三条、转租第七百一十六条、押金与定金切开、买卖不破租赁是否具备占有等条件；临时建筑转 临时建筑租赁合同·审查，建筑设备转 建筑设备租赁合同·审查。给出可回给对方的修改句。不要按施工挂靠或买卖/承揽定性表审查本类型；有完整待签文本要评改则转 $不动产租赁合同·审查。"
