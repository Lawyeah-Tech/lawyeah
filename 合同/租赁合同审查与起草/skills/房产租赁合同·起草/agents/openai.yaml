interface:
  display_name: "房产租赁合同·起草"
  short_description: "按已谈妥条件起草住房承租房产租赁：租期截二十年、备案非生效、维修转租、押金非定金、对抗以占有为前提。"
  default_prompt: "使用 $房产租赁合同·起草，在单一立场下按已谈妥条件起草中国大陆房产租赁合同。核对租期二十年截断、登记备案是否被误写成生效条件、维修义务、转租是否须同意、押金与定金是否切开、买卖不破租赁是否具备占有等条件；落进本类型三闸后自审。不要写成融资租赁、售后回租、农地流转或农村土地租赁文本；有完整待签文本要评改则转 $房产租赁合同·审查。"
