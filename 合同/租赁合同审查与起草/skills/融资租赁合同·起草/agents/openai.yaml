interface:
  display_name: "融资租赁合同·起草"
  short_description: "按已谈妥条件起草直租融资租赁：融物融资、三方两合同、购货款付给出卖人、索赔与付租分轨、取回须清算。"
  default_prompt: "使用 $融资租赁合同·起草，在单一立场下按已谈妥条件起草中国大陆融资租赁合同（直租）。核对是否同时具备融物与融资、是否存在出租人／承租人／出卖人三方和买卖与融资租赁两份合同闭合、购货款是否付给出卖人而不是承租人、索赔权是否让与且质量问题原则上不拒付租金、取回是否清算、登记是否被误写成所有权或合同生效要件；与售后回租、普通设备租赁和名租实贷切开；给出可回给对方的修改句。不要审查售后回租合同、普通动产租赁合同、建筑设备干租或买卖本约，不要抄动产租赁或买卖的审查方法；有完整待签文本要评改则转 $融资租赁合同·审查。"
