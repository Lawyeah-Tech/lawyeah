interface:
  display_name: "定期租赁合同·审查"
  short_description: "审查待签定期租赁：须有固定届满点、超过二十年部分无效、续订自续订日起再计二十年、六个月以上须书面。"
  default_prompt: "使用 $定期租赁合同·审查，在单一立场下审查中国大陆待签定期租赁合同。核对是否存在可确定的起算点与届满点、约定期限是否超过二十年（超过部分无效而非整份无效）、续订是否自续订之日起仍受二十年限制、六个月以上是否书面、届满继续使用是否被误写成按原期限再续一期、是否出现随时解除消解定期；给出可回给对方的修改句。不要审查不定期租赁，也不要把本任务做成房产租赁、不动产、动产、建筑设备或临时建筑专论；无文本但本类型条件已谈妥则转 $定期租赁合同·起草。"
