interface:
  display_name: "房屋团购合同·起草"
  short_description: "按已谈妥条件起草房屋团购合同，把预约转本约条件、成团规模与价格独立、监管账户收款、成团失败退款写入初稿，出稿后自审。"
  default_prompt: "使用 $房屋团购合同·起草，在单一立场下按已谈妥条件起草中国大陆房屋团购合同（定向团购预约、团购合作或团购服务/入园意向），切开预约与本约、单位组织与中间方、核验成团规模与阶梯或一口价、名单置换与指定人、购房款是否进入开发商预售资金监管账户、未达销售条件不得收预订款、成团失败与拒签出路，并锁定后续网签不得覆盖团购价，给出可回给对方的修改建议。不要按一般商品房个卖的面积3%或先验房主路径落稿，不要只打红黄绿；出稿后用本类型硬闸自审。"
