interface:
  display_name: "共有产权住房买卖合同·起草"
  short_description: "按已谈妥条件起草共有产权住房买卖合同，把份额量化、价款对应份额、禁售与优先回购、资格附件写入初稿，出稿后自审。"
  default_prompt: "使用 $共有产权住房买卖合同·起草，在单一立场下按已谈妥条件起草中国大陆共有产权住房买卖合同。核对是否量化购房人与代持机构的产权份额、价款是否只对应购房人份额、转让限制是否写明且未写成自由上市、购房资格是否有书面审核文件、代持机构是否作为一方签章；给出可回给对方的修改句。不要按普通商品房或经济适用房的路径落稿，也不要把共有产权改成可自由上市或借名购买的结构；出稿后用本类型硬闸自审。"
