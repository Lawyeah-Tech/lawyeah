interface:
  display_name: "房地产包销合同·审查"
  short_description: "审查按基价包盘、期满余房买断的房地产包销合同，核逐套包销基价、期满按基价买入、对外以出卖人名义且具备预售许可、购房款进开发商或监管账户。"
  default_prompt: "使用 $房地产包销合同·审查，在单一立场下审查中国大陆待签房地产包销合同。核对是否锁定包销基价并约定期满余房按基价买断、是否与全案佣金代理或渠道引流切开、对外销售是否以出卖人名义且具备预售许可、购房款是否进入开发商或监管账户；给出可回给对方的修改句。不要审查全案销售代理、渠道分销、经销买断或行纪，也不要把商品房买卖本约当包销审完。"
