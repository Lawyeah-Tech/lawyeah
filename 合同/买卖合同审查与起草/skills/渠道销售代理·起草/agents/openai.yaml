interface:
  display_name: "渠道销售代理·起草"
  short_description: "按已谈妥条件起草渠道销售委托代理合同，把报备到访确认、结佣节点、禁止返佣洗客、房款不进渠道私户写入初稿，出稿后自审。"
  default_prompt: "使用 $渠道销售代理·起草，在单一立场下按已谈妥条件起草中国大陆渠道销售委托代理合同。核对核心给付是否为引流推介并按成交收佣金、是否非买断非驻场、报备到访确认是否闭环、结佣是否绑网签且首付到账、是否禁止私自返佣和洗客截客；给出可回给对方的修改句。不要按全案销售代理、经销买断、行纪或存量房中介落稿；出稿后用本类型硬闸自审。"
