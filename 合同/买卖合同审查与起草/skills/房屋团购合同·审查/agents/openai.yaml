interface:
  display_name: "房屋团购合同·审查"
  short_description: "审查房屋团购预约或团购合作待签文本，核预约与本约切开、成团规模与一口价或阶梯价、购房款进开发商监管账户、成团失败与拒签出路。"
  default_prompt: "使用 $房屋团购合同·审查，在单一立场下审查中国大陆待签房屋团购合同（定向团购预约、团购合作或团购服务/入园意向），切开预约与本约、单位组织与中间方、核验成团规模与阶梯或一口价、名单置换与指定人、购房款是否进入开发商预售资金监管账户、未达销售条件不得收预订款、成团失败与拒签出路，并锁定后续网签不得覆盖团购价，给出可回给对方的修改建议。不要按一般商品房个卖的面积3%或先验房主路径审查，不要只打红黄绿。"
