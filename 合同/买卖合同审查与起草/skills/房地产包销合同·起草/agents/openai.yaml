interface:
  display_name: "房地产包销合同·起草"
  short_description: "按已谈妥条件起草房地产包销合同，把逐套基价、期满余房买断、出卖人名义对外、房款进开发商或监管账户写入初稿，出稿后自审。"
  default_prompt: "使用 $房地产包销合同·起草，在单一立场下按已谈妥条件起草中国大陆房地产包销合同。核对是否锁定包销基价并约定期满余房按基价买断、是否与全案佣金代理或渠道引流切开、对外销售是否以出卖人名义且具备预售许可、购房款是否进入开发商或监管账户；给出可回给对方的修改句。不要按全案销售代理、渠道分销、经销买断或行纪落稿，也不要把商品房买卖本约当包销写出；出稿后用本类型硬闸自审。"
