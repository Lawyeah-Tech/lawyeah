interface:
  display_name: "共有产权住房买卖合同·审查"
  short_description: "审查购房人与代持机构按份共有的共有产权住房买卖合同，核产权份额量化、价款只对应购房人份额、禁售与优先回购、资格审核文件。"
  default_prompt: "使用 $共有产权住房买卖合同·审查，在单一立场下审查中国大陆待签共有产权住房买卖合同。核对是否量化购房人与代持机构的产权份额、价款是否只对应购房人份额、转让限制是否写明且未写成自由上市、购房资格是否有书面审核文件、代持机构是否作为一方签章；给出可回给对方的修改句。不要按普通商品房或经济适用房的路径审完，也不要把共有产权改成可自由上市或借名购买的结构。"
