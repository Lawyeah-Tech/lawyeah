interface:
  display_name: "著作权转让合同·起草"
  short_description: "按已谈妥条件起草著作权转让合同：写死第十条第五至十七项、人身权不移转、书面、权利清单与第二十七条必备项；禁止人身权买断、全部版权空词、交载体即移转。出稿后按著作权转让硬闸自审。"
  default_prompt: "使用 $著作权转让合同·起草，在单一立场下按已谈妥条件起草中国大陆著作权转让合同。必须写入第十条财产权清单、人身权不移转、书面、第二十七条必备项、原件与财产权分条。禁止人身权买断、口头买断一定有效、全部版权空词、交载体即移转。出稿后按著作权转让硬闸自审。"
