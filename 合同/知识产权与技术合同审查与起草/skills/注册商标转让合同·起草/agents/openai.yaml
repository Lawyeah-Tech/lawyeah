interface:
  display_name: "注册商标转让合同·起草"
  short_description: "按已谈妥条件起草注册商标转让合同：写死共同向商标局申请、签字只约束价款披露与配合申请、核准公告之日起享有专用权、封闭一并转让清单；禁止签字即过户或交证即过户。出稿后按商标转让硬闸自审。"
  default_prompt: "使用 $注册商标转让合同·起草，在单一立场下按已谈妥条件起草中国大陆注册商标转让合同。必须写入共同向商标局申请、签字只约束价款披露与配合申请、核准公告之日起享有专用权、封闭一并转让注册号清单。禁止签字即过户、交证即过户、事后补转。出稿后按商标转让硬闸自审。"
