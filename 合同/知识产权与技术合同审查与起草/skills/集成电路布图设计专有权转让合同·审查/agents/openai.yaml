interface:
  display_name: "集成电路布图设计专有权转让合同·审查"
  short_description: "审查待签集成电路布图设计专有权转让合同：核已登记专有权全部让与、著录变更登记生效、GDS验证；禁止未批先交核心。输出风险表和修改句。"
  default_prompt: "使用 $集成电路布图设计专有权转让合同·审查，在单一立场下审查中国大陆待签集成电路布图设计专有权转让合同。核对已登记专有权全部让与、书面并办理著录项目变更、专有权转让自登记之日起生效、GDSII等可验证交付、向外国人转让须先批准。禁止未登记布图当专有权卖、未批先交核心。给出可回给对方的修改句。"
