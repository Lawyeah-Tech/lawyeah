interface:
  display_name: "竞业限制协议·起草"
  short_description: "按已谈妥条件起草竞业限制协议：写入三类人员、期限不超过二年、范围可执行、离职后按月补偿、单位解除额外三个月，出稿后用这些硬闸自审。"
  default_prompt: "使用 $竞业限制协议·起草，在单一立场下按已谈妥条件起草中国大陆竞业限制协议。主线是离职后择业限制加按月补偿。写入限于高级管理人员、高级技术人员和其他负有保密义务的人员、起算点为劳动合同解除或终止、期限不超过二年、范围可执行、离职后按月补偿账户、单位解除须额外支付三个月补偿、三个月未付的催告解除程序；出稿后用这些硬闸自审，输出可编辑草稿、未决项、自审风险表和修改句。不要写成整份劳动合同、培训服务期或派遣协议，不要把无补偿写成整份无效，不要用竞业限制限制劳动者依法解除劳动合同，不要输出劳动仲裁策略。"
