interface:
  display_name: "个人劳务承包合同·起草"
  short_description: "按已谈妥条件起草个人劳务承包合同：写入班组承包不等于劳动也不等于个人承揽、安全选任、法定连带不得放弃，出稿后用这些硬闸自审。"
  default_prompt: "使用 $个人劳务承包合同·起草，在单一立场下按已谈妥条件起草中国大陆个人劳务承包合同。写入自然人包工头自行招用班组、按完成量结算、指令只对包工头、入场保险前置、伤亡只写内部追偿、代发写成受托支付；出稿后用这些硬闸自审，输出可编辑草稿、未决项、自审风险表和修改句。不要写成劳动合同、个人劳务、个人承揽、企业外包或派遣，不要把建筑或强制准入作业发包给个人，不要把伤亡或欠薪绝对免责改成可履行，不要输出劳动仲裁或工伤策略。"
