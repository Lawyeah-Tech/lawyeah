interface:
  display_name: "培训服务期协议·审查"
  short_description: "审查待签培训服务期协议：核专项技术培训费用可举证、违约金不超过费用且按未履行期间分摊、第三十八条与单位违法解除不赔，输出风险表和修改句。"
  default_prompt: "使用 $培训服务期协议·审查，在单一立场下审查中国大陆待签培训服务期协议。主线是专项技术培训费用加服务期加违约金按未履行期间分摊。核对是否属于专项技术培训而不是岗前培训、费用发票是否可举证、违约金是否不超过培训费用且按未履行期间分摊、服务期是否与费用和培训时间相适应、单位违法解除或劳动者依第三十八条解除时是否仍被写成要赔、服务期长于劳动合同期限时是否写续延；给出可回给对方的修改句。不要审查整份劳动合同、竞业限制或派遣协议，不要把岗前培训改成可履行违约金，不要编造培训费，不要输出劳动仲裁策略。"
