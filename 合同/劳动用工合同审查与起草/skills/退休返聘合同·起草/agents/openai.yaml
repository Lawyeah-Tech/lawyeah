interface:
  display_name: "退休返聘合同·起草"
  short_description: "按已谈妥条件起草退休返聘合同：写入身份闸、一般为民事劳务、意外险、与劳动合同切开，出稿后用这些硬闸自审。"
  default_prompt: "使用 $退休返聘合同·起草，在单一立场下按已谈妥条件起草中国大陆退休返聘协议。先核受聘人已达现行法定退休年龄或已享受基本养老保险待遇；标题用退休返聘或劳务协议（返聘），写入劳务费与劳务报酬个税、商业意外或雇主责任险（附加超龄人员条款），保留民法典第一千一百九十二条过错责任；出稿后用这些硬闸自审，输出可编辑草稿、未决项、自审风险表和修改句。不要命名为劳动合同，不要写入试用、工资、经济补偿或二倍工资，不要写成一定是劳务、一定不是工伤，不要输出劳动仲裁或工伤策略。"
