interface:
  display_name: "培训服务期协议·起草"
  short_description: "按已谈妥条件起草培训服务期协议：写入专项技术培训费用可举证、违约金不超过费用且按未履行期间分摊、第三十八条与单位违法解除不赔，出稿后用这些硬闸自审。"
  default_prompt: "使用 $培训服务期协议·起草，在单一立场下按已谈妥条件起草中国大陆培训服务期协议。主线是专项技术培训费用加服务期加违约金按未履行期间分摊。写入培训项目与费用构成、发票抬头为用人单位、违约金不超过培训费用且按未履行期间分摊、服务期与费用和培训时间相适应、劳动者依第三十八条解除或单位违法解除时不赔、服务期长于劳动合同期限时写续延；出稿后用这些硬闸自审，输出可编辑草稿、未决项、自审风险表和修改句。不要写成整份劳动合同、竞业限制或派遣协议，不要把岗前培训写成可履行违约金，不要编造培训费，不要输出劳动仲裁策略。"
