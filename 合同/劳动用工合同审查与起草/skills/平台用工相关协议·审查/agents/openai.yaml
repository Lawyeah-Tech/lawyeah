interface:
  display_name: "平台用工相关协议·审查"
  short_description: "审查待签平台用工相关协议：核三分法先定性、算法管理、与运输平台切开，输出风险表和修改句。"
  default_prompt: "使用 $平台用工相关协议·审查，在单一立场下审查中国大陆待签平台用工相关协议。按用工事实先作三分法：符合劳动关系、不完全符合确立劳动关系情形、民事自主经营；不完全符合须核报酬、休息、职业伤害、算法公示与申诉；民事须真实自主接单。核对订单分配、计价抽成、工时奖惩是否公示并设申诉通道，禁止强制接单、诱导超时。不要按全日制劳动合同、派遣、职业中介、业务外包或运输合同审完，不要把标题合作或注册个体户写成已经排除劳动法，不要输出劳动仲裁策略。"
