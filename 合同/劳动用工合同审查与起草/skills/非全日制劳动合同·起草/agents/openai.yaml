interface:
  display_name: "非全日制劳动合同·起草"
  short_description: "按已谈妥条件起草非全日制劳动合同：写入日均不超过四小时、周累计不超过二十四小时、小时工资与十五日结算、随时终止无经济补偿，出稿后用这些硬闸自审。"
  default_prompt: "使用 $非全日制劳动合同·起草，在单一立场下按已谈妥条件起草中国大陆非全日制劳动合同。写入日均不超过四小时、每周累计不超过二十四小时、元/小时且不低于履行地最低小时工资、结算周期不超过十五日、随时通知终止用工且不支付经济补偿；不得约定试用期，不要套用劳动合同法第十九条分档。出稿后用这些硬闸自审，输出可编辑草稿、未决项、自审风险表和修改句。不要写成全日制劳动合同或个人劳务，不要输出劳动仲裁或工伤策略。"
