interface:
  display_name: "业务外包（派遣型）合同·起草"
  short_description: "按已谈妥条件起草业务外包（派遣型）合同：写入真外包对假派遣、管理权防火墙、去人头化结算，出稿后用这些硬闸自审。"
  default_prompt: "使用 $业务外包（派遣型）合同·起草，在单一立场下按已谈妥条件起草中国大陆业务外包（派遣型）合同。写入两个组织、可独立核算的成果或服务、指令只经业务指令单给现场管理人员、按成果或业务量计价、发票开服务费或外包费；出稿后用这些硬闸自审，输出可编辑草稿、未决项、自审风险表和修改句。不要写成劳务派遣、个人承揽或平台用工，不要把无证派遣改写成外包，不要把三性、百分之十、派遣许可证写成外包放行条件，不要输出劳动仲裁或工伤策略。"
