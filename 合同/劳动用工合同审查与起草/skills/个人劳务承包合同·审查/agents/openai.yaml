interface:
  display_name: "个人劳务承包合同·审查"
  short_description: "审查待签个人劳务承包合同：核班组承包不等于劳动也不等于个人承揽、安全选任、法定连带不得放弃，输出风险表和修改句。"
  default_prompt: "使用 $个人劳务承包合同·审查，在单一立场下审查中国大陆待签个人劳务承包合同。核对是否自然人包工头自行招用并组织班组、按完成量结算、指令是否只对包工头；核选任与安全交底、雇主责任险或意外险是否进场前置；法定清偿与连带不得用伤亡或欠薪概由乙方负责抹掉。不要按劳动合同、个人劳务、个人承揽、企业外包或派遣审完，不要把建筑或强制准入作业发包给个人改成可履行，不要输出劳动仲裁或工伤策略。"
