interface:
  display_name: "非全日制劳动合同·审查"
  short_description: "审查待签非全日制劳动合同：核日均不超过四小时、周累计不超过二十四小时、小时工资与十五日结算、随时终止无经济补偿，输出风险表和修改句。"
  default_prompt: "使用 $非全日制劳动合同·审查，在单一立场下审查中国大陆待签非全日制劳动合同。核对日均工时是否不超过四小时、每周累计是否不超过二十四小时、是否小时计酬且不低于履行地最低小时工资、结算周期是否不超过十五日、终止是否为随时通知终止用工且不支付经济补偿；出现试用期只删除，不要套用劳动合同法第十九条分档。不要按全日制劳动合同或个人劳务审完，不要输出劳动仲裁或工伤策略。"
