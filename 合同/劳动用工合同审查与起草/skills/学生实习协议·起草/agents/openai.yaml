interface:
  display_name: "学生实习协议·起草"
  short_description: "按已谈妥条件起草学生实习协议：写入在校实习与劳动关系切开、职校三方、保险与报酬、毕业自动终止，出稿后用这些硬闸自审。"
  default_prompt: "使用 $学生实习协议·起草，在单一立场下按已谈妥条件起草中国大陆学生实习协议或职业学校岗位实习三方协议。写入在籍学号与毕业日、职校三方与未成年监护人、实习责任险或意外险、职校顶岗报酬不低于同岗位百分之八十或最低档且货币按月直付、毕业或离校之日自动终止；出稿后用这些硬闸自审，输出可编辑草稿、未决项、自审风险表和修改句。不要写成劳动合同或约定试用期覆盖已毕业用工，不要通过派遣或中介组织职校实习，不要输出劳动仲裁或伤害索赔策略。"
