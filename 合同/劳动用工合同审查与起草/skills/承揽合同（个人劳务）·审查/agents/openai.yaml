interface:
  display_name: "承揽合同（个人劳务）·审查"
  short_description: "审查待签承揽合同（个人劳务）：核真承揽才走民法典第一千一百九十三条、定作人选任过错不免、与外包和平台切开，输出风险表和修改句。"
  default_prompt: "使用 $承揽合同（个人劳务）·审查，在单一立场下审查中国大陆待签承揽合同（个人劳务）。先核对是否人格从属或安排社保（是则不按个人承揽放行），是否过程劳务，是否业务外包派人，是否平台派单抽成；真承揽才按民法典第一千一百九十三条处理损害，且必须保留定作、指示、选任过错，禁止概括免责；任意解除按第七百八十七条而不是第七百九十三条；给出可回给对方的修改句。不要按劳动合同、个人劳务、外包或平台用工审完，不要输出劳动仲裁或工伤策略，不要设计避社保或挂靠结构。"
