interface:
  display_name: "平台用工相关协议·起草"
  short_description: "按已谈妥条件起草平台用工相关协议：写入三分法先定性、算法管理、与运输平台切开，出稿后用这些硬闸自审。"
  default_prompt: "使用 $平台用工相关协议·起草，在单一立场下按已谈妥条件起草中国大陆平台用工相关协议。符合劳动关系的不得起草去劳动化民事稿；不完全符合须写入报酬、休息、职业伤害、算法公示与申诉；民事须真实自主接单、自备主要生产工具、可多平台执业。写入订单分配、计价抽成、工时奖惩公示与申诉通道，禁止强制接单、诱导超时。出稿后用这些硬闸自审，输出可编辑草稿、未决项、自审风险表和修改句。不要写成全日制劳动合同、派遣、职业中介、业务外包或运输合同，不要把标题合作或注册个体户写成已经排除劳动法，不要输出劳动仲裁策略。"
