interface:
  display_name: "劳务派遣协议·审查"
  short_description: "审查待签劳务派遣协议：核许可证与二百万元注册资本、岗位三性、百分之十比例、费用分列、合法退回、告知与二年合同，输出风险表和修改句。"
  default_prompt: "使用 $劳务派遣协议·审查，在单一立场下审查中国大陆待签劳务派遣协议（派遣单位与用工单位）。核对许可证与注册资本不低于二百万元、岗位限于临时性辅助性替代性、被派遣劳动者不超过用工总量百分之十、费用分列工资/社保/管理费、退回限于合法情形、告知义务与二年以上固定期限劳动合同；给出可回给对方的修改句。不要审查劳动者劳动合同，不要把无证派遣改成外包，不要输出劳动仲裁或工伤策略。"
