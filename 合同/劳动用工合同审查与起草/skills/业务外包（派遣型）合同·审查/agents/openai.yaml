interface:
  display_name: "业务外包（派遣型）合同·审查"
  short_description: "审查待签业务外包（派遣型）合同：核真外包对假派遣、管理权防火墙、去人头化结算，输出风险表和修改句。"
  default_prompt: "使用 $业务外包（派遣型）合同·审查，在单一立场下审查中国大陆待签业务外包（派遣型）合同。核对是否组织对组织、承包方是否自主管理员工、结算是否按成果或业务量而不是人头、发包方是否保留面试考勤奖惩权、有无现场管理人员防火墙。不要按劳务派遣协议、个人承揽或平台用工审完，不要把无证派遣改写成外包，不要把三性、百分之十、派遣许可证写成外包放行条件，不要输出劳动仲裁或工伤策略。"
