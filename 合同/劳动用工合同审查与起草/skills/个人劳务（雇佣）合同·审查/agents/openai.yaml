interface:
  display_name: "个人劳务（雇佣）合同·审查"
  short_description: "审查待签个人劳务（雇佣）合同：核劳务不等于劳动、民法典第一千一百九十二条风险负担、与承揽和派遣切开，输出风险表和修改句。"
  default_prompt: "使用 $个人劳务（雇佣）合同·审查，在单一立场下审查中国大陆待签个人劳务（雇佣）合同。先核对是否人格从属或安排社保（是则不按个人劳务放行），是否成果承揽，是否三方派遣；再按民法典第一千一百九十二条分列第三人损害、自身损害和追偿，禁止概括免责；给出可回给对方的修改句。不要按劳动合同、承揽或派遣审完，不要输出劳动仲裁或工伤策略，不要设计避社保或虚开发票结构。"
