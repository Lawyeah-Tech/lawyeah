interface:
  display_name: "承揽合同（个人劳务）·起草"
  short_description: "按已谈妥条件起草承揽合同（个人劳务）：写入真承揽才走民法典第一千一百九十三条、定作人选任过错不免、与外包和平台切开，出稿后用这些硬闸自审。"
  default_prompt: "使用 $承揽合同（个人劳务）·起草，在单一立场下按已谈妥条件起草中国大陆承揽合同（个人劳务）。写入自然人独立完成并交付特定成果、主要工作亲自完成、民法典第一千一百九十三条过错责任、任意解除按第七百八十七条并赔偿；禁止概括免责。出稿后用这些硬闸自审，输出可编辑草稿、未决项、自审风险表和修改句。不要写成劳动合同、个人劳务、业务外包或平台用工，不要输出劳动仲裁或工伤策略，不要设计避社保或挂靠结构。"
