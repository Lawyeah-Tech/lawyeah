interface:
  display_name: "劳务派遣协议·起草"
  short_description: "按已谈妥条件起草劳务派遣协议：写入许可证与二百万元注册资本、岗位三性、百分之十比例、费用分列、合法退回、告知与二年合同，出稿后用这些硬闸自审。"
  default_prompt: "使用 $劳务派遣协议·起草，在单一立场下按已谈妥条件起草中国大陆劳务派遣协议（派遣单位与用工单位）。写入许可证与注册资本不低于二百万元、岗位限于临时性辅助性替代性、被派遣劳动者不超过用工总量百分之十、工资/社保/管理费分列、合法退回、告知义务与二年以上固定期限劳动合同；出稿后用这些硬闸自审，输出可编辑草稿、未决项、自审风险表和修改句。不要写成劳动者劳动合同，不要把无证派遣改成外包，不要输出劳动仲裁或工伤策略。"
