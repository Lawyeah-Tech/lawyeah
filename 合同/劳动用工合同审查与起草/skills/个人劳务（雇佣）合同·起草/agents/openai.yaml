interface:
  display_name: "个人劳务（雇佣）合同·起草"
  short_description: "按已谈妥条件起草个人劳务（雇佣）合同：写入劳务不等于劳动、民法典第一千一百九十二条风险负担、与承揽和派遣切开，出稿后用这些硬闸自审。"
  default_prompt: "使用 $个人劳务（雇佣）合同·起草，在单一立场下按已谈妥条件起草中国大陆个人劳务（雇佣）合同。写入自然人平等提供特定劳务、劳务费与个税、民法典第一千一百九十二条第三人损害由接受方承担、自身损害按过错分担；禁止概括免责。出稿后用这些硬闸自审，输出可编辑草稿、未决项、自审风险表和修改句。不要写成劳动合同、承揽或派遣，不要输出劳动仲裁或工伤策略，不要设计避社保或虚开发票结构。"
