interface:
  display_name: "竞业限制协议·审查"
  short_description: "审查待签竞业限制协议：核三类人员、期限不超过二年、范围可执行、离职后按月补偿、单位解除额外三个月，输出风险表和修改句。"
  default_prompt: "使用 $竞业限制协议·审查，在单一立场下审查中国大陆待签竞业限制协议。主线是离职后择业限制加按月补偿。核对限于高级管理人员、高级技术人员和其他负有保密义务的人员、期限不超过二年、范围可执行、离职后按月补偿对价、单位解除须额外支付三个月补偿、三个月未付劳动者可请求解除、保密与竞业切开；给出可回给对方的修改句。不要审查整份劳动合同、培训服务期或派遣协议，不要把无补偿写成整份无效，不要认定三个月未付已经解除，不要输出劳动仲裁策略。"
