interface:
  display_name: "学生实习协议·审查"
  short_description: "审查待签学生实习协议：核在校实习与劳动关系切开、职校三方、保险与报酬、毕业自动终止，输出风险表和修改句。"
  default_prompt: "使用 $学生实习协议·审查，在单一立场下审查中国大陆待签学生实习协议或职业学校岗位实习三方协议。核对学生是否在校在籍、是否已满十六周岁、职校是否三方签署、津贴与实习责任险或意外险、毕业后是否终止并另订劳动合同；给出可回给对方的修改句。不要审查劳动合同正文，不要把已毕业用工改成可履行实习，不要通过派遣或中介组织职校实习，不要输出劳动仲裁或伤害索赔策略。"
